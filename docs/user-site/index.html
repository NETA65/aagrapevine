<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- ================================================================
     THE COMMITTEE SITE'S ADDRESS: https://neta65.github.io/aagrapevine/
     If the site moves (for example to a custom domain such as
     https://grapevine.neta65.org/), change that address in the 4 places
     below (Find & Replace in any editor does all): the refresh line, the
     canonical line and the two links. Keep the slash at the end.
     ================================================================
     HOME PAGE of https://neta65.github.io/ (optional) - the NETA65
     account's GitHub Pages address, which otherwise shows GitHub's
     "Site not found".
     What it does: sends visitors - and search engines - straight on to
     the committee's website (English; the Spanish home page is the
     second link). The other NETA65 sites under this address
     (/GV_Booth/, /Archives_Booth/ ...) keep their own pages.
     How: an instant refresh plus a canonical link, which Google and
     Bing treat as a permanent move to the committee's site. It needs
     no JavaScript; and no "noindex" (that would contradict the move).
     Where it lives: the top folder of the repository
     NETA65/neta65.github.io, next to robots.txt. The master copy is
     docs/user-site/index.html in NETA65/aagrapevine; the steps are in
     that repository's README, section "Search engines". Never set a
     Custom domain (or add a CNAME file) in THAT repository: it would
     move every NETA65 site with it.
     ================================================================ -->
<meta http-equiv="refresh" content="0; url=https://neta65.github.io/aagrapevine/">
<link rel="canonical" href="https://neta65.github.io/aagrapevine/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grapevine / La Viña — NETA 65</title>
<style>
  :root { color-scheme: light dark; --paper: #fbf8f2; --ink: #1d1a26; --link: #07457c; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #121019; --ink: #eeeaf6; --link: #9ccbf5; }
  }
  body { margin: 0; padding: 2rem 16px; background: var(--paper); color: var(--ink);
         font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  a { color: var(--link); font-weight: 600; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <p><a href="https://neta65.github.io/aagrapevine/">NETA 65 Grapevine &amp; La Viña Committee</a></p>
  <p lang="es"><a href="https://neta65.github.io/aagrapevine/es/">Comité de Grapevine y La Viña de NETA 65</a></p>
</main>
</body>
</html>
