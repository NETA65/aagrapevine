    notes: |
      SAY: Here are the places to find everything from today. The committee website is the easiest start: it has this month's issues, the story deadlines, the events and the prices, and it stays current every day. Grapevine and La Viña have their own sites with stories, podcasts and the stores.
      DO: Leave this slide up for a moment so people can write the addresses down or take a picture of the slide.
      TRANSITION: Or scan this.

  - id: "qr-contribute"
    layout: "live"
    kind: "qr"
    title: "Scan to share your story"
    intro: "The committee's Share your story page: deadlines, themes and how to send a story."
    options: { url: "/contribute/", caption: "Share your story on the committee website" }
    minutes: 0.5
    notes: |
      SAY: If you'd like to keep going with your three sentences, scan this code with your phone's camera. It opens the committee website's page about sharing your story, with the deadlines, the themes and the addresses.
      TRANSITION: Now, your questions.

  - id: "questions"
    layout: "qa"
    eyebrow: "Review"
    title: "Questions"
    prompts:
      - "Which way of reading or listening would work for your home group?"
      - "Who in your life could use a gift subscription or a free story?"
      - "What would you write about for the next Grapevine theme?"
    note: "Answers stay in the room. The committee meets {live:meeting_rule}: bring your questions there too."
    minutes: 8
    notes: |
      SAY: Let's take your questions now, and the ones we gathered during the hour. If I don't know an answer, I'll say so, and we'll find it together after the workshop. The review questions on the slide are there if the room is quiet.
      DO: Read out the questions from the paper or the chat first. Keep answers short, and point to the committee website for details.
      IF TIME, ASK: What's one thing you'll take back to your home group?

  - id: "credits"
    layout: "credits"
    title: "Credits and sources"
    sources:
      - "The AA Preamble: Copyright © by AA Grapevine, Inc.; reprinted with permission."
      - "AA Grapevine and La Viña: Our Meetings in Print (P-52)"
      - "Facts about the magazines: aagrapevine.org and aalavina.org, as of {live:as_of}"
      - "Grapevine and La Viña are trademarks of AA Grapevine, Inc.; no logos, covers or artwork are reproduced."
    disclaimer: true
    note: "Not an official AA Grapevine, Inc. presentation. Prepared by the NETA 65 Grapevine & La Viña Committee for local service use; the committee website is {live:site_url} ({live:year})."
    minutes: 0.5
    notes: |
      SAY: These are the sources for the facts and the words we used today. This workshop is a local service piece from our Area committee. It isn't Conference-approved literature, and it doesn't speak for AA as a whole or for AA Grapevine, Inc.
      DO: Leave this slide up for a few seconds; you don't need to read it aloud.

  - id: "closing"
    layout: "closing"
    title: "Thank you for your service"
    message: "Keep coming back, and keep carrying the message."
    lines:
