  # every control of the player by its name in the page's language ({ui:…}: "Customize" / "Personalizar" …)
  - id: "player-controls"
    layout: "bullets"
    facilitator: true
    eyebrow: "For the facilitator"
    title: "The player's controls"
    items:
      - "{ui:customize}: {ui:version}, {ui:slides}, {ui:edit}, {ui:add}, {ui:your_details}, {ui:prepare} and {ui:save_share}"
      - "{ui:notes} and {ui:overview}, under the slide; {ui:presenter_view} on a second screen"
      - "{ui:print}: the slides, the slides with notes, a handout for participants, or the speaker script"
      - "{ui:full_screen} for the room; {ui:black_screen} for a pause"
    notes: |
      DO: Try each control once before the workshop, so nothing surprises you in front of the room.

  # printed portrait (a handout page prints landscape unless it says so)
  - id: "story-planner"
    layout: "text"
    facilitator: true
    handout: true
    print: "portrait"
    title: "Handout: plan your story"
    body: |
      Many published stories start as a few lines on a piece of paper. Use this page to plan yours; no one needs to see it but you.

      - What was it like? One or two sentences about the drinking, or the days before you found AA.
      - What happened? The moment, the meeting or the member that made a difference.
      - What is it like now? What you can share with someone who is where you were.

      Grapevine: send your story through aagrapevine.org/share or to gveditorial@aagrapevine.org. La Viña: in Spanish, through aalavina.org/comparte or to manuscritoslv@aagrapevine.org.

      The story deadlines and themes are on the committee website: {live:site}/contribute/
    notes: |
      DO: Print one copy per person ({ui:customize} → {ui:prepare} → {ui:print}) and hand it out before the activity ({slide:write-together}). The same page in Spanish: {slide:story-planner-es}.

  # the same handout in Spanish: a slide written in Spanish (the player marks it lang="es")
  - id: "story-planner-es"
    layout: "text"
    facilitator: true
    handout: true
    lang: "es"
    eyebrow: "Hoja para participantes"
    title: "Planea tu historia"
    body: |
      Muchas historias publicadas empiezan como unas pocas líneas en una hoja de papel. Usa esta hoja para planear la tuya; nadie más necesita verla.

      - ¿Cómo era? Una o dos frases sobre la bebida, o los días antes de llegar a AA.
      - ¿Qué pasó? El momento, la reunión o el miembro que hizo la diferencia.
      - ¿Cómo es ahora? Lo que puedes compartir con alguien que está donde tú estabas.

      La Viña: envía tu historia en aalavina.org/comparte o a manuscritoslv@aagrapevine.org, o grábala por teléfono al {live:lv_audio_phone}.
    notes: |
      DO: Print one copy for each Spanish-speaking participant (Customize → Prepare → Print), with the English page ({slide:story-planner}).

  # tick boxes in columns (checklist: true): a printed checklist, the same list in English and in Spanish
  - id: "story-checklist"
    layout: "columns"
    facilitator: true
    handout: true
    checklist: true
    eyebrow: "Handout"
    title: "Before you send your story"
    columns:
      - heading: "In English"
        accent: "gv"
        items:
          - "It is my own experience, in my own words"
          - "No last names and no one else's story"
          - "A title, and within the word limit"
      - heading: "{lang:es}En español{/lang}"
        accent: "lv"
        items:
          - "{lang:es}Es mi propia experiencia, con mis palabras{/lang}"
          - "{lang:es}Sin apellidos y sin la historia de otra persona{/lang}"
          - "{lang:es}Con un título, y dentro del límite de palabras{/lang}"
    notes: |
      DO: Print one per person with the story planner ({slide:story-planner}). Each writer ticks the boxes before sending a story.

