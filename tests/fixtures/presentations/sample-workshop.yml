    qr: "/"
    minutes: 0.5
    notes: |
      SAY: Thank you for being here, and for everything you do to carry the message. The committee's next meeting is on the screen, and every AA member is welcome. If you have questions later, the committee's e-mail is on the screen too. Good night, and keep coming back.
      DO: Leave this slide up while people say goodbye. On Zoom, stop sharing your screen only after the last person has left.

  - id: "prepare"
    layout: "bullets"
    facilitator: true
    checklist: true
    eyebrow: "For the facilitator"
