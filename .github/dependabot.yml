# Dependabot keeps the automation's building blocks up to date by opening
# at most one grouped pull request per month for each kind of update.
#
# What to do with these pull requests (see README → "Housekeeping"):
#   The "Code check (tests and test build)" workflow
#   (.github/workflows/check.yml) builds the website with the update and
#   runs the tests. Merge only when the pull request shows a green ✓; a
#   red ✗ means leave it (the live site is not affected).
#   * "github-actions" updates keep the daily workflow running when GitHub
#     retires old versions. Every action is pinned to a commit with its
#     release as a note ("uses: actions/checkout@<commit> # v7.0.1"): the
#     pull request moves the commit and its "# vX.Y.Z" note together
#     (Dependabot rewrites a note that names the pinned commit's release,
#     so keep the notes in that form; tests/test_automation.py → Pinned).
#   * "npm" updates are the site-building tools. After merging, glance at
#     the next "Website update" run; if it fails, revert the merge (one click).
#   * "pip" updates are the Python packages of the daily sync — only NEW
#     MAJOR versions: requirements.txt caps each package below its next
#     major version (">=2.32,<3"), so every run already installs the newest
#     minor and patch releases by itself; a new major version (which can
#     change how a package behaves) waits for this pull request, which
#     changes the line to allow it. yt-dlp has no cap (it must keep up
#     with YouTube changes), so it is left out here.
#   * "pip" in scripts/ops is Playwright, the browser driver of the Code
#     check's browser checks and of the monthly posters' share pictures
#     (scripts/ops/requirements-browser.txt). It is pinned to one version,
#     so every new release — minor and patch too: it must keep up with the
#     Google Chrome on GitHub's runners — comes as this monthly pull
#     request, and the Code check runs the browser checks with it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(actions)"
    open-pull-requests-limit: 2
    # a release is proposed only once it is a week old (a broken one is usually pulled or fixed by then)
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      site-tools:
        patterns: ["*"]
        update-types: [minor, patch]
    # Major versions can change how the site is built — upgrade those by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # lite-youtube-embed stays on 0.3.x (PR #24, November 2026: closed, and Dependabot told
      # "@dependabot ignore lite-youtube-embed minor version" — this entry keeps that visible and lasting).
      # 0.4 renamed needsYTApi to playbackMode, so pwa.js plainPlayer no longer keeps the videos on
      # youtube-nocookie.com, and iPhone / iPad Safari would load YouTube's player (1–2 MB, Google ad
      # requests) before a tap, ignoring Data saver and the Video captions setting. Every release from 0.4.0
      # on (">=0.4.0", npm's range form): for a 0.x package Dependabot calls 0.4 and 0.5 minor updates — PR #24
      # came despite the semver-major entry above — so "0.4.x" alone would let 0.5.0 into the grouped
      # site-tools pull request. 0.3.x patch releases still come. Taking 0.4 or later on purpose:
      # docs/OPERATIONS.md → "dependabot.yml" (tests/browser/test_r12_u4_aa_browser.py PrivacyPlayer fails
      # on 0.4.0).
      - dependency-name: "lite-youtube-embed"
        versions: [">=0.4.0"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 2
    # a release is proposed only once it is a week old (lucide-static 1.81.0 was hours old when it was taken in)
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # Change requirements.txt only when a new release falls outside its range (">=x,<N": a new major version) —
    # never just to raise the lowest version inside it (Dependabot's default does that).
    versioning-strategy: increase-if-necessary
    groups:
      python-packages:
        patterns: ["*"]
        update-types: [major]
    # Minor and patch releases need no pull request (see above); yt-dlp has no cap to raise.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "yt-dlp"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 2

  # Playwright, pinned in scripts/ops/requirements-browser.txt (see above): each new release.
  - package-ecosystem: pip
    directory: /scripts/ops
    schedule:
      interval: monthly
    allow:
      - dependency-name: "playwright"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 1
