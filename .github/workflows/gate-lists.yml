# =====================================================================
#  Gate list check — on every pull request, on a push to main that
#  changes the code or a workflow, and every night.
#
#  The tests Website update runs before it publishes (its job "Test the
#  code before publishing": scripts/ops/gate_tests.py) must test the
#  CODE only — never what the committee edits (content/, config/, the
#  glossary and the overrides) or the documentation: a gated test that
#  judged those would fail only on somebody's later edit, and keep the
#  site from publishing until the file was fixed. This check runs every
#  gated test once more in copies of the repository with committee-like
#  edits made and the documentation deleted (tests/test_automation.py →
#  GateLists, tests/committee_edits.py). It takes 4 to 10 minutes, so
#  since November 2026 it runs here, beside the Code check rather than
#  inside its offline tests: on EVERY pull request (a change of the code
#  alone — scripts/, eleventy/, src/ — can make a gated test read the
#  committee's files), on a push to main that changes what the Code check
#  watches (the same paths as check.yml), every night, and by hand
#  (Actions → Gate list check → Run workflow).
#
#  A red ✗ here never touches the live site. It names the gated tests
#  that fail once the committee's files are edited: give such a test data
#  of its own, or list it in CONTENT_TESTS (scripts/ops/gate_tests.py).
# =====================================================================
name: Gate list check
run-name: ${{ github.event_name == 'schedule' && 'Gate list check (GitHub schedule)' || '' }}

on:
  schedule:
    # 9:43 UTC = 3:43 AM CST / 4:43 AM CDT on time; GitHub starts it hours late, which does not matter here.
    - cron: "43 9 * * *"
  # every pull request (no path filter: whatever it changes may make a gated test depend on the committee's files)
  pull_request:
  # a push to main: the paths check.yml's push watches (tests/test_automation.py GateListsWorkflow keeps them equal)
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "src/**"
      - "!src/assets/cache/**"
      - "eleventy/**"
      - "eleventy.config.js"
      - "config/**"
      - "content/**"
      - "data/geo/**"
      - "data/translations/overrides.yml"
      - "data/translations/glossary.yml"
      - "package.json"
      - "package-lock.json"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-lists-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  gate-lists:
    name: The gate's tests with the committee's files edited
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Node.js (for the gated tests that run the site's JavaScript)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install site tools
        run: npm ci --no-audit --no-fund

      - name: Run the gate list check
        env:
          # tests/test_automation.py GateLists runs only when asked (it is minutes of work)
          GV_GATE_LISTS: "1"
        run: python -m unittest discover -s tests -p test_automation.py -k GateLists -v
