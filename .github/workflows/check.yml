# =====================================================================
#  Code check (tests and test build) — nothing is published.
#
#  Runs for every pull request (for example Dependabot's monthly
#  "chore(deps)" and "chore(actions)" updates) AND for every push to
#  main that changes code, templates, settings, content or a workflow.
#  It builds the website exactly like the daily "Website update" does
#  (strict about missing button/heading texts; the Morning check's
#  build.json included) and runs the offline Python tests.
#
#  On a pull request, a broken update shows a red ✗ BEFORE it is merged.
#  On a push, a red ✗ here means "something in that change is broken" —
#  undo or fix the change (the live site keeps working either way:
#  "Website update" runs the same tests before it publishes — all but
#  the few that judge the day's synced data, scripts/ops/gate_tests.py —
#  and publishes nothing until they pass).
#
#  Rule of thumb (README → Housekeeping): merge a pull request only when
#  it shows a green ✓.
# =====================================================================
# The name shown in the Actions sidebar, the "Run workflow" menu, a commit's or pull request's checks and GitHub's
# "Run failed: …" e-mails. Nothing finds the workflow by it: the tests and the docs' links use the FILE name
# (check.yml); tests/test_run_names.py only pins this name (change it there too).
name: Code check (tests and test build)
# A push or a pull request keeps GitHub's own title (the commit's subject, the pull request's title).
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Code check (started by hand)' || '' }}

on:
  pull_request:
  push:
    branches: [main]
    # Only changes that can break the build or the sync scripts. The bot's
    # daily data commits never start this (they are pushed with the built-in
    # token, which cannot start workflows).
    paths:
      - "scripts/**"
      - "tests/**"
      - "src/**"
      - "!src/assets/cache/**"
      - "eleventy/**"
      - "eleventy.config.js"
      - "config/**"
      - "content/**"
      - "data/geo/**"                 # the Texas places list (the place tests read it)
      - "data/translations/overrides.yml"
      - "data/translations/glossary.yml"
      - "package.json"
      - "package-lock.json"
      - "requirements.txt"
      # every workflow (the tests read them: the schedules, the morning mode, the Morning check)
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request (or branch) replaces the check that is running.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    # (not "Build the website": that is the name of Website update's own build step)
    name: Test build of the website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install site tools (Eleventy, Tailwind, …)
        run: npm ci --no-audit --no-fund

      - name: Build the website (as for GitHub Pages)
        env:
          # A project site lives in a folder named after the repository.
          PATH_PREFIX: /${{ github.event.repository.name }}/
          # Same as "Website update": a button or heading text missing from src/_i18n/ fails the build.
          I18N_STRICT: "1"
        run: npx @11ty/eleventy

      - name: Check the build
        run: |
          set -euo pipefail
          # Same checks as "Website update" → "Check the build".
          test -s _site/index.html || { echo "::error::_site/index.html is missing — the build did not produce a home page."; exit 1; }
          test -s _site/es/index.html || { echo "::error::_site/es/index.html is missing — the Spanish site was not built."; exit 1; }
          test -s _site/assets/css/main.css || { echo "::error::The stylesheet was not built."; exit 1; }
          # The Morning check (morning.yml) reads the live build.json: a change that loses it is caught here
          # (Website update only warns, so that a deploy is never blocked by it).
          test -s _site/build.json || { echo "::error::_site/build.json is missing — the Morning check could not see the site's builds."; exit 1; }
          pages=$(find _site -name '*.html' | wc -l)
          size=$(du -sm _site | cut -f1)
          echo "Built ${pages} pages, ${size} MB."
          echo "**Website:** ${pages} pages, ${size} MB — builds fine with this change." >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Python tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # A few tests run the site's own JavaScript (the district report, the offline worker, the
      # website's copy of the monthly-digest rules — tests/nodejs.py); without Node.js and the
      # site's packages they would be skipped.
      - name: Set up Node.js (for the tests that run the site's JavaScript)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install site tools
        run: npm ci --no-audit --no-fund

      - name: Run the tests
        # The translation models are not downloaded here, so the tests that need them
        # are skipped; everything else (text handling, content parsing, build rules) runs.
        run: python -m unittest discover -s tests -v

      - name: Check the e-mail digest still builds
        # Standard library only; writes a preview into the runner's temp folder, sends nothing
        # (and adds nothing to this run's summary).
        run: GITHUB_STEP_SUMMARY="" python -m scripts.notify.send_digest --dry-run --out-dir "$RUNNER_TEMP/digest-preview"
