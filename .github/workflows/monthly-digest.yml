# =====================================================================
#  Monthly e-mail digest (OPTIONAL — off until you add the secrets).
#
#  Sends LAST month's digest: one bilingual (English + Spanish) e-mail,
#  the same edition as the website's /digest/ page — everything that was
#  new on the site last month (bulletin posts, the events that took place,
#  committee files and photos, the magazines' new stories, writers from
#  Area 65 & Texas, podcasts, videos, Instagram posts, documents) plus ONE
#  link to this month's toolkit (/monthly/YYYY-MM/), where everything current
#  lives — e.g. to a Google Group that reaches every district.
#
#  When: on the 1st, from 7 AM Central, as soon as every source has been
#  updated since the month ended (so the month's last items are in it);
#  at the latest from noon Central on the 3rd, with the data there is.
#  Only ONCE: a small "digest-sent-YYYY-MM" artifact marks a month as
#  sent (kept 40 days) and the later tries skip it. A month with nothing
#  new is not sent (and counts as done). If the connection breaks while
#  the e-mail is handed over (it MAY have been sent), the month counts as
#  done too, and the run fails: check the group before sending it again.
#
#  Turn it on: Settings → Secrets and variables → Actions → add
#    SMTP_SERVER, SMTP_USERNAME, SMTP_PASSWORD, DIGEST_TO
#    (optional: SMTP_PORT, DIGEST_FROM, DIGEST_REPLY_TO)
#  Step-by-step instructions: README.md → "Monthly e-mail digest".
#
#  Preview without sending: Actions → "Monthly e-mail digest" →
#  Run workflow → leave "Preview only" ticked → download the preview
#  artifact. The "month" box is the month the digest COVERS (2026-09 =
#  the September digest, sent October 1); empty = last month. A manual
#  send ("Preview only" unticked) goes at once — with the data there is,
#  without waiting — and marks the month as done (a month with nothing
#  new is only marked: no e-mail, as on a scheduled try).
# =====================================================================
name: Monthly e-mail digest
# Each run's title says what it does — from the same input as PREVIEW in the first step, so the title always
# matches: a scheduled try, a preview, or a send by hand. Folded (>-) into one line (a plain one-line value could
# not hold the titles' ": ").
run-name: >-
  ${{ github.event_name == 'schedule' && 'Monthly e-mail digest (GitHub schedule)'
  || inputs.preview_only && 'Monthly e-mail digest: preview only'
  || 'Monthly e-mail digest: SEND NOW (started by hand)' }}

on:
  schedule:
    # GitHub cron is always UTC, and GitHub starts this repository's scheduled runs 4 to 6 (sometimes 8)
    # hours late, so the tries are set 4 hours early: five a day on the 1st–3rd (08:07, 11:07, 14:07,
    # 17:07, 20:07 UTC = 3:07 AM – 3:07 PM CDT, 2:07 AM – 2:07 PM CST on time; late, from about 7 AM
    # Central into the evening). The first step turns each into "skip" (not the 1st–3rd in Texas, before
    # 7 AM Central, or already sent) or "send"; send_digest then waits for the data (exit 3 = "not yet":
    # the next try). The 20:07 try comes after noon Central even on time, so the 3rd's "send with the data
    # there is" try always happens. Minute 7 avoids the top-of-the-hour rush.
    - cron: "7 8,11,14,17,20 1-3 * *"
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Preview only — build the e-mail but don't send it (download it from the run's Artifacts)"
        type: boolean
        default: true
      month:
        description: "The month the digest covers, as YYYY-MM (empty = last month — the digest that goes out on the 1st)"
        type: string
        default: ""

permissions:
  contents: read
  pages: read        # to look up the site's public address
  actions: read      # to find the "digest-sent-YYYY-MM" marker of a month already sent

concurrency:
  group: monthly-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Build & send the digest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Is it time, and is the e-mail digest set up?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          EVENT: ${{ github.event_name }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_only }}
          MONTH: ${{ inputs.month }}
        run: |
          set -uo pipefail
          # Central time (the committee's): today's day and hour, and the month the digest covers — the
          # one typed in the "month" box (spaces removed), else last month.
          day=$(TZ=America/Chicago date +%-d)
          hour=$(TZ=America/Chicago date +%-H)
          due=$(TZ=America/Chicago date -d "$(TZ=America/Chicago date +%Y-%m-01) -1 day" +%Y-%m)
          month="${MONTH:-}"
          month="${month//[[:space:]]/}"
          edition="${month:-$due}"
          echo "edition=$edition" >> "$GITHUB_OUTPUT"
          if [ "$PREVIEW" = "true" ]; then
            echo "mode=preview" >> "$GITHUB_OUTPUT"
            echo "Preview mode — the e-mail will be built but not sent."
            exit 0
          fi
          if [ -z "$SMTP_SERVER" ] || [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$DIGEST_TO" ]; then
            echo "mode=off" >> "$GITHUB_OUTPUT"
            echo "::notice title=E-mail digest is off::Add the SMTP_SERVER, SMTP_USERNAME, SMTP_PASSWORD and DIGEST_TO secrets to turn it on (README → Monthly e-mail digest)."
            echo "E-mail digest is not set up — nothing to do. (This is normal.)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$EVENT" != "schedule" ]; then
            echo "mode=send" >> "$GITHUB_OUTPUT"          # a manual send: no day / hour / marker guard
            exit 0
          fi
          # A scheduled try: only on the 1st–3rd in Texas, from 7 AM Central, until the month is sent.
          if [ "$day" -gt 3 ] || [ "$hour" -lt 7 ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "Not the time for the monthly digest (Central time: day $day, hour $hour) — nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! sent=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=digest-sent-$edition&per_page=10" --jq '[.artifacts[]|select(.expired|not)]|length'); then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "::warning title=Digest not sent yet::Could not check whether the $edition digest was already sent (the GitHub API did not answer) — nothing was sent; the next try checks again."
            exit 0
          fi
          if [ "${sent:-0}" -gt 0 ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "The $edition digest was already sent — nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "mode=send" >> "$GITHUB_OUTPUT"
          # the last tries (from noon Central on the 3rd) send with the data there is
          if [ "$day" -eq 3 ] && [ "$hour" -ge 12 ]; then echo "last=true" >> "$GITHUB_OUTPUT"; fi

      - name: Check out the repository
        if: contains(fromJSON('["preview","send"]'), steps.check.outputs.mode)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        if: contains(fromJSON('["preview","send"]'), steps.check.outputs.mode)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML (reads config/site.yml)
        if: contains(fromJSON('["preview","send"]'), steps.check.outputs.mode)
        run: python -m pip install --quiet PyYAML

      - name: Find the site's public address
        id: site
        if: contains(fromJSON('["preview","send"]'), steps.check.outputs.mode)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The address GitHub Pages actually serves (custom domain included).
          # If this lookup fails, the digest falls back to site.url in config/site.yml.
          url="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url' 2>/dev/null || true)"
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
          echo "Site address: ${url:-"(from config/site.yml)"}"

      - name: Build (and send) the digest
        id: send
        if: contains(fromJSON('["preview","send"]'), steps.check.outputs.mode)
        env:
          PYTHONIOENCODING: utf-8
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_REPLY_TO: ${{ secrets.DIGEST_REPLY_TO }}
          SITE_URL: ${{ steps.site.outputs.url }}
          MODE: ${{ steps.check.outputs.mode }}
          LAST: ${{ steps.check.outputs.last }}
          EVENT: ${{ github.event_name }}
          MONTH: ${{ inputs.month }}
        run: |
          set -uo pipefail
          args=()
          # (the preview goes to the runner's temp folder: upload-artifact skips hidden folders like .tmp/)
          if [ "$MODE" = "preview" ]; then args+=(--dry-run --out-dir "$RUNNER_TEMP/digest-preview"); fi
          # Any "month" typed in is passed on (spaces removed), so a mistyped one ("2026-9", "Oct")
          # stops the run (send_digest exits 2) instead of sending another month's digest to everyone.
          month="${MONTH:-}"
          month="${month//[[:space:]]/}"
          if [ -n "$month" ]; then args+=(--month "$month"); fi
          # the last scheduled tries (from noon Central on the 3rd) and a manual send: send with the data
          # there is (only the other scheduled tries wait for every source to be updated)
          if [ "${LAST:-}" = "true" ] || { [ "$MODE" = "send" ] && [ "$EVENT" != "schedule" ]; }; then args+=(--stale-ok); fi
          code=0
          python -m scripts.notify.send_digest "${args[@]}" || code=$?
          case $code in
            0|4)
              # sent (or nothing new) — or it MAY have been sent (4): mark the month as done either way,
              # so no later scheduled try can send it a second time
              if [ "$MODE" = "send" ]; then
                mkdir -p "$RUNNER_TEMP/digest-sent"
                echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) run ${GITHUB_RUN_ID} exit ${code}" > "$RUNNER_TEMP/digest-sent/sent.txt"
                echo "sent=true" >> "$GITHUB_OUTPUT"
              fi
              if [ "$code" -eq 4 ]; then
                echo "maybe=true" >> "$GITHUB_OUTPUT"
                echo "::error title=The digest MAY have been sent::The connection broke while the e-mail was being handed over. The month is marked as done so no later try sends it again. Check the group; if it did not arrive, send it with Run workflow (Preview only unticked)."
              fi
              ;;
            3)
              # not sent yet: a source has not been updated since the month ended (send_digest wrote why)
              echo "::notice title=Digest waits::Some sources have not been updated since the month ended — nothing was sent; the next try sends it (at the latest from noon Central on the 3rd)."
              ;;
            *)
              exit "$code"
              ;;
          esac

      - name: Mark the month as sent
        if: steps.send.outputs.sent == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-sent-${{ steps.check.outputs.edition }}
          path: ${{ runner.temp }}/digest-sent/
          if-no-files-found: error
          retention-days: 40

      - name: Fail the run — the e-mail may not have gone out
        if: steps.send.outputs.maybe == 'true'
        run: exit 1

      - name: Keep the preview
        if: steps.check.outputs.mode == 'preview'
        uses: actions/upload-artifact@v7
        with:
          name: digest-preview
          path: ${{ runner.temp }}/digest-preview/
          if-no-files-found: warn
          retention-days: 14
