  # (left out of the 60-minute version) D is turned around for an RLV: a member who reads English at a Spanish-speaking
  # meeting (Grapevine), where the English deck had a Spanish-speaking newcomer (La Viña).
  - id: "scenarios-d-f"
    layout: "columns"
    style: "cards"
    eyebrow: "Actividad"
    accent: "gv"
    title: "Casos de la D a la F"
    columns:
      - heading: "D · La visita"
        accent: "gv"
        text: "Un miembro que lee en inglés toma una La Viña en tu reunión en español."
      - heading: "E · El poema"
        accent: "grape"
        text: "Un miembro escribió un poema y quiere mandarlo a la revista."
      - heading: "F · La mesa de la asamblea"
        accent: "lv"
        text: "Tu distrito te pide atender la mesa en una asamblea, incluidas las ventas."
    takeaway: "¿Qué harías? ¿Qué Tradición o principio ayuda?"
    minutes: 0.25
    notes: |
      POSIBLES RESPUESTAS (compártelas después de que los grupos informen):
      D. Cuéntale del Grapevine, la revista de AA en inglés, y de su reunión abierta semanal en inglés, la Grapevine Weekly Open: {live:gv_open_meeting}. Si en tu grupo o tu distrito hay un GVR, ponlos en contacto, u ofrece conectarlo con una reunión en inglés a través de la oficina local de AA. Lo primero es la bienvenida.
      E. La Viña no publica poemas, canciones ni homenajes. Agradécele, e invítalo a escribir como historia la experiencia que hay detrás del poema, a mandar un chiste o una foto de la sala, o a grabar su historia por teléfono. Un taller de escritura es un gran siguiente paso.
      F. Pregunta primero qué dicen las guías del distrito y del Área: qué se puede mostrar y vender, quién maneja el dinero, y cómo se informa. Lleva un registro por escrito, da recibos, guarda el dinero de la mesa aparte del tuyo, y entrégalo como digan las guías. Piensa en pedirle a otro servidor de confianza que cuente contigo. El registro de gastos te ayuda con tus propios gastos.
      REPARTO DEL TIEMPO: se muestra durante la actividad.
