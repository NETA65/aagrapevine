  - id: "record"
    layout: "bullets"
    accent: "lv"
    title: "¿No escribes? Graba tu historia"
    items:
      - "**_Graba tu historia_** de La Viña: hasta 7 minutos, como compartes en una reunión"
      - "Llama al **{live:lv_audio_phone}** y marca 1"
      - "Di tu nombre y tu teléfono, y lee la declaración de permiso de la página de instrucciones"
