      - "Las suscripciones llegan en un paquete sencillo, sin ninguna mención de AA"
      - text: "Renovaciones, cambios de dirección, problemas: servicio al cliente"
        items:
          - "(800) 640-8781, en español · preguntas@aagrapevine.org"
      - text: "Libro del mes: un libro con descuento por un tiempo"
        items:
          - "[www.aalavina.org/libro-del-mes](https://www.aalavina.org/libro-del-mes)"
    source: "Fuentes: aalavina.org · aagrapevine.org/contact-us"
    minutes: 1.25
    notes: |
      DI: Cuando un miembro quiere suscribirse, mándenlo a la tienda oficial de La Viña, en aalavina.org. Algo que agradecen los miembros nuevos en AA: las suscripciones llegan en un paquete sencillo, sin ninguna mención de AA en el sobre.
      DI: Estos son los precios por año que les acabo de dar, los actuales de AA Grapevine. {live:price_change_note} Para cualquier otro plan, como la Completa o dos o tres años, la página de la Tienda de nuestro comité tiene la lista al día.
      CAMBIOS DE PRECIO: los precios de la diapositiva son los que rigen el día que presentas; cuando AA Grapevine anuncia precios nuevos, cambian solos el día en que empiezan. Di un cambio como simple información, nunca como presión para suscribirse.
      DI: Para renovaciones, cambios de dirección o una edición que no llegó, el servicio al cliente ayuda, con una línea y un correo en español. No tienen que resolver ustedes los problemas de pedidos; solo saber adónde mandar a la gente.
      DI: Y a mitad de mes, la tienda pone un libro con descuento por un tiempo: el Libro del mes. El de La Viña a veces dura más de un mes. Es algo ligero y bonito para mencionar en un anuncio.
      CONSEJO: No juntes los datos de pago de los miembros ni hagas pedidos por ellos, a menos que tu grupo te lo pida. Si ayudas con un pedido del grupo, guarda copias de los formularios y los pagos.
      FUENTE: aalavina.org/tienda; aalavina.org/libro-del-mes; aagrapevine.org/contact-us; Manual del RLV (2025), pp. 10 y 15. Precios: la carta de AA Grapevine a las oficinas intergrupales y centrales, 1 de octubre de 2026; no dice nada de los planes de 2 o 3 años, la Completa o los mensuales, así que no adivines esos.
      TRANSICIÓN: Tomemos un descanso.
    version_notes:
      short: "RECORTE A 60: sáltate esta diapositiva; la diapositiva de recursos al final tiene el servicio al cliente, y los precios por año están en las notas de la diapositiva anterior."

