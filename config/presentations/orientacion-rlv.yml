      DI: Su primer paso, si quieren, es registrarse. Es un formulario corto en línea. Los recursos de La Viña para los RLV, incluido el Manual del RLV, se descargan gratis, y un RLV registrado recibe un ejemplar de cortesía de La Viña durante un año, para usarlo en el puesto. Si se atoran, escriban a la dirección de abajo: es la ayuda en español de AA Grapevine, la casa editorial de La Viña.
      HAZ: Si hay tiempo, abre el formulario en pantalla para que vean qué corto es. No lo llenes en pantalla con los datos de nadie.
      CONSEJO: La oficina pide sus propios datos de contacto; así es como los localiza. La revista los protege y nunca los publica. Registrarse es una opción, no un requisito. Para los GVR, la oficina de AA Grapevine para los representantes es gvrc@aagrapevine.org (en inglés).
      FUENTE: aalavina.org/servicio/conviertete-en-rlv; aalavina.org/recursos; Manual del RLV (2025), p. 7.
