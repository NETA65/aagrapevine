      DI: No son la reunión de nuestro comité: son las reuniones abiertas de AA de La Viña y del Grapevine. Son algo muy bonito para mencionarle a un miembro que no puede salir de casa, a un recién llegado, o a alguien que no puede ir a una reunión al mediodía.
