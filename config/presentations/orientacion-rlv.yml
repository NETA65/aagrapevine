# Orientación para nuevos RLV — the committee's orientation workshop in Spanish, for new and returning Representantes
# de La Viña (RLV): the web presentation on /orientation/ (the Spanish orientations' event pages link it:
# eleventy/event-pages.js `deckEs`). Checked by tests/test_presentations.py, like the English decks.
#
# Adapted by hand from orientation-workshop.yml (not translated line by line): the same seven parts, the same full
# version (about 90 minutes, with a break) and the same 60-minute version (the same slides left out, the same
# `version_minutes.short`, each slide's "CUT TO 60" line as a "RECORTE A 60" version note), written for the RLV:
#  · La Viña comes first: every two months, so an RLV has a new issue every other month (a second sample
#    announcement is for the month in between), its monthly virtual workshop, its weekly Reunión Abierta, its
#    themes, its Libro del mes, its store, its "Graba tu historia", its resources for RLVs (aalavina.org/recursos,
#    the Manual del RLV) and AA Grapevine's help in Spanish (preguntas@aagrapevine.org, (800) 640-8781: config/site.yml
#    rlv_office_email, support_phone_es). Grapevine stays where an RLV needs it (the GVR at the same group, a member
#    who reads English, our Grapevine Meeting);
#  · every fact is one the repository already has (orientation-workshop.yml, writing-workshop.yml, config/site.yml);
#    facts that change are {live:…} tokens or `live` slides, in Spanish (a Spanish deck's facts are Spanish:
#    eleventy/filters/presentations.js), so they stay current by themselves;
#  · quotations: the Spanish Preamble (Libro de trabajo de La Viña, 2023) and the Responsibility Statement (Manual del
#    RLV, 2025), word for word with their credit lines, as orientation-workshop.yml gives them. Its two A.A.W.S.
#    quotations (the Service Manual on GVRs and RLVs, F-3 on money) have no Spanish text here: their slides say the
#    same in our own words, with the source named;
#  · the register is the Spanish site's: "tú" to one person, "ustedes" to the room; the notes' labels are Spanish
#    (DI:, HAZ:, PREGUNTA:, CONSEJO:, FUENTE:, TRANSICIÓN:), and the player writes the TIEMPO line;
#  · the same slide ids as orientation-workshop.yml where a slide matches one there, new ids for La Viña's own.
#
# Check it: .venv\Scripts\python.exe tests\test_presentations.py config\presentations\orientacion-rlv.yml

id: "orientacion-rlv"
order: 9
lang: "es"
title: "Orientación para nuevos RLV"
short: "Orientación para RLV"
eyebrow: "Bienvenida"
footer: "Comité de Grapevine y La Viña de NETA 65 · {live:panel}"
minutes: 90
icon: "compass"
tone: "lv"

card:
  title:
    en: "Orientation for New RLVs"
    es: "Orientación para nuevos RLV"
  summary:
    en: "The orientation in Spanish for La Viña representatives: La Viña and how it pays its way, what an RLV does each month, a one-minute announcement in Spanish to practice, and the committee's tools and people to ask, with a break."
    es: "La orientación en español para los Representantes de La Viña: La Viña y cómo se mantiene, lo que hace un RLV cada mes, un anuncio de un minuto en español para practicar, y las herramientas del comité y a quién preguntar, con un descanso."
  audience:
    en: "New and returning RLVs, and any GSR, DCM or member of a Spanish-speaking group curious about this service: at an Area or district workshop, online or in person."
    es: "RLV nuevos o que regresan, y cualquier RSG, MCD o miembro de un grupo de habla hispana a quien le interese este servicio: en un taller del Área o del distrito, en línea o en persona."

# The versions (Customize → Version), as the English deck's: the 60-minute one has no break, introductions in the
# chat, no pair practice and no breakout rooms, and leaves out the same slides; its `version_minutes.short` are the
# English deck's, so its agenda and TIEMPO lines follow the same plan (0:05, 0:18, 0:27, 0:33, 0:40, 0:49, 0:55).
presets:
  - id: "full"
    label: { en: "Full workshop (about 90 minutes)", es: "Taller completo (unos 90 minutos)" }
    minutes: 90
  - id: "short"
    label: { en: "60-minute version", es: "Versión de 60 minutos" }
    minutes: 60
    hide: ["milestones", "is-and-isnt", "practice", "helping-subscribe", "break", "record", "where-to-send", "tracker",
           "coming-up", "words", "scenarios-d-f"]
    note:
      en: "For example, at a district meeting: no break, introductions in the chat, no pair practice and no breakout rooms. Leaves out the milestones, “Lo que es el puesto y lo que no es”, “Ayudar a un miembro a suscribirse”, recording, “Dónde mandar una historia”, the tracker, “Lo que viene”, “Palabras que ayudan” and the second scenario slide. The agenda and the times in the notes follow the 60-minute plan; each slide's notes show its “RECORTE A 60” line: what to keep, shorten or skip."
      es: "Por ejemplo, en una reunión de distrito: sin descanso, presentaciones en el chat, sin práctica en parejas y sin salas para grupos pequeños. Deja fuera los hitos, «Lo que es el puesto y lo que no es», «Ayudar a un miembro a suscribirse», grabar tu historia, «Dónde mandar una historia», el registro de gastos, «Lo que viene», «Palabras que ayudan» y la segunda diapositiva de casos. La agenda y los tiempos de las notas siguen el plan de 60 minutos; las notas de cada diapositiva muestran su línea «RECORTE A 60»: qué mantener, acortar u omitir."

# The presenter's blanks (Customize → Your details). `puesto`, the presenter's service position in Spanish, is shared
# by the Spanish presentations; the first name by all.
fillins:
  - key: "date"
    label: { en: "Date", es: "Fecha" }
    hint: "DD de mes de AAAA"
  - key: "place"
    label: { en: "Place, or online", es: "Lugar, o en línea" }
    hint: "Lugar, o en línea"
  - key: "puesto"
    label: { en: "Presenter's service position (in Spanish)", es: "Puesto de servicio de quien presenta" }
    hint: "puesto de servicio"
    default: "Coordinador(a) de Grapevine / La Viña del Área 65"
    shared: true
  - key: "first_name"
    label: { en: "Your first name (only in your notes)", es: "Tu nombre de pila (solo en tus notas)" }
    hint: "nombre de pila"
    shared: true
    notes_only: true
  - key: "district_day"
    label: { en: "Your district's meeting day (“Tu mes de un vistazo”)", es: "Día de la reunión de tu distrito («Tu mes de un vistazo»)" }
    hint: "día del distrito"
  - key: "month_event"
    label: { en: "This month's event (“Este mes de un vistazo”)", es: "El evento de este mes («Este mes de un vistazo»)" }
    hint: "Taller, mesa o asamblea: fecha y lugar"
  - key: "break_end"
    label: { en: "When the break ends (clock time)", es: "Hora en que termina el descanso" }
    hint: "hora"
  - key: "district_workshop"
    label: { en: "A workshop in your district (“Lo que viene”)", es: "Un taller en tu distrito («Lo que viene»)" }
    hint: "Fecha · un taller en tu distrito: lugar y hora"

slides:

  # ── Apertura (0:00–0:08) ─────────────────────────────────────────────────────────────────────────────────────────
  - id: "title"
    layout: "title"
    eyebrow: "NETA 65 · Comité de Grapevine y La Viña"
    title: "Orientación para nuevos RLV"
    subtitle: "Llevar el mensaje con La Viña en tu grupo base"
    lines: ["{fill:puesto} · {live:panel}", "{fill:date} · {fill:place}"]
    minutes: 0.75
    version_minutes: { short: 0.5 }
    notes: |
      DI: Bienvenidos todos, y gracias por estar aquí. Me llamo {fill:first_name}, soy alcohólico(a) y sirvo como {fill:puesto}. Este taller es para los Representantes de La Viña, los RLV, nuevos y los que regresan, y para cualquier RSG, MCD o miembro a quien le interese este servicio.
      {not:short} DI: Tenemos unos noventa minutos, con un descanso de diez minutos a la mitad, y se van a llevar unas cuantas herramientas sencillas para usar en su grupo base la próxima semana.
      {only:short} DI: Tenemos más o menos una hora, sin descanso, y se van a llevar unas cuantas herramientas sencillas para usar en su grupo base la próxima semana.
      HAZ (antes de que llegue la gente): abre las diapositivas en la {ui:presenter_view}, prueba el audio y compartir pantalla, abre el chat, y pide a un voluntario que lleve el tiempo y a otro que vigile el chat y las manos levantadas. Ten a la mano la edición actual de La Viña para levantarla. Empieza a tiempo; quien llegue tarde se pone al día.
      PARA QUIEN FACILITA: {ui:customize} → {ui:prepare} tiene la lista de «antes de presentar» y el plan de 60 minutos. Todo lo que está entre corchetes, en las diapositivas y en estas notas, es un espacio para llenar: {ui:customize} → {ui:your_details}. Estas notas están escritas para que cualquier servidor de confianza pueda presentar el taller.
    version_notes:
      short: "RECORTE A 60: deja esta diapositiva."

  # The 60-minute version has no break: its last item only says the slides are shared afterward.
  - id: "welcome"
    layout: "bullets"
    eyebrow: "Bienvenida"
    title: "¡Bienvenidos! Unos avisos"
    items:
      - "**Anonimato:** a quién ves aquí y lo que oyes aquí, que aquí se quede"
      - "**Por favor, no tomes fotos, capturas de pantalla ni grabaciones** de nadie"
      - "Cambia tu nombre en pantalla: nombre de pila e inicial · grupo · distrito · puesto de servicio"
      - "La cámara es opcional; por favor, quédate en silencio cuando no hables"
      - "Preguntas: levanta la mano o usa el chat, en español o en inglés"
      - "Un descanso de 10 minutos a la mitad; las diapositivas se comparten después"
    version_fields:
      short:
        items:
          - "**Anonimato:** a quién ves aquí y lo que oyes aquí, que aquí se quede"
          - "**Por favor, no tomes fotos, capturas de pantalla ni grabaciones** de nadie"
          - "Cambia tu nombre en pantalla: nombre de pila e inicial · grupo · distrito · puesto de servicio"
          - "La cámara es opcional; por favor, quédate en silencio cuando no hables"
          - "Preguntas: levanta la mano o usa el chat, en español o en inglés"
          - "Las diapositivas se comparten después"
    takeaway: "Lo presenta el Comité de Grapevine y La Viña de NETA 65. No es una presentación oficial de AA Grapevine, Inc."
    minutes: 2
    version_minutes: { short: 1.5 }
    notes: |
      DI: Unas cosas para que todos podamos estar tranquilos y participar. Primero, el anonimato. Algunos somos nuevos en el servicio, y algunos preferimos que no se sepa que estamos en AA, así que por favor no tomen fotos, capturas de pantalla ni grabaciones de la gente que está aquí, en línea o en la sala. Este taller no se está grabando. Si quieren guardar una diapositiva, no se preocupen: las diapositivas se comparten después, y no traen nombres ni caras.
      DI: En línea, por favor muestren su nombre de pila y la inicial de su apellido, su grupo, su distrito y su puesto de servicio (cambien su nombre en pantalla, o escríbanlo en el chat), para saber quién está. La cámara es opcional. Quédense en silencio cuando no hablen, y usen la mano levantada o el chat para preguntar. Si alguien prefiere preguntar en inglés, también está bien; alguien le ayuda.
      DI: Una cosa más. Este taller lo prepara nuestro comité de Área. No es una presentación oficial de AA Grapevine, Inc., y no habla en nombre de AA en su conjunto. Vamos a compartir experiencia y a señalarles las fuentes oficiales para todo lo demás.
      HAZ: En línea, muestra cómo poner un nombre de pila en pantalla: en Zoom, Participantes, luego Más, luego Cambiar nombre; en Google Meet, un miembro que entró con su cuenta no puede cambiar su nombre en la llamada, así que lo escribe en el chat. En una sala, pide que silencien los teléfonos y que no fotografíen la sala ni a la gente.
      CONSEJO: Si alguien toma una captura de pantalla, basta con un recordatorio amable y general para toda la sala. Nunca señales a nadie.
    version_notes:
      short: "RECORTE A 60: deja."

  # The Spanish Preamble word for word, as orientation-workshop.yml gives it (Libro de trabajo de La Viña, 2023, p. 2),
  # with its credit line.
  - id: "preamble"
    layout: "quote"
    eyebrow: "Apertura"
    title: "Un momento de silencio, y el Preámbulo"
    quote: |
      Alcohólicos Anónimos es una comunidad de personas que comparten su mutua experiencia, fortaleza y esperanza para resolver su problema común y ayudar a otros a recuperarse del alcoholismo.

      El único requisito para ser miembro de AA es el deseo de dejar la bebida. Para ser miembro de AA no se pagan derechos de admisión ni cuotas; nos mantenemos con nuestras propias contribuciones.

      AA no está afiliada a ninguna secta, religión, partido político, organización o institución alguna, no desea intervenir en controversias, no respalda ni se opone a ninguna causa.

      Nuestro objetivo primordial es mantenernos sobrios y ayudar a otros alcohólicos a alcanzar el estado de sobriedad.
    credit: "Copyright © The AA Grapevine, Inc., reimpreso con permiso."
    source: "Libro de trabajo de La Viña (2023), p. 2."
    minutes: 1
    version_minutes: { short: 0.5 }
    notes: |
      DI: Abramos con un momento de silencio, y luego el Preámbulo de AA.
      HAZ: Haz una pausa de unos diez segundos de silencio. Luego lee el Preámbulo despacio, o invita a un voluntario a leerlo. Léelo tal como aparece, palabra por palabra, con su línea de copyright.
      DI (después de la lectura): El Preámbulo apareció por primera vez en el Grapevine en junio de 1947. Lo escribió un editor del Grapevine, a partir del Prólogo del Libro Grande. Así que es una buena manera de abrir un taller sobre nuestra reunión impresa.
      CONSEJO: Este es el texto en español del Libro de trabajo de La Viña (2023), y el copyright es de AA Grapevine. Si tu comité suele abrir con la Oración de la Serenidad, sigue la costumbre del comité y pasa la lectura.
    version_notes:
      short: "RECORTE A 60: deja el momento de silencio; lee el Preámbulo solo si hay tiempo."

  - id: "introductions"
    layout: "qa"
    accent: "grape"
    title: "Conozcámonos"
    prompts:
      - "Tu nombre de pila, tu grupo base y tu distrito"
      - "Tu puesto de servicio: RLV, GVR, RSG, MCD, ¿o solo te interesa?"
      - "¿Es tu primer taller de La Viña?"
      - "Una cosa que te gustaría llevarte hoy"
    note: "En línea, contesta en el chat; en la sala, basta una frase por persona."
    minutes: 2.5
    version_minutes: { short: 1 }
    notes: |
      DI: Veamos quién está aquí. En el chat, o en voz alta si somos un grupo pequeño, dígannos su nombre de pila, su grupo base y su distrito, su puesto de servicio, si este es su primer taller de La Viña, y una cosa que les gustaría llevarse hoy.
      HAZ: Con más de unas 12 personas, usa solo el chat y lee algunas respuestas en voz alta. Con un grupo pequeño, den una vuelta y que sea una frase por persona. Pide al voluntario del chat que anote lo que la gente quiere llevarse, para volver a eso en las preguntas y respuestas.
      PREGUNTA (opcional, si hay tiempo): ¿Quién sirve como RLV por primera vez? ¡Bienvenidos! ¿Quién ya ha servido antes? Gracias por volver; compartan su experiencia mientras avanzamos.
      CONSEJO: Fíjate quién sirve también como GVR en su grupo, e invítalo a compartir cuando lleguemos a las herramientas en inglés.
    version_notes:
      short: "RECORTE A 60: haz las presentaciones solo en el chat, mientras muestras la diapositiva siguiente."

  - id: "why-we-are-here"
    layout: "columns"
    style: "cards"
    eyebrow: "Bienvenida"
    title: "Para qué estamos aquí"
    columns:
      - heading: "1 · Conocer la revista"
        text: "Qué es La Viña, quién la publica y cómo se mantiene."
      - heading: "2 · Conocer el puesto"
        text: "Lo que hace un RLV cada mes."
      - heading: "3 · Llevarte herramientas"
        text: "Un anuncio de un minuto, nuestro sitio web y a quién preguntar."
    takeaway: "Compartimos experiencia, no reglas: la conciencia de tu grupo decide."
    minutes: 1
    version_minutes: { short: 0.75 }
    notes: |
      DI: Para esto estamos aquí. Primero, para que conozcan la revista: qué es La Viña, quién la publica y cómo se mantiene. Segundo, para que conozcan el puesto de servicio: lo que de verdad hace un RLV, mes con mes, y cómo se conecta con su distrito y con nuestra Área. Y tercero, para que se lleven herramientas que puedan usar la próxima semana: un anuncio de un minuto, el sitio web del comité, y los puestos de servicio a los que pueden acudir cuando se atoren.
      DI: Todo lo que van a oír hoy es experiencia compartida. Nada de esto es una regla. Nuestros líderes son servidores de confianza que no gobiernan, y cada grupo es autónomo. Así que, cuando oigan una idea que les guste, llévensela y ofrézcanla a la conciencia de su grupo. El grupo decide.
      PREGUNTA (opcional, si hay tiempo): De estas tres, ¿cuál les importa más hoy? (Toma una o dos respuestas.)
      TRANSICIÓN: Así vamos a usar nuestro tiempo.
    version_notes:
      short: "RECORTE A 60: deja."

  # Each row's time is worked out from the version being shown (`from`); the 60-minute version has its own title and
  # rows. Change a row's words in both lists.
  - id: "plan"
    layout: "agenda"
    eyebrow: "Bienvenida"
    title: "El plan de hoy (unos 90 minutos)"
    items:
      - { time: "0:00", title: "Bienvenida, avisos y presentaciones", from: "title" }
      - { time: "0:08", title: "Lo básico de La Viña, y el puesto de RLV", from: "part-1" }
      - { time: "0:24", title: "El mes de un RLV y tu anuncio de un minuto", from: "part-3" }
      - { time: "0:36", title: "La mesa de literatura, las suscripciones y los regalos", from: "part-4" }
      - { time: "0:42", title: "Descanso (10 minutos)", from: "break" }
      - { time: "0:52", title: "Historias, audio y herramientas digitales", from: "part-5" }
      - { time: "0:59", title: "El sitio web del comité, tu distrito y el Área, el dinero", from: "part-6" }
      - { time: "1:08", title: "Preguntas, casos en grupos pequeños y cierre", from: "part-7" }
    version_fields:
      short:
        title: "El plan de hoy (unos 60 minutos)"
        items:
          - { time: "0:00", title: "Bienvenida, avisos y presentaciones", from: "title" }
          - { time: "0:05", title: "Lo básico de La Viña, y el puesto de RLV", from: "part-1" }
          - { time: "0:18", title: "El mes de un RLV y tu anuncio de un minuto", from: "part-3" }
          - { time: "0:27", title: "La mesa de literatura, las suscripciones y los regalos", from: "part-4" }
          - { time: "0:33", title: "Historias, audio y herramientas digitales", from: "part-5" }
          - { time: "0:40", title: "El sitio web del comité, tu distrito y el Área, el dinero", from: "part-6" }
          - { time: "0:49", title: "Preguntas, casos con toda la sala, y cierre", from: "part-7" }
    minutes: 0.75
    notes: |
      {not:short} DI: Este es el plan. Empezamos con lo básico de La Viña, luego hablamos del puesto de servicio en sí y de cómo es un mes típico, incluido un anuncio de un minuto que pueden dar en su grupo. Después de un vistazo a la mesa de literatura y a las suscripciones, tomamos un descanso de diez minutos. En la segunda mitad vemos las historias y el audio, las herramientas digitales, el sitio web del comité, cómo se conectan con su distrito y con el Área, y el dinero. Terminamos con las preguntas más comunes, un ejercicio corto en grupos pequeños, sus preguntas, y la Declaración de la Responsabilidad.
      {only:short} DI: Este es el plan. Empezamos con lo básico de La Viña, luego hablamos del puesto de servicio en sí y de cómo es un mes típico, incluido un anuncio de un minuto que pueden dar en su grupo. Después de un vistazo a la mesa de literatura y a las suscripciones, vemos las historias y el audio, las herramientas digitales, el sitio web del comité, cómo se conectan con su distrito y con el Área, y el dinero. Terminamos con las preguntas más comunes, un ejercicio corto entre todos, sus preguntas, y la Declaración de la Responsabilidad.
      HAZ: Los tiempos son minutos desde el inicio (h:mm). Si prefieres la hora del reloj, cámbialos antes de presentar ({ui:customize} → {ui:edit}).
      {not:short} HAZ: Las líneas de TIEMPO de estas notas suman unos 87 minutos, y quedan unos tres para las preguntas opcionales y por si se alarga algo. Pide a quien lleva el tiempo una señal discreta al descanso y diez minutos antes del final.
      {only:short} HAZ: Las líneas de TIEMPO de estas notas suman unos 60 minutos, sin descanso: el plan le deja a cada parte unos minutos para preguntas. Pide a quien lleva el tiempo una señal discreta diez minutos antes del final.
    version_notes:
      short: "RECORTE A 60: di: «Hoy vamos un poco más rápido y sin descanso». No muestres el plan de 60 minutos ({ui:customize} → {ui:prepare}): enumera lo que te saltas."

  # ── Parte 1 · Lo básico de La Viña (0:08–0:16) ───────────────────────────────────────────────────────────────────
  - id: "part-1"
    layout: "section"
    number: 1
    accent: "lv"
    title: "Lo básico de La Viña"
    subtitle: "La reunión impresa de AA en español"
    minutes: 0.25
    notes: |
      DI: Empecemos por lo básico: qué es La Viña, de dónde viene, quién la publica y cómo se mantiene. Algunos de ustedes la leen desde hace años; para otros es algo nuevo. Las dos cosas están bien.
      HAZ: Levanta la edición actual de La Viña, si la tienes.
    version_notes:
      short: "RECORTE A 60: deja (marca la parte), pero no te detengas."

  - id: "two-magazines"
    layout: "columns"
    style: "panels"
    title: "Dos revistas, un mismo mensaje"
    columns:
      - heading: "La Viña"
        accent: "lv"
        items:
          - "Cada dos meses en español, desde **1996**"
          - "Impresa, digital, en la aplicación y en audio"
          - "Historias originales en español, y algunas traducidas del Grapevine"
          - "[www.aalavina.org](https://www.aalavina.org)"
      - heading: "Grapevine, su revista hermana"
        accent: "gv"
        items:
          - "Cada mes en inglés, desde **junio de 1944**"
          - "Impresa, digital, en la aplicación y en audio"
          - "Historias de miembros de AA de todo el mundo"
          - "[www.aagrapevine.org](https://www.aagrapevine.org)"
    source: "Fuentes: aa.org/aa-grapevine-la-vina · P-52 (2026), pp. 4–10"
    minutes: 1.5
    notes: |
      DI: Son dos revistas y un mismo mensaje. La Viña sale cada dos meses, seis ediciones al año, en español, desde 1996. El Grapevine sale cada mes en inglés, desde junio de 1944. Las dos vienen impresas, en digital, en las aplicaciones y en audio. La Viña no es una simple traducción: la mayoría de sus historias las escriben en español miembros de habla hispana, y algunas se traducen del Grapevine.
      DI: Un detalle que le gusta a la gente: La Viña tiene un lomo pegado, como un librito. Y el Grapevine impreso no lleva grapas, para poder entrar a las cárceles que no permiten grapas.
      DI: Las dos las publica la misma organización sin fines de lucro, AA Grapevine, Inc., y AA las llama las revistas internacionales de Alcohólicos Anónimos.
      PREGUNTA (opcional, si hay tiempo): Levanten la mano, o en el chat: ¿quién lee La Viña? ¿El Grapevine? ¿Las dos?
      FUENTE: aa.org/aa-grapevine-la-vina; P-52 (2026), pp. 4, 6, 10; aagrapevine.org/evolution-magazine; M-39, p. 57.
    version_notes:
      short: "RECORTE A 60: deja."

  - id: "meeting-in-print"
    layout: "bullets"
    title: "Nuestra reunión impresa"
    items:
      - "**Junio de 1944:** el primer Grapevine llegó a todos los grupos de AA y a los miembros en el extranjero"
      - "Sus cartas salían cada mes, y la llamaron su _reunión impresa_"
      - "**1996:** La Viña, para tener esa reunión impresa en español"
      - "Escrita por miembros: experiencia, fortaleza y esperanza, en sus propias palabras"
      - "Muchas voces, no la política de AA: cada historia es la experiencia de un miembro"
    takeaway: "Por eso una historia es tan buen tema para una reunión."
    source: "Fuentes: aagrapevine.org/history-aa-grapevine y /history-aa-lavina · P-52 (2026), pp. 3, 13 (en nuestras palabras)"
    minutes: 1.5
    notes: |
      DI: ¿Por qué la llamamos nuestra reunión impresa? El primer Grapevine, en junio de 1944, se mandó a todos los grupos de AA, unos trescientos en ese entonces, y a cada miembro que se sabía que servía en las fuerzas armadas fuera del país. Cada mes se imprimía una página entera con las cartas de esos miembros, y empezaron a llamar al Grapevine su reunión impresa. En 1996 nació La Viña, para que los miembros de habla hispana tuvieran su reunión impresa en su propio idioma. Las dos revistas todavía llevan la frase en sus portadas.
      DI: Casi todas las historias las escribe un miembro de AA, compartiendo experiencia, fortaleza y esperanza como lo hacemos en una reunión. Y como en una reunión, se oyen muchas voces. Una historia es la experiencia de un miembro. No es la política de AA, y publicarla no quiere decir que AA la respalde. Justamente por eso las historias son tan buenos temas para una reunión.
      PREGUNTA (opcional, si hay tiempo): ¿Alguna historia de La Viña se les ha quedado en el corazón? (Toma un compartimiento breve.)
      CONSEJO: Que cada compartimiento dure más o menos un minuto; falta mucho por ver.
      FUENTE: aagrapevine.org/history-aa-grapevine; P-52, pp. 3, 9, 13; la Declaración de Propósito del Grapevine (en nuestras palabras; las palabras de las revistas tienen derechos de autor).
    version_notes:
      short: "RECORTE A 60: sáltate la pregunta."

  # (left out of the 60-minute version) The English deck's milestones that touch La Viña, and the Reunión Abierta.
  - id: "milestones"
    layout: "table"
    title: "Algunos hitos"
    rows:
      - ["1944", "El primer Grapevine, que empezaron seis miembros de AA de la zona de Nueva York"]
      - ["1947", "El Preámbulo de AA aparece por primera vez en el Grapevine"]
      - ["1986", "La Conferencia lo reconoce como _la revista internacional de AA_, y eso incluye a La Viña"]
      - ["1996", "La primera edición de La Viña"]
      - ["2018–23", "Canal de YouTube (2018), pódcast e Instagram (2021), aplicaciones (2023)"]
      - ["2026", "La Viña cumple 30 años; empieza la Reunión Abierta de La Viña"]
    widths: [1.5, 10.3]
    first_col_bold: true
    source: "Fuentes: aagrapevine.org/history-aa-grapevine y /history-aa-lavina · P-52 (2026), pp. 5–10 · M-39 · el volante oficial de la Reunión Abierta de La Viña"
    minutes: 1
    notes: |
      DI: Unos cuantos hitos, para ver qué tan entretejidas están estas revistas con AA. Seis miembros de la zona de Nueva York empezaron el Grapevine en 1944. El Preámbulo que leímos hoy apareció por primera vez en el Grapevine en 1947. En 1986 la Conferencia de Servicios Generales reconoció al Grapevine como la revista internacional de Alcohólicos Anónimos, y ese reconocimiento incluye a La Viña.
      DI: La primera edición de La Viña salió en 1996, y en 2026 cumplió treinta años. En los últimos años las revistas sumaron un canal de YouTube, un pódcast, Instagram y aplicaciones, y desde noviembre de 2026 La Viña tiene su propia reunión abierta semanal en español, la Reunión Abierta de La Viña, de la que hablamos en un rato.
      CONSEJO: Usa solo estos hitos. Algunas cronologías viejas, incluida la página Acerca de de nuestro propio sitio, traen fechas que no se pudieron verificar. Si alguien pregunta por una que no está aquí, di que la vas a revisar en la historia oficial, en aalavina.org y aagrapevine.org.
      FUENTE: aagrapevine.org/history-aa-grapevine y /history-aa-lavina; P-52, pp. 5-10; M-39, p. 54; el volante oficial «Nueva reunión abierta de La Viña», que dio el 5 de noviembre de 2026 como su primera reunión.
    version_notes:
      short: "RECORTE A 60: sáltate esta diapositiva."

  - id: "who-publishes"
    layout: "bullets"
    title: "Quién la publica"
    items:
      - "**AA Grapevine, Inc.** publica las dos revistas, con su propia junta, su personal y sus finanzas"
      - "Es una de las dos entidades operativas de la Junta de Servicios Generales; la otra es A.A. World Services, Inc."
      - "El personal de la redacción son miembros sobrios de AA, y la redacción decide lo que se publica"
      - "La Conferencia de Servicios Generales tiene un comité sobre Grapevine y La Viña"
      - "No es «aprobada por la Conferencia»: la Conferencia reconoce al Grapevine como la revista internacional de AA (1986), y eso incluye a La Viña"
    source: "Fuentes: The A.A. Service Manual, 2024–2026, pp. 79–85 · P-52 (2026), pp. 6–8"
    minutes: 1.5
    notes: |
      DI: ¿Quién publica La Viña? AA Grapevine, Inc. Es una de las dos entidades operativas de la Junta de Servicios Generales de AA; la otra es A.A. World Services, que publica el Libro Grande y nuestros folletos. Grapevine tiene su propia junta, su pequeño personal en Nueva York y sus propias finanzas, aparte de la Oficina de Servicios Generales.
      DI: Las personas del lado editorial que deciden el contenido son miembros sobrios de AA. La Conferencia tiene un comité para Grapevine y La Viña. Pero la Conferencia no revisa cada edición antes de imprimirla; la Carta Constitutiva de la Conferencia protege el derecho de la redacción de aceptar o rechazar material.
      DI: A veces van a oír que La Viña es «aprobada por la Conferencia». En sentido estricto no lo es: una revista no puede pasar por el proceso anual de aprobación. En cambio, en 1986 la Conferencia reconoció al Grapevine como la revista internacional de Alcohólicos Anónimos, y ese reconocimiento incluye a La Viña. Esas son las palabras que conviene usar.
      PREGUNTA (opcional, si hay tiempo): ¿Alguna pregunta hasta aquí sobre cómo encajan las revistas en AA?
      FUENTE: The A.A. Service Manual, 2024-2026 Edition, pp. 79-85; P-52, pp. 6-8.
    version_notes:
      short: "RECORTE A 60: deja solo el último punto (lo de «aprobada por la Conferencia»)."

  - id: "pay-their-way"
    layout: "bullets"
    title: "Cómo se mantiene"
    items:
      - "AA Grapevine **no acepta contribuciones** de grupos ni de miembros, y **no tiene anuncios**"
      - "Se sostiene con la venta de suscripciones, libros y otros artículos"
      - "Los grupos la apoyan comprando las revistas y usándolas en su trabajo de Paso Doce"
      - "La Viña todavía no se mantiene sola: la Junta de Servicios Generales cubre la diferencia, como un servicio a la Comunidad"
    takeaway: "Una suscripción no es una donación: es la reunión impresa puesta a trabajar."
    source: "Fuentes: Service Manual, p. 66 · F-3 (junio de 2026), pp. 12–13 · aa.org/aa-grapevine-la-vina"
    minutes: 1.5
    notes: |
      DI: Esta es la parte que más se confunde, así que dejémosla clara. AA Grapevine no acepta contribuciones, ni de grupos ni de miembros, y no tiene anuncios. Se sostiene vendiendo suscripciones, libros y otros artículos. Así que la manera en que un grupo apoya a La Viña es comprándola y usándola de verdad en su trabajo de Paso Doce.
      DI: La Viña todavía no llega a suficientes lectores para cubrir sus costos, así que la Junta de Servicios Generales cubre la diferencia como un servicio a la Comunidad, como lo recomendó la Conferencia en 2001. Los grupos y miembros de habla hispana ayudan más leyéndola, compartiéndola y escribiendo para ella.
      DI: Así que, por favor, nunca pasen una canasta «para La Viña», y nunca llamen a una compra una «contribución a La Viña». Volveremos al dinero, y a quién paga qué, más adelante en el taller.
      FUENTE: The A.A. Service Manual, 2024-2026, p. 66; F-3 Self-Support (junio de 2026), pp. 12-13; aa.org/aa-grapevine-la-vina (preguntas frecuentes); M-39, pp. 55-56; Manual del RLV (2025), p. 10.
      TRANSICIÓN: ¿Y quién lleva todo esto al grupo? Ustedes.
    version_notes:
      short: "RECORTE A 60: deja."

