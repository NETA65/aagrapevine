    notes: |
      DI: Y unas sobre el puesto de servicio. Nuestro grupo votó que no a una suscripción: ¿y ahora? Es el derecho del grupo, y la propia revista se lo recuerda a sus representantes. Sigan anunciando las historias y las herramientas gratis, presten su propio ejemplar, y vuelvan a proponerlo otro año si les parece bien. Sin presión.
      DI: ¿Puedo publicar fotos? De la mesa, sí, sin nadie en ella. El folleto de AA sobre el anonimato trata las páginas web públicas y las redes sociales como la prensa, la radio y el cine: nada de nombres completos ni de caras reconocibles de los miembros. ¿Cuánto tiempo sirvo? Lo que decida su grupo; dos años es lo común. ¿Quién puede ir a la reunión del comité? Cualquier miembro de AA, sin registrarse.
      PREGUNTA (opcional, si hay tiempo): ¿Cuál es una pregunta que les daba miedo hacer? (Toma una.)
