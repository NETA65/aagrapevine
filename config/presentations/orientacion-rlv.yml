      HAZ: Pide al voluntario del chat que lea las preguntas del chat. Vuelve a lo que la gente quería llevarse, de las presentaciones. Que cada intervención dure más o menos un minuto. Si no sabes una respuesta, dilo, anótala, y promete contestar por correo (usa CCO cuando escribas a una lista de representantes).
      CONSEJO: Si una pregunta toca un asunto ajeno, como un tratamiento, un medicamento o la política, di con amabilidad que AA no tiene opinión sobre asuntos ajenos, y vuelve a la revista.
