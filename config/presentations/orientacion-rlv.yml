  - id: "who-pays"
    layout: "table"
    title: "Quién suele pagar qué"
    header: ["Qué", "Por lo general lo paga"]
    rows:
      - ["Una suscripción del grupo", "El grupo, si su conciencia de grupo está de acuerdo"]
      - ["Tu propia suscripción", "Tú, si quieres; nunca es un requisito"]
      - ["Regalos y Lleva el Mensaje", "Quien decide regalar"]
      - ["Talleres y materiales del distrito", "El distrito, según sus propias guías"]
      - ["Mesas y viajes del Área", "El Área, según su presupuesto y sus guías"]
    widths: [5.2, 6.6]
    first_col_bold: true
    takeaway: "Pregunta antes de gastar, guarda el recibo, e informa."
    minutes: 1.25
    version_minutes: { short: 1.75 }
    notes: |
      DI: Este es el patrón más común, pero su grupo, su distrito y el Área deciden cada uno el suyo. Una suscripción del grupo y las revistas para la mesa salen de la tesorería del grupo, cuando la conciencia de grupo está de acuerdo. Su propia suscripción es suya, y nunca es un requisito para este servicio. Los regalos y los certificados de Lleva el Mensaje los paga quien decide regalar: un miembro, un grupo, o un distrito por su propia decisión.
      DI: Los talleres y materiales del distrito siguen el presupuesto y las guías del distrito; las mesas, los materiales y los viajes del comité de Área siguen los del Área. Para eventos grandes, la oficina de AA Grapevine puede mandar materiales impresos gratis si se piden con tiempo.
      DI: Tres costumbres mantienen a todos tranquilos: preguntar antes de gastar, guardar el recibo, e informar. Los servidores de confianza no gobiernan; el grupo, el distrito y el Área deciden.
      CONSEJO: Para una tesorería que planea su presupuesto, los precios por año de AA Grapevine: La Viña impresa, {live:price_lv_print}; digital, {live:price_lv_digital}. {live:price_change_note} Los otros planes y la lista al día están en la tienda oficial y en nuestra página /es/shop/; no des otros precios de memoria. Nunca pidas dinero, premios ni descuentos a negocios ni a nadie fuera de AA (Séptima Tradición).
      FUENTE: F-3 (junio de 2026), pp. 7, 12-13; Manual del RLV (2025), p. 15; GV News, oct. de 2026, p. 4.
    version_notes:
      short: "RECORTE A 60: deja. «Palabras que ayudan» (la siguiente diapositiva) no está en esta versión: incluye aquí su idea principal."

