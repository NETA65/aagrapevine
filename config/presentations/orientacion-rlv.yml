  # ── Para quien facilita: Customize → Prepare, never projected ────────────────────────────────────────────────────
  - id: "before-you-present"
    layout: "bullets"
    checklist: true
    facilitator: true
    eyebrow: "Para quien facilita"
    accent: "navy"
    title: "Para quien facilita: antes de presentar"
    items:
      - "Llena todo lo que está entre corchetes, en las diapositivas y en las notas: {ui:customize} → {ui:your_details}"
      - "Revisa «Este mes» ({slide:this-month}), «Los temas y las fechas límite» ({slide:deadlines}) y «Lo que viene» ({slide:coming-up}): se mantienen al día solos"
      - "Confirma en aalavina.org la fecha del taller de La Viña y la Reunión Abierta"
      - "Llama a la línea de Graba tu historia para probarla: {live:lv_audio_phone}"
      - "Lleva: la edición actual, catálogos, postales, formularios de pedido, la tarjeta de mesa con el QR"
      - "Consigue a alguien que lleve el tiempo y a alguien que vigile el chat"
      - "Deja los nombres fuera de las diapositivas y de las notas: esta presentación está publicada en internet"
    notes: |
      Esta página nunca se proyecta: está en {ui:customize} → {ui:prepare} (las marcas se quedan en este dispositivo). Es la lista de quien presenta el taller.
      ESPACIOS PARA LLENAR: {ui:customize} → {ui:your_details} los enumera uno por uno; uno vacío se ve en la diapositiva como un [espacio] naranja, y la presentación te los recuerda antes de empezar. Los ‹espacios› de los dos anuncios de ejemplo no son para llenar: se quedan en blanco para la práctica.
      SE MANTIENE AL DÍA SOLO (desde el sitio del comité, que se reconstruye cada día): la próxima fecha, la hora y el enlace de Google Meet de la reunión del comité; el próximo Taller Mensual y Virtual de La Viña, su hora y su ID de Zoom; los días, las horas y la sala de Zoom de las reuniones abiertas semanales; las ediciones y temas de este mes, la próxima fecha límite y el Libro del mes; el número de Graba tu historia; las próximas asambleas; y los precios por año, los que rigen el día que presentas (un cambio que haya anunciado AA Grapevine entra solo en su día). Cuando el sitio del comité no tiene nada que mostrar en alguno (los temas de La Viña todavía sin leer, un Libro del mes entre ofertas), la diapositiva dice dónde buscar.
      DÓNDE REVISAR: el Kit del mes (/es/monthly/) y los Eventos (/es/events/) del sitio del comité; aalavina.org/recursos; aalavina.org/calendario-de-eventos; neta65.org para las fechas de las asambleas. Precios: solo los precios por año de AA Grapevine, en «Ayudar a un miembro a suscribirse»; para todo lo demás, manda a la gente a la tienda oficial o a /es/shop/.
      ANONIMATO: esta presentación está publicada en el sitio público del comité, con todo y notas. Usa solo puestos de servicio y el correo del comité; ningún nombre completo, cara, teléfono personal ni correo personal.
      REVISA CADA VEZ: el taller mensual de La Viña, por lo general el 4.º jueves, {live:lv_workshop_time}; en noviembre y diciembre La Viña lo ha hecho el jueves antes de Acción de Gracias y de Navidad (aalavina.org/calendario-de-eventos); el día y la hora de la Reunión Abierta (aalavina.org); la línea de Graba tu historia: llama tú, y si no contesta, da solo la opción del correo; las fechas de las asambleas de verano y otoño de 2027 (neta65.org), que en octubre de 2026 estaban por confirmar.
      LAS GUÍAS DEL ÁREA: las sugerencias del Área para los representantes de GV/LV están enlazadas en la página de Grapevine / La Viña de neta65.org. Donde sean distintas de esta presentación, sigue las guías del Área y la práctica de tu distrito.

  # The 60-minute plan, with its own times written out (no `from`: on this page they must stay the plan's whatever
  # version is chosen). Change a slide's short time and this plan together.
  - id: "sixty-minute-plan"
    layout: "agenda"
    facilitator: true
    eyebrow: "Para quien facilita"
    accent: "navy"
    title: "Para quien facilita: la versión de 60 minutos"
    items:
      - { time: "0:00", title: "Bienvenida y avisos; presentaciones en el chat" }
      - { time: "0:05", title: "Lo básico y el puesto (sin los hitos ni «Lo que es el puesto y lo que no es»)" }
      - { time: "0:18", title: "El mes de un RLV y los anuncios de ejemplo (sin práctica)" }
      - { time: "0:27", title: "La mesa y las suscripciones (sin «Ayudar a un miembro a suscribirse»)" }
      - { time: "0:33", title: "Historias y herramientas digitales (sin grabar ni «Dónde mandar una historia»)" }
      - { time: "0:40", title: "El sitio, el distrito y el Área, el dinero (sin el registro, «Lo que viene» ni «Palabras»)" }
      - { time: "0:49", title: "Preguntas comunes, y un caso con toda la sala" }
      - { time: "0:55", title: "Preguntas, recursos y la Declaración de la Responsabilidad" }
    notes: |
      Esta página nunca se proyecta: está en {ui:customize} → {ui:prepare}. Es el plan de una versión de 60 minutos, por ejemplo en una reunión de distrito: {ui:customize} → {ui:version} → la versión de 60 minutos. En esa versión, las notas de cada diapositiva muestran una línea «RECORTE A 60» que dice qué mantener, acortar u omitir, y las líneas de TIEMPO siguen este plan.
      EN RESUMEN: sin descanso; presentaciones en el chat; sin los hitos, «Lo que es el puesto y lo que no es», «Ayudar a un miembro a suscribirse», grabar tu historia, «Dónde mandar una historia», el registro de gastos, «Lo que viene», «Palabras que ayudan» ni la segunda diapositiva de casos; sin práctica en parejas y sin salas para grupos pequeños. Deja el momento de silencio, las diapositivas del dinero y la Declaración de la Responsabilidad.
      CONSEJO: {ui:customize} → {ui:version} → la versión de 60 minutos deja fuera las diapositivas que te saltas en esa sesión; después vuelve a elegir el taller completo.
