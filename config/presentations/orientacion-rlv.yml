      DI: Estas son las preguntas que más oímos sobre el dinero y la revista. (Lee cada pregunta, haz una pausa para que la sala la conteste en su cabeza, y luego da la respuesta.)
      DI: ¿Puede nuestro grupo mandarle una contribución a La Viña? No. AA Grapevine está organizada para no recibir contribuciones. Un grupo la apoya comprando las revistas y usándolas, y regalando certificados de regalo o de Lleva el Mensaje si así lo decide. ¿Puedo fotocopiar una historia? No: las historias son de AA Grapevine, Inc. Presten la revista, compartan el enlace, o pongan el audio desde el sitio oficial o la aplicación. ¿Necesito mi propia suscripción para servir? No. Ayuda leer cada edición, y muchos representantes sí se suscriben, pero el ejemplar del grupo y los pódcasts y videos gratis son un buen comienzo. Y un RLV registrado recibe un ejemplar de cortesía durante un año. Los problemas con los pedidos van al servicio al cliente; no tienen que arreglarlos ustedes.
      PREGUNTA (opcional, si hay tiempo): ¿Qué otras preguntas de dinero les han hecho en su grupo?
      FUENTE: Service Manual, p. 66; F-3 (junio de 2026), pp. 12-13; la política de derechos de autor y reimpresión de aagrapevine.org; aagrapevine.org/contact-us.
    version_notes:
      short: "RECORTE A 60: deja; contesta rápido, sin pregunta."

