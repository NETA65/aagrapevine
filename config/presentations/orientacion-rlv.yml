      DI: Muchos miembros no saben cuánto hay gratis. La aplicación de La Viña se descarga gratis, y la Cita Diaria y un contador de sobriedad son gratis dentro de ella; leer la revista en la aplicación necesita una suscripción digital o Completa. La Cita Diaria es una cita corta de una historia publicada, cada día, en la página de inicio de la revista o por correo.
