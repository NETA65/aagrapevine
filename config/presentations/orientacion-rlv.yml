      {only:short} POSIBLES RESPUESTAS (compártelas después de que la sala conteste):
      A. AA Grapevine no acepta contribuciones, ni de grupos ni de miembros. Una suscripción del grupo es un gasto normal del grupo, así que el grupo puede presupuestar una, o certificados de Lleva el Mensaje, si su conciencia de grupo está de acuerdo. Lleven las dos opciones a la junta de trabajo. (Service Manual, p. 66; F-3, pp. 7 y 12-13; Séptima Tradición.)
      B. Fotografíen la mesa sin nadie. Las fotos de frente de miembros publicadas en público rompen el anonimato aunque no lleven nombres, y eso incluye las redes sociales y los chats de grupo que pueden ver personas de fuera de AA. Ofrezcan tomar la foto de la mesa sola. (P-47, pp. 10-11; Undécima y Duodécima Tradiciones.)
      C. Es el derecho del grupo (Cuarta Tradición). Mantengan la revista a la vista con su propio ejemplar o con ediciones anteriores, anuncien las herramientas gratis, inviten a los miembros a escribir, y vuelvan a ofrecer la idea otro año. Sin presión y sin culpas.
