      DI: Algo que ninguna de las dos revistas hace: recibir grabaciones de oradores en reuniones o eventos de AA. Por favor, no graben una reunión para mandarla.
      CONSEJO: Llama tú a la línea antes de anunciarla; si no contesta, da solo la opción del correo. Instrucciones: aalavina.org/graba-tu-historia; nuestro sitio tiene los pasos en /es/contribute/#record. Para quien grabe en inglés, el Audio Project del Grapevine: {live:gv_audio_phone}.
