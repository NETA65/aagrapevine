      {not:short} DI: Practiquemos con algunas situaciones de la vida real. En grupos de tres o cuatro, tomen un caso. Platiquen qué harían, y qué Tradición o principio ayuda. Escojan a alguien que comparta su respuesta en un minuto. Tienen unos cuatro minutos en sus grupos.
      {only:short} DI: Practiquemos con una o dos situaciones de la vida real, entre todos. Voy a leer un caso; piensen qué harían, y qué Tradición o principio ayuda. Cualquiera puede contestar, en una o dos frases.
      {not:short} HAZ: Muestra primero las dos diapositivas siguientes para que todos vean los seis casos. Asigna los casos por letra (de la A a la F), uno por grupo; con más de seis grupos, repite letras. En línea, pega los seis casos en el chat antes de abrir salas de tres o cuatro por 4 minutos, con aviso de un minuto; en una plataforma sin salas (Google Meet en una cuenta personal), toma uno o dos casos con toda la sala, como en la versión de 60 minutos. En una sala, los grupos pueden voltear sus sillas.
      {not:short} HAZ (para compartir, unos 4 minutos): escucha a tres grupos, un minuto cada uno, y luego repasa tú los demás casos, con las posibles respuestas de las notas de las diapositivas de casos.
      {only:short} HAZ: Muestra la diapositiva siguiente, lee en voz alta el caso A o el B, y toma dos o tres respuestas de la sala o del chat. Luego da la posible respuesta de las notas de esa diapositiva.
      CONSEJO: Casi nunca hay una sola respuesta correcta. Lleva la plática hacia los principios: el grupo decide, el anonimato, la atracción y no la promoción, el automantenimiento.
      {not:short} REPARTO DEL TIEMPO: 1 minuto para formar los grupos o abrir las salas, 4 en grupos, 4 para compartir: escucha a tres grupos, y luego repasa tú las demás respuestas.
    version_notes:
      short: "RECORTE A 60: sin salas para grupos pequeños. Escoge uno o dos casos y platíquenlos con toda la sala."

