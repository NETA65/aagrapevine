  - id: "words"
    layout: "columns"
    style: "panels"
    title: "Palabras que ayudan, y palabras que conviene evitar"
    columns:
      - heading: "Di"
        accent: "vine"
        items:
          - "«Una suscripción del grupo es un gasto del grupo»"
          - "«Comprar y usar la revista es la manera de apoyarla»"
          - "«Un certificado de regalo de Lleva el Mensaje»"
          - "«La Conferencia la reconoce como revista internacional de AA»"
          - "«Lo podrías llevar a la conciencia de tu grupo»"
      - heading: "Evita"
        accent: "grape"
        items:
          - "«Una donación para La Viña»"
          - "«Pasar la canasta para La Viña»"
          - "«La Viña aprobada por la Conferencia»"
          - "«Todos los grupos tienen que suscribirse»"
          - "«Vender suscripciones», «cuota», «discurso de venta»"
    minutes: 0.75
    notes: |
      DI: Las palabras importan, así que aquí va una lista corta. Digan «una suscripción del grupo es un gasto del grupo», no «una donación para La Viña». Digan «comprar y usar la revista es la manera de apoyarla», y nunca pasen una canasta para La Viña. Digan «un certificado de regalo de Lleva el Mensaje». Digan que la Conferencia la reconoce como revista internacional de AA, en lugar de llamarla literatura aprobada por la Conferencia.
      DI: Y cuidado con las palabras que presionan. «Todos los grupos tienen que suscribirse» no es cierto: cada grupo es autónomo. «Vender suscripciones», «cuotas» y «discursos de venta» son de los negocios, no del trabajo de Paso Doce. «Podrías», «consideren», «llévenlo a la conciencia de su grupo» llevan el mismo mensaje con la mano abierta.
