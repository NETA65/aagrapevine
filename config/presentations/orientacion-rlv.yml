  - id: "tracker"
    layout: "bullets"
    title: "El registro de gastos y regalos"
    items:
      - "Anota los kilómetros o millas, la literatura, las suscripciones, los regalos y los reembolsos"
      - "Agrega a cada entrada una foto de su recibo"
      - "Se queda en tu propio dispositivo: haz una copia de seguridad, o exporta una hoja de cálculo, de vez en cuando"
      - "Marca lo que ya te reembolsaron, y entrega el registro que te pida la tesorería"
    takeaway: "Guarda cada recibo, en papel y en foto: quien te reembolse te lo va a pedir."
    source: "Fuente: {live:site}/es/tracker/ · las entradas se quedan en tu dispositivo"
    minutes: 1.5
    notes: |
      DI: A veces el servicio cuesta dinero: las millas para ir a la reunión del distrito, literatura para regalar, una suscripción de regalo, un hotel en una asamblea. El registro de nuestro sitio les ayuda a llevar las cuentas claras. Anotan cada gasto, millas o regalo, le agregan una foto del recibo, y apuntan quién se los va a reembolsar: su grupo, su distrito, el Área, o nadie, si deciden cubrirlo ustedes como su propia contribución.
      DI: Todo se queda en su propio teléfono o computadora. Nada se sube a internet, lo que también quiere decir que les toca a ustedes hacer una copia de seguridad o exportar una hoja de cálculo de vez en cuando. Cuando llegue un reembolso, márquenlo como pagado.
      DI: Lo más importante: guarden cada recibo, en papel o en foto. Quien les reembolse, el grupo, el distrito o el Área, se los va a pedir, y unos buenos registros los protegen a ustedes y a la tesorería por igual.
      CONSEJO: Las reglas de reembolso, como lo que se paga por milla y lo que hay que aprobar antes, las pone cada grupo, cada distrito y el Área. Pregunten antes de gastar.
      FUENTE: la página del registro del sitio del comité ({live:site}/es/tracker/), octubre de 2026.
    version_notes:
      short: "RECORTE A 60: una frase: «Guarden cada recibo; el registro de gastos de nuestro sitio les ayuda». Sáltatela."

