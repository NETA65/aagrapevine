  - id: "the-link"
    layout: "bullets"
    title: "El enlace entre tu grupo y la revista"
    items:
      - "El Manual de Servicio de A.A. describe a los RLV y a los GVR como **el enlace entre el grupo y la oficina de AA Grapevine**"
      - "Un miembro llega a ser RLV como voluntario, o porque su grupo lo elige para el puesto"
      - "RLV quiere decir Representante de La Viña; GVR, el representante del Grapevine"
      - "Algunos miembros sirven a las dos revistas, como GVR/RLV"
    source: "Fuente: The A.A. Service Manual, 2024–2026, p. 83, de A.A. World Services, Inc. (en nuestras palabras)."
    minutes: 1
    notes: |
      DI: Así describe el Manual de Servicio de A.A. este puesto, dicho en nuestras palabras: los RLV y los GVR son el enlace entre el grupo y la oficina de AA Grapevine, y un miembro llega a serlo como voluntario o porque su grupo lo elige.
      DI: Hay dos palabras que me gustan: enlace, y grupo. Ustedes son el enlace que mantiene viva la reunión impresa en su grupo base, y es su grupo el que los elige. RLV quiere decir Representante de La Viña; GVR es el representante del Grapevine. Algunos miembros sirven a las dos revistas y se llaman GVR/RLV.
      DI: En esa misma página se dice la esperanza de que cada grupo tenga un representante y una suscripción a por lo menos una de las revistas. Es una esperanza, no un requisito: cada grupo decide por sí mismo.
      CONSEJO: Esta diapositiva dice en nuestras palabras lo que el Manual dice en inglés; no la presentes como una cita textual. La cita, en inglés, está en la orientación en inglés del comité.
      FUENTE: The A.A. Service Manual, 2024-2026, pp. 83-84; M-39, pp. 52-53.
    version_notes:
      short: "RECORTE A 60: deja; di los dos primeros puntos y sáltate el comentario."

  - id: "what-a-rep-does"
    layout: "bullets"
    title: "Lo que hace un RLV"
    items:
      - "Anuncia cada nueva edición de La Viña y lo que trae"
      - "Mantiene la revista a la vista: una mesa, ediciones anteriores, catálogos y postales"
      - "Invita a los miembros a escribir o grabar sus historias, y a mandar fotos y chistes"
      - "Comparte los libros, pódcasts, videos y servicios nuevos"
      - "Ayuda a los miembros y al grupo a suscribirse, y les dice adónde llamar si hay un problema con un pedido"
      - "Sugiere maneras de usar La Viña en el trabajo de Paso Doce"
    takeaway: "Ideas para escoger, no obligaciones: cada grupo toma lo que le sirve."
    source: "Fuentes: aalavina.org (conviértete en RLV) · Manual del RLV (2025), p. 6 · en nuestras palabras"
    minutes: 1.5
    notes: |
      DI: ¿Qué hace de verdad un RLV? Sobre todo cosas pequeñas y constantes. Anuncian cada nueva edición y lo que trae. Mantienen la revista donde la gente la vea. Invitan a los miembros a escribir o grabar sus historias, y les recuerdan que La Viña también recibe fotos de salas de reunión y chistes. Pasan las noticias: libros nuevos, episodios del pódcast, videos. Ayudan a los miembros, y al grupo si así lo desea, a suscribirse, y saben adónde mandar a alguien con un problema con su pedido. Y sugieren maneras en que el grupo puede usar la revista para llevar el mensaje: un ejemplar para un recién llegado, una suscripción para un centro de tratamiento o una cárcel, una historia como tema de una reunión.
      DI: La propia revista les recuerda a sus representantes que sus ideas no son órdenes. Algunos grupos van a tener menos interés que otros, y ese es su derecho en AA. Escojan una o dos de estas, háganlas bien, y sumen más cuando estén listos.
      PREGUNTA (opcional, si hay tiempo): ¿Cuál de estas podrían empezar este mes en su grupo?
      FUENTE: aalavina.org/servicio/conviertete-en-rlv; aagrapevine.org/get-involved/become-grapevine-rep; Manual del RLV (2025), p. 6 (en nuestras palabras).
    version_notes:
      short: "RECORTE A 60: deja; sáltate la pregunta."

  - id: "chosen"
    layout: "bullets"
    title: "Te elige la conciencia de tu grupo"
    items:
      - "Tu grupo elige a su RLV, o acepta a un voluntario"
      - "El grupo decide el periodo; dos años es lo común"
      - "Algunos miembros sirven a las dos revistas, como GVR/RLV"
      - "Trabaja junto con tu RSG: compartan sus planes y coordinen sus informes"
      - "Cuando rotes, avísale a la oficina y pásale tus notas al siguiente RLV"
    takeaway: "La rotación mantiene fresco el servicio, y al día los registros."
    source: "Fuentes: Service Manual, pp. 83–84 · Manual del RLV (2025), pp. 6–7 · P-52, pp. 11–12"
    minutes: 1.5
    notes: |
      DI: A ustedes los elige la conciencia de su grupo. Algunos grupos hacen una elección en la junta de trabajo; otros aceptan con gusto a un voluntario. El grupo decide cuánto tiempo sirven. Dos años es lo común, y muchos grupos hacen coincidir el periodo con el de sus otros puestos de servicio, pero lo decide el grupo.
      DI: Su RSG es su compañero más cercano. Muchos grupos tienen un RSG y un RLV, y funciona mejor cuando se coordinan: quién informa qué, y cuándo. Si en su grupo también hay un GVR, trabajen juntos. Cuando termine su periodo, avísenle a la oficina de La Viña, para que su lista de representantes esté al día, y entreguen sus notas y materiales a la siguiente persona. Eso es la rotación.
      PREGUNTA (opcional, si hay tiempo): Si ya han servido antes, ¿qué le dirían en una frase a un RLV nuevo? (Toma una respuesta.)
      CONSEJO: Para avisar de un cambio de RLV, la página del RLV en nuestro sitio ({live:site}/es/gvr/) tiene un correo listo para mandar desde su propia aplicación de correo, a la dirección de ayuda en español de AA Grapevine.
      FUENTE: The A.A. Service Manual, 2024-2026, pp. 83-84; Manual del RLV (2025), pp. 6-7; P-52, pp. 11-12.
    version_notes:
      short: "RECORTE A 60: deja; sin pregunta."

  - id: "registering"
    layout: "resources"
    title: "Registrarte: un buen primer paso"
    links:
      - label: "Regístrate como RLV (La Viña)"
        url: "https://www.aalavina.org/servicio/conviertete-en-rlv"
        note: "Un RLV registrado recibe un ejemplar de cortesía de La Viña durante un año"
