      DI: Esto es lo que está pasando ahora mismo, este mes. (Lee la diapositiva en más o menos un minuto: las ediciones y sus temas, la próxima fecha límite, el Libro del mes y las fechas.) No necesitan apuntar nada: todo está en el Kit del mes del sitio del comité, y se actualiza solo.
      CONSEJO: El Libro del mes está en la diapositiva hasta que termina su oferta (por lo general el día 14); entre dos ofertas, la diapositiva manda a la página de La Viña. Lo mismo pasa con una fecha límite o una edición que el sitio del comité todavía no conoce.
    version_notes:
      short: "RECORTE A 60: deja; es la diapositiva que más se usa."

  - id: "announcement"
    layout: "bullets"
    numbered: true
    title: "Tu anuncio de un minuto"
    items:
      - "Levanta la edición actual"
      - "Di el tema en una frase"
      - "Menciona una historia que te gustó, en tus propias palabras"
      - "Da una fecha: la próxima fecha límite o un evento"
      - "Di dónde encontrarla: la mesa, la tarjeta con el QR, la tienda"
      - "Que sea breve, y cambia de tema cada mes"
    takeaway: "Comparte tu experiencia, y luego invita. Sin presión, sin discurso de venta."
    source: "Fuente: el GVR Workbook (2026), p. 33, en nuestras palabras"
    minutes: 1
    version_minutes: { short: 1.25 }
    notes: |
      DI: Ahora convirtamos todo eso en un anuncio. La mayoría de los grupos le dan al RLV un minuto o dos durante los avisos, y es suficiente. Levanten la edición, porque la gente recuerda lo que ve. Digan el tema en una frase. Mencionen una historia que se les quedó, en sus propias palabras: no lean la historia, solo dígannos por qué les importó. Den una fecha, como la próxima fecha límite o un evento. Digan dónde encontrarla. Y siéntense.
      DI: El mes siguiente, cambien: un mes la edición nueva, otro mes un libro nuevo o un episodio del pódcast, otro mes una fecha límite para escribir o Lleva el Mensaje. Así se mantiene fresco, y nadie deja de escuchar.
      CONSEJO: Su experiencia es lo más atractivo que pueden compartir: «esta historia me ayudó esta semana». El Kit del mes del sitio del comité ({live:site}/es/monthly/) tiene listos los temas y las fechas del mes.
      FUENTE: GVR Workbook (2026), pp. 33 y 40 (en nuestras palabras); la lista «GV/LV Rep Report» del comité, 2026.
    version_notes:
      short: "RECORTE A 60: deja."

  # The Spanish sample announcement, as orientation-workshop.yml gives it (the ‹blanks› stay blank for the practice), on
  # a read-aloud card in La Viña's orange.
  - id: "sample-lv"
    layout: "text"
    style: "script"
    accent: "lv"
    title: "Un anuncio de ejemplo: una edición nueva"
    body: |
      **Llena los espacios, y luego dilo con tus propias palabras:**

      “Hola, soy **‹nombre›**, su RLV. La nueva edición de La Viña trae el tema **‹tema›**. Una historia que me llegó fue sobre **‹una frase, en tus propias palabras›**. Si alguien quiere escribir para una próxima edición, el tema es **‹tema›** y la fecha límite es el **‹fecha›**. Hay ejemplares en la mesa de literatura, y la tarjeta con el código QR muestra cómo suscribirse o regalar una suscripción. Gracias por dejarme servir.”
    minutes: 1
    version_minutes: { short: 1.25 }
    notes: |
      DI: Este es un ejemplo. Lo voy a leer como lo diría en mi grupo base. (Léelo en menos de un minuto, llenando el tema real de esta edición y una historia que te haya gustado.)
      DI: Fíjense en lo que trae: quién soy, el tema, una historia en mis propias palabras, una fecha, dónde encontrarla, y gracias. Y fíjense en lo que no trae: precios, presión, ni leer la historia completa en voz alta.
      CONSEJO: Cuando llenen «una historia», digan en una frase por qué les importó. No fotocopien ni publiquen la historia misma; las historias tienen derechos de autor. Mejor presten la revista o compartan el enlace.
    version_notes:
      short: "RECORTE A 60: deja; lee el ejemplo una vez."

  # New for La Viña's two-month rhythm: the English deck's tip ("in the months between, announce La Viña's open topics,
  # the weekly Reunión Abierta, the app, or La Viña's monthly virtual workshop") as a second sample, on the same card.
  - id: "sample-between"
    layout: "text"
    style: "script"
    accent: "lv"
    title: "Un anuncio de ejemplo: el mes sin edición nueva"
    body: |
      **La Viña sale cada dos meses: en el mes de en medio, anuncia otra cosa.**

      “Hola, soy **‹nombre›**, su RLV. Este mes no hay edición nueva de La Viña, pero sí algo para ustedes: **‹la Reunión Abierta de los jueves / el Taller Mensual y Virtual / un tema sugerido / la aplicación›**. **‹Una frase: cuándo, o dónde encontrarlo›**. La edición actual sigue en la mesa de literatura. Gracias por dejarme servir.”
    minutes: 0.75
    version_minutes: { short: 1 }
    notes: |
      DI: Como La Viña sale cada dos meses, un RLV tiene noticias nuevas un mes sí y otro no. En el mes de en medio, el anuncio puede ser otra cosa: la Reunión Abierta de La Viña de los jueves, el Taller Mensual y Virtual de La Viña, un tema sugerido para escribir (aalavina.org/temas-sugeridos), la aplicación, o un episodio del pódcast. Mismo patrón: una cosa, una fecha o dónde encontrarla, y gracias.
      CONSEJO: Si en tu grupo también hay un GVR, pónganse de acuerdo para que los anuncios no se encimen: un mes La Viña, otro el Grapevine, o los dos muy breves.
    version_notes:
      short: "RECORTE A 60: muéstralo unos segundos y di que es el mismo patrón para el mes sin edición nueva. La práctica no está en esta versión; di: «Pruébenlo en su próxima reunión y cuéntennos cómo les fue en la reunión del comité»."

  # (left out of the 60-minute version)
  - id: "practice"
    layout: "activity"
    eyebrow: "Actividad"
    title: "Practica tu anuncio de un minuto"
    steps:
      - "Forma una pareja (en línea: salas de dos o tres, si la plataforma las tiene)"
      - "Llena el ejemplo con el tema de esta edición, o con una historia que conozcas"
      - "Cada persona lo da una vez, en un minuto o menos"
      - "Tu pareja menciona una cosa que funcionó"
    duration: 5
    materials: ["El anuncio de ejemplo", "La edición actual, o la aplicación", "Un cronómetro"]
    takeaway: "**Para compartir:** ¿Qué hizo que fuera fácil escucharlo?"
    minutes: 5
    notes: |
      DI: Practiquemos. Formen pareja con alguien a quien todavía no conozcan. Llenen el ejemplo con el tema de esta edición o con cualquier historia que recuerden, y luego cada quien lo da una vez, en un minuto o menos. Su pareja le dice una cosa que funcionó. Solo una, y solo cosas amables. Tienen unos tres minutos.
      HAZ: En línea, abre salas de dos o tres por 3 minutos, con aviso a los 30 segundos, si tu plataforma las tiene (Google Meet en una cuenta personal no las tiene: ahí forma las parejas por nombre y que cada pareja se turne en voz alta, o que compartan en el chat). Pega primero el ejemplo en el chat, para que lo tengan en su sala. En una sala, basta con voltear con quien está al lado.
      PREGUNTA (cuando todos regresen): ¿Qué hizo que un anuncio fuera fácil de escuchar? (Toma dos o tres respuestas. Por lo general: breve, personal, una fecha, la revista en alto.)
      CONSEJO: Si alguien está nervioso, recuérdale que leer el ejemplo palabra por palabra es un muy buen primer anuncio.
      REPARTO DEL TIEMPO: 1 minuto para formar las parejas o abrir las salas, 3 en parejas, 1 para compartir.
      TRANSICIÓN: Su anuncio manda a la gente a la mesa de literatura, así que armemos una.
    version_notes:
      short: "RECORTE A 60: sáltate la práctica. Di: «Pruébenlo en su próxima reunión y cuéntennos cómo les fue en la reunión del comité»."

  # ── Parte 4 · En tu grupo: la mesa y las suscripciones (0:36–0:42), luego el descanso (0:42–0:52) ───────────────
  - id: "part-4"
    layout: "section"
    number: 4
    accent: "lv"
    title: "En tu grupo: la mesa y las suscripciones"
    subtitle: "Que La Viña sea fácil de encontrar, de prestar y de regalar"
    minutes: 0.25
    notes: |
      DI: Su anuncio manda a la gente a algún lugar: a la mesa de literatura, y a las maneras de leer, suscribirse o regalar. Veamos las dos cosas, y cómo se maneja el dinero, que siempre lo decide el grupo.
    version_notes:
      short: "RECORTE A 60: deja, rápido."

  - id: "literature-table"
    layout: "columns"
    style: "panels"
    title: "Cómo armar una mesa de literatura"
    columns:
      - heading: "Ármala"
        accent: "lv"
        items:
          - "La Viña actual, de frente"
          - "Ediciones anteriores, ordenadas por tema"
          - "Una caja para prestar, con una hoja de préstamo solo con nombres de pila"
          - "Renovada cada mes, ordenada"
      - heading: "Qué llevar"
        accent: "vine"
        items:
          - "Catálogos y formularios de pedido"
          - "Las postales gratis de los recursos para RLV"
          - "La tarjeta de mesa con el QR del comité"
          - "Unas ediciones anteriores para los recién llegados"
    takeaway: "Fotografía la mesa, nunca a las personas."
    minutes: 1.5
    version_minutes: { short: 1.75 }
    notes: |
      DI: Una buena mesa de literatura es pequeña, actual y ordenada. Pongan la edición actual de La Viña de frente, por donde pasa la gente, y si su grupo tiene también el Grapevine, a su lado. Ordenen las ediciones anteriores por tema, para que un miembro encuentre una sobre el padrinazgo, los Pasos o las fiestas. Una caja para prestar funciona bien: los miembros toman prestada una revista y la regresan, o la pasan a alguien más. Basta una hoja de préstamo sencilla, solo con nombres de pila.
      DI: Lleven catálogos y formularios de pedido, y las postales gratis de los recursos oficiales. El sitio de nuestro comité tiene una tarjeta de mesa con un código QR que lleva a las suscripciones y a los recursos gratis. Y guarden unas ediciones anteriores para regalarle a un recién llegado.
      DI: Si toman una foto de su mesa para compartirla con el distrito, fotografíen la mesa, nunca a la gente.
      CONSEJO: Los recursos para RLV están en aalavina.org/recursos; nuestro sitio los reúne en /es/gvr/#kits. Para un evento grande, AA Grapevine puede mandar materiales impresos gratis: escriban a gvrc@aagrapevine.org con su nombre, su Área, su puesto de servicio, y el nombre, la fecha y la asistencia esperada del evento, con cuatro a seis semanas de anticipación.
      PREGUNTA (opcional, si hay tiempo): ¿Qué hay hoy en la mesa de su grupo? ¿Qué falta?
      FUENTE: la sesión 3 de RLV / GVR 101 del sitio del comité ({live:site}/es/orientation/); GV News, oct. de 2026, p. 4; Manual del RLV (2025).
    version_notes:
      short: "RECORTE A 60: deja; sáltate la pregunta."

  - id: "money-at-the-table"
    layout: "bullets"
    title: "El dinero en la mesa: como decida tu grupo"
    items:
      - "La conciencia de grupo decide si se vende algo en la mesa, y cómo"
      - "Muchos grupos no venden nada: los miembros piden directamente a las tiendas oficiales"
      - "Si tu grupo sí maneja dinero: lleva un registro por escrito, da recibos, informa"
      - "El dinero del grupo pasa por la tesorería, como digan las guías de tu grupo"
      - "Nunca una canasta «para La Viña»: AA Grapevine no acepta contribuciones"
    takeaway: "Pide libros para el grupo solo después de que el grupo haya aprobado el gasto."
    source: "Fuentes: Manual del RLV (2025), p. 15 · GVR Workbook (2026), pp. 26–27, 39 · en nuestras palabras"
    minutes: 1.5
    version_minutes: { short: 1.75 }
    notes: |
      DI: El dinero en la mesa siempre lo decide el grupo. Algunos grupos no venden nada: la mesa es para leer y prestar, y los miembros piden directamente a las tiendas oficiales. Otros tienen algunos libros o ediciones anteriores a la venta. En cualquier caso, antes de manejar dinero, pregúntenle a la conciencia de su grupo cómo quiere que se haga.
      DI: Si su grupo les pide manejar dinero, que sea sencillo y transparente: un registro por escrito, un recibo por cada compra, y un informe breve al grupo. El dinero del grupo pasa por la tesorería, como digan las guías de su propio grupo. Y por favor, no compren libros para el grupo esperando que se los paguen después: lleven primero la propuesta a la junta de trabajo.
      DI: Lo que nunca hacemos es pasar una canasta «para La Viña». AA Grapevine no acepta contribuciones. Comprar y usar las revistas es la manera de apoyarlas.
      CONSEJO: En las asambleas de Área y en las convenciones, la mesa de literatura sigue las guías del Área. Las Políticas y Procedimientos del Área (la sección 4.9 en la copia que tenemos) la limitan a literatura aprobada por la Conferencia, a los materiales de Grapevine y La Viña, y a las Guías. Confirma la redacción actual con el Área antes de apoyarte en ella.
      FUENTE: Manual del RLV (2025), p. 15; GVR Workbook (2026), pp. 26-27 y 39; Service Manual, p. 66 (en nuestras palabras).
    version_notes:
      short: "RECORTE A 60: deja."

  # The prices said in the notes are the ones in effect on the day shown, in Spanish; {live:price_change_note} says so
  # while a notice is current, and is empty after it.
  - id: "four-ways"
    layout: "columns"
    style: "cards"
    title: "Cuatro maneras de suscribirte o regalar"
    columns:
      - heading: "1 · Para ti"
        text: "Impresa, digital (en la web y la aplicación) o la Completa."
      - heading: "2 · Para tu grupo"
        text: "Un gasto del grupo, si la conciencia de grupo está de acuerdo."
      - heading: "3 · Como regalo"
        text: "Para un ahijado o ahijada, un recién llegado o un aniversario."
      - heading: "4 · Lleva el Mensaje"
        text: "La oficina se la manda a un alcohólico que la necesita."
    takeaway: "Los precios cambian: revisa la tienda oficial o nuestra página /es/shop/."
    minutes: 1.5
    version_minutes: { short: 2.25 }
    notes: |
      DI: Hay cuatro maneras de poner La Viña en más manos. Una, para ustedes: impresa, digital, que incluye la web y la aplicación, o la Completa, que junta la impresa y la digital. Dos, para su grupo: la conciencia de grupo puede escoger una suscripción para la mesa de literatura. El folleto de AA sobre el automantenimiento pone la literatura de Grapevine entre los gastos normales de un grupo, junto a la renta y la literatura de AA, así que se paga de la canasta como cualquier otro gasto del grupo.
      DI: Tres, como regalo, para un ahijado o ahijada, un recién llegado o un aniversario de sobriedad; también hay certificados de regalo. Y cuatro, Lleva el Mensaje: compran un certificado de regalo para alguien a quien no conocen, y la oficina de La Viña se lo asigna a un alcohólico que lo necesita, por ejemplo alguien en una cárcel, un centro de tratamiento o un hospital, o alguien que no puede salir de casa. Un grupo o un distrito puede comprar varios juntos.
      DI: Los precios cambian, así que la tienda oficial y la página de la Tienda de nuestro comité siempre tienen la lista al día. Por un año, los precios de AA Grapevine son: La Viña impresa, {live:price_lv_print}; digital, {live:price_lv_digital}. {live:price_change_note}
      {not:short} DI: Los precios por año también están en la siguiente diapositiva.
      CONSEJO: Preséntalas como opciones. La conciencia de grupo decide; cada miembro decide por sí mismo. Nunca presiones a nadie para comprar, y nunca uses un precio para apurar a nadie.
      FUENTE: F-3 Self-Support (junio de 2026), pp. 7, 12-13; aalavina.org/lleva-el-mensaje; P-52, pp. 10-11. Precios: la carta de AA Grapevine a las oficinas intergrupales y centrales, 1 de octubre de 2026.
    version_notes:
      short: "RECORTE A 60: deja. La siguiente diapositiva no está en la versión de 60 minutos, así que di aquí los precios por año."

