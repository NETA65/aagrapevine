      {only:short} DI: En esta parte: cómo animar a los miembros a escribir sus historias, los temas y las fechas límite, y las herramientas digitales, casi todas gratis, que pueden recomendar.
      {not:short} HAZ: Revisa que todos hayan vuelto, y vuelve a poner el cronómetro para la segunda mitad.
