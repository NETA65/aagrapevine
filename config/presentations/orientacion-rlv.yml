  # The English slide quotes F-3 (p. 12) word for word; with no Spanish text of it here, the same point in our words.
  - id: "seventh-tradition"
    layout: "bullets"
    accent: "grape"
    title: "El dinero y la Séptima Tradición"
    items:
      - "AA Grapevine, Inc. no está organizada para recibir contribuciones de grupos ni de personas"
      - "Los grupos y los miembros apoyan las revistas comprando suscripciones a La Viña y al Grapevine y otras publicaciones, y usándolas en su trabajo de Paso Doce"
      - "Una suscripción del grupo es un gasto normal del grupo, cuando la conciencia de grupo la escoge"
    source: "Fuente: Self-Support: Where Money and Spirituality Mix (F-3), p. 12, de A.A. World Services, Inc. (en nuestras palabras)."
    minutes: 1
    version_minutes: { short: 1.5 }
    notes: |
      DI: Hablemos claro del dinero, porque es donde más a menudo las buenas intenciones salen mal. El folleto de AA sobre el automantenimiento, actualizado en junio de 2026, dice, en nuestras palabras, que AA Grapevine no está organizada para recibir contribuciones de grupos ni de personas, y que los grupos y los miembros apoyan las revistas comprando suscripciones y otras publicaciones, y usándolas en su trabajo de Paso Doce.
      DI: Así que AA Grapevine funciona distinto del resto de nuestra estructura de servicio. Nuestras contribuciones de la Séptima Tradición sostienen al grupo, al distrito, al Área y a la OSG. Grapevine no recibe contribuciones: se sostiene con las revistas, los libros y otros artículos que compramos y usamos, y la Junta de Servicios Generales cubre lo que le falta a La Viña. El mismo folleto, cuando enumera los gastos básicos de un grupo, como la renta, el café y la literatura de AA, incluye la literatura de Grapevine. Una suscripción del grupo es un gasto normal del grupo, pagado de la canasta como los demás, cuando la conciencia de grupo la escoge.
      CONSEJO: En 2026 se le pidió a la Conferencia que considerara dejar que Grapevine aceptara contribuciones. No hubo ningún cambio; en su lugar, se revisó esta respuesta en el F-3. No presentes las contribuciones a Grapevine como algo que viene. Esta diapositiva dice en nuestras palabras lo que el folleto dice en inglés; no la presentes como una cita textual.
      FUENTE: F-3 (junio de 2026), pp. 7, 12-13; M-39 (2026); Service Manual, p. 66.
    version_notes:
      short: "RECORTE A 60: deja; di solo los puntos de la diapositiva."

