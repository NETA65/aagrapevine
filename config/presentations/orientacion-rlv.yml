  - id: "encouraging"
    layout: "bullets"
    title: "Animar a los miembros a escribir"
    items:
      - "La escriben los miembros: no hace falta experiencia; la redacción arregla la ortografía"
      - "Cuenta una experiencia, como la compartirías en tu grupo base"
      - "La Viña: de 5 a 6 páginas a doble espacio"
      - "No publica poemas, canciones, homenajes ni nada ya publicado"
      - "Cada quien manda su propia historia: nunca mandes la historia de otra persona"
    takeaway: "Los chistes y las fotos de salas de reunión vacías también son bienvenidos."
    source: "Fuentes: las pautas para colaborar de La Viña · Service Manual, p. 85"
    minutes: 1.5
    version_minutes: { short: 2.5 }
    notes: |
      DI: Cada historia de La Viña la escribió un miembro como nosotros, y la revista depende de eso: no puede pagar por los artículos, así que necesita tantas voces como sea posible. Las pautas de La Viña dicen que no hace falta ser un escritor con experiencia; el único requisito es ser alcohólico en recuperación. La redacción se encarga de la ortografía. Si alguna vez escribieron un Cuarto Paso o un mensaje largo, pueden escribir una historia.
      DI: Las mejores historias cuentan una experiencia, como la compartirían en su grupo base: lo que pasó, lo que hicieron, cómo los cambió. La Viña sugiere de cinco a seis páginas a máquina, a doble espacio. No publica poemas, canciones ni homenajes a personas, ni nada que ya se haya publicado en otro lugar.
      DI: Algo importante para nosotros como representantes: invitamos, pero cada miembro manda su propia historia, con sus propios datos. Nunca manden la historia de otra persona por ella. Y recuérdenles que La Viña también quiere fotos de salas de reunión, sin personas, y chistes.
      CONSEJO: La Viña manda un acuse de recibo por cada historia. Nunca le prometas a nadie que su historia se va a publicar. Para un taller de escritura completo en español, el comité tiene el Taller de escritura de La Viña, en esta misma página.
      FUENTE: aalavina.org/guia-para-contribuciones; The A.A. Service Manual, 2024-2026, p. 85 (en nuestras palabras).
    version_notes:
      short: "RECORTE A 60: deja."

