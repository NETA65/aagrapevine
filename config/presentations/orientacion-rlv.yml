    source: "Fuentes: aalavina.org · aalavina.org/calendario-de-eventos · el Kit del mes · a octubre de 2026"
    minutes: 2
    version_minutes: { short: 2.5 }
    notes: |
      DI: Este es el ritmo de un mes. Cada dos meses hay una edición nueva de La Viña para levantar. El día primero, el sitio de nuestro comité saca el resumen mensual y renueva el Kit del mes, así que sus noticias ya están listas. A mitad de mes cambia el Libro del mes: la tienda de La Viña pone un libro con descuento por un tiempo; a veces el de La Viña dura dos meses. Cada jueves está la Reunión Abierta de La Viña, en español, por Zoom.
      DI: El tercer miércoles se reúne nuestro comité de Área por Google Meet, {live:meeting_time}, y desde enero de 2027 cada reunión empieza con un(a) orador(a) invitado(a). Luego está la reunión de su distrito: pregúntenle a su MCD si el distrito recibe un informe de GV/LV, y quién lo da. Y por lo general el cuarto jueves, la oficina de La Viña tiene su Taller Mensual y Virtual, en español, por Zoom, {live:lv_workshop_time}: ID de Zoom {live:lv_workshop_zoom_id}. Es abierto a todos: libros de La Viña y Grapevine, noticias de eventos y novedades de la OSG.
      DI: No olviden la junta de trabajo de su propio grupo: ahí informan, y ahí va a la conciencia de grupo cualquier propuesta suya.
      CONSEJO: El taller de La Viña es por lo general el cuarto jueves; el calendario de La Viña lo ha mantenido en el cuarto jueves aun en los meses con cinco jueves. En noviembre y diciembre La Viña lo ha hecho el jueves antes de Acción de Gracias y antes de Navidad. Empieza a las 3:00 p. m. hora del Este, la hora de La Viña; La Viña no publica una hora de término, así que lo ponemos de una hora. Revisa la fecha cada mes en aalavina.org/calendario-de-eventos antes de anunciarla. El primer miércoles nuestro comité tiene también la Reunión de Grapevine, una reunión de AA en línea en inglés; invita a ella a quien lea en inglés.
      ACTUALIZA: si presentas para un solo distrito, cambia el espacio del día del distrito por su día de reunión: {ui:customize} → {ui:your_details}.
      FUENTE: el sitio del comité ({live:site}/es/meetings/ y /es/monthly/); aalavina.org/libro-del-mes; La Viña News, sept.-oct. 2026, p. 3; aalavina.org/calendario-de-eventos.
    version_notes:
      short: "RECORTE A 60: deja."

