  - id: "how-you-connect"
    layout: "columns"
    style: "cards"
    title: "Cómo te conectas: grupo, distrito, Área"
    columns:
      - heading: "1 · Tu grupo"
        text: "Informa en las juntas de trabajo; la conciencia de grupo decide."
      - heading: "2 · Tu distrito"
        text: "Si tu distrito pide informes de GV/LV, da uno breve."
      - heading: "3 · El comité de Área"
        text: "Cada mes por Google Meet. Todos los miembros de AA son bienvenidos."
      - heading: "4 · La oficina de la revista"
        text: "Regístrate, pregunta, haz pedidos y manda historias."
    takeaway: "Tu RSG y tu MCD son tus compañeros más cercanos: mantenlos al tanto."
    minutes: 1.5
    notes: |
      DI: Así es como encajan. Primero, su grupo: informan en la junta de trabajo, y la conciencia de grupo decide qué comprar, qué poner en la mesa o qué regalar. Segundo, su distrito: cada distrito organiza a su manera su servicio de Grapevine y La Viña. Algunos tienen un representante de GV/LV del distrito o todo un comité, los distritos de habla hispana muchas veces tienen su propio comité de La Viña, y en otros los RSG comparten las noticias. Si su distrito pide informes de GV/LV, den uno breve; su MCD les puede decir cómo funciona.
      DI: Tercero, el Área: nuestro Comité de Grapevine y La Viña de NETA 65 se reúne cada tercer miércoles por Google Meet, desde enero de 2027 con un(a) orador(a) invitado(a) cada mes, y todos los miembros de AA son bienvenidos. La coordinación del Área trabaja con los distritos y lleva las noticias en los dos sentidos. Cuarto, la oficina de la revista en Nueva York, AA Grapevine, Inc., donde se registran, preguntan, hacen pedidos y mandan historias.
      PREGUNTA (opcional, si hay tiempo): ¿Su distrito tiene un representante o un comité de La Viña? ¿A quién le preguntarían algo? (Toma una o dos respuestas; anota los distritos que no tienen.)
      CONSEJO: Las votaciones en las asambleas de Área siguen las Políticas y Procedimientos del Área. Si alguien pregunta, mándalo con la Secretaría del Área en lugar de contestar de memoria.
      FUENTE: Manual del RLV (2025); neta65.org/trusted-servants/grapevine-la-vina; informes del comité, Panel 75.
    version_notes:
      short: "RECORTE A 60: deja; sáltate la pregunta. La diapositiva siguiente, «Lo que es el puesto y lo que no es», no está en esta versión: di aquí su idea en una frase: «Atracción y no promoción: informamos e invitamos (Undécima Tradición)»."

  # (left out of the 60-minute version) "Selling" is never "un trabajo de ventas": the site never calls RLV service,
  # or what it isn't, a job.
  - id: "is-and-isnt"
    layout: "columns"
    style: "panels"
    title: "Lo que es el puesto, y lo que no es"
    columns:
      - heading: "Es"
        accent: "lv"
        items:
          - "El enlace de tu grupo con la revista"
          - "Compartir tu propia experiencia"
          - "Información para la conciencia de grupo"
          - "Una puerta a más servicio"
      - heading: "No es"
        accent: "grape"
        items:
          - "Vender: sin cuotas, sin presión"
          - "Manejar dinero, a menos que el grupo te lo pida"
          - "Decidir por el grupo"
          - "Algo que haces a solas"
    takeaway: "Atracción y no promoción: informamos e invitamos (Undécima Tradición)."
    minutes: 1.5
    notes: |
      DI: Resumamos el puesto así. Es un enlace. Es compartir su propia experiencia con la revista: «esta historia me ayudó». Es llevar información a la conciencia de su grupo para que el grupo decida. Y para muchos de nosotros es una puerta a más servicio: los representantes muchas veces pasan a servir en su distrito, en el Área o en otros comités, como Instituciones Correccionales, Tratamiento, IP o CCP.
      DI: No es vender. Ya en 1960 la Conferencia pidió una «actitud informativa» en las presentaciones del Grapevine, en lugar de una venta agresiva, y eso sigue en pie: sin cuotas, sin culpas, sin presión. No es manejar el dinero del grupo, a menos que su grupo se lo pida. No es tomar decisiones por el grupo. Y no es algo que tengan que hacer a solas: su distrito y nuestro comité están aquí.
      PREGUNTA (opcional, si hay tiempo): ¿Alguna palabra de la derecha les sorprendió?
      FUENTE: M-39, p. 52 (Acción Consultiva de 1960); P-52, p. 12; Undécima Tradición.
      TRANSICIÓN: Ahora veamos cómo es en realidad un mes de este servicio.
    version_notes:
      short: "RECORTE A 60: sáltate esta diapositiva; di su idea en una frase en la diapositiva anterior."

