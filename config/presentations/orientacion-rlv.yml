      DI: Nuestro comité de Área se reúne por {live:meeting_platform} cada tercer miércoles, {live:meeting_time}. Todos los miembros de AA son bienvenidos y no hace falta registrarse. No es una junta de trabajo. Abrimos con un momento de silencio y la Oración de la Serenidad; desde enero de 2027, un(a) orador(a) invitado(a) habla y contesta preguntas hasta las 7:30 (en una noche sin orador, como en noviembre y diciembre de 2026, compartimos sobre un tema). Luego vienen los eventos y las solicitudes de talleres, las ofertas especiales de las tiendas y los temas de las revistas; después los RLV y GVR comparten lo que les funciona. Cerramos a las 8:00 con la Declaración de la Responsabilidad, y después del cierre, el estacionamiento: quédense para lo que tengan en mente. El primer miércoles, con el mismo enlace, está nuestra Reunión de Grapevine, una reunión de AA en línea en inglés alrededor de una historia del Grapevine.
