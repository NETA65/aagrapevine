    en: "Getting Ready for the Conference: Grapevine and La Viña"
    es: "Preparándonos para la Conferencia: La Viña y Grapevine"
  summary:
    en: "For February and March: what the General Service Conference is, its Conference Committee on Grapevine and La Viña, how a group's voice reaches it through the GSR, the DCM and the delegate, the Fellowship survey on Grapevine, this year's agenda items (filled in from the delegate's background) and a time to talk them over."
    es: "Para febrero y marzo: qué es la Conferencia de Servicios Generales y su comité para las dos revistas, cómo llega la voz de un grupo por medio del RSG, el MCD y el delegado, la encuesta a la Comunidad sobre Grapevine, los puntos de agenda de este año (tomados del material de referencia del delegado) y un tiempo para conversarlos."
  audience:
