# =====================================================================
#  "Getting Ready for the Conference: Grapevine and La Viña" — for February and March 2027, before the 77th
#  General Service Conference: what the Conference is, its Conference Committee on Grapevine and La Viña, how a
#  group's voice reaches it (GSR, DCM, the Area assembly, the delegate), the Fellowship survey on Grapevine's
#  products, the year's agenda items and a time to talk them over, the Area's dates, and inviting the delegate. A web
#  presentation on /orientation/ (Presentations), new in November 2026 (no PowerPoint copy: no `drive_title`).
#
#  How it is written:
#   · the year's agenda items are the presenter's blanks ({fill:item_1} … {fill:item_3}): they were not published
#     in November 2026, and only the delegate's background material says what they are. So are the Conference's own
#     dates ({fill:conference_dates}), the day the delegate needs the groups' input and the delegate's visit. Nothing
#     on a slide guesses at them;
#   · the facts the repository already holds, with their sources: the Conference committee on the Grapevine since
#     1954 and its name since 2020, the Advisory Actions of 1954, 1960, 1962, 1978, 1986, 2001 and 2021 (as the
#     booth's facts and the other decks cite them: M-39, the Service Manual, P-52), and the Fellowship survey the 75th
#     Conference (2025) asked the AA Grapevine Board for, whose final report the committee meeting's notes expect on
#     the 2027 agenda (M-39, p. 58: config/history.yml, committee-meeting.yml). The 2027 Conference is the 77th
#     (config/site.yml `meeting: speakers:`). The delegate's service address is the Area's, delegate@neta65.org
#     (content/events/2026-11-10-neta65-delegate-town-hall.md);
#   · the Area's dates come from the Events page (a `live` events list: the ACM, the assembly …), and the
#     committee's next meeting from config/site.yml `meeting:` ({live:meeting_next});
#   · the agenda's times are worked out by the player (`from`): the times written are the full version's;
#   · the versions: "full" (about 45 minutes) and "short" (about 30: the history and the delegate's Right of Decision
#     left out, the talk shorter). A TRANSITION to a slide the short version leaves out has its own {not:short} /
#     {only:short} line;
#   · the delegate and every speaker by service position only; nothing here speaks for the Conference, the delegate
#     or AA Grapevine, Inc.
#  The content stays English (the owner's decision); the card, the versions and the blanks' labels are bilingual.
#  Checked by tests/test_presentations.py (and by the build, with I18N_STRICT=1).
# =====================================================================
id: "conference-prep"
order: 8
lang: "en"
title: "Getting Ready for the Conference: Grapevine and La Viña"
short: "Conference Prep"
eyebrow: "Getting ready for the Conference"
footer: "NETA 65 Grapevine & La Viña Committee · {live:panel}"
minutes: 45
icon: "landmark"
tone: "grape"
