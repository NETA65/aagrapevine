      WHAT'S HERE: a checklist for before the day, and the credits and sources, in {ui:customize} → {ui:prepare}, where you can read or print each one.

  - id: "before-the-day"
    layout: "bullets"
    facilitator: true
    checklist: true
    eyebrow: "Appendix · For facilitators"
    title: "Before the day"
    items:
      - "Date, place, language and format agreed with the host group or district: they decide"
      - "The date, the host and the place: {ui:customize} → {ui:your_details}"
      - "Both story lines called once to test them"
      - "The story recorder opened on a phone, and the code scanned from the back of the room"
      - "Paper, pens and a timer; a whiteboard or the chat for the numbers"
      - "Online: breakout rooms of two for the activity; nobody recording"
    notes: |
      WHEN: a week before, about an hour.
      STEP 1: The host decides the date, the place, the language and the format; the committee suggests and supports. For a workshop in Spanish, the presenter speaks Spanish: these notes have a few lines in Spanish, and the recorder and the story lines work in Spanish.
      STEP 2: Call both story lines to test them, open the story recorder on your own phone, and scan the code on its slide from the back of the room.
      STEP 3: In a room, find a quiet corner or two where members can try the recorder for ten seconds each. Online, plan breakout rooms of two for 'Plan your share'.
      TIP: Don't record the workshop, and don't record anyone for the magazines: each member records their own story, at home, by their own choice. Don't promise the host a published story.

