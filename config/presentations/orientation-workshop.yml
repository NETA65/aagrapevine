  # pptx 30
  - id: "money-at-the-table"
    layout: "bullets"
    title: "Money at the table: as your group decides"
    items:
      - "The group conscience decides whether anything is sold at the table, and how"
      - "Many groups sell nothing: members order from the official stores themselves"
      - "If your group does handle money: keep a written record, give receipts, report back"
      - "Group money goes through the treasurer, the way your group's guidelines say"
      - "Never a basket “for Grapevine”: Grapevine accepts no contributions"
    takeaway: "Order books for the group only after the group has approved the expense."
    source: "Sources: GVR Workbook (2026), pp. 26–27, 39 · RLV Manual (2025), p. 15 · in our own words"
    minutes: 1.5
    version_minutes: { short: 1.75 }
    notes: |
      SAY: Money at the table is always the group's decision. Some groups sell nothing at all: the table is for reading and borrowing, and members order directly from the official stores. Others keep a few books or back issues for sale. Either way, before you handle any money, ask your group conscience how it wants this done.
      SAY: If your group does ask you to handle money, keep it simple and transparent: a written record, a receipt for every purchase, and a short report back to the group. Group money goes through the treasurer, the way your group's own guidelines say. And please don't buy books for the group and hope to be paid back: bring the proposal to the business meeting first.
      SAY: One thing we never do is pass a basket 'for Grapevine'. Grapevine doesn't accept contributions. Buying and using the magazines is how we support them.
      TIP: At Area assemblies and conventions, the literature table follows the Area's own guidelines. The Area's Policies and Procedures (section 4.9 in the copy we have) limit it to Conference-approved literature, Grapevine and La Viña materials, and Guidelines. Check the current wording with the Area before you rely on it.
      SOURCE: GVR Workbook (2026), pp. 26-27 and 39; RLV Manual (2025), p. 15; Service Manual, p. 66 (all paraphrased).
    version_notes:
      short: "CUT TO 60: keep."

  # pptx 31. The deck's numbered cards. The prices said in the notes are the ones in effect on the day shown (they
  # switch by themselves on January 1, 2027); {live:price_change_note} says so while the notice is current, and is
  # empty after it. Each price follows its own label ("Grapevine in print, $36.00"), so a price the site cannot read
  # says "see the Shop page" in a sentence that still reads. "they're on the next slide too" is only for the versions
  # that show the next slide. "never use a price as a reason to hurry" reads "never use a price to rush anyone".
  - id: "four-ways"
    layout: "columns"
    style: "cards"
    title: "Four ways to subscribe or give"
    columns:
      - heading: "1 · For yourself"
        text: "Print, digital (web and app) or Complete."
      - heading: "2 · For your group"
        text: "A group expense, if the group conscience agrees."
      - heading: "3 · As a gift"
        text: "For a sponsee, a newcomer or an anniversary."
      - heading: "4 · Carry the Message"
        text: "The office sends it to an alcoholic in need."
    takeaway: "Prices change: check the official stores or our /shop/ page."
    minutes: 1.5
    version_minutes: { short: 2.25 }
    notes: |
      SAY: There are four ways to put the magazines in more hands. One, for yourself: print, digital, which covers the website and the app, or Complete, which bundles print and digital. Two, for your group: the group conscience can choose a subscription for the literature table. AA's pamphlet on self-support lists Grapevine literature among a group's ordinary expenses, next to rent and AA literature, so it's paid from the basket like any other group expense.
      SAY: Three, as a gift, for a sponsee, a newcomer, or a sobriety anniversary; there are gift certificates too. And four, Carry the Message: you buy a gift certificate for someone you don't know, and the Grapevine or La Viña office assigns it to an alcoholic in need, for example someone in a prison, a treatment center or a hospital, or someone who is homebound. A group or district can buy several together.
      SAY: Prices change, so the official stores and our committee's Shop page always have the up-to-date list. For a year, AA Grapevine's prices are: Grapevine in print, {live:price_gv_print}; digital, {live:price_gv_digital}; La Viña in print, {live:price_lv_print}; digital, {live:price_lv_digital}. {live:price_change_note}
      {not:short} SAY: The yearly prices are on the next slide too.
      TIP: Present these as options. The group conscience decides; members decide for themselves. Never pressure anyone to buy, and never use a price to rush anyone.
      SOURCE: F-3 Self-Support (June 2026), pp. 7, 12-13; aagrapevine.org/carry-the-message; aalavina.org/lleva-el-mensaje; P-52, pp. 10-11. Prices: AA Grapevine's letter to intergroups and central offices, October 1, 2026.
    version_notes:
      short: "CUT TO 60: keep. The next slide is skipped in the 60-minute version, so say the yearly prices here."

  # pptx 32 (left out of the 60-minute version). The deck's "Yearly prices from January 1, 2027" were AA Grapevine's
  # new prices; here the slide shows the yearly prices in effect on the day it is shown, and they switch to the new
  # ones by themselves on January 1, 2027. Its "IF YOU PRESENT BEFORE JANUARY 1, 2027" note said the 2026 prices still
  # applied until then: the slide now shows them itself, so that note says how the prices switch. "for a limited time"
  # (the Book of the Month) reads "for a set time".
