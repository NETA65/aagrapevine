  - id: "literature-table"
    layout: "columns"
    style: "panels"
    title: "Setting up a literature table"
    columns:
      - heading: "Set it up"
        accent: "gv"
        items:
          - "Current Grapevine and La Viña, face up"
          - "Back issues sorted by theme"
