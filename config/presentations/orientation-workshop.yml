  # pptx 35
  - id: "encouraging"
    layout: "bullets"
    title: "Encouraging members to write"
    items:
      - "Written by members: no experience needed; the editors fix the spelling"
      - "Tell one experience, the way you'd share it at your home group"
      - "Grapevine: about 300 to 1,800 words · La Viña: 5–6 double-spaced pages"
      - "Neither prints poems, song lyrics, tributes or previously published work"
      - "Each writer sends their own story: never send someone's story for them"
    takeaway: "Jokes and photos of empty meeting rooms are welcome too."
    source: "Sources: the Grapevine and La Viña guidelines for contributors · Service Manual, p. 85"
    minutes: 1.5
    version_minutes: { short: 2.5 }
    notes: |
      SAY: Every story in these magazines was written by a member like us, and the magazines depend on it: they can't pay for articles, so they need as many voices as possible. AA's Service Manual encourages members to send articles even if they think their grammar and spelling aren't perfect. The editors take care of that. If you've written a Fourth Step or a long email, you can write a story.
      SAY: The best stories tell one experience, the way you'd share it at your home group: what happened, what you did, how it changed you. Grapevine suggests about 300 to 1,800 words; La Viña suggests five or six double-spaced typed pages. Neither magazine prints poems, song lyrics or tributes to individuals, or anything already published elsewhere.
      SAY: One important point for us as reps: we invite, but each member sends their own story, with their own contact details. Never send someone's story for them. And remind writers that the magazines also want photos of meeting rooms, with no people in them, and jokes.
      TIP: A story that misses its theme's deadline can still be used in a later issue. Grapevine contacts writers only when a story is selected; La Viña acknowledges every submission. Never promise anyone that their story will be published.
      SOURCE: aagrapevine.org/guidelines-contributing-grapevine; aalavina.org/guia-para-contribuciones; The A.A. Service Manual, 2024-2026, p. 85; GVR Workbook (2026), pp. 42-43 (paraphrased).
    version_notes:
      short: "CUT TO 60: keep."

