  # pptx 52. The deck's TIME line also split the nine minutes: kept as TIMING. Green, as every activity in the
  # PowerPoint (kit.py's activity(): accent="vine"), inside Part 7's grape. In the 60-minute version: 4 minutes, one
  # or two scenarios discussed by the whole room (its "CUT TO 60" line), so that version has its own title, steps,
  # time card and materials (`version_fields.short`) and its own lines of the notes ({only:short}): no groups, no
  # breakout rooms, and only the first scenario slide.
  - id: "scenarios"
    layout: "activity"
    eyebrow: "Activity"
    accent: "vine"
    title: "Scenarios in small groups"
    steps:
      - "Form groups of three or four (on Zoom: breakout rooms)"
      - "Each group takes one scenario from the next two slides"
      - "What would you do? Which Tradition helps?"
      - "Choose someone to share back in one minute"
    duration: 9
    materials: ["The scenario slides", "One volunteer to report back"]
    takeaway: "**Share back:** What would you suggest to your group?"
    version_fields:
      short:
        title: "Scenarios for the whole room"
        steps:
          - "Read one or two scenarios from the next slide together"
          - "What would you do? Which Tradition helps?"
          - "Anyone can answer, in a sentence or two"
        duration: 4
        materials: ["The scenario slide"]
        takeaway: "What would you suggest to your group?"
    minutes: 9
    version_minutes: { short: 4 }
    notes: |
      {not:short} SAY: Let's practice with some real-life situations. In groups of three or four, take one scenario. Talk about what you would do, and which Tradition or principle helps. Pick someone to share back your answer in one minute. You'll have about four minutes in your groups.
      {only:short} SAY: Let's practice with a real-life situation or two, all together. I'll read a scenario; think about what you would do, and which Tradition or principle helps. Anyone can answer, in a sentence or two.
      {not:short} DO: Show the next two slides first so everyone sees all six scenarios. Assign scenarios by letter (A to F), one per group; with more than six groups, repeat letters. On Zoom, put the six scenarios in the chat before opening breakout rooms of three or four for 4 minutes, with a 1-minute warning. In a room, groups can turn their chairs.
      {not:short} DO (share back, about 4 minutes): hear from three groups, a minute each, then go through the remaining scenarios yourself, using the possible answers in the notes of the scenario slides.
      {only:short} DO: Show the next slide, read scenario A or B aloud, and take two or three answers from the room or the chat. Then give the possible answer from that slide's notes.
      TIP: There's rarely one right answer. Steer toward the principles: the group decides, anonymity, attraction rather than promotion, self-support.
      {not:short} TIMING: 1 minute to form groups or open the breakout rooms, 4 in groups, 4 to share back: hear from three groups, then go through the remaining answers yourself.
    version_notes:
      short: "CUT TO 60: no breakout rooms. Pick one or two scenarios and discuss them as a whole room."

  # pptx 53. The deck's TIME line: "shown during the activity" (its time is the activity's); the player needs a
  # length for every slide shown, so it has the smallest one, and the deck's words stay as TIMING. The PowerPoint
  # draws its eyebrow and takeaway in its first card's colour (blue; cards blue, orange, green): its own `accent`.
  - id: "scenarios-a-c"
    layout: "columns"
    style: "cards"
    eyebrow: "Activity"
    accent: "gv"
    title: "Scenarios A to C"
    columns:
      - heading: "A · The treasurer"
        accent: "gv"
        text: "“Can we add Grapevine to our list of contributions, like GSO?”"
      - heading: "B · The photo"
        accent: "lv"
        text: "A member wants to post a photo of your table, with everyone smiling behind it."
      - heading: "C · The vote"
        accent: "vine"
        text: "Your group voted no on a group subscription."
    takeaway: "What would you do? Which Tradition or principle helps?"
    minutes: 0.25
    notes: |
      {not:short} POSSIBLE ANSWERS (share after the groups report):
      {only:short} POSSIBLE ANSWERS (share after the room has answered):
      A. Grapevine doesn't accept contributions, from groups or members. A group subscription is an ordinary group expense, so the group can budget for one, or for Carry the Message certificates, if its group conscience agrees. Bring both options to the business meeting. (Service Manual, p. 66; F-3, pp. 7 and 12-13; Tradition Seven.)
      B. Photograph the table with nobody in it. Full-face photos of members posted publicly break anonymity even without names, and that includes social media and group chats people outside AA can see. Offer to take the picture of the table instead. (P-47, pp. 10-11; Traditions Eleven and Twelve.)
      C. That's the group's right (Tradition Four). Keep the magazines visible with your own copy or back issues, announce the free tools, invite members to write, and offer the idea again another year. No pressure and no guilt.
      TIMING: shown during the activity.
    version_notes:
      short: "CUT TO 60: use scenario A or B only."

  # pptx 54 (left out of the 60-minute version). Its TIME line: as on the slide before. Its eyebrow and takeaway are
  # its first card's orange in the PowerPoint (cards orange, grape, blue): its own `accent`. Answer D gives the
  # Reunión Abierta's day and time from the site ({live:lv_open_meeting}), as "Every week: open AA meetings on Zoom"
  # does, where the deck said "on Thursdays": "starting Nov. 5, 2026" until that day, then "since".
  - id: "scenarios-d-f"
    layout: "columns"
    style: "cards"
    eyebrow: "Activity"
    accent: "lv"
    title: "Scenarios D to F"
    columns:
      - heading: "D · The newcomer"
        accent: "lv"
        text: "A Spanish-speaking newcomer picks up a Grapevine at your English-speaking meeting."
      - heading: "E · The poem"
        accent: "grape"
        text: "A member has written a poem and wants to send it to the magazine."
      - heading: "F · The assembly table"
        accent: "gv"
        text: "Your district asks you to run the table at an assembly, including sales."
    takeaway: "What would you do? Which Tradition or principle helps?"
    minutes: 0.25
    notes: |
      POSSIBLE ANSWERS (share after the groups report):
      D. Tell them about La Viña, AA's magazine in Spanish, and give them a copy if you have one. Mention the La Viña app and the {lang:es}Reunión Abierta de La Viña{/lang} — {live:lv_open_meeting} — and offer to connect them with an RLV or a Spanish-speaking meeting through your local AA office. Welcome comes first.
      E. Neither magazine publishes poems, song lyrics or tributes. Thank them, and invite them to write the experience behind the poem as a story, to send a letter or a joke, or to record their story by phone. A writing workshop is a great next step.
      F. Ask first what the district's and the Area's guidelines say: what may be displayed and sold, who handles the money, and how it's reported. Keep a written record, give receipts, keep the table's money separate from your own, and hand it over as the guidelines say. Consider asking a second trusted servant to count with you. The tracker helps with your own expenses.
      TIMING: shown during the activity.
    version_notes:
      short: "CUT TO 60: skip this slide unless a group asks."

