  # pptx 50
  - id: "faq-money"
    layout: "bullets"
    title: "Questions we often hear: money and the magazines"
    items:
      - text: "**Can our group send a contribution to Grapevine?**"
        items: ["No. Buy and use the magazines, or give Carry the Message gifts."]
      - text: "**Can I photocopy a story for our meeting?**"
        items: ["No. The stories are copyrighted: lend the issue or share the link."]
      - text: "**Do I need my own subscription?**"
        items: ["No. Many reps find it helps; the group's copy is a good start."]
      - text: "**Where do order problems go?**"
        items: ["Customer service: (800) 631-6025, or (800) 640-8781 in Spanish."]
    minutes: 1.5
    version_minutes: { short: 0.75 }
    notes: |
      SAY: Here are the questions we hear most about money and the magazines. (Read each question, pause a beat to let the room answer in their heads, then give the answer.)
      SAY: Can our group send a contribution to Grapevine? No. Grapevine is set up not to take contributions. A group supports it by buying the magazines and using them, and by giving gift or Carry the Message certificates if it wishes. Can I photocopy a story? No: the stories belong to AA Grapevine, Inc. Lend the issue, share the link, or play the audio from the official site or app. Do I need my own subscription to serve? No. It helps to read each issue, and many reps do subscribe, but the group's copy and the free podcasts and videos are a fine start. Order problems go to customer service; you don't have to fix them yourself.
      ASK (optional, if on time): What other money questions have you been asked at your group?
      SOURCE: Service Manual, p. 66; F-3 (June 2026), pp. 12-13; aagrapevine.org copyright and reprint policy; aagrapevine.org/contact-us.
    version_notes:
      short: "CUT TO 60: keep; answer quickly, no question."

