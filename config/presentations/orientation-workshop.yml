      SAY: Can I post photos? Of the table, yes, with nobody in it. AA's pamphlet on anonymity treats public web pages and social media like press, radio and film: no full names and no recognizable faces of members. How long do I serve? As your group decides; two years is common. Who can come to the committee meeting? Any AA member, no registration.
