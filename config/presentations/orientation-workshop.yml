  # pptx 48 (left out of the 60-minute version)
  - id: "words"
    layout: "columns"
    style: "panels"
    title: "Words that help, and words to avoid"
    columns:
      - heading: "Say"
        accent: "vine"
        items:
          - "“A group subscription is a group expense”"
          - "“Buying and using the magazines supports them”"
          - "“A Carry the Message gift certificate”"
          - "“The Conference recognizes it as AA's international journal”"
          - "“You might bring it to your group conscience”"
      - heading: "Avoid"
        accent: "grape"
        items:
          - "“A donation to Grapevine”"
          - "“Pass the basket for Grapevine”"
          - "“Conference-approved Grapevine”"
          - "“Every group must subscribe”"
          - "“Sell subscriptions”, “quota”, “pitch”"
    minutes: 0.75
    notes: |
      SAY: Words matter, so here's a short list. Say 'a group subscription is a group expense', not 'a donation to Grapevine'. Say 'buying and using the magazines supports them', and never pass a basket for Grapevine. Say 'a Carry the Message gift certificate'. Say the Conference recognizes Grapevine as AA's international journal, rather than calling it Conference-approved literature.
      SAY: And watch for pressure words. 'Every group must subscribe' isn't true: each group is autonomous. 'Selling subscriptions', 'quotas' and 'pitches' belong to business, not to Twelfth Step work. 'You might', 'consider', 'bring it to your group conscience' carry the same message with an open hand.
      ASK (optional, if on time): Which of these have you heard at a meeting? (Take one answer, kindly.)
      SOURCE: F-3 (June 2026); The A.A. Service Manual, 2024-2026, p. 85; M-39, p. 52; the committee website's wording rules in GVR / RLV 101 ({live:site}/orientation/).
      TRANSITION: Let's put it all together with some common questions.
    version_notes:
      short: "CUT TO 60: skip; fold the main point into the previous slide."

