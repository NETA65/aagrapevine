        items:
          - "Grapevine print: {live:price_gv_print}, digital: {live:price_gv_digital} · La Viña print: {live:price_lv_print}, digital: {live:price_lv_digital}"
      - "Subscriptions arrive in plain packaging, with no mention of AA"
      - text: "Renewals, address changes, problems: customer service"
        items:
          - "(800) 631-6025, or (800) 640-8781 in Spanish"
