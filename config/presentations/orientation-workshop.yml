    version_minutes: { short: 1.75 }
    notes: |
      SAY: A good literature table is small, current and tidy. Put this month's Grapevine and the current La Viña face up, where people walk past. Sort older issues by theme, so a member can find one about sponsorship, the Steps or the holidays. A lending box works well: members borrow an issue and bring it back, or pass it on. A simple sign-out sheet with first names only is plenty.
      SAY: Bring catalogs and order forms, and the free postcards from the official rep kits: the apps, the podcast, YouTube, Carry the Message. Our committee website has a QR table card that sends people to subscriptions and free resources. And keep a few back issues to give a newcomer.
      SAY: If you take a picture of your table to share with the district, photograph the table, never the people.
      TIP: The rep kits are at aagrapevine.org/gvr-resources and aalavina.org/recursos; our site gathers them at /gvr/#kits. For a large event, AA Grapevine can send free printed materials: write to gvrc@aagrapevine.org with your name, Area, service position, the event's name, date and expected attendance, and allow four to six weeks.
      ASK (optional, if on time): What's one thing on your group's table today? What's missing?
