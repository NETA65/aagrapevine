      SAY: Let me sum up the service position this way. It is a link. It is sharing your own experience with the magazines: 'this story helped me'. It is bringing information to your group conscience so the group can decide. And for many of us it's a doorway into wider service; GVRs often go on to serve their district, the Area, or other committees such as Corrections, Treatment, PI or CPC.
