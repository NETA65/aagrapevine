  - id: "seventh-tradition"
    layout: "quote"
    title: "Money and the Seventh Tradition"
    quote: "AA Grapevine, Inc. is not set up to take contributions from groups or individuals. Groups and individual members support the Grapevine by purchasing Grapevine and La Viña subscriptions and other Grapevine publications and using them in their Twelfth Step work."
    credit: "Reprinted from _Self-Support: Where Money and Spirituality Mix_ (F-3), p. 12, with permission of Alcoholics Anonymous World Services, Inc."
    minutes: 1
    version_minutes: { short: 1.5 }
    notes: |
      SAY: Let's talk about money plainly, because it's where good intentions most often go wrong. This is from AA's pamphlet on self-support, updated in June 2026. (Read the quotation.)
      SAY: So AA Grapevine is set up differently from the rest of our service structure. Our Seventh Tradition contributions support the group, district, Area and GSO. Grapevine takes no contributions: it pays its way through the magazines, books and other items we buy and use, and the General Service Board covers La Viña's shortfall. The same pamphlet, when it lists a group's basic expenses such as rent, refreshments and AA literature, includes Grapevine literature. A group subscription is an ordinary group expense, paid from the Seventh Tradition basket like the others, when the group conscience chooses it. The pamphlet also suggests groups consider subscriptions, gift certificates, books, or the Carry the Message project when they discuss how to use their funds.
      TIP: In 2026 the Conference was asked to consider letting Grapevine accept contributions. It made no change; instead, this answer in F-3 was revised. Don't present contributions to Grapevine as something coming.
      SOURCE: F-3 (June 2026), pp. 7, 12-13; M-39 (2026); Service Manual, p. 66.
    version_notes:
      short: "CUT TO 60: keep; read the quote only."

