  - id: "month-at-a-glance"
    layout: "table"
    title: "Your month at a glance"
    header: ["When", "What happens", "Your part"]
    rows:
      - ["Around the 1st", "New issue; monthly digest", "Hold up the issue"]
      - ["The 1st", "Grapevine story deadline", "Name the next theme"]
      - ["Mid-month", "Book of the Month", "Mention this month's book"]
      - ["3rd Wednesday", "Area committee meeting (Zoom)", "Come and ask questions"]
      - ["{fill:district_day}", "District meeting", "Ask your DCM if there's a GV/LV report"]
      - ["Usually the 4th Thursday", "La Viña's monthly workshop", "Invite Spanish speakers"]
    widths: [3.75, 4.45, 3.63]
    first_col_bold: true
    source: "Sources: aagrapevine.org · aalavina.org/calendario-de-eventos · the Monthly toolkit · as of October 2026"
    minutes: 2
    version_minutes: { short: 2.5 }
    notes: |
      SAY: Here's the rhythm of a month. Around the first, there's a new issue to hold up. Grapevine comes every month; La Viña every two months. On the first, our committee's website also puts out the monthly digest and refreshes the Monthly toolkit, so your news is ready for you. The first of the month is also Grapevine's story deadline: each month the editors close one theme, several months before that issue's cover date.
      SAY: Around the middle of the month, the Book of the Month changes: each store features one older title at a discount for a set time. Grapevine's changes every month; La Viña's sometimes runs for two months. On the third Wednesday, our Area committee meets on Zoom, {live:meeting_time}. Then there's your district meeting: ask your DCM whether the district takes a GV/LV report, and who gives it. And once a month, usually on the fourth Thursday, La Viña's office holds an information workshop in Spanish on Zoom, {live:lv_workshop_time}: Zoom ID {live:lv_workshop_zoom_id}.
      SAY: Don't forget your own group's business meeting: that's where you report, and where any proposal of yours goes to the group conscience.
      TIP: La Viña's workshop is usually on the fourth Thursday; La Viña's own calendar has kept the fourth Thursday even in months with five Thursdays. In November and December La Viña has held it on the Thursday before Thanksgiving and before Christmas. It starts at 3:00 p.m. Eastern, La Viña's own time; La Viña publishes no end time, so we list it as one hour. Check the date at aalavina.org/calendario-de-eventos each month before you announce it.
      UPDATE: if you're presenting to a single district, replace the district-day fill-in with its real meeting day: {ui:customize} → {ui:your_details}.
      SOURCE: the committee website ({live:site}/meetings/ and /monthly/); aagrapevine.org/contribute; aagrapevine.org/BOTM and aalavina.org/libro-del-mes (offer dates as of October 2026); La Viña News, Sept.-Oct. 2026, p. 3; aalavina.org/calendario-de-eventos.
    version_notes:
      short: "CUT TO 60: keep."

