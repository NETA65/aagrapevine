      - text: "Book of the Month: one title at a discount for a set time"
        items:
          - "[www.aagrapevine.org/BOTM](https://www.aagrapevine.org/BOTM) · [www.aalavina.org/libro-del-mes](https://www.aalavina.org/libro-del-mes)"
    source: "Sources: aagrapevine.org/contact-us · aalavina.org"
    minutes: 1.25
    notes: |
      SAY: When a member wants to subscribe, send them to the official store: aagrapevine.org for Grapevine, aalavina.org for La Viña. Something members new to AA appreciate: subscriptions come in plain packaging, with no mention of AA on the envelope.
      SAY: These are the yearly prices I just gave you, AA Grapevine's current ones. {live:price_change_note} For any other plan, such as Complete or two or three years, our committee's Shop page has the up-to-date list.
      PRICE CHANGES: the prices on the slide are the ones in effect on the day you present; when AA Grapevine announces new ones, they switch by themselves on the day they start. Say a change as plain information, never as pressure to subscribe.
      SAY: For renewals, address changes or a missing issue, customer service helps: there's an English line and a Spanish line, and an email address for each. You don't need to solve order problems yourself; just know where to send people.
      SAY: And around the middle of the month, each store features one older title at a discount for a set time: the Book of the Month. Grapevine's changes every month; La Viña's sometimes runs longer. It's a nice, light thing to mention in an announcement.
      TIP: Don't collect members' payment details or order for them unless your group asks you to. If you do help with a group order, keep copies of the forms and payments.
      SOURCE: aagrapevine.org/contact-us; GVR Workbook (2026), p. 32; RLV Manual (2025), pp. 10 and 15; aagrapevine.org/BOTM; aalavina.org/libro-del-mes. Prices: AA Grapevine's letter to intergroups and central offices, October 1, 2026; it says nothing about 2- or 3-year, Complete or monthly plans, so don't guess at those.
      TRANSITION: Let's take a break.
