# GVR and RLV Orientation Workshop — the web presentation on /orientation/ ("Workshop presentations").
#
# Converted from the committee's PowerPoint deck (built 2026-10-01 by aagrapevine-ops\decks\deck1_gvr-orientation.py;
# its copy is in the Drive folder 2027-2028_Panel77_GVLV\slides\): every slide in the same order, with the same words
# on the slide and in the notes. Only what the web player does differently was adapted:
#  · facts that change — the committee meeting's time, Zoom ID and passcode, La Viña's monthly workshop, the weekly
#    open meetings, the prices, this month's issues and themes, the story deadlines, the assemblies, the site's own
#    address — are {live:…} tokens or `live` slides, so they stay current by themselves (the site is rebuilt every
#    day). A fact the site's data may lack (La Viña's next deadline, a Book of the Month between offers …) then says
#    where to look ("see aalavina.org for La Viña's themes"), so the words around it are written to read well
#    either way ("La Viña: …", never a label left with nothing after it);
#  · the deck's [fill-ins] are the presenter's blanks, {fill:…} (Customize → Your details). The title slide shows the
#    presenter's service position, never a name; a first name appears only in the presenter's own notes (AA's
#    anonymity: a presenter is a service position);
#  · each TIME line became `minutes` (the player writes the TIME line for the version being shown), and each
#    "CUT TO 60" line is a `version_notes` of the 60-minute version (`short`), which leaves out the slides its plan
#    skips. Where a left-out slide asked for one sentence to be said instead, that sentence is also in the version
#    note of the slide just before it, so the presenter still sees it;
#  · what the 60-minute version says differently is written for it: a slide's own text in that version is its
#    `version_fields.short` (the agenda's title and rows, the welcome's break, the scenario activity), and a line of
#    the notes only one version needs starts with {only:short} or {not:short} (the opening's "about ninety minutes",
#    a TRANSITION to a slide that version leaves out);
#  · the two hidden slides are facilitator pages (Customize → Prepare), never projected; PowerPoint steps in the notes
#    now say what to do in the player, naming its controls with {ui:…} ("{ui:customize} → {ui:your_details}"), so
#    the Spanish page names them in Spanish;
#  · a few words the site's wording rules leave out ("job", "of course", "limited time", "hurry") are reworded;
#  · the facts the site keeps are its {live:…} keys where the deck typed them: both Books of the Month (botm,
#    botm_lv), the two story lines' numbers (gv_audio_phone, lv_audio_phone), the weekly open meetings
#    (gv_open_meeting, lv_open_meeting, open_meeting_zoom) and the next assembly (assembly_next);
#  · the 60-minute version's times follow the deck's 60-minute plan (`version_minutes.short`, see the versions);
#  · colours: a part's colour is its section slide's `accent`; a slide the PowerPoint drew in another colour has
#    that colour as its own `accent` (the Q&A's grape, the activities' green, La Viña's orange …). The two sample
#    announcements are read-aloud cards (`style: "script"`) and the break a pause slide (`style: "break"`), as in
#    the PowerPoint. Spanish words in the English slides and notes are marked {lang:es}…{/lang} (the Spanish sample,
#    the Spanish Preamble and Responsibility Statement, La Viña's names for things), so a screen reader reads them in
#    Spanish. No slide of the deck was printed for the participants, so none is a `handout`.
#
# Check it: .venv\Scripts\python.exe tests\test_presentations.py config\presentations\orientation-workshop.yml

id: "orientation-workshop"
order: 1
lang: "en"
title: "GVR and RLV Orientation Workshop"
short: "Orientation Workshop"
eyebrow: "Welcome"
footer: "NETA 65 Grapevine & La Viña Committee · {live:panel}"
minutes: 90
icon: "compass"
tone: "vine"
drive_title: "GVR and RLV Orientation Workshop"

card:
  title:
    en: "GVR and RLV Orientation Workshop"
    es: "Taller de orientación para RLV y GVR"
  summary:
    en: "The two magazines and how they pay their way, what a GVR or RLV does each month, a one-minute announcement to practice, and the committee's tools and people to ask, with a break."
    es: "Las dos revistas y cómo se mantienen, lo que hace un RLV o un GVR cada mes, un anuncio de un minuto para practicar, y las herramientas del comité y a quién preguntar, con un descanso."
  audience:
    en: "New and returning GVRs and RLVs, and any GSR, DCM or member curious about this service: at an Area or district workshop, on Zoom or in person."
    es: "RLV y GVR nuevos o que regresan, y cualquier RSG, MCD o miembro a quien le interese este servicio: en un taller del Área o del distrito, por Zoom o en persona."

# The versions (Customize → Version). The 60-minute one is the deck's hidden "For facilitators: the 60-minute
# version" plan: no break, introductions in the chat, no pair practice, no breakout rooms, and these slides left out.
# Its slides' `version_minutes.short` follow the plan's times, so its agenda and TIME lines match the plan (0:05,
# 0:18, 0:27, 0:33, 0:40, 0:49, 0:55): the opening, Part 7 and the closing take the times of the PowerPoint's "CUT TO
# 60" lines (5, 6 and about 5 minutes); Parts 1–2 keep their full minutes (13, as the plan says). For Parts 3–6 the plan kept
# about the full workshop's lengths (9, 6, 7, 9 minutes) although it skips slides there, so their remaining slides
# get proportionally more time (room for questions). The TIME line is the one timing of a slide (owner, 2026-10-02):
# the "CUT TO 60" lines say what to keep, shorten or skip, without the PowerPoint's minute counts, which added up to
# about 45 minutes, not to the plan's 60.
presets:
  - id: "full"
    label: { en: "Full workshop (about 90 minutes)", es: "Taller completo (unos 90 minutos)" }
    minutes: 90
  - id: "short"
    label: { en: "60-minute version", es: "Versión de 60 minutos" }
    minutes: 60
    hide: ["milestones", "is-and-isnt", "practice", "helping-subscribe", "break", "record", "where-to-send", "tracker",
           "coming-up", "words", "scenarios-d-f"]
    note:
      en: "For example, at a district meeting: no break, introductions in the chat, no pair practice and no breakout rooms. Leaves out the milestones, “is and isn't”, “Helping a member subscribe”, recording, “Where to send a story”, the tracker, “Coming up”, “Words that help” and the second scenario slide. The agenda and the times in the notes follow the deck's 60-minute plan, which leaves each part a few minutes for questions; each slide's notes show its “CUT TO 60” line: what to keep, shorten or skip."
      es: "Por ejemplo, en una reunión de distrito: sin descanso, presentaciones en el chat, sin práctica en parejas y sin salas para grupos pequeños. Deja fuera los hitos, “is and isn't”, “Helping a member subscribe”, grabar tu historia, “Where to send a story”, el registro de gastos, “Coming up”, “Words that help” y la segunda diapositiva de casos. La agenda y los tiempos de las notas siguen el plan de 60 minutos de la presentación, que deja a cada parte unos minutos para preguntas; las notas de cada diapositiva muestran su línea “CUT TO 60”: qué mantener, acortar u omitir."

# The presenter's blanks (Customize → Your details; kept on their own device). An empty one shows on the slide as an
# orange [hint], as the deck's [fill-ins] did. presenter and first_name are shared by all four presentations.
fillins:
  - key: "date"
    label: { en: "Date", es: "Fecha" }
    hint: "Month DD, YYYY"
  - key: "place"
    label: { en: "Place, or Zoom", es: "Lugar o Zoom" }
    hint: "Zoom or venue"
  - key: "presenter"
    label: { en: "Presenter's service position", es: "Puesto de servicio de quien presenta" }
    hint: "Service position"
    default: "Area 65 Grapevine / La Viña Chair"
    shared: true
  - key: "first_name"
    label: { en: "Your first name (only in your notes)", es: "Tu nombre de pila (solo en tus notas)" }
    hint: "first name"
    shared: true
    notes_only: true
  - key: "district_day"
    label: { en: "Your district's meeting day (“Your month at a glance”)", es: "Día de la reunión de tu distrito (“Your month at a glance”)" }
    hint: "District's day"
  - key: "month_event"
    label: { en: "This month's event (“This month at a glance”)", es: "El evento de este mes (“This month at a glance”)" }
    hint: "Workshop, booth or assembly: date and place"
  - key: "break_end"
    label: { en: "When the break ends (clock time)", es: "Hora en que termina el descanso" }
    hint: "time"
  - key: "district_workshop"
    label: { en: "A workshop in your district (“Coming up”)", es: "Un taller en tu distrito (“Coming up”)" }
    hint: "Date · a workshop in your district: place and time"

slides:

  # ── Opening (0:00–0:08) ──────────────────────────────────────────────────────────────────────────────────────────
  # pptx 1. On the deck's title slide the presenter line was "[First name, last initial] · [service position]": here
  # the service position only (the name stays in the notes). Its "Last updated: October 2026 (prices from January 1,
  # 2027)" line is left out: the player shows "Current as of <date>", and the prices switch by themselves.
  - id: "title"
    layout: "title"
    eyebrow: "NETA 65 · Grapevine & La Viña Committee"
    title: "GVR and RLV Orientation Workshop"
    subtitle: "Carrying the message with Grapevine and La Viña in your home group"
    lines: ["{fill:presenter} · {live:panel}", "{fill:date} · {fill:place}"]
    minutes: 0.75
    version_minutes: { short: 0.5 }
    # The opening's length is said per version: about ninety minutes with a break, or about an hour without one.
    notes: |
      SAY: Welcome, everyone, and thank you for being here. My name is {fill:first_name}, I'm an alcoholic, and I serve as {fill:presenter}. This workshop is for new and returning GVRs and RLVs, and for any GSR, DCM or member who is curious about this service.
      {not:short} SAY: We have about ninety minutes together, with a ten-minute break in the middle, and you'll leave with a few simple tools you can use at your home group next week.
      {only:short} SAY: We have about an hour together, without a break, and you'll leave with a few simple tools you can use at your home group next week.
      DO (before people arrive): open the slides in {ui:presenter_view}, test audio and screen sharing, open the chat, and ask one volunteer to keep time and another to watch the chat and the raised hands. Have this month's Grapevine and La Viña within reach to hold up. Start on time; latecomers can catch up.
      FOR FACILITATORS: {ui:customize} → {ui:prepare} holds the 'before you present' checklist and the 60-minute plan. Every item in square brackets, on the slides and in these notes, is a fill-in: {ui:customize} → {ui:your_details}. These notes are written so any trusted servant can present the workshop.
    version_notes:
      short: "CUT TO 60: keep this slide."

  # pptx 2. The 60-minute version has no break, so its last item only says the slides are shared afterward (its own
  # list, `version_fields.short.items`: change both lists together).
  - id: "welcome"
    layout: "bullets"
    eyebrow: "Welcome"
    title: "Welcome! A few housekeeping notes"
    items:
      - "**Anonymity:** who you see here and what you hear here, let it stay here"
      - "**Please take no photos, screenshots or recordings** of anyone"
      - "Rename yourself: first name and last initial · group · district · service position"
      - "Cameras are optional; please stay muted unless you're speaking"
      - "Questions: raise your hand or use the chat, in English or Spanish"
      - "A 10-minute break about halfway; the slides are shared afterward"
    version_fields:
      short:
        items:
          - "**Anonymity:** who you see here and what you hear here, let it stay here"
          - "**Please take no photos, screenshots or recordings** of anyone"
          - "Rename yourself: first name and last initial · group · district · service position"
          - "Cameras are optional; please stay muted unless you're speaking"
          - "Questions: raise your hand or use the chat, in English or Spanish"
          - "The slides are shared afterward"
    takeaway: "Presented by the NETA 65 Grapevine & La Viña Committee. This is not an official AA Grapevine, Inc. presentation."
    minutes: 2
    version_minutes: { short: 1.5 }
    notes: |
      SAY: A few things so we can all relax and take part. First, anonymity. Some of us are new to service, and some of us are private about being in AA, so please take no photos, no screenshots and no recordings of the people here, on Zoom or in the room. We are not recording this workshop. If you want to keep a slide, don't worry: the slides will be shared afterward, and there are no names or faces in them.
      SAY: On Zoom, please rename yourself with your first name and last initial, your group, your district and your service position, so we know who's here. Cameras are optional. Stay muted unless you're speaking, and use the raised hand or the chat for questions. Spanish speakers, you're welcome to ask in Spanish; someone will help.
      SAY: One more thing. This workshop is put together by our Area committee. It is not an official AA Grapevine, Inc. presentation, and it doesn't speak for AA as a whole. We'll share experience and point you to the official sources for everything else.
      DO: Show how to rename (Participants, then More, then Rename). In a room, ask people to silence phones and not to photograph the room or the people in it.
      TIP: If someone takes a screenshot, a gentle general reminder to the whole room is enough. Never single anyone out.
    version_notes:
      short: "CUT TO 60: keep."

  # pptx 3. The Preamble word for word (the 2021 wording), with AA Grapevine's credit line under it.
  - id: "preamble"
    layout: "quote"
    eyebrow: "Opening"
    title: "A moment of silence, then the Preamble"
    quote: |
      Alcoholics Anonymous® is a fellowship of people who share their experience, strength and hope with each other that they may solve their common problem and help others to recover from alcoholism.

      The only requirement for membership is a desire to stop drinking. There are no dues or fees for A.A. membership; we are self-supporting through our own contributions.

      A.A. is not allied with any sect, denomination, politics, organization or institution; does not wish to engage in any controversy; neither endorses nor opposes any causes.

      Our primary purpose is to stay sober and help other alcoholics to achieve sobriety.
    credit: "Copyright © by AA Grapevine, Inc.; reprinted with permission."
    minutes: 1
    version_minutes: { short: 0.5 }
    notes: |
      SAY: Let's open with a moment of silence, followed by the AA Preamble.
      DO: Pause for about ten seconds of silence. Then read the Preamble slowly, or invite a volunteer to read it. If an RLV would like to read it in Spanish as well, use the Spanish text below, word for word.
      SPANISH PREAMBLE (Libro de trabajo de La Viña, 2023, p. 2): '{lang:es}Alcohólicos Anónimos es una comunidad de personas que comparten su mutua experiencia, fortaleza y esperanza para resolver su problema común y ayudar a otros a recuperarse del alcoholismo. El único requisito para ser miembro de AA es el deseo de dejar la bebida. Para ser miembro de AA no se pagan derechos de admisión ni cuotas; nos mantenemos con nuestras propias contribuciones. AA no está afiliada a ninguna secta, religión, partido político, organización o institución alguna, no desea intervenir en controversias, no respalda ni se opone a ninguna causa. Nuestro objetivo primordial es mantenernos sobrios y ayudar a otros alcohólicos a alcanzar el estado de sobriedad.{/lang}' {lang:es}Copyright © The AA Grapevine, Inc., reimpreso con permiso.{/lang}
      SAY (after the reading): The Preamble first appeared in the Grapevine in June 1947. A Grapevine editor wrote it, drawing on the Foreword to the Big Book. So it is a fitting way to open a workshop about our meeting in print.
      TIP: Show the Preamble word for word and keep the credit line under it; it is AA Grapevine's copyright. This is the current wording ('a fellowship of people'), revised by the 2021 General Service Conference. If your committee usually opens with the Serenity Prayer instead, follow the committee's custom and skip the reading.
    version_notes:
      short: "CUT TO 60: keep the moment of silence; read the Preamble only if time allows."

  # pptx 4. A lavender pause slide in the PowerPoint (kit.py's qa() is grape), in the opening's blue.
  - id: "introductions"
    layout: "qa"
    accent: "grape"
    title: "Let's meet each other"
    prompts:
      - "Your first name, home group and district"
      - "Your service position: GVR, RLV, GSR, DCM, or just curious?"
      - "Is this your first Grapevine / La Viña workshop?"
      - "One thing you'd like to take home today"
    note: "On Zoom, answer in the chat; in a room, a sentence each is plenty."
    minutes: 2.5
    version_minutes: { short: 1 }
    notes: |
      SAY: Let's find out who's here. In the chat, or out loud if we're a small group, tell us your first name, your home group and district, your service position, whether this is your first Grapevine or La Viña workshop, and one thing you'd like to take home today.
      DO: With more than about 12 people, use the chat only and read a few answers aloud. With a small group, go around once and keep it to one sentence each. Ask the chat volunteer to note what people want to take home, so you can come back to it during Questions and answers.
      ASK (optional, if on time): Who is serving as a GVR or RLV for the very first time? Welcome! Who has served before? Thank you for coming back; please share your experience as we go.
      TIP: Notice who serves La Viña, and invite them to add their experience when we reach the Spanish-language tools.
    version_notes:
      short: "CUT TO 60: do introductions in the chat only, while you show the next slide."

  # pptx 5. The deck's numbered cards: the number leads each heading.
  - id: "why-we-are-here"
    layout: "columns"
    style: "cards"
    eyebrow: "Welcome"
    title: "Why we are here"
    columns:
      - heading: "1 · Know the magazines"
        text: "What Grapevine and La Viña are, and how they pay their way."
      - heading: "2 · Know the service position"
        text: "What a GVR or RLV does each month."
      - heading: "3 · Leave with tools"
        text: "A one-minute announcement, our website, and people to ask."
    takeaway: "We share experience, not rules: your group conscience decides."
    minutes: 1
    version_minutes: { short: 0.75 }
    notes: |
      SAY: Here's why we're here today. First, so you know the magazines: what they are, who publishes them, and how they pay their way. Second, so you know the service position: what a GVR or RLV actually does, month by month, and how you fit with your district and our Area. And third, so you leave with tools you can use next week: a one-minute announcement, the committee's website, and the service positions you can call on when you're stuck.
      SAY: Everything you'll hear today is shared experience. None of it is a rule. Our leaders are trusted servants who don't govern, and every group is autonomous. So when you hear an idea you like, take it home and offer it to your group conscience. The group decides.
      ASK (optional, if on time): Looking at these three, which one matters most to you today? (Take one or two answers.)
      TRANSITION: Here's how we'll spend our time.
    version_notes:
      short: "CUT TO 60: keep."

  # pptx 6. Each row's time is worked out from the version being shown (`from`: the slide where that part starts);
  # a row whose slides are all left out (the break, in the 60-minute version) is left out too. The 60-minute version
  # has its own title and rows (`version_fields.short`): about 60 minutes, and its last part one or two scenarios for
  # the whole room instead of small groups (its times are the plan's; `from` works them out the same way). Change a
  # row's words in both lists.
  - id: "plan"
    layout: "agenda"
    eyebrow: "Welcome"
    title: "Today's plan (about 90 minutes)"
    items:
      - { time: "0:00", title: "Welcome, housekeeping and introductions", from: "title" }
      - { time: "0:08", title: "Grapevine and La Viña basics, and the GVR / RLV service position", from: "part-1" }
      - { time: "0:24", title: "A rep's month and your one-minute announcement", from: "part-3" }
      - { time: "0:36", title: "The literature table, subscriptions and gifts", from: "part-4" }
      - { time: "0:42", title: "Break (10 minutes)", from: "break" }
      - { time: "0:52", title: "Stories, audio and digital tools", from: "part-5" }
      - { time: "0:59", title: "The committee's website, your district and the Area, money", from: "part-6" }
      - { time: "1:08", title: "Questions, scenarios in small groups, and closing", from: "part-7" }
    version_fields:
      short:
        title: "Today's plan (about 60 minutes)"
        items:
          - { time: "0:00", title: "Welcome, housekeeping and introductions", from: "title" }
          - { time: "0:05", title: "Grapevine and La Viña basics, and the GVR / RLV service position", from: "part-1" }
          - { time: "0:18", title: "A rep's month and your one-minute announcement", from: "part-3" }
          - { time: "0:27", title: "The literature table, subscriptions and gifts", from: "part-4" }
          - { time: "0:33", title: "Stories, audio and digital tools", from: "part-5" }
          - { time: "0:40", title: "The committee's website, your district and the Area, money", from: "part-6" }
          - { time: "0:49", title: "Questions, scenarios as a whole room, and closing", from: "part-7" }
    minutes: 0.75
    notes: |
      {not:short} SAY: Here's the plan. We'll start with the basics about the two magazines, then talk about the service position itself and what a typical month looks like, including a one-minute announcement you can give at your group. After a short look at the literature table and subscriptions, we'll take a ten-minute break. In the second half we'll cover stories and audio, the digital tools, the committee's website, how you connect with your district and the Area, and money. We'll finish with common questions, a short exercise in small groups, your questions, and the Responsibility Statement.
      {only:short} SAY: Here's the plan. We'll start with the basics about the two magazines, then talk about the service position itself and what a typical month looks like, including a one-minute announcement you can give at your group. After a short look at the literature table and subscriptions, we'll cover stories and audio, the digital tools, the committee's website, how you connect with your district and the Area, and money. We'll finish with common questions, a short exercise all together, your questions, and the Responsibility Statement.
      DO: The times are minutes from the start (h:mm). If you prefer clock times, replace them before you present ({ui:customize} → {ui:edit}).
      {not:short} DO: The TIME lines in these notes add up to about 87 minutes, which leaves about three minutes for the optional questions (ASK) and for running over. Ask the timekeeper to give you a quiet signal at the break and ten minutes before the end.
      {only:short} DO: The TIME lines in these notes add up to about 60 minutes, with no break: the plan leaves each part a few minutes for questions. Ask the timekeeper to give you a quiet signal ten minutes before the end.
    version_notes:
      short: "CUT TO 60: say: 'We'll go a bit faster today and skip the break.' Don't show the 60-minute plan ({ui:customize} → {ui:prepare}): it lists what you're skipping."

  # ── Part 1 · Grapevine and La Viña basics (0:08–0:16) ────────────────────────────────────────────────────────────
  # pptx 7
  - id: "part-1"
    layout: "section"
    number: 1
    accent: "gv"
    title: "Grapevine and La Viña basics"
    subtitle: "AA's meeting in print, in English and in Spanish"
    minutes: 0.25
    notes: |
      SAY: Let's start with the basics: what the two magazines are, where they came from, who publishes them and how they pay their way. Some of you have read them for years; for others this is new. Both are fine.
      DO: Hold up this month's Grapevine and the current La Viña if you have them.
    version_notes:
      short: "CUT TO 60: keep (it marks the part), but don't linger."

  # pptx 8
  - id: "two-magazines"
    layout: "columns"
    style: "panels"
    title: "Two magazines, one message"
    columns:
      - heading: "Grapevine"
        accent: "gv"
        items:
          - "Monthly, in English, since **June 1944**"
          - "Print, digital, app and audio"
          - "Stories by AA members around the world"
          - "[www.aagrapevine.org](https://www.aagrapevine.org)"
      - heading: "La Viña"
        accent: "lv"
        items:
          - "Every two months in Spanish, since **1996**"
          - "Print, digital, app and audio"
          - "Original stories in Spanish, plus some translated from Grapevine"
          - "[www.aalavina.org](https://www.aalavina.org)"
    source: "Sources: aa.org/aa-grapevine-la-vina · P-52 (2026), pp. 4–10"
    minutes: 1.5
    notes: |
      SAY: There are two magazines and one message. Grapevine comes out every month in English and has since June 1944. La Viña comes out every two months, six issues a year, in Spanish, and has since 1996. Both come in print, digital, in the apps, and as audio. La Viña isn't simply a translation: most of its stories are written in Spanish by Spanish-speaking members, with some pieces translated from Grapevine.
      SAY: A detail people like: the print Grapevine has no staples. It went staple-free so it could go into prisons that don't allow staples. La Viña has a perfect binding, like a small book.
      SAY: Both are published by the same nonprofit, AA Grapevine, Inc., and AA calls them the international journals of Alcoholics Anonymous. You may also hear of La Vigne, in French: that one is published by a local committee in Quebec, not by AA Grapevine.
      ASK (optional, if on time): Show of hands, or in the chat: who reads Grapevine? La Viña? Both?
      SOURCE: aa.org/aa-grapevine-la-vina; P-52 (2026), pp. 4, 6, 10; aagrapevine.org/evolution-magazine; M-39, p. 57.
    version_notes:
      short: "CUT TO 60: keep."

  # pptx 9
  - id: "meeting-in-print"
    layout: "bullets"
    title: "Our meeting in print"
    items:
      - "**June 1944:** the first issue went to all AA groups and to members overseas"
      - "Their letters ran each month, and they called it their _meeting in print_"
      - "Written by members: experience, strength and hope, in their own words"
      - "Many voices, not AA policy: each story is one member's experience"
    takeaway: "That's why a story makes such a good topic for a meeting."
    source: "Sources: aagrapevine.org/history-aa-grapevine · P-52 (2026), pp. 3, 13 (paraphrased)"
    minutes: 1.5
    notes: |
      SAY: Why do we call it our meeting in print? The very first issue, in June 1944, was sent to every AA group, about three hundred of them back then, and to every AA member known to be serving overseas in the armed forces. Each month a full page printed letters from those members, and they started calling the Grapevine their meeting in print. Both magazines still carry the phrase on their covers.
      SAY: Almost every story is written by an AA member, sharing experience, strength and hope the way we do at a meeting. And just like a meeting, you'll hear many voices. A story is one member's experience. It isn't AA policy, and publishing it doesn't mean AA endorses it. That's exactly why stories make such good discussion topics.
      ASK (optional, if on time): Has a Grapevine or La Viña story ever stayed with you? (Take one short share.)
      TIP: Keep shares to about a minute; there's a lot ahead.
      SOURCE: aagrapevine.org/history-aa-grapevine; P-52, pp. 3, 9, 13; Grapevine's Statement of Purpose (paraphrased; the magazines' own words are copyrighted).
    version_notes:
      short: "CUT TO 60: skip the question."

