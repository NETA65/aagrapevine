# =====================================================================
#  "Grapevine and La Viña Information Workshop" — the committee's hour on
#  AA's meeting in print, as a web presentation on /orientation/
#  (Presentations). Read by src/_data/presentations.js, played
#  by src/assets/js/presentations.js; tests/test_presentations.py checks
#  the format, AA's principles and the site's wording rules.
#
#  Where it comes from: the PowerPoint deck of the same name (53 slides,
#  built 2026-10-01 by aagrapevine-ops/decks/deck2_info-workshop.py, in
#  the committee's Drive folder `slides`). Every slide is here, in the
#  same order, with the same words on the slide and in the notes. Only
#  what the web player does differently was changed:
#  - [orange fill-ins] are {fill:…} blanks (Customize → Your details);
#  - facts that change come from the site's own data ({live:…}): this
#    month's issues and the next ones, with their themes, the yearly
#    prices (the price in effect on the day), both Books of the Month,
#    the committee meeting and its dial-in number, La Viña's monthly
#    workshop, the two weekly open meetings and their Zoom room, the
#    story deadlines, the two story lines' numbers, the panel, the
#    site's address and e-mail. A fact the site knows nothing of (an
#    issue not announced yet, an offer that has ended) says where to
#    look instead ("see aalavina.org"; config/presentations/README.md
#    lists them), so the sentences around a fact read well either way;
#  - each note's TIME line is `minutes` (the player writes the TIME line
#    for the version shown; `version_minutes` where a shorter version
#    gives a slide another time); the "as of" months and "Last updated"
#    are gone (the player shows "Current as of <date>");
#  - "slide 18" is {slide:ways-to-read}, so the number follows the
#    version shown; PowerPoint steps became steps in the player, its
#    buttons named with {ui:…} so that the Spanish page shows its own
#    names (Customize → Your details / Personalizar → Tus datos);
#  - where the shorter versions need other words than the full one, a
#    notes line says so with {only:…} / {not:…} (a TRANSITION to a slide
#    the version leaves out, the agenda's RUNNING LATE paragraph), a
#    version note, or `version_fields` (the About slide's "Credits slide",
#    which the 20-minute visit leaves out);
#  - Spanish words inside the English text are marked {lang:es}…{/lang},
#    so a screen reader reads them in Spanish;
#  - the hidden checklist (slide 53) is a facilitator page (Prepare);
#  - a slide the PowerPoint draws in another colour than its part's has
#    that colour as its own `accent` (the generator's accent=… and its
#    helpers' own colours: the quotations' grape, the activities' green,
#    the lavender Q&A, the blue Grapevine issue tour and credits …).
#    Not carried over: the navy of the "Current information" eyebrows,
#    the PowerPoint's mark for the slides to update by hand (an accent
#    colours the whole slide, and these slides stay current by themselves).
#
#  Content stays English (the owner's decision); `card`, the versions
#  and the blanks' labels are in both languages (Spanish written by
#  hand, Latin-American, "tú"). AA's principles and the site's wording
#  rules apply to the notes too: anyone can open them.
#
#  Check it after every change:
#    .venv\Scripts\python.exe tests\test_presentations.py config\presentations\information-workshop.yml
# =====================================================================

id: "information-workshop"
order: 2
lang: "en"
title: "Grapevine and La Viña Information Workshop"
short: "Information Workshop"
eyebrow: "Information workshop"
footer: "NETA 65 Grapevine & La Viña Committee · {live:panel}"
minutes: 60
icon: "book-open"
tone: "gv"
drive_title: "Grapevine and La Viña Information Workshop"

card:
  title:
    en: "Grapevine and La Viña Information Workshop"
    es: "Taller informativo de Grapevine y La Viña"
  summary:
    en: "Our meeting in print: what Grapevine and La Viña are, where they came from, what's free, and how members, groups and districts use them."
    es: "Nuestra reunión impresa: qué son La Viña y Grapevine, de dónde vienen, qué es gratis y cómo las usan los miembros, los grupos y los distritos."
  audience:
    en: "For any AA members, groups or districts, including those who have never opened an issue."
    es: "Para cualquier miembro, grupo o distrito de AA, incluso para quienes nunca han abierto una revista."

# The versions (Customize → Version). The agenda slide's notes describe the two shorter ones: "RUNNING LATE?"
# (the slides marked OPTIONAL, about 12 minutes) and the "20-MINUTE VERSION (a district or group visit)".
# The three review-question slides are outside the 60-minute plan, so they start switched off (`starts_off`).
# Running late leaves the optional slides out and keeps every other slide's time (59.75 − 12.25 = 47.5 minutes).
# The 20-minute visit is "about a minute each, then take questions": its slides have `version_minutes: { visit: 1 }`
# where their full time differs, and the last one, Thank you, `visit: 5`: its minute and about four minutes of
# questions (its version note says "now take questions"), so the visit's TIME lines end at 0:20. Its sixteen slides
# are the PowerPoint's own list: no Welcome slide (its anonymity reminder is in the title slide's visit note) and
# no Credits slide (the About slide's visit text says so).
# A TRANSITION that hands off to a slide a version leaves out has that version's own line: `{not:late}` on the full
# one, `{only:late}` on the one that hands off to the slide that comes next in that version (the same for visit).
presets:
  - id: "full"
    label: { en: "Full workshop (about 60 minutes)", es: "Taller completo (unos 60 minutos)" }
    minutes: 60
  - id: "late"
    label: { en: "Running late (about 48 minutes)", es: "Si se te hace tarde (unos 48 minutos)" }
    minutes: 48
    hide: ["part-2", "early-years", "growing", "inside-grapevine", "inside-la-vina", "free-links", "hard-to-reach",
           "story-reach", "tradition-eleven", "find-everything-2"]
    note:
      en: "Leaves out the slides marked optional: Part 2's history, the two issue tours, the free-resource addresses, members a meeting can't reach, the activity, Tradition Eleven and the second address slide."
      es: "Deja fuera las diapositivas marcadas como opcionales: la historia (Parte 2), los dos recorridos por una edición, las direcciones de los recursos gratuitos, los miembros a quienes una reunión no llega fácilmente, la actividad, la Undécima Tradición y la segunda diapositiva de direcciones."
  - id: "visit"
    label: { en: "20-minute version (a district or group visit)", es: "Versión de 20 minutos (visita a un distrito o grupo)" }
    minutes: 20
    only: ["title", "about", "meeting-in-print", "two-magazines", "conference-approved", "ways-to-read",
           "free-for-everyone", "weekly-open", "carry-message", "group-subscriptions", "pay-their-way", "gvr-rlv",
           "committee", "find-everything", "responsibility", "thank-you"]
    note:
      en: "Sixteen slides, about a minute each, then questions. No activities or review questions."
      es: "Dieciséis diapositivas, más o menos un minuto cada una, y luego las preguntas. Sin actividades ni preguntas de repaso."

# The presenter's blanks (Customize → Your details, kept on their device). The deck's orange brackets: the date,
# place, restrooms and end time, and the items of the "Current information" slides that the site's data does not
# carry (this issue's Step and Tradition, the new books, the seasonal items). An empty blank shows as an orange
# [hint] on the slide, as in the deck. The next issues and La Viña's Book of the Month are {live:…} facts now.
fillins:
  - key: "date"
    label: { en: "Date", es: "Fecha" }
    hint: "Month DD, YYYY"
  - key: "place"
    label: { en: "Place, or Zoom", es: "Lugar o Zoom" }
    hint: "Place, or Zoom"
  - key: "presenter"
    label: { en: "Presenter's service position", es: "Puesto de servicio de quien presenta" }
    hint: "Service position"
    default: "Area 65 Grapevine / La Viña Chair"
    shared: true
  - key: "first_name"
    label: { en: "Your first name (only in your notes)", es: "Tu nombre de pila (solo en tus notas)" }
    hint: "first name"
    shared: true
    notes_only: true
  - key: "restrooms"
    label: { en: "Restrooms (where they are)", es: "Baños (dónde están)" }
    hint: "where"
  - key: "end_time"
    label: { en: "End time", es: "Hora de término" }
    hint: "end time"
  - key: "gv_step_tradition"
    label: { en: "Grapevine: this issue's Step and Tradition", es: "Grapevine: el Paso y la Tradición de esta edición" }
    hint: "Step N and Tradition N"
  - key: "new_books"
    label: { en: "New books (Grapevine; La Viña)", es: "Libros nuevos (Grapevine; La Viña)" }
    hint: "title (Grapevine); title (La Viña)"
  - key: "gv_seasonal"
    label: { en: "Grapevine's seasonal items", es: "Artículos de temporada de Grapevine" }
    hint: "seasonal items"
  - key: "lv_seasonal"
    label: { en: "La Viña's seasonal items", es: "Artículos de temporada de La Viña" }
    hint: "seasonal items"

slides:
  # ===================================================================
  #  OPENING (pptx slides 1–6)
  # ===================================================================
  - id: "title"
    layout: "title"
    eyebrow: "NETA 65 · Grapevine & La Viña Committee"
    title: "Grapevine and La Viña Information Workshop"
    subtitle: "Our meeting in print: what it is, what's free, and how members use it"
    lines: ["{fill:presenter} · {live:panel}", "{fill:date} · {fill:place}"]
    minutes: 1
    # The agenda slide (and its notes) is not in the 20-minute version: its instruction moves here and to the last
    # slide. Nor is the Welcome slide, with its anonymity reminder: the visit note asks for it here instead. The
    # presenter is the presenter blank (whoever presents, in their service position), never "the chair".
    version_notes:
      visit: "20-MINUTE VERSION (a district or group visit): about a minute on each slide, then take questions at the end. The Welcome slide is not in this version: unless the group has just done so, ask the room not to photograph, screenshot or record anyone before you begin."
    notes: |
      {not:visit} SAY: (Show this slide while people arrive.) Welcome, everyone, and thank you for coming. My name is {fill:first_name}, and I'm an alcoholic. I have the privilege of serving as {fill:presenter} in Northeast Texas Area 65, {live:panel}. Over the next hour we'll look at the two magazines AA calls 'our meeting in print': what they are, where they came from, what's free, and the many ways members, groups and districts use them. You don't need to know anything about Grapevine or La Viña to be here. If you've never opened an issue, you're exactly who this hour is for.
      {only:visit} SAY: Welcome, everyone, and thank you for having us. My name is {fill:first_name}, and I'm an alcoholic. I have the privilege of serving as {fill:presenter} in Northeast Texas Area 65, {live:panel}. In the next twenty minutes we'll look at the two magazines AA calls 'our meeting in print': what they are, what's free, and the many ways members, groups and districts use them. You don't need to know anything about Grapevine or La Viña to be here. If you've never opened an issue, you're exactly who this visit is for.
      DO: Before you start: fill in the date and place ({ui:customize} → {ui:your_details}), and work through the presenter's checklist ({ui:customize} → {ui:prepare}; it is not shown in the slide show). Have a printed Grapevine and a printed La Viña in your hand to hold up; we never put magazine covers on slides. If someone else presents, change the presenter line to their service position ({ui:customize} → {ui:your_details}), never a full name. For a 15- to 20-minute visit, choose the 20-minute version in {ui:customize} → {ui:version}.
      FACILITATOR TIP: This presentation is public on the committee's website, and so are these notes. Keep names, phone numbers and personal emails out of both.
      {not:visit} TRANSITION: Let's take care of a few things first so everyone feels at home.
      {only:visit} TRANSITION: Before we go further, I want to be clear about who is presenting today.

  - id: "welcome"
    layout: "bullets"
    title: "Welcome"
    items:
      - "**Opening:** a moment of silence, then the Preamble (next slide)"
      - "**Anonymity:** please don't photograph, screenshot or record anyone. Who you see here and what you hear here stays here."
      - "**On Zoom:** rename yourself with your first name; cameras are optional; questions in the chat"
      - "Phones on silent · restrooms: {fill:restrooms} · we'll finish by {fill:end_time}"
      - "Questions are welcome: we'll gather them and answer at the end"
    takeaway: "All are welcome, whether you've read every issue or never seen one."
    minutes: 2
    notes: |
      SAY: Let's open with a moment of silence, and then we'll read the Preamble together on the next slide. (Pause for the moment of silence.) Thank you. A few things so this hour goes well. First, anonymity. Please don't take photos of people or record this session, and if we're on Zoom, please no screenshots. You're welcome to photograph the slides themselves; we'll also share this presentation afterward. If you're joining online, rename yourself with just your first name. Cameras are up to you. Questions are welcome at any time; I'll keep a list, and we'll have time for them at the end.
      DO: Fill in the restrooms and the end time ({ui:customize} → {ui:your_details}). If the group you're visiting usually opens with the Serenity Prayer, you can say it together after the moment of silence, then go on to the Preamble. In a room, have a parking-lot sheet or a whiteboard for questions. On Zoom, ask a co-host to watch the chat and gather questions, and to turn off recording.
      FACILITATOR TIP: If someone starts recording or photographing the room, a quiet, friendly word afterward is enough. Anonymity reminders work best when they're warm, not stern.
      TRANSITION: Many groups open with the Preamble. Here it is, and it has a Grapevine story of its own.

  # The PowerPoint sets the Preamble in a grape-tinted card (the colour of its quotations), under a blue eyebrow.
  - id: "preamble"
    layout: "quote"
    eyebrow: "Opening"
    accent: "grape"
    title: "The AA Preamble"
    quote: "Alcoholics Anonymous® is a fellowship of people who share their experience, strength and hope with each other that they may solve their common problem and help others to recover from alcoholism. The only requirement for membership is a desire to stop drinking. There are no dues or fees for A.A. membership; we are self-supporting through our own contributions. A.A. is not allied with any sect, denomination, politics, organization or institution; does not wish to engage in any controversy; neither endorses nor opposes any causes. Our primary purpose is to stay sober and help other alcoholics to achieve sobriety."
    credit: "Copyright © by AA Grapevine, Inc.; reprinted with permission."
    minutes: 1.25
    notes: |
      SAY: Many of our meetings open with the Preamble, so you probably know it by heart. Let's read it together. (Read it together.) What many members don't know is that it was first printed in the Grapevine, in June 1947. A Grapevine editor wrote it, drawing on the Foreword of the Big Book. AA Grapevine, Inc. still holds its copyright, which is why you see the credit line under it. In 2021 the General Service Conference changed 'men and women' to 'people'.
      IF TIME, ASK: Did anyone know the Preamble began in the Grapevine?
      DO: Read it aloud, or invite the room to read it together.
      SOURCES: Text and credit line: P-52 (2026), p. 2, and F-3 (June 2026). History: P-52 (2026), p. 5; Service Manual, p. 170; M-39, p. 57 (2021 revision).
      TRANSITION: Before we go further, I want to be clear about who is presenting today.

  - id: "about"
    layout: "bullets"
    title: "About this workshop"
    items:
      - "Presented by the **NETA 65 Grapevine & La Viña Committee**, trusted servants of Area 65"
      - "**Not an official AA Grapevine, Inc. presentation**, and not Conference-approved literature"
      - "We share information and experience; we don't speak for AA as a whole"
      - "Sources are on the slides and on the Credits slide"
      - "Nothing here is a requirement: each member and each group decides (Tradition Four)"
    takeaway: "Inform and invite, never pressure."
    minutes: 1
    # The 20-minute visit leaves out the Credits slide (the PowerPoint's own list), so there its fourth line says
    # only where the sources are.
    version_fields:
      visit:
        items:
          - "Presented by the **NETA 65 Grapevine & La Viña Committee**, trusted servants of Area 65"
          - "**Not an official AA Grapevine, Inc. presentation**, and not Conference-approved literature"
          - "We share information and experience; we don't speak for AA as a whole"
          - "Sources are on the slides"
          - "Nothing here is a requirement: each member and each group decides (Tradition Four)"
    notes: |
      SAY: I want to say plainly what this workshop is and isn't. It's put on by our Area committee, which is a group of trusted servants, not by AA Grapevine, Inc., the publisher. Nobody here speaks for the magazines or for AA as a whole. What we can do is share accurate information, with the source for each fact, and our own experience of using the magazines. And nothing you hear today is a rule. Our leaders are but trusted servants; they do not govern. Whether you read, subscribe, write or serve is up to you, and what a group buys or does is up to its group conscience.
      {not:visit} FACILITATOR TIP: You'll see small 'Sources' lines at the bottom of many slides. If someone asks 'where does that come from?', point to that line and to the Credits slide.
      {only:visit} FACILITATOR TIP: You'll see small 'Sources' lines at the bottom of many slides. If someone asks 'where does that come from?', point to that line. The Credits slide is not in this version; the full presentation on our website has it.
      SOURCES: Tradition Two and Tradition Four (P-52, p. 17). For Grapevine presentations, a 1960 Advisory Action asked for an 'informative attitude' rather than a 'hard sell' (M-39, p. 52).
      {not:visit} TRANSITION: Here's the plan for our hour.
      {only:visit} TRANSITION: So, what exactly are these two magazines?

  # The times are minutes from the start; with `from` the player works each one out for the version shown.
  - id: "agenda"
    layout: "agenda"
    title: "Our hour together"
    items:
      - { time: "0:00", title: "Welcome and opening", from: "title" }
      - { time: "0:08", title: "Parts 1–2 · What Grapevine and La Viña are · A short history", from: "part-1" }
      - { time: "0:17", title: "Part 3 · Inside an issue, and the ways to read", from: "part-3" }
      - { time: "0:23", title: "Part 4 · Free resources and books", from: "part-4" }
      - { time: "0:29", title: "Part 5 · How members use them", from: "part-5" }
      - { time: "0:36", title: "Part 6 · Gifts, group subscriptions and self-support", from: "part-6" }
      - { time: "0:43", title: "Parts 7–8 · Share your story · Stay connected", from: "part-7" }
      - { time: "0:50", title: "Questions, and closing", from: "questions" }
    minutes: 0.5
    # Its RUNNING LATE and 20-MINUTE paragraphs are for the full version: the Running late version already leaves
    # those slides out (their numbers would only say "not in this version"), so there a version note says so, and the
    # 20-minute visit has no agenda slide.
    version_notes:
      late: "RUNNING LATE: this version already leaves out the optional slides: Part 2's history (the one sentence to say instead is in the notes of the slide Is Grapevine Conference-approved?), the two issue tours, the free-resource addresses, members a meeting can't reach, the activity, Tradition Eleven and the second address slide. The times on this slide and the TIME lines follow this version."
    notes: |
      SAY: Here's our hour. We'll start with what the magazines are and where they came from, then open an issue together, look at the free resources and the books, and spend some time on how members actually use them. Then gifts, group subscriptions and how the magazines pay their way, writing your own story, how to stay connected, and your questions.
      DO: The times are minutes from the start, so they work whatever time you begin; they follow the version chosen in {ui:customize} → {ui:version}. Every slide's notes end with a TIME line that says where you should be.
      {only:full} RUNNING LATE? The slides marked OPTIONAL in their notes can go: Part 2's history (slides {slide:part-2}–{slide:growing}; say one sentence instead), the two issue tours ({slide:inside-grapevine}–{slide:inside-la-vina}, skip both or neither), the free-resource addresses ({slide:free-links}), members a meeting can't reach ({slide:hard-to-reach}), the activity ({slide:story-reach}), Tradition Eleven ({slide:tradition-eleven}) and the second address slide ({slide:find-everything-2}). Together they give back about 12 minutes; the Running late version ({ui:customize} → {ui:version}) leaves them all out.
      {only:full} 20-MINUTE VERSION (a district or group visit): show slides {slide:title}, {slide:about}, {slide:meeting-in-print}, {slide:two-magazines}, {slide:conference-approved}, {slide:ways-to-read}, {slide:free-for-everyone}, {slide:weekly-open}, {slide:carry-message}, {slide:group-subscriptions}, {slide:pay-their-way}, {slide:gvr-rlv}, {slide:committee}, {slide:find-everything}, {slide:responsibility} and {slide:thank-you}, about a minute each, then take questions. Skip the activities and the review questions. The 20-minute version ({ui:customize} → {ui:version}) shows only those slides.
      TRANSITION: First, let's find out who's in the room.

  # An activity is green in the PowerPoint (eyebrow, steps, time card), whatever its part.
  - id: "show-of-hands"
    layout: "activity"
    eyebrow: "Activity"
    accent: "vine"
    title: "A quick show of hands"
    steps:
      - "Who has read an issue of Grapevine or La Viña?"
      - "Who reads Grapevine or La Viña in print, online or in the app?"
      - "Who has heard the Grapevine podcast, or gets the Daily Quote?"
      - "Whose home group has a GVR or RLV (a Grapevine or La Viña representative)?"
    duration: 2
    takeaway: "No wrong answers. This tells us where to spend our time."
    minutes: 2
    notes: |
      SAY: Let's see who's here. Just raise a hand, or on Zoom use the 'raise hand' reaction. Who has ever read an issue of Grapevine or La Viña? Who reads one now, in print, online or in the app? Who has listened to the Grapevine podcast, or gets the Daily Quote by email? And whose home group has a GVR or an RLV, a Grapevine or La Viña representative? Thank you. That helps me know where to slow down and where we can move quickly.
      DO: Read each question and pause. Count roughly, out loud: 'about half', 'a few'. If few people know the magazines, spend more time on Parts 1, 3 and 4; if many do, spend more on Parts 5 and 6 (the part numbers are on the agenda slide).
      FACILITATOR TIP: Keep it light. Nobody should feel behind for never having read an issue.
      TRANSITION: So, what exactly are these two magazines?

  # ===================================================================
  #  PART 1 · What Grapevine and La Viña are (pptx slides 7–11)
  # ===================================================================
  - id: "part-1"
    layout: "section"
    number: 1
    title: "What Grapevine and La Viña are"
    subtitle: "AA's international journals: our meeting in print"
    accent: "gv"
    minutes: 0.25
    notes: |
      SAY: Part one: what the magazines are, who makes them, and how they fit in AA. If you brought a copy, now is a good moment to hold it up.
      DO: Hold up a printed Grapevine and a printed La Viña, then pass them around the room so people can leaf through them during the next few slides.
      TRANSITION: Let's start with a phrase you'll hear all day: our meeting in print.

  - id: "meeting-in-print"
    layout: "bullets"
    title: "Our meeting in print"
    items:
      - "**The international journals of Alcoholics Anonymous**, in print, digital and audio"
      - "Written by AA members: stories of experience, strength and hope"
      - "**Grapevine:** every month, in English, since June 1944"
      - "**La Viña:** every two months, in Spanish, since 1996"
      - "One publisher, **AA Grapevine, Inc.**, one of the two operating entities of AA's General Service Board"
    takeaway: "A meeting you can carry with you, at any hour, anywhere."
    source: "Sources: aa.org/aa-grapevine-la-vina · P-52 (2026), pp. 6–13 · Service Manual, p. 79"
    minutes: 1.75
    version_minutes: { visit: 1 }
    notes: |
      SAY: Grapevine and La Viña are the international journals of Alcoholics Anonymous. Every issue is full of members' stories, their experience, strength and hope, the same thing you'd hear around the tables. Here's where the phrase 'our meeting in print' comes from. The very first Grapevine, in June 1944, went to every AA group, about 300 at the time, and to every AA member anyone knew of who was serving overseas in the armed forces. Each month a page called 'Mail Call for All AAs in the Armed Forces' printed their letters, and those members, far from any meeting, started calling the Grapevine their 'meeting in print'. Grapevine comes out every month in English; La Viña comes out every two months in Spanish. Both come from the same publisher, AA Grapevine, Inc. It's one of the two operating companies of AA's General Service Board; the other is A.A. World Services, which publishes the Big Book. AA Grapevine has its own board, staff and finances, separate from the General Service Office.
      IF TIME, ASK: For anyone who reads one: when do you read it? Morning coffee, before a meeting, on a lunch break?
      FACILITATOR TIP: Keep the corporate structure light. Most people only need to hear: 'part of AA's General Service Board, with its own publisher, board and staff, separate from GSO'.
      SOURCES: aagrapevine.org/history-aa-grapevine; P-52 (2026), pp. 6, 8, 13; Service Manual, pp. 66, 79.
      TRANSITION: So, two magazines. Here's how they compare.

  - id: "two-magazines"
    layout: "columns"
    style: "panels"
    title: "Two magazines, one message"
    columns:
      - heading: "Grapevine"
        accent: "gv"
        items:
          - "Every month, in English, since June 1944"
          - "64 full-color pages and no staples, so it can go into prisons"
          - "[aagrapevine.org](https://www.aagrapevine.org)"
      - heading: "La Viña"
        accent: "lv"
        items:
          - "Every two months, in Spanish, since 1996"
          - "68 full-color pages"
          - "Stories written in Spanish"
          - "[aalavina.org](https://www.aalavina.org)"
    takeaway: "Same message, two languages, one publisher."
    source: "Sources: aagrapevine.org/evolution-magazine · P-52 (2026), pp. 4, 10 · M-39, p. 57"
    minutes: 1.5
    version_minutes: { visit: 1 }
    notes: |
      SAY: Side by side. Grapevine is monthly, in English, 64 pages in full color. One detail I love: it has no staples, so it can go into prisons that don't allow staples. La Viña is AA's magazine in Spanish. It comes out every two months, six issues a year, 68 pages in full color. Most of its stories are written in Spanish by Spanish-speaking members, and a few are translated from Grapevine. It's La Viña's own meeting in print, not a translation of Grapevine. And if anyone asks about French: there's a French magazine, La Vigne, but a local committee in Quebec publishes it, not AA Grapevine, Inc.
      ASK THE ROOM: Do we have La Viña readers here? What do you like about it?
      DO: Point out that both websites are written out on the slide.
      SOURCES: aagrapevine.org/evolution-magazine; Grapevine Workbook (2026), p. 11; M-39, p. 57 (La Viña's binding, 2018); RLV Manual (2025), p. 4; P-52 (2026), pp. 4, 10.
      {not:visit} TRANSITION: Who writes all these stories? Members do.
      {only:visit} TRANSITION: Here's a question we hear a lot: is Grapevine Conference-approved?

  - id: "many-voices"
