    takeaway: "A story you send today may reach someone years from now, in a prison, a hospital or a library."
    source: "Sources: Service Manual, p. 85 · aagrapevine.org/submit-your-story · GV guidelines"
    minutes: 1.5
    notes: |
      SAY: Any AA member can write for Grapevine or La Viña. The Service Manual encourages members to send stories even if they think their grammar and spelling aren't perfect, and La Viña says the only requirement is to be an alcoholic in recovery. The best stories are like a good share: one experience, told honestly. Short pieces count too: a letter, a joke, or a photo of your meeting room with nobody in it. If you'd rather talk than write, both magazines accept stories recorded by phone. Your anonymity is protected: you give your full name and contact details to the office, and on Grapevine's form you choose how your name appears in print: first name and last initial, initials only, or 'Anonymous'. Bylines usually show your city too. Neither magazine pays for stories.
      ASK THE ROOM: Has anyone here ever sent in a story, a letter or a joke? What was that like?
      FACILITATOR TIP: Never promise anyone their story will be published, and never send a member's story for them: each writer sends it, or agrees to it, with their own details. If asked: both magazines want original work that hasn't been published anywhere else; Grapevine doesn't print poems, prayers, song lyrics or tributes to individuals, and La Viña doesn't print poems, songs or tributes.
      SOURCES: Service Manual (2024–2026), p. 85 (FAQs 6–7); aagrapevine.org/guidelines-contributing-grapevine (rev. April 2019); aagrapevine.org/submit-your-story (the three byline choices); aalavina.org/guia-para-contribuciones; {lang:es}Pautas para Colaborar con La Viña{/lang} (2020); GVR Handbook (2024), p. 12; M-39, p. 53 (1974).
      TRANSITION: Here's how to send a story to each magazine.

  # "By phone": the two story lines' numbers, as the deck printed them, from the site's data (the official pages
  # aagrapevine.org/audio-portal and aalavina.org/graba-tu-historia, as /contribute/#record gives them), so the
  # slide follows a line that changes; a number the site doesn't have says "see the Share your story page", so a
  # middle dot (not the deck's comma) sets the length apart.
  # "Email": La Viña's address for a story is manuscritoslv@aagrapevine.org, the one the committee gives (the owner's
  # decision of 2026-10-02: config/site.yml links.lv_email_editorial, as /contribute/ shows it), where the deck had
  # lveditorial@ (La Viña News); lveditorial@ is only the contact of La Viña's monthly workshop.
  - id: "send-your-story"
    layout: "table"
    title: "How to send your story"
    header: ["", "Grapevine (in English)", "La Viña ({lang:es}en español{/lang})"]
    rows:
      - ["Online", "[aagrapevine.org/submit-your-story](https://www.aagrapevine.org/submit-your-story)", "[aalavina.org/comparte](https://www.aalavina.org/comparte)"]
      - ["Email", "gveditorial@aagrapevine.org", "manuscritoslv@aagrapevine.org"]
      - ["Length", "300 to 1,800 words", "5 to 6 typed pages, double-spaced"]
      - ["By phone", "{live:gv_audio_phone} · 6 to 8 minutes", "{live:lv_audio_phone} · up to 7 minutes"]
    widths: [1.4, 5.6, 4.8]
    first_col_bold: true
    source: "Sources: aagrapevine.org/submit-your-story · /audio-portal · aalavina.org/comparte"
    minutes: 1
    notes: |
      SAY: To send a story to Grapevine, use the 'Submit your story' form at aagrapevine.org/submit-your-story, or email gveditorial@aagrapevine.org; pick one, not both. The suggested length is 300 to 1,800 words. For La Viña, use the '{lang:es}Comparte{/lang}' form at aalavina.org or email manuscritoslv@aagrapevine.org; La Viña asks for five to six double-spaced typed pages. To record instead: Grapevine's Audio Project line takes stories of six to eight minutes, and La Viña's '{lang:es}Graba tu historia{/lang}' line takes up to seven minutes. The steps for each line are on our Share your story page.
      DO: Test both phone lines a few days before the workshop. The Grapevine line was reported down in May 2026.
      FACILITATOR TIP: Write in your own language: Spanish to La Viña, English to Grapevine. Keep a copy, because manuscripts aren't returned. Grapevine contacts writers only when a story is selected and keeps stories on file for future issues; La Viña lets every writer know their story arrived. By mail: Grapevine, Editorial Department, 475 Riverside Drive, New York, NY 10115.
      SOURCES: aagrapevine.org/guidelines-contributing-grapevine; aagrapevine.org/submit-your-story; aagrapevine.org/audio-portal (read Oct. 1, 2026); aalavina.org/comparte; aalavina.org/guia-para-contribuciones (manuscritoslv@); aalavina.org/graba-tu-historia; Grapevine Workbook (2026), pp. 42–43.
      TRANSITION: And because the magazines plan ahead, here are the themes they're collecting now.

  # The deck's table of the next three deadlines of each magazine (its DO note: "the next three deadlines for each
  # magazine"), from the site's own list (/contribute/#deadlines), current every day: `limit_each: 3` keeps three of
  # each (an issue with two themes is never cut in half); its last row (La Viña's open topics, any time) is the
  # takeaway. The notes' tips name themes that are only on the slide for a while, so each says "if it is on the slide".
  - id: "deadlines"
    layout: "live"
    kind: "deadlines"
    options: { pub: "both", limit: 6, limit_each: 3 }
    eyebrow: "Current information"
    title: "Themes and deadlines"
    takeaway: "La Viña · Open topics: [aalavina.org/temas-sugeridos](https://www.aalavina.org/temas-sugeridos) · Any time"
    source: "Sources: Grapevine Editorial Calendar · {lang:es}Temas de La Viña{/lang} (aalavina.org)"
    minutes: 1
    notes: |
      SAY: Grapevine chooses stories about five months before an issue's cover date, so the themes it's collecting now are for issues months away. (Read the next deadlines from the table: the theme, its issue, and the date stories are due.) La Viña also welcomes stories on open topics at any time. And a story that misses its deadline isn't wasted: it may be used in a later issue.
      DO: The deadlines stay current by themselves: the next three of each magazine, from the same list as our page {live:site}/contribute/#deadlines. If a magazine has no deadline on the slide, its themes are on its own site: aagrapevine.org/contribute for Grapevine, aalavina.org/recursos ({lang:es}Temas de La Viña{/lang}) for La Viña. The 2028 calendars were not out on Oct. 1, 2026 (expected early 2027).
      FACILITATOR TIP: If someone is excited to write, invite them to the next writing workshop, or to write for fifteen minutes after their home group's meeting. If the July 2027 Annual Prison Issue is on the slide: Grapevine especially wants stories from women in long-term custody. If {lang:es}Hispanos Veteranos en AA{/lang} (Hispanic veterans in AA) is on the slide: '{lang:es}veteranos{/lang}' can mean long-time members (La Viña's {lang:es}Veteranos{/lang} section is for old-timers) or military veterans, and La Viña's themes list gives only the title. Check La Viña's own description before you explain this theme.
      SOURCES: aagrapevine.org/contribute and the Grapevine Editorial Calendar 2026–27 (document); the {lang:es}Temas de La Viña{/lang} 2027 document (aalavina.org/recursos); aalavina.org/temas-sugeridos; Grapevine Workbook (2026), p. 42.
      TRANSITION: Last part: how to stay connected after today.

  # ===================================================================
  #  PART 8 · Stay connected (pptx slides 40–45)
  # ===================================================================
  - id: "part-8"
    layout: "section"
    number: 8
    title: "Stay connected"
    subtitle: "La Viña's monthly workshop, GVRs and RLVs, our committee, and where to find everything"
    accent: "vine"
    minutes: 0.25
    notes: |
      SAY: Part eight. A few ways to stay connected after today, then your questions.
      TRANSITION: First, a monthly online workshop that La Viña's own office runs.

  # The next date, the time and the Zoom ID come from config/site.yml (recurring_events: lv-monthly-workshop).
  - id: "lv-workshop"
    layout: "bullets"
    eyebrow: "Current information"
    title: "La Viña's monthly information workshop"
    items:
      - "**{lang:es}Taller informativo mensual de La Viña{/lang}:** online, in Spanish, hosted by La Viña's office"
      - "News about La Viña, its products and suggestions"
      - "Usually the **4th Thursday**, **{live:lv_workshop_time}**"
      - "Zoom ID **{live:lv_workshop_zoom_id}**"
      - "Next date listed: {live:lv_workshop_next}"
      - "Dates: [aalavina.org/calendario-de-eventos](https://www.aalavina.org/calendario-de-eventos)"
    takeaway: "In November and December, La Viña has held it the Thursday before Thanksgiving and Christmas: always check its calendar."
    source: "Sources: La Viña News, Sept.–Oct. 2026, p. 3 · aalavina.org/calendario-de-eventos"
    minutes: 0.75
    notes: |
      SAY: La Viña's office holds a monthly information workshop on Zoom, in Spanish: the '{lang:es}Taller informativo mensual de La Viña{/lang}', to keep us informed about the latest from La Viña, its products and suggestions. It's usually on the fourth Thursday of the month, {live:lv_workshop_time}. In November and December, La Viña has held it on the Thursday before Thanksgiving and before Christmas. (Read the next date on the slide.) This is a good one to pass on to Spanish-speaking groups, RLVs and district La Viña committees.
      DO: The next date stays current by itself; before each workshop, check it against aalavina.org/calendario-de-eventos. Say 'usually the fourth Thursday': La Viña's own calendar has kept the fourth Thursday even in months with five Thursdays. La Viña publishes only the start time, so the committee lists it as one hour.
      SOURCES: La Viña News, Sept.–Oct. 2026, p. 3; aalavina.org/calendario-de-eventos and its event pages (read Oct. 1, 2026; Oct. 22 was the latest date posted; November 20 and December 18 in 2025).
      TRANSITION: One way to stay connected is to serve as your group's GVR or RLV.

  - id: "gvr-rlv"
    layout: "bullets"
    title: "The GVR and the RLV"
    items:
      - "**GVR:** Grapevine Representative · **RLV:** {lang:es}Representante de La Viña{/lang}"
      - "The link between the home group and the AA Grapevine office"
      - "Chosen by the group; the group decides the term (two years is common)"
      - "Announces the new issue, keeps a display, invites members to write, shares new resources"
      - "Registers online: free tools and newsletters (an RLV also receives a free copy of each issue for a year)"
    takeaway: "No GVR or RLV yet? Bring it to your group conscience. We're glad to help."
    source: "Sources: Service Manual, pp. 83–84 · GV Workbook, p. 24 · {lang:es}Manual del RLV{/lang}, pp. 6–7"
    minutes: 1
    notes: |
      SAY: Many groups have a GVR, a Grapevine Representative, or an RLV, a {lang:es}Representante de La Viña{/lang}; some members serve both magazines. The Service Manual calls them the link between the group and the AA Grapevine office. Members become reps by volunteering or by being elected by their group, and the group decides the term; two years is common. The service position is simple: announce the new issue, keep a small display, invite members to write, and share new resources. Reps register online for free tools: Grapevine sends registered reps a monthly email, and La Viña's {lang:es}Noticias{/lang} comes every two months. An RLV also receives a free copy of La Viña for a year, to use in the service position. New reps will find a short orientation, GVR / RLV 101, on our website.
      IF TIME, ASK: Whose group has a GVR or RLV? Would you wave, so others know who you are?
      FACILITATOR TIP: Present the position as an invitation, and as a service link, not a sales role: reps share information, and the group decides. If someone's interested, suggest they talk with their group, and point them to our GVR / RLV corner page.
      SOURCES: Service Manual (2024–2026), pp. 83–84; Grapevine Workbook (2026), p. 24; {lang:es}Manual del RLV{/lang} (2025), pp. 6–7 (an RLV's free copy every two months for one year, p. 7); aagrapevine.org/gvr-resources and aalavina.org/recursos (Grapevine News monthly, {lang:es}Noticias{/lang} every two months); aagrapevine.org/get-involved/become-grapevine-rep; aalavina.org/servicio/conviertete-en-rlv.
      TRANSITION: And here's how to reach us, your Area committee.

  # The meeting's rule, time, Zoom ID, passcode and next date come from config/site.yml (`meeting:`); the e-mail
