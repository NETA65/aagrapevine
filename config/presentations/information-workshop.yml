  # A timeline: years in the time column (no `from`: they are dates, not clock times).
  - id: "early-years"
    layout: "agenda"
    title: "The early years"
    items:
      - { time: "1944", title: "First issue, in June", detail: "Started by six AA members in the New York area, four women and two men, with Bill W.'s blessing" }
      - { time: "1945", title: "Becomes AA's national journal, at the groups' request" }
      - { time: "1946", title: "Bill W. first sets out the Traditions in a Grapevine article" }
      - { time: "1947", title: "The AA Preamble first appears, written by a Grapevine editor" }
      - { time: "1958", title: "Bill W.'s “The Next Frontier: Emotional Sobriety”" }
      - { time: "1965", title: "The Responsibility Statement: “I am responsible…”", detail: "Written for the Toronto Convention by a former Grapevine editor" }
    source: "Sources: aagrapevine.org (history pages) · P-52 (2026), p. 5 · Service Manual, pp. 79, 170"
    minutes: 1.5
    optional: true
    notes: |
      SAY: Grapevine began in June 1944, started by six AA members in the New York area, four women and two men, with Bill W.'s blessing. A year later, at the groups' request, it became AA's national journal, and by January 1949 its masthead called it 'the international journal of Alcoholics Anonymous'. Some of AA's most important writing first appeared on its pages. In 1946 Bill W. first set out the Traditions in a Grapevine article. In 1947 the Preamble appeared, written by a Grapevine editor. In January 1958 came Bill's 'The Next Frontier: Emotional Sobriety', which many of us still pass to sponsees. And the Responsibility Statement, 'I am responsible', was written for the 1965 International Convention in Toronto by a former Grapevine editor and trustee. We'll close with it today.
      IF TIME, ASK: Which of these surprised you?
      FACILITATOR TIP: Don't add dates or titles that aren't on this slide; some popular 'firsts' about Grapevine couldn't be confirmed. If someone asks about one, offer to look it up. Grapevine's own website calls the Responsibility Statement the 'Responsibility Declaration'; it's the same text.
      SOURCES: aagrapevine.org/history-aa-grapevine; aagrapevine.org/aa-grapevines-contributions-aa; P-52 (2026), p. 5; Service Manual, pp. 79, 170; Grapevine Workbook (2026), p. 17.
      OPTIONAL: part of the optional Part 2 (see the section slide).
      TRANSITION: Then the magazine grew, and in 1996 it gained a sister.

  - id: "growing"
    layout: "agenda"
    title: "Growing with the Fellowship"
    items:
      - { time: "1986", title: "Conference recognition: AA's international journal" }
      - { time: "1988", title: "_The Language of the Heart_: Bill W.'s Grapevine writings" }
      - { time: "1996", title: "La Viña's first issue, in Spanish" }
      - { time: "1998", title: "Grapevine begins reaching out online" }
      - { time: "2009", title: "Full color throughout, and staple-free" }
      - { time: "2018–23", title: "YouTube (2018), Instagram and podcast (2021), apps (2023)" }
      - { time: "2026", title: "La Viña turns 30 · Grapevine's weekly open meeting (Feb.)", detail: "La Viña's weekly open meeting (announced for Nov. 5)" }
    source: "Sources: aagrapevine.org (history pages) · P-52 (2026), p. 10 · M-39, pp. 54–57"
    minutes: 1.5
    optional: true
    notes: |
      SAY: In 1986 came the Conference recognition we just read. In 1988 Bill W.'s Grapevine writings were gathered in 'The Language of the Heart'. La Viña has its own story. From 1991 the Conference asked for at least one article in Spanish in each Grapevine; in 1995 it approved a Spanish edition, and La Viña's first issue came out in 1996. Grapevine went online in 1998 and became full color and staple-free throughout in 2009. Then came YouTube in 2018, Instagram and the podcast in 2021, and the apps in 2023. In 2026 La Viña turned thirty, and Grapevine began a weekly open meeting in February; La Viña announced its own, in Spanish, for November 5th. We'll come back to both.
      SOURCES: M-39, pp. 54–57; P-52 (2026), pp. 9–10; aagrapevine.org/history-aa-lavina; aagrapevine.org/evolution-magazine; La Viña's flyer 'Nueva reunión abierta de La Viña' (2026). La Viña's first issue month differs between sources, so say '1996'.
      OPTIONAL: part of the optional Part 2 (see the section slide).
      TRANSITION: Enough history. Let's open an issue and see what's inside.

