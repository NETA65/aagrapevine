      SAY: Our committee meets on Zoom {live:meeting_rule}, {live:meeting_time}. The meeting ID and passcode are on the slide, and every AA member is welcome; there's nothing to sign up for. You'll hear what's new at Grapevine and La Viña, and what other groups and districts are trying. You can reach us any time at {live:email}. Our website, in English and Spanish, has this month's issues, the deadlines, the free resources, and pages for GVRs and RLVs. And we're glad to visit your district or group when invited: a short presentation, a literature display, or a writing workshop.
      DO: The next meeting date stays current by itself. Joining by phone: {live:meeting_phone}. Callers then enter the meeting ID and the numbers-only phone passcode {live:meeting_phone_passcode} (if no passcode shows here, ask the committee, {live:email}, before the workshop, so you can give it to callers on request). The Accessibility page on our website lists the other dial-in numbers.
      FACILITATOR TIP: Use the committee email on slides and flyers, never a personal phone number or personal email.
      SOURCES: The committee's site settings (meeting time, Zoom ID); neta65.org/trusted-servants/grapevine-la-vina/.
