    header: ["", "Grapevine", "La Viña"]
    rows:
      - ["Print", "12 issues a year, in plain packaging", "6 issues a year, in plain packaging"]
      - ["Digital", "Website, app, archive since 1944", "Website, app, archive since 1996"]
      - ["Complete", "Print and digital together", "Print and digital together"]
      - ["Audio", "Audio stories: see each plan", "See each plan in the store"]
      - ["Per year", "Print: {live:price_gv_print} · digital: {live:price_gv_digital}", "Print: {live:price_lv_print} · digital: {live:price_lv_digital}"]
    widths: [1.5, 4.2, 4.2]
    first_col_bold: true
    takeaway: "Yearly prices (AA Grapevine). Other plans, always current: [our Shop page](/shop/)."
    source: "Sources: AA Grapevine (stores; letter of Oct. 1, 2026) · Service Manual, p. 83 · P-52 (2026), pp. 9–10"
    minutes: 1.5
    version_minutes: { visit: 1 }
    notes: |
      SAY: There's a way to read for everyone. Print comes in the mail: twelve Grapevines a year, or six La Viñas. Something worth knowing for a newcomer or anyone private about their membership: subscriptions are mailed in plain packaging, with nothing on the outside that says AA. Digital gives you the website and the app, including the Story Archive. Grapevine's archive holds almost every story and letter it has published since June 1944; La Viña's goes back to 1996. Complete is print and digital together. And audio: members can listen to the stories, and the store pages say which plan includes what. The last row has AA Grapevine's prices for one year. Grapevine in print: {live:price_gv_print}; digital: {live:price_gv_digital}. La Viña in print: {live:price_lv_print}; digital: {live:price_lv_digital}. {live:price_change_note} For Complete and the other plans, our committee's Shop page reads the official prices every day.
      IF TIME, ASK: Which of these would work best for someone in your home group who doesn't read much, or who works nights?
      FACILITATOR TIP: If someone asks for any other price, open the Shop page or the official store and read it from there, with today's date; don't quote prices from memory. The 'Per year' row shows the prices in effect today and changes by itself on the day new prices start. While AA Grapevine's announcement of new prices is current, the SAY line above gives what changes and when (it is never on the slide): say it as plain information, never as pressure to subscribe.
      SOURCES: AA Grapevine's letter to intergroups and central offices, Oct. 1, 2026 (prices from Jan. 1, 2027; it says nothing about 2- or 3-year, Complete or monthly plans); official stores read into the committee's shop data, Oct. 1, 2026; Service Manual, p. 83 (Story Archive); P-52 (2026), pp. 9–10; Grapevine Workbook (2026), p. 32 and RLV Manual (2025), p. 10 (plain packaging). Which plans include audio differs between sources, so say 'check the store'.
