      - { time: "2.", title: "How often does a new La Viña come out?", detail: "a) Every month\u2003\u2003b) Every two months\u2003\u2003c) Twice a year" }
      - { time: "3.", title: "Can a group send a contribution to Grapevine?", detail: "a) Yes, any amount\u2003\u2003b) Only through the Area\u2003\u2003c) No" }
    minutes: 1.5
