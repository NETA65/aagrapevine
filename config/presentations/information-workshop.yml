      - "The editorial staff who choose the content are sober AA members"
      - "Each story is one member's experience, **not AA policy**"
      - "Stories may disagree: what works for one member may not work for another"
      - "The editors choose what is printed; the Conference doesn't review each issue first"
    takeaway: "That's why a story makes such a good topic for a meeting."
