  # ===================================================================
  #  PART 5 · How members use them (pptx slides 26–29)
  # ===================================================================
  - id: "part-5"
    layout: "section"
    number: 5
    title: "How members use them"
    subtitle: "Sponsorship, the home group, newcomers, and members a meeting can't reach"
    accent: "gv"
    minutes: 0.25
    notes: |
      SAY: Part five. A magazine on a shelf doesn't carry any message. Here's how members put Grapevine and La Viña to work: ideas from members' experience, not instructions.
      TRANSITION: Let's start close to home.

  - id: "close-to-home"
    layout: "columns"
    style: "panels"
    title: "Close to home"
    columns:
      - heading: "Sponsorship"
        accent: "gv"
        items: ["Read a story together, then talk", "A gift subscription for a sponsee"]
      - heading: "The home group"
        accent: "gv"
        items: ["The issue's discussion topic", "A table and a lending shelf"]
      - heading: "Newcomers"
        accent: "gv"
        items: ["A copy with the meeting list", "Stories reach them before they're ready to share"]
      - heading: "Treatment and corrections"
        accent: "gv"
        items: ["Staple-free, so it can go inside", "Through H&I and Corrections"]
    source: "Sources: Grapevine Workbook (2026), p. 24 · {lang:es}Manual del RLV{/lang} (2025), p. 6"
    minutes: 2
    notes: |
      SAY: Here's how members use the magazines close to home. With sponsees: many of us read a story together and talk about it, or work through the Step and Tradition of the month. A gift subscription is a meeting that never closes. In the home group: every issue has a discussion topic that's ready for a meeting, and a literature table with the current issue, plus a shelf of back issues members can borrow, keeps the stories moving. A one- or two-minute announcement from the GVR or RLV is enough. For newcomers: a copy to take home with the meeting list; stories often reach people before they're ready to speak at a meeting. And treatment and correctional facilities: Grapevine is staple-free so it can go where staples aren't allowed, and every July there's an Annual Prison Issue. That's done through your district's or Area's H&I, Treatment or Corrections committee, following the facility's rules.
      ASK THE ROOM: Which one of these does your home group already do? Which could it try?
      FACILITATOR TIP: Back issues keep working for years. A lending shelf with a first-names-only sign-out sheet is enough; no records with full names.
      SOURCES: Grapevine Workbook (2026), p. 24; {lang:es}Manual del RLV{/lang} (2025), p. 6; the committee's '10 ways to put an issue to work' (config/carry.yml), based on the Grapevine Board's presentation of May 12, 2026; Grapevine editorial calendars 2026 and 2027 (Annual Prison Issue, July).
      {not:late} TRANSITION: And the magazines reach members a meeting can't easily reach.
      {only:late} TRANSITION: Some of these ideas involve giving the magazine to someone. Here's how that works.

  - id: "hard-to-reach"
    layout: "columns"
    style: "panels"
    title: "Members a meeting can't easily reach"
    columns:
      - heading: "Isolated and homebound"
        accent: "gv"
        items: ["A meeting in print, at any hour", "Apps, audio stories, open meetings"]
      - heading: "Spanish-speaking members"
        accent: "lv"
        items: ["La Viña, written in Spanish", "Help in Spanish: (800) 640-8781"]
      - heading: "Deaf and hard-of-hearing"
        accent: "grape"
        items: ["ASL videos from AA Grapevine", "GSO's Accessibility Resources list"]
      - heading: "Those who'd rather listen or talk"
        accent: "vine"
        items: ["Audio stories and podcasts", "Record your story by phone"]
    source: "Sources: GSO, Accessibility Resources (Oct. 2025) · P-52 (2026), p. 10 · Workbook, p. 22"
    minutes: 1.5
    optional: true
    notes: |
      SAY: And the magazines go where meetings can't easily go. For members who are isolated or homebound, in a rural town, working nights, caring for someone, or sick, the magazine is a meeting at any hour, and the apps, audio stories and weekly open meetings bring the Fellowship closer. For Spanish-speaking members, La Viña is written in Spanish, with the {lang:es}Cita Diaria{/lang}, the app and customer service in Spanish. For Deaf and hard-of-hearing members, AA Grapevine has ASL videos on its YouTube channel, and GSO lists them in its Accessibility Resources; every story can also be read in print or online. And for members who'd rather listen than read, there are audio stories and podcasts, and anyone can record their own story by phone; we'll come back to that.
      IF TIME, ASK: Who do you know who can't get to meetings often? What might reach them?
      FACILITATOR TIP: If your district has an Accessibilities committee, this is a natural place to work together. Questions about accessibility resources can also go to GSO at access@aa.org.
      SOURCES: GSO, Accessibility Resources (Oct. 2025), listing 'AA Grapevine ASL Videos for Deaf Alcoholics'; P-52 (2026), p. 10; Grapevine Workbook (2026), p. 22; aagrapevine.org/contact-us (Spanish line).
      OPTIONAL: if you're running late, skip it.
      TRANSITION: Let's make this personal for a few minutes.

  # Green, as every activity in the PowerPoint (Part 5 is blue).
  - id: "story-reach"
    layout: "activity"
    eyebrow: "Activity"
    accent: "vine"
    title: "Who could a story reach?"
    steps:
      - "Think of one person or place a story could reach this month"
      - "No names, please: “a sponsee”, “a friend in treatment”, “our clubhouse”"
      - "Share your idea with a neighbor (on Zoom, in the chat)"
      - "Pick one small step you could take this week"
    duration: 3
    materials: ["A pen and paper, or the chat"]
    takeaway: "**Share back:** What's one idea you'd bring to your home group?"
    minutes: 3
    optional: true
    notes: |
      SAY: Let's take three minutes. Think of one person, or one place, that a Grapevine or La Viña story could reach this month. Please don't use names: say 'my sponsee', 'a friend in treatment', 'the clubhouse'. Turn to a neighbor and share your idea; on Zoom, put it in the chat. Then pick one small step you could take this week. (After three minutes.) Would two or three people share the idea they'd bring to their home group?
      DO: Start a visible three-minute timer and give a 30-second warning. On Zoom, read a few chat ideas aloud, without the names shown in the chat.
      FACILITATOR TIP: If the room is quiet, offer your own example first: 'For me, it was leaving a copy at the clubhouse coffee table.' Keep the sharing to two or three people.
      OPTIONAL: if you're running late, skip the activity.
      TRANSITION: Some of those ideas involve giving the magazine to someone. Here's how that works.

  # ===================================================================
  #  PART 6 · Gifts, group subscriptions and self-support (pptx slides 30–35)
  # ===================================================================
  - id: "part-6"
    layout: "section"
    number: 6
    title: "Gifts, group subscriptions and self-support"
    subtitle: "Carry the Message, the group's choice, and how the magazines pay their way"
    accent: "grape"
    minutes: 0.25
    notes: |
      SAY: Part six: giving the magazines, group subscriptions, and how Grapevine and La Viña pay their way. This is information, not a sales pitch: every choice here belongs to you or to your group.
      TRANSITION: First, the gift that goes to someone you'll never meet.

  - id: "carry-message"
    layout: "columns"
    style: "panels"
    title: "Carry the Message: two ways to give"
    columns:
      - heading: "For someone you know"
        accent: "grape"
        items:
          - "A gift subscription or gift certificate"
          - "For a sponsee, a friend, an anniversary, an event"
          - "The first renewal notice comes to you"
      - heading: "For someone you don't know"
        accent: "vine"
        items:
          - "A **Carry the Message** gift certificate"
          - "The office gives it to an alcoholic in need: in prison, in treatment, at home"
          - "Your details aren't linked to it"
    takeaway: "Grapevine calls it Carry the Message; La Viña calls it {lang:es}Lleva el Mensaje{/lang}."
    source: "Sources: aagrapevine.org/carry-the-message · aalavina.org/lleva-el-mensaje · P-52"
    minutes: 1.5
    version_minutes: { visit: 1 }
    notes: |
      SAY: There are two ways to give the magazines. For someone you know, a sponsee, a friend, a member celebrating an anniversary, or as a giveaway at an event, you buy a gift subscription or a gift certificate; the first renewal notice comes to you, and later ones go to them. For someone you'll never meet, there's Carry the Message, in Spanish '{lang:es}Lleva el Mensaje{/lang}'. You buy a certificate, and the Grapevine or La Viña office gives it to an alcoholic who needs it: someone in prison, in treatment, in a hospital, or at home. Your name isn't connected to that subscription. This isn't new: in the 1960s the Conference was already encouraging groups to send subscriptions to doctors, clergy, libraries, prisons and hospitals.
      ASK THE ROOM: Has anyone here been given a subscription? What did it mean to you?
      FACILITATOR TIP: Call it a gift certificate or a subscription, not a 'donation'. It's a purchase that puts the magazine in someone's hands.
      SOURCES: aagrapevine.org/carry-the-message and /2023-carry-message-project; aalavina.org/lleva-el-mensaje; P-52 (2026), pp. 10–11; M-39, pp. 52–53 (1961, 1962 and 1968 Advisory Actions). Prices: see the stores or our Shop page.
      TRANSITION: What about the group itself?

  - id: "group-subscriptions"
    layout: "bullets"
    title: "Group subscriptions: the group decides"
    items:
      - "Each group is autonomous: **its group conscience decides** (Tradition Four)"
      - "AA's self-support pamphlet lists Grapevine literature among a group's **basic expenses**, with rent, refreshments, AA literature and meeting lists"
      - "Ideas groups use: a subscription for the literature table, several copies (a lower price per copy), a gift for newcomers or anniversaries, a Carry the Message certificate"
      - "The GVR or RLV, or any member, can bring information to the business meeting"
    takeaway: "Order forms: [aagrapevine.org/gvr-resources](https://www.aagrapevine.org/gvr-resources) · [aalavina.org/recursos](https://www.aalavina.org/recursos)"
    source: "Sources: F-3, Self-Support (June 2026), pp. 7, 12–13 · Grapevine Workbook (2026), p. 39"
    minutes: 1.5
    version_minutes: { visit: 1 }
    notes: |
      SAY: Whether a group subscribes is the group's decision, made by its group conscience. For information: AA's pamphlet on self-support, F-3, lists Grapevine literature among a group's basic expenses, alongside rent, refreshments, AA literature and meeting lists. Whether and how to spend on it is up to each group. Groups that use the magazines do it in different ways: one subscription for the literature table, several copies at a lower price per copy, a gift for each newcomer or anniversary, or a Carry the Message certificate. The usual way is simple: the GVR or RLV, or any member, brings the information to the business meeting, and the group decides. Orders then go through the official stores or customer service.
      ASK THE ROOM: What has your group's experience been with the magazines: a subscription, a lending shelf, or none?
      DO: If a treasurer asks for budget figures, AA Grapevine's yearly prices are on slide {slide:ways-to-read}. Grapevine, print: {live:price_gv_print}; digital: {live:price_gv_digital}. La Viña, print: {live:price_lv_print}; digital: {live:price_lv_digital}. The price for several copies, and every other plan, is on the stores or our Shop page. {live:price_change_note}
      FACILITATOR TIP: Some groups will be less interested in the magazines, and that's their right. Offer information once, kindly, and leave the decision with the group.
      SOURCES: F-3, Self-Support: Where Money and Spirituality Mix (June 2026), pp. 7, 12–13; Grapevine Workbook (2026), pp. 26–27, 39, 52; the official stores (lower price from 2 copies, Oct. 2026).
      TRANSITION: That raises a fair question: how do Grapevine and La Viña pay their way?

  - id: "pay-their-way"
    layout: "quote"
    title: "How Grapevine and La Viña pay their way"
    quote: "AA Grapevine, Inc. does not accept contributions from individuals or groups. Nor does it accept revenue from ads or membership fees. Instead, it relies on A.A. groups, committees and individual members who value Grapevine and La Viña in their recovery and in their Twelfth Step work to purchase subscriptions and other content-related materials."
    credit: "Reprinted from The A.A. Service Manual, 2024–2026 Edition, p. 66, with permission of Alcoholics Anonymous World Services, Inc."
    takeaway: "La Viña is not yet self-supporting: the General Service Board supports it as a service to the Fellowship."
    source: "Sources: Service Manual, p. 66 · P-52 (2026), pp. 7–9 · aa.org (Grapevine FAQ)"
    minutes: 1.5
    version_minutes: { visit: 1 }
    notes: |
      SAY: How do Grapevine and La Viña pay their way? Here it is in the Service Manual's own words. (Read the quotation.) So AA Grapevine, Inc. takes no contributions, from members or from groups, and it has no advertising and no membership fees. The magazines are supported by members and groups who find them useful and choose to subscribe or buy a book. Any surplus goes to the General Service Board's Reserve Fund, and the Board covers any shortfall. La Viña, as the slide says, isn't yet self-supporting: it doesn't yet have enough readers to cover its costs, so the General Service Board supports it as a service to the Fellowship. So please don't pass a basket 'for Grapevine', and don't send it a check from the group. Nobody is asked to buy anything out of duty.
      IF TIME, ASK: Is any of this new to you?
      DO: Read the quotation aloud, slowly, then pause.
      FACILITATOR TIP: A purchase is not a 'contribution to Grapevine'. Use the words 'subscribe', 'buy' or 'give a gift', never 'donate'.
      SOURCES: Service Manual (2024–2026), p. 66 (the same wording is in AA Grapevine's flyer Self-Support 2025, F-230); aa.org/aa-grapevine-la-vina (FAQ); aa.org/faq/does-my-contribution-aa-support-grapevine; P-52 (2026), pp. 7–9; RLV Manual (2025), p. 10; M-39, pp. 55–56 (1989 and 1994 actions). Check the page when the 2026–2028 Service Manual is out.
      {not:visit} TRANSITION: So, if a member wants to help, what can they do?
      {only:visit} TRANSITION: So, if a member wants to help, one way is to serve as their group's GVR or RLV.

  - id: "five-ways"
    layout: "bullets"
    title: "Five ways a member can help"
    numbered: true
    items:
      - "**Read** it, and talk about it with others"
      - "**Subscribe** for yourself, or suggest a group subscription to your group conscience"
      - "**Give** a gift, or Carry the Message to someone you don't know"
      - "**Write** a story, a letter or a joke, or send a photo (no people)"
      - "**Serve** as your group's GVR or RLV, or at a district or Area table"
    takeaway: "Pick one, if it feels right: attraction, never pressure."
    minutes: 1.25
    notes: |
      SAY: Here are five simple ways, and you can pick one or none. Read, and talk about it, because a story shared out loud carries further than one left in a drawer. Subscribe, in print, digital, the app or Complete, or suggest a group subscription to your group conscience. Give: a gift to someone you know, or Carry the Message to someone you don't. Write: the magazines are only as good as the stories members send, and that includes letters, jokes and photos of your meeting room, with nobody in the picture. And serve: as your group's Grapevine or La Viña representative, or by helping at a district or Area literature table. None of this is required of anyone. We share what has worked for us, and you decide.
      IF TIME, ASK: Which of the five would be easiest for you this month?
      FACILITATOR TIP: Resist any urge to set targets or compare groups. AA's experience is that attraction works better than promotion, and the Conference asked long ago for an 'informative attitude' rather than a 'hard sell' in Grapevine presentations.
      SOURCES: P-52 (2026), pp. 10–12; M-39, p. 52 (1960 Advisory Action); aagrapevine.org/contribute; aagrapevine.org/get-involved/become-grapevine-rep.
      {not:late} TRANSITION: That spirit has a name in our Traditions.
      {only:late} TRANSITION: That's how members support the magazines. Now the part that fills them: your stories.

  # The deck prints two lines under the Tradition: its name and the permission line; both stay in `credit`.
  - id: "tradition-eleven"
    layout: "quote"
    title: "Attraction rather than promotion"
    quote: "Our public relations policy is based on attraction rather than promotion; we need always maintain personal anonymity at the level of press, radio and films."
    credit: "— Tradition Eleven (short form)\nReprinted from AA Grapevine and La Viña: Our Meetings in Print (P-52), p. 17, with permission of Alcoholics Anonymous World Services, Inc."
    minutes: 0.5
    optional: true
    notes: |
      SAY: Tradition Eleven guides how we talk about the magazines. (Read the Tradition.) Attraction rather than promotion: we share what Grapevine and La Viña have done for us, and let that speak. And personal anonymity at the level of press, radio and films, which today includes the internet and social media. When you share the magazines online, share the link or the issue, never a member's full name or face.
      DO: Read the Tradition aloud, or ask a volunteer to read it.
      SOURCES: P-52 (2026), p. 17 (short form). The 2013 Conference affirmed that the internet and social media are implicit in Tradition Eleven (SMF-197, p. 1).
      OPTIONAL: if you're running late, skip it.
      TRANSITION: That's how members support the magazines. Now the part that fills them: your stories.

