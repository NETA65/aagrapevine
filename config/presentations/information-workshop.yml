      DO: Read each question and its options, let the room answer, then go to the answers slide after question six.
      FACILITATOR TIP: Keep it light and celebrate every answer. This is a review, not a test.
      OPTIONAL: not counted in the 60-minute plan; use it only if you have the time, or in place of part of the Q&A. The three review-question slides start switched off: turn them on in {ui:customize} → {ui:slides}.
