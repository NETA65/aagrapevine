  # ===================================================================
  #  QUESTIONS, OPTIONAL REVIEW QUESTIONS, CLOSING (pptx slides 46–52)
  # ===================================================================
  # The PowerPoint's Q&A slide is grape (a lavender pause slide), inside Part 8's green. No eyebrow in the deck:
  # "Closing", as on the Responsibility Statement and the agenda's last row ("Questions, and closing"), rather than
  # the part's ("Part 8 · Stay connected"), as the writing workshop does.
  - id: "questions"
    layout: "qa"
    accent: "grape"
    eyebrow: "Closing"
    title: "Questions & answers"
    prompts:
      - "What questions do you have about Grapevine or La Viña?"
      - "Which free resource will you try first?"
      - "What's one idea you'd bring to your home group?"
    note: "Please keep shares short so everyone has a turn."
    minutes: 8
    notes: |
      SAY: What questions do you have? Anything about the magazines, the free resources, subscriptions, or writing. And I'd love to hear your experience too.
      DO: Take the questions gathered earlier first. Repeat each question so everyone, including people on Zoom, hears it. If time allows, use the optional review questions (three slides that start switched off: turn them on in {ui:customize} → {ui:slides}, and they come right after this one); otherwise go on to the Responsibility Statement (slide {slide:responsibility}).
      FACILITATOR TIP: If you don't know an answer, say so and offer to find out ({live:email}). Send order and subscription problems to customer service. If a question turns to outside issues, gently bring it back to the magazines.
      LIKELY QUESTIONS: (1) Is Grapevine Conference-approved? The Conference recognizes it as AA's international journal, and that extends to La Viña (slide {slide:conference-approved}). (2) Can our group donate to Grapevine, or pass a basket for it? No: AA Grapevine, Inc. takes no contributions; members and groups support it by subscribing and buying (slide {slide:pay-their-way}). (3) Can we photocopy a story, or put it in our newsletter or online? Not without permission from AA Grapevine, Inc. (licensing@aagrapevine.org); share the issue or the link instead. (4) Will my name be printed? Grapevine's form lets you choose first name and last initial, initials, or 'Anonymous' (slide {slide:anyone-can-write}). (5) Does the envelope say AA? No: subscriptions come in plain packaging (slide {slide:ways-to-read}). (6) How does a group order? With the order forms on the rep pages (slide {slide:group-subscriptions}), the official stores, or customer service (slide {slide:find-everything}). (7) Do I need a subscription to record my story? Don't say so: Grapevine's audio-portal page doesn't ask for one (slide {slide:send-your-story}). (8) How much is a subscription? Read the 'Per year' row on slide {slide:ways-to-read} (AA Grapevine's yearly prices in effect today); for any other plan, open our Shop page.
      TRANSITION: (If you turned the review questions on) Let's try a few review questions together, just for fun. (If not) Let's close together.

  # The review questions are outside the 60-minute plan ("use it only if you have the time"), so they start
  # switched off. Their numbers run 1–6 across two slides, which `numbered` can't do: the number is the
  # agenda's first column, the options the muted line under each question. The deck's wide gaps between the
  # options are two em spaces, written \u2003 inside the quotes: a browser keeps them as they are, where it would
  # close up ordinary spaces.
