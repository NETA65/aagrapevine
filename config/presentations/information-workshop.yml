  # No copyright holder is printed for the Responsibility Statement: a source line, not a permission line.
  # Its quote mark is La Viña orange in the PowerPoint (the deck's one quotation that isn't grape).
  - id: "responsibility"
    layout: "quote"
    eyebrow: "Closing"
    accent: "lv"
    title: "The Responsibility Statement"
    quote: "I am responsible. When anyone, anywhere, reaches out for help, I want the hand of A.A. always to be there. And for that: I am responsible."
    credit: "— Responsibility Statement, written for the 1965 International Convention, Toronto"
    minutes: 0.5
    version_minutes: { visit: 1 }
    # "As we heard earlier" points back to the history slide (The early years), which the shorter versions leave out.
    notes: |
      {only:full} SAY: Thank you all for being here. Let's close with the Responsibility Statement. As we heard earlier, it was written for the 1965 International Convention in Toronto by a former Grapevine editor. Please join me. (Read together.) I am responsible. When anyone, anywhere, reaches out for help, I want the hand of A.A. always to be there. And for that: I am responsible.
      {not:full} SAY: Thank you all for being here. Let's close with the Responsibility Statement. It was written for the 1965 International Convention in Toronto by a former Grapevine editor. Please join me. (Read together.) I am responsible. When anyone, anywhere, reaches out for help, I want the hand of A.A. always to be there. And for that: I am responsible.
      DO: Invite everyone to read it together. Use the exact words on the slide. Grapevine's website calls it the Responsibility Declaration; it's the same text.
      SOURCES: aagrapevine.org/about-us (where it is called the 'Responsibility Declaration'); P-52 (2026), back cover. No copyright holder is printed for it, so the slide carries a source line instead of a permission line.
      {not:visit} TRANSITION: (Show the credits briefly, then the thank-you slide.)
      {only:visit} TRANSITION: (Go on to the thank-you slide, then take questions.)

  # The credit lines, the trademark line and the deck's own disclaimer are written out (`note`), so no `disclaimer`.
  # The PowerPoint's credits are Grapevine blue, whatever the part. No eyebrow there either: "Closing", as on the
  # slide before it, rather than the part's.
  - id: "credits"
    layout: "credits"
    accent: "gv"
    eyebrow: "Closing"
    title: "Credits & sources"
    sources:
      - "AA Grapevine, Inc.: [aagrapevine.org](https://www.aagrapevine.org) (history, editorial policy, guidelines, audio portal, podcasts, weekly open meeting, store), read Oct. 1, 2026; letter to intergroups and central offices on prices from Jan. 1, 2027 (Oct. 1, 2026)"
      - "La Viña: [aalavina.org](https://www.aalavina.org) ({lang:es}contribuciones, graba tu historia, calendario, tienda{/lang}); La Viña News, Sept.–Oct. 2026"
      - "A.A.W.S.: _The A.A. Service Manual_, 2024–2026; _Our Meetings in Print_ (P-52, 2026); _Advisory Actions_ (M-39); _Self-Support_ (F-3); _Anonymity_ (P-47); GSO's _Accessibility Resources_"
      - "NETA 65 Grapevine & La Viña Committee: [{live:site}](/)"
    note: |
      The Preamble and the quoted A.A.W.S. passages carry their credit lines on their own slides.
      Grapevine and La Viña are trademarks of AA Grapevine, Inc. The names are used only to identify the magazines; no logos, covers or artwork are reproduced.
      This presentation was prepared by the NETA 65 Grapevine & La Viña Committee for local service use. It is not AA Conference-approved literature and does not speak for AA as a whole or for AA Grapevine, Inc.
    minutes: 0.5
    notes: |
      SAY: These are the sources for today's facts, and the credit lines for the passages we quoted. Once more: this workshop was prepared by our Area committee for local service. It isn't Conference-approved literature, and it doesn't speak for AA as a whole or for AA Grapevine, Inc.
      DO: Show this slide for a few seconds; there's no need to read it.
      TRANSITION: Thank you.

  # The deck's QR code (captioned "Our website") opens the committee site: `qr: "/"`. In the 20-minute visit the
  # questions are taken here, at the end (its version note): its minute and about four of questions.
  - id: "thank-you"
    layout: "closing"
    title: "Thank you"
    message: "For carrying the message: in print, online, and one member to another."
    lines: ["NETA 65 Grapevine & La Viña Committee", "{live:email}", "{live:site}"]
    qr: "/"
    minutes: 0.5
    version_minutes: { visit: 5 }
    version_notes:
      visit: "20-MINUTE VERSION (a district or group visit): now take questions."
    notes: |
      SAY: Thank you for your time and your service. Please take a magazine with you if we have extras, tell one person about something free you heard today, and come to our committee meeting, {live:meeting_rule}. The QR code goes to our website, where everything from today is kept up to date. Keep coming back.
      DO: Leave this slide up while people leave. Collect the passed-around magazines, or leave them on the literature table. If anything was recorded by mistake, delete it.

  # ===================================================================
  #  FOR THE PRESENTER (pptx slide 53, hidden there) — Customize → Prepare
  # ===================================================================
  # The deck's "what to update" checklist, rewritten for the web: what stays current by itself, what the presenter
  # fills in or checks. Its lines about rebuilding the PowerPoint file (the generator's UPDATE blocks,
  # `kit.py fillins`, research.md, re-typing prices and "Last updated") have no web equivalent and were left out.
  # Navy, as the PowerPoint's hidden checklist.
  - id: "checklist"
    layout: "bullets"
    facilitator: true
    checklist: true
    eyebrow: "For the presenter · not shown in the slide show"
    accent: "navy"
    title: "Before each workshop: presenter's checklist"
    items:
      - "Fill in your details ({ui:customize} → {ui:your_details}): every blank still empty shows in orange brackets"
      - "Re-check on the day what you filled in (the Step and Tradition, new books, seasonal items: /monthly/, /shop/), both weekly open meetings, La Viña's calendar"
      - "Test both record-by-phone lines and the links; never add audio or video to the slides"
      - "To ask for free printed materials, write gvrc@aagrapevine.org 4–6 weeks ahead"
      - "Bring printed issues to hold up and pass around (no covers on slides) and the order forms"
      - "Keep names out of slides and notes"
    notes: |
      This page is for the presenter and is never shown in the slide show ({ui:customize} → {ui:prepare}). It is the presenter's checklist for keeping this presentation current. The slide numbers below are those of the version you chose.
      STAYS CURRENT BY ITSELF: the issues and themes on Inside an issue of Grapevine, {slide:inside-grapevine}, and of La Viña, {slide:inside-la-vina}; this month's issues, the next ones and both Books of the Month on This month, {slide:this-month}; the yearly prices on The ways to read, {slide:ways-to-read}, and in the notes; the weekly open meetings' days, times and Zoom room, {slide:weekly-open}; the two story lines' numbers, {slide:send-your-story}; the themes and deadlines, {slide:deadlines}; La Viña's monthly workshop, {slide:lv-workshop}; the committee's meeting and its next date, {slide:committee}, and its dial-in number in that slide's notes; the panel in the footer and the 'Current as of' date on the title slide. They come from the committee site, which updates itself every day from the official sites. A fact the site doesn't know yet says where to look instead ('see aalavina.org').
      YOU FILL IN ({ui:customize} → {ui:your_details}): the date, the place, the presenter's service position, the restrooms and the end time; the Step and Tradition of this issue, {slide:inside-grapevine}; the new books, {slide:books}; the seasonal items, {slide:this-month}. A blank that is still empty shows in orange brackets, and the player lists them before you present.
      WHERE TO CHECK: the committee site ({live:site}) /monthly/, /shop/, /contribute/#deadlines and /meetings/#weekly-open update themselves every day from the official sites. For La Viña's monthly workshop use aalavina.org/calendario-de-eventos. For the {lang:es}Reunión Abierta de La Viña{/lang}, look for an official page on aalavina.org (on Oct. 1, 2026 it was known only from La Viña's flyer); if there is one now, cite it on the weekly open meetings slide instead of the flyer ({ui:customize} → {ui:edit}).
      TIMING: 60 minutes with 8 minutes of Q&A. The notes of the agenda slide, Our hour together, list the OPTIONAL slides (about 12 minutes) and a 20-minute version; both are versions in {ui:customize} → {ui:version}. The three review-question slides start switched off ({ui:customize} → {ui:slides}).
      NO LOGO: since October 2026 the deck carries no NETA 65 Area logo, by decision; the text 'NETA 65 · Grapevine & La Viña Committee' on the title slide names us. Don't add the Area logo back. The QR code on the last slide opens our website.
      PRICES: the only prices on slides are AA Grapevine's yearly prices, in the 'Per year' row of The ways to read, {slide:ways-to-read}. They show the prices in effect on the day and change by themselves on the day new prices start. While a change is announced, the notes say what changes and when; the announcement stays off the slides, because it also names the books' new prices. Every other price: our Shop page.
      NEVER: any other price on a slide (say 'see current prices' and where); pressure to subscribe; Grapevine or La Viña logos, covers, artwork or pasted stories; members' full names, faces, phones or personal emails, in the slides or in these notes, because this presentation is public; unverified numbers; links to non-AA websites.
      If a new edition of the Service Manual (2026–2028) is out, re-check the page numbers in the credit lines (pp. 66, 81, 83–85).
