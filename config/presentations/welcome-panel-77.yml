    notes: |
      SAY: Our website gathers what a GVR or RLV needs. The GVR and RLV corner has your first steps, with a checklist that remembers your progress on your own device, links to the official kits, and GVR and RLV Bingo. GVR and RLV 101 has six short sessions, five to eight minutes each, and the presentations, this one included. The Monthly toolkit is the page to bookmark: this month's issues and themes, the dates, ideas for putting an issue to work, and a ready-made GV/LV report for your district meeting.
      SAY: Share your story has the themes and deadlines with countdowns, how to send a story, and how to record one, by phone or in your phone's browser. The Shop page has the current prices, the stores' offers, Carry the Message and the order forms. The Share page has QR codes, posters and table tents for your literature table, and the Events page every date, with a calendar you can add to your phone.
