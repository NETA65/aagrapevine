      ADDRESSES: Lewisville Group, 1305 S. State Hwy 121, Bldg A Suite 105, Lewisville, TX 75067; Eastland Group, 302 North College Ave, Eastland, TX 76448; Downtown Suburban Group, 1700 E Front St., Tyler, TX 75702. Each orientation has its own page on our Events page.
