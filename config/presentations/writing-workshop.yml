  # ---------------------------------------------------------------- Part 5 · Anonymity in your writing (pptx 29–34)
  - id: "part-5"
    layout: "section"
    number: 5
    accent: "lv"
    title: "Anonymity in your writing"
    subtitle: "Your name, other people's names, and the Traditions on paper"
    minutes: 0.5
    notes: |
      SAY: Welcome back. Before you write a full scene, let's talk about anonymity, because it shapes what goes on the page. The good news: the magazines have protected writers' anonymity for more than eighty years, and the system is simple. The part that's up to us is protecting the other people in our stories.
      DO: Check that everyone is back; on Zoom, wait until the participant count is steady.
      TRANSITION: 'First, your own name.'
    version_notes:
      short: "90-MINUTE PLAN: Part 5 takes about 5 minutes (6 in the full plan)."

  # Navy in the deck: the colour of its first column (eyebrow and takeaway).
  - id: "your-name"
    layout: "columns"
    style: "panels"
    accent: "navy"
    title: "How your name appears"
    columns:
      - heading: "What the editors receive"
        accent: "navy"
        items:
          - "Your full name, address, phone and email"
          - "Used by the office to contact you; never printed"
          - "Grapevine protects anonymity at all times (1974 Advisory Action)"
      - heading: "What readers see"
        accent: "vine"
        items:
          - "You choose: first name and last initial, initials only, or _Anonymous_"
          - "Usually with your city and state"
          - "For example: _Maria G., Tyler, Texas_"
    takeaway: "Full name to the office; a first name and initial, or less, in print."
    minutes: 1.5
    version_minutes: { short: 1 }
    notes: |
      SAY: When you send a story, you give the editors your full name, address, phone and email, so they can reach you if your story is chosen. It is never printed: back in 1974 the General Service Conference noted that the Grapevine protects anonymity at all times. In print, you choose how your name appears. Grapevine's online form gives three choices: first name and last initial, first and last initials only, or Anonymous. Published stories usually show your city and state as well; the example on the slide is made up. If you live in a very small town and that worries you, you can ask to be published as Anonymous.
      ASK: Does anyone have a question about their own name in print? (Answer generally; invite anyone with a personal situation to talk with you privately at the break or after.)
      FACILITATOR TIP: 'Usually with your city and state' is what published bylines show; it is not a written rule, so say 'usually'. The three name choices come from Grapevine's online submission form (aagrapevine.org/submit-your-story).
      TRANSITION: 'This is AA's own custom, in AA's own words.'

  - id: "custom-in-print"
    layout: "quote"
    accent: "grape"
    title: "The AA custom in print"
    quote: "In printed articles, on websites or email, we are identified by our first names and last initials only."
    credit: "— Reprinted from _Anonymity Online and Digital Media_ (SMF-197), p. 1, with permission of A.A. World Services, Inc."
    minutes: 1
    notes: |
      SAY: This is our custom across AA, not only in the magazines; the service piece on the screen is quoting the pamphlet The A.A. Group. In print, on websites and in email, we use first names and last initials. Tradition Eleven asks us to keep personal anonymity at the level of press, radio and films, and today that includes the internet and social media. So if your story is published, celebrate it, share the issue with your home group, and think twice before posting it on social media with your full name or your photo next to it.
      ASK: How does your home group handle anonymity online, in WhatsApp groups or on social media? (One or two answers; don't let it become a debate.)
      FACILITATOR TIP: If someone asks whether they can share their published story online: point them to the magazine's own link, without their full name or a photo, and remember that the story's copyright belongs to AA Grapevine, Inc. once published.
      TRANSITION: 'Now, the people in our stories.'

  # The deck's "a rare job" (slide) and "a very unusual job" (notes) → "line of work": the site never says "job".
  - id: "other-people"
    layout: "bullets"
    title: "Protecting other people in your story"
    items:
      - "Sponsors, family, friends: first names only, or none (_my sponsor_, _my sister_)"
      - "Never reveal that someone else is in AA if they could be recognized"
      - "Leave out details that point to one person: a workplace, a rare line of work, a tiny town"
      - "Photos: no one who can be recognized; show rooms, chairs, the coffee pot"
      - "Tell your part of the story; theirs is theirs to tell"
    takeaway: "Ask yourself: if this person read my story, would they feel safe?"
    minutes: 1.5
    notes: |
      SAY: Our stories are full of other people: sponsors, spouses, children, the friend who drove us to our first meeting. Their anonymity matters as much as ours. Use first names only, or no names at all: 'my sponsor', 'my sister' works beautifully. Never reveal that someone else is a member of AA if they could be recognized. Watch for details that point to one person, like their workplace or a very unusual line of work. With photos, nobody who can be recognized. And the deepest one: tell your part of the story. If your story involves a family member's struggles, write about what you did and how you changed, and leave their story for them to tell.
      ASK: Look at your drafts from Exercises 1 and 2. Is there a full name, or a detail that identifies someone? Fix it now; it takes ten seconds.
      FACILITATOR TIP: This applies to the room as well: if pairs mention other people, that stays in the pair.
      TRANSITION: 'And a few Traditions that apply to writing.'

  - id: "traditions-on-paper"
    layout: "bullets"
    title: "Keep it AA: the Traditions on paper"
    items:
      - "**Singleness of purpose:** your experience with alcohol and with recovery in AA"
      - "**No outside issues:** no politics, causes or current events; no medical or legal advice; no opinions on treatment, medications or other fellowships"
      - "**Attraction, not promotion:** don't recommend outside businesses, websites, products or treatment centers; AA literature is fine to mention; let the hope in your story do the work"
      - "**Your experience, not AA's voice:** stories are not statements of AA policy"
    source: "Our summary of Traditions Five, Six, Ten and Eleven; Grapevine's Guidelines for Contributing (rev. April 2019) ask that stories reflect AA's singleness of purpose."
    minutes: 1.5
    version_minutes: { short: 1 }
    notes: |
      SAY: The Traditions apply on paper just as they do in the meeting room. Grapevine asks that a story relate to AA experience and reflect AA's singleness of purpose, so write about your experience with alcohol and with recovery in AA. Tradition Ten: no outside issues: no politics, causes or current events, no medical or legal advice, and no opinions on treatment, medications or other fellowships. If any of those were part of your life, say what you did, without telling the reader what to do or think. Traditions Six and Eleven: attraction, not promotion. Don't recommend an outside business, website, product or treatment center as the answer; mentioning the Big Book or other AA literature is fine. And you speak only for yourself: stories are members' experience, never AA policy.
      ASK: Can anyone think of how to write about, say, a hospital stay without giving medical advice? (Answer: describe what happened to you and what you did; leave out recommendations.)
      FACILITATOR TIP: Present these as our summary of the Traditions' guidance, not as the committee's rules or the magazines' rules: the editors decide what they print.
      TRANSITION: 'Now let's put it all together in a full scene.'

  # Step 1 listed the next open themes "as of October 2026" (Emotional Sobriety, Annual Prison Issue, Sober Seniors,
