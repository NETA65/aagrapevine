slides:
  # ---------------------------------------------------------------- Opening (pptx 1–5)
  - id: "title"
    layout: "title"
    eyebrow: "NETA 65 · Grapevine & La Viña Committee"
    title: "Grapevine and La Viña Writing Workshop"
    subtitle: "Putting our experience, strength and hope on paper"
    # The deck's line was "[First name, last initial] · [service position]": on the web a presenter is a service
    # position, and a first name lives only in the notes.
    lines:
      - "{fill:presenter}"
      - "{fill:date} · {fill:host_group} · {fill:place}"
    minutes: 1
    # SAY: the deck's "For the next [two hours / ninety minutes]" is one line per version ({not:short} / {only:short}).
    notes: |
      {not:short} SAY: Good [morning / afternoon], everyone, and welcome to the Grapevine and La Viña Writing Workshop. My name is {fill:first_name}, I'm an alcoholic, and I serve as {fill:presenter} with the NETA 65 Grapevine & La Viña Committee. Thank you to {fill:host_group} for inviting us and for making room for us today. For the next two hours we're going to do more writing than listening. By the time we close, most of you will have the beginning of a story, maybe a whole one, that you could send to Grapevine or La Viña if you choose to.
      {only:short} SAY: Good [morning / afternoon], everyone, and welcome to the Grapevine and La Viña Writing Workshop. My name is {fill:first_name}, I'm an alcoholic, and I serve as {fill:presenter} with the NETA 65 Grapevine & La Viña Committee. Thank you to {fill:host_group} for inviting us and for making room for us today. For the next ninety minutes we're going to do more writing than listening. By the time we close, most of you will have the beginning of a story, maybe a whole one, that you could send to Grapevine or La Viña if you choose to.
      DO: Before anyone arrives: put a story planner, a revision checklist, paper and a pen on every chair; start the slides on this slide; have a timer ready. On Zoom: open the room 15 minutes early, make a trusted servant co-host for the breakout rooms, and put the committee's contribute page link in the chat. Introduce yourself with your first name only. This presentation is posted publicly, so the title line carries a service title, never a name: your first name is only in these notes.
      FACILITATOR TIP: Everything a facilitator needs (a checklist for before the day, supplies, Zoom set-up, a 90-minute and a 120-minute timing plan, and the printable handouts in English and Spanish) is in the facilitator section, {ui:customize} → {ui:prepare}. Those pages are never projected, so the show ends on the credits. To print the handouts: {ui:customize} → {ui:prepare} → {ui:print}. Read the section before the day. Anyone the host trusts can give this presentation: the notes are written so a member can read them almost word for word.
      UPDATE: the bracketed presenter, date and host line: {ui:customize} → {ui:your_details}. "Current as of" fills in by itself.
      TRANSITION: 'Let's start the way we start our meetings, with a few words about who we are and what today is.'
    version_notes:
      short: "90-MINUTE PLAN: welcome, Preamble, safe room and agenda take about 7 minutes (9 in the full plan)."

  - id: "welcome"
    layout: "bullets"
    eyebrow: "Welcome"
    title: "Welcome: you belong here"
    items:
      - "No writing experience needed: just willingness and a story"
      - "Hands-on: four short writing exercises, with sharing in pairs (always optional)"
      - "Write in English for Grapevine, {lang:es}_en español para La Viña_{/lang}"
      - "Presented by the NETA 65 Grapevine & La Viña Committee, **not** an official AA Grapevine, Inc. presentation"
      - "We share experience and suggestions; what you do with them is up to you"
    takeaway: "Everyone here has a story that someone else needs to read."
    minutes: 2
    version_minutes: { short: 1 }
    notes: |
      SAY: Whether you've written a dozen stories or you haven't picked up a pen since school, you are in the right place. I want to be plain about two things. First, this workshop is put on by our Area committee. We're trusted servants, not experts, and we don't speak for AA Grapevine, Inc. or for its editors. What you'll hear about how the magazines work comes from their own published guidelines, and I'll show you where to check it for yourself. Second, nobody has to read anything aloud today. When we share in pairs, you can always pass. If you write in Spanish, wonderful: La Viña takes stories in Spanish, and Grapevine takes them in English.
      ASK: Show of hands: who has read a story in Grapevine or La Viña that stayed with you? And who has ever thought, 'I could have written that'? Hold on to that thought: it's why you're here.
      FACILITATOR TIP: In a bilingual room, seat Spanish-speaking writers near each other so pairs can share in Spanish, and invite a bilingual member to help with the prompts. Never single out a newcomer; let people volunteer.
      TRANSITION: 'Let's open with a moment of silence, followed by the AA Preamble.'

  - id: "preamble"
    layout: "quote"
    eyebrow: "Welcome · Opening"
    title: "We open with the AA Preamble"
    quote: |-
      Alcoholics Anonymous® is a fellowship of people who share their experience, strength and hope with each other that they may solve their common problem and help others to recover from alcoholism.
      The only requirement for membership is a desire to stop drinking. There are no dues or fees for A.A. membership; we are self-supporting through our own contributions.
      A.A. is not allied with any sect, denomination, politics, organization or institution; does not wish to engage in any controversy; neither endorses nor opposes any causes.
      Our primary purpose is to stay sober and help other alcoholics to achieve sobriety.
    credit: "Copyright © by AA Grapevine, Inc.; reprinted with permission."
    minutes: 2
    notes: |
      SAY: Please join me in a moment of silence. (Pause.) Would someone be willing to read the AA Preamble for us? (Invite a volunteer, or read it yourself.) Thank you. A little history that fits today: the Preamble first appeared in the Grapevine in June 1947, and it was written by a Grapevine editor. So the words we open most meetings with came out of the same magazine we're going to write for.
      DO: Leave the slide up while it is read. Read the text exactly as shown; do not shorten it. The credit line stays on the slide.
      FACILITATOR TIP: Follow the host group's custom. If the group opens with the Serenity Prayer, or with the Preamble read from its own card, do that and skip this slide. The Preamble's wording here is the 2021 revision ('a fellowship of people').
      TRANSITION: 'Before we write a word, let's agree on how we'll keep this room safe.'

  - id: "safe-room"
    layout: "bullets"
    eyebrow: "Welcome"
    title: "A safe room for writing and sharing"
    items:
      - "**What is shared here stays here:** in the room, in pairs, in breakout rooms"
      - "No photos, screenshots or recordings of anyone, in the room or on Zoom"
      - "On Zoom: first name and last initial; cameras are optional"
      - "Sharing is optional: you can always pass"
      - "In pairs: listen without fixing; afterwards, speak only about your own writing"
      - "Your draft is yours: only you decide whether to send it"
    source: "“…taking pictures or screenshots is not in keeping with anonymity principles.” Reprinted from _Anonymity — Our Spiritual Foundation_ (P-47), p. 12, with permission of Alcoholics Anonymous World Services, Inc."
    minutes: 3
    version_minutes: { short: 2 }
    notes: |
      SAY: Today we're going to write about real lives: ours, and sometimes the people in them. So we need the same safety we have in a meeting. What you hear today stays here, and that includes what your partner reads to you in the pair exercises. Please don't take photos, screenshots or recordings of anyone, in the room or on the screen; AA's pamphlet on anonymity makes the same point about online meetings. If you'd like the slides, there's no need to photograph the screen: they're posted on our committee website, and the handouts are yours to keep. When you share in pairs, you're a listener, not an editor: no advice, no fixing. When we talk as a whole room afterwards, speak about your own writing only, never about what your partner wrote.
      ASK: Is everyone comfortable with these? Is there anything this group would like to add? (This is the room's own conscience; accept any suggestion that keeps people safe.)
      FACILITATOR TIP: On Zoom, say the no-screenshot reminder out loud and also paste it in the chat. Repeat it privately by chat to anyone who joins late. Confirm the meeting is not being recorded. The quotation at the bottom is A.A.W.S. material; keep its credit line with it if you edit the slide.
      TRANSITION: 'Here's how we'll spend our time together.'

  # The deck's last row read "Questions and closing (we finish by 1:55)": the finishing time is its own row here,
  # worked out like the others (the credits slide starts when the workshop ends), so it stays right in every version.
  - id: "agenda"
    layout: "agenda"
    eyebrow: "Welcome"
    title: "Our time together"
    items:
      - { time: "0:00", title: "Welcome, opening and a safe room", from: "title" }
      - { time: "0:09", title: "Why we write · what the magazines publish · current themes", from: "part-1" }
      - { time: "0:27", title: "Exercise 1: a warm-up", from: "exercise-1" }
      - { time: "0:37", title: "What makes a strong story · Exercise 2", from: "part-4" }
      - { time: "1:02", title: "Break", from: "break" }
      - { time: "1:09", title: "Anonymity in your writing · Exercise 3", from: "part-5" }
      - { time: "1:30", title: "Revise (Exercise 4) · how to submit or record your story", from: "part-6" }
      - { time: "1:48", title: "Questions and closing", from: "self-support" }
      - { time: "1:55", title: "We finish", from: "credits" }
    minutes: 1
    # The 90-minute plan's agenda: its own times (the player works them out from `from` in any case), and "Revise"
    # without Exercise 4, which that version leaves out. Change a row in both lists.
    version_fields:
      short:
        items:
          - { time: "0:00", title: "Welcome, opening and a safe room", from: "title" }
          - { time: "0:07", title: "Why we write · what the magazines publish · current themes", from: "part-1" }
          - { time: "0:19", title: "Exercise 1: a warm-up", from: "exercise-1" }
          - { time: "0:27", title: "What makes a strong story · Exercise 2", from: "part-4" }
          - { time: "0:47", title: "Break", from: "break" }
          - { time: "0:52", title: "Anonymity in your writing · Exercise 3", from: "part-5" }
          - { time: "1:09", title: "Revise · how to submit or record your story", from: "part-6" }
          - { time: "1:18", title: "Questions and closing", from: "self-support" }
          - { time: "1:24", title: "We finish", from: "credits" }
    # DO: the deck said breakout rooms "will open automatically" (a word the site never uses).
    notes: |
      {not:short} SAY: Here's the plan. We'll start with why we write and what Grapevine and La Viña actually publish, including the themes the editors are asking for right now. Then we write: four short exercises, each one building on the last, with a break in the middle. Between exercises I'll share a few ideas about what makes a story strong, how to protect anonymity on paper, and how to send your story in when you're ready. We'll leave time for questions at the end, and we'll finish on time.
      {only:short} SAY: Here's the plan. We'll start with why we write and what Grapevine and La Viña actually publish, including the themes the editors are asking for right now. Then we write: three short exercises, each one building on the last, with a break in the middle, and a fourth one to do at home. Between exercises I'll share a few ideas about what makes a story strong, how to protect anonymity on paper, and how to send your story in when you're ready. We'll leave time for questions at the end, and we'll finish on time.
      DO: Point out where the restrooms and coffee are. On Zoom, explain that breakout rooms will open on their own and close with a one-minute warning.
      FACILITATOR TIP: The times are minutes from the start, so they work for any start time; write clock times next to them on a printed copy if you like. If you only have 90 minutes, choose the 90-minute version ({ui:customize} → {ui:version}): Exercise 4 is done at home and the break is five minutes.
      UPDATE: nothing to change by hand: the times follow the version you present and the slides you switch off ({ui:customize} → {ui:slides}).
      TRANSITION: 'So, why write at all?'
    version_notes:
      short: "90-MINUTE PLAN: the times on this slide are the 90-minute plan's. Exercise 4 is done at home (under 'Revise', show the revision checklist instead), the break is about five minutes, and the plan leaves a few minutes to spare in a 90-minute slot."

  # ---------------------------------------------------------------- Part 1 · Why we write (pptx 6–9)
  - id: "part-1"
    layout: "section"
    number: 1
    accent: "gv"
    title: "Why we write"
    subtitle: "Our meeting in print, and Twelfth Step work on paper"
    minutes: 0.5
    notes: |
      SAY: Before we pick up our pens, let's take a few minutes on why this matters. Some of you have read these magazines for years; some of you may be holding one for the first time. Either way, I hope you'll leave seeing them a little differently: not as something other people write, but as something you can be part of.
      DO: If you brought current issues of Grapevine and La Viña, hold them up now and pass them around. Hold up the printed issue rather than showing a cover on screen: the covers are AA Grapevine's artwork.
      TRANSITION: 'Let's start with where the magazines came from.'
    version_notes:
      short: "90-MINUTE PLAN: Parts 1–3 (up to the first exercise) take about 12 minutes (18 in the full plan). Trim the talking, not the writing time: if you are running short, trim the slides in Parts 1 and 2."

  - id: "meeting-in-print"
    layout: "bullets"
    title: "Our meeting in print"
    items:
      - "Grapevine: monthly, in English, since **June 1944**"
      - "La Viña: every two months, in Spanish, since **1996**"
      - "In the 1940s, members serving overseas in the armed forces called it their _meeting in print_"
      - "Almost every story is written by an AA member: people like us"
      - "Recognized by the General Service Conference as _the international journal of Alcoholics Anonymous_ (1986); the recognition extends to La Viña"
      - "Stories are members' experience, not statements of AA policy"
    source: "Sources: aagrapevine.org/history-aa-grapevine; P-52 (2026); The A.A. Service Manual, 2024–2026, pp. 81–85."
    minutes: 2
    version_minutes: { short: 1 }
    notes: |
      SAY: The first Grapevine came out in June 1944. It was started by six members in the New York area, and it went to every AA group, about 300 at the time, and to every AA member known to be serving overseas in the armed forces. Those members wrote back, and each month a full page printed their letters. They began calling the Grapevine their 'meeting in print', and both magazines still carry that phrase. La Viña followed in 1996, so Spanish-speaking members could have a meeting in print in their own language. Here is what I want you to notice: almost everything in both magazines is written by AA members. Not professionals. People like us. And the editors decide what goes in each issue; what you read there is members' experience, not AA policy. That freedom is exactly what makes room for your story.
      ASK: How did you first come across Grapevine or La Viña? (Take one or two answers.)
      FACILITATOR TIP: Say 'recognized by the Conference as the international journal of AA', not 'Conference-approved': a monthly magazine can't go through the yearly approval process, which is why the Conference recognized it this way in 1986.
      TRANSITION: 'So why would any of us sit down and write for it?'

  - id: "twelfth-step-work"
    layout: "columns"
    style: "cards"
    title: "Writing is Twelfth Step work"
    columns:
      - heading: "Carries the message"
        text: "A story written today may reach someone years from now: in a prison, a hospital, a library, at a kitchen table at 2 a.m."
      - heading: "Helps the writer"
        text: "Putting experience on paper is a lot like a good inventory: clarity, gratitude and fresh insight."
      - heading: "Every voice is needed"
        text: "The magazines pay no writers. They depend on members' stories: newcomers and longtime members, English and Spanish."
    takeaway: "Your experience, strength and hope, for someone you will never meet."
    minutes: 2
    version_minutes: { short: 1 }
    notes: |
      SAY: When we write a story, we are doing Twelfth Step work. A story you write today may be read years from now by someone in a prison cell, a hospital bed, a public library, or at a kitchen table at two in the morning, someone who will never walk into your home group. Writing also does something for the writer. Many of us find that putting our experience on paper works a lot like an inventory: things get clearer, and we end up more grateful than when we started. And the magazines need us. They can't pay for stories; they depend on members willing to share, and they're richer when they sound like all of us: newcomers and old-timers, big cities and small towns, English and Spanish.
      ASK: Has a story ever reached you at exactly the right moment? (If you have one, share it in a sentence or two, with no names, then invite one person from the room.)
      FACILITATOR TIP: Keep your own share short. The point of this slide is the room's willingness, not the presenter's story.
      TRANSITION: 'And if you're thinking, "but I'm not a writer", this next one is for you.'

  # The deck's quotation slides have a grape quote mark (kit.py's quote(), accent="grape"), whatever the part.
  - id: "not-a-writer"
    layout: "quote"
    accent: "grape"
    title: "You don't need to be a writer"
    quote: "A.A. members are encouraged to submit articles even though they may think their grammar and spelling aren't perfect."
    credit: "— Reprinted from _The A.A. Service Manual_, 2024–2026 Edition, p. 85, with permission of Alcoholics Anonymous World Services, Inc."
    minutes: 2
    version_minutes: { short: 1 }
    # SAY: the deck says "the editors' job"; the site's wording rules never use "job" (→ "task").
    notes: |
      SAY: This is from The A.A. Service Manual, and I love that it's in there at all. Grammar and spelling are the editors' task, not yours. If you have ever written a Fourth Step, a note to your sponsor, or an email, you can write a story. La Viña says the same thing in its own guidelines: you don't need to be an experienced writer; the only requirement is that you're an alcoholic in recovery. What the editors need from you is honesty, not polish.
      ASK: What most often stops you from writing? (Take two or three answers: time, fear, 'my story isn't interesting'. Answer each one kindly: the exercises today take minutes, not hours; nobody sees your draft unless you choose; and every story helps someone.)
      FACILITATOR TIP: If someone says their story is 'boring', remind them that a reader in a hospital or a prison is looking for someone like them, not for drama.
      TRANSITION: 'Now let's look at what the two magazines actually publish.'

  # ---------------------------------------------------------------- Part 2 · What Grapevine and La Viña publish (pptx 10–15)
  - id: "part-2"
    layout: "section"
    number: 2
    accent: "lv"
    title: "What Grapevine and La Viña publish"
    subtitle: "Stories, departments, short pieces, length and tone"
    minutes: 0.5
    notes: |
      SAY: Knowing what the editors look for saves a lot of guesswork. In the next few slides I'll go through the kinds of stories each magazine prints, the regular sections you can write for, a few short pieces that make an easy first submission, how long a story should be, and what they don't publish.
      DO: Keep a copy of each magazine open to its table of contents, so you can show a department page if someone asks.
      TRANSITION: 'Two magazines, one message.'

  # The deck colours a two-column slide (its eyebrow, its takeaway) with its first column's colour: Grapevine blue
  # here and on the next slide, in La Viña's part.
  - id: "two-magazines"
    layout: "columns"
    style: "panels"
    accent: "gv"
    title: "Two magazines, one message"
    columns:
      - heading: "Grapevine: in English"
        accent: "gv"
        items:
          - "Monthly"
          - "First-person stories of experience with alcoholism and AA"
          - "An article on a Step and on a Tradition in every issue"
          - "Letters, opinions, jokes, photos of meeting places"
      - heading: "La Viña: {lang:es}en español{/lang}"
        accent: "lv"
        items:
          - "Every two months"
          - "Testimonies told as in a meeting: what it was like, how you came to AA, what it is like now"
          - "Original stories in Spanish, plus some translated from Grapevine"
          - "Photos of meeting rooms and favorite jokes, too"
    source: "Sources: both magazines' guidelines for contributors; P-52 (2026); La Viña News (Sept.–Oct. 2026)."
    minutes: 1.5
    version_minutes: { short: 1 }
    notes: |
      SAY: Grapevine comes out every month in English. Most of what it prints is first-person stories: members' own experience with alcoholism and with AA. Every issue carries an article on a Step and an article on a Tradition. La Viña comes out every two months in Spanish. It asks for your testimony told the way you'd tell it in a meeting: what your life was like, how you came to AA, and what it's like now. La Viña's guidelines even call your article a Twelfth Step. Both magazines also print letters, jokes and photos of meeting places.
      ASK: Who here plans to write in Spanish? In English? (A show of hands; it helps you pair people for the exercises.)
      FACILITATOR TIP: If a bilingual member asks which magazine to choose: write in the language you think and pray in. A story goes to one magazine, in its own language.
      TRANSITION: 'Both magazines have regular sections, and each one is a door for your story.'

  - id: "departments"
    layout: "columns"
    style: "panels"
    accent: "gv"
    title: "Departments: a home for your story"
    columns:
      - heading: "Grapevine departments"
        accent: "gv"
        text: "Emotional Sobriety · Sponsorship · Newcomers · Old-Timers · Young & Sober (YES) · Spiritual Awakenings · Home Group · Into Action · Our Personal Stories · **Steps and Traditions**"
      - heading: "Some La Viña sections"
        accent: "lv"
        text: "**{lang:es}_Pasos y Tradiciones_{/lang} (Steps and Traditions)** · {lang:es}_Veteranos_{/lang} (old-timers) · {lang:es}_Jóvenes en AA_{/lang} (young people in AA) · {lang:es}_Servicio_{/lang} (service)"
    takeaway: "The editors always need stories on Steps 4–12 and on every Tradition."
    source: "Sources: aagrapevine.org/contribute; La Viña's {lang:es}Pautas para Colaborar{/lang} (2020)."
    minutes: 1.5
    version_minutes: { short: 1 }
    notes: |
      SAY: Each issue is organized into departments, and they're a great way to find your angle. If you've been sober a few months, Newcomers might be your place. If your sponsor changed your life, Sponsorship. YES stands for Youth Enjoying Sobriety, the young people's section. La Viña has its own sections, among them Steps and Traditions, {lang:es}Veteranos{/lang} for long-time members, {lang:es}Jóvenes en AA{/lang} for young people, and {lang:es}Servicio{/lang}. Notice the takeaway: Grapevine's editors say they always need stories on Steps Four through Twelve and on every Tradition. Those are harder to write, which is exactly why they're needed. Your experience with Tradition Seven at a group business meeting is a story.
      ASK: Looking at these, which one could you write for today? Just think of it; you'll use it in a few minutes.
      FACILITATOR TIP: These are the departments named on aagrapevine.org and in La Viña's guidelines as of October 2026. Sections change from time to time; the current issue's table of contents is the best check.
      TRANSITION: 'If a whole story feels like too much, start small.'

  - id: "short-pieces"
    layout: "bullets"
    title: "Short pieces: an easy first step"
    items:
      - "**Dear Grapevine:** a letter about a story you read"
      - "**What's On Your Mind?:** your opinion on meetings, sponsorship, the Traditions, AA life"
      - "**At Wit's End:** clean AA jokes and funny sober moments"
      - "**If Walls Could Talk:** photos of your meeting place with no people in them, with the group's name and location"
    takeaway: "La Viña welcomes meeting-room photos and favorite jokes too."
    source: "Sources: aagrapevine.org/contribute and guidelines; GVR Workbook (2026), pp. 36–37; La Viña News (Sept.–Oct. 2026)."
    minutes: 1.5
    version_minutes: { short: 1 }
    notes: |
      SAY: Not everyone's first piece has to be a full story. Grapevine has short sections that come almost entirely from readers. Dear Grapevine is letters: maybe a story in last month's issue hit home and you want to say why. What's On Your Mind? is for opinions about meetings, sponsorship, the Traditions, AA life. At Wit's End is jokes and funny sober moments; there's even a monthly online cartoon caption contest. And If Walls Could Talk is photos of meeting places, the rooms, never the people, with the group's name and location. La Viña asks for meeting-room photos and favorite jokes too. A letter or a photo is a real contribution to our meeting in print.
      ASK: Does your home group have a meeting room with a story? A coffee pot that has seen forty years of meetings? That's an If Walls Could Talk photo.
      FACILITATOR TIP: Photos and art go in as high-resolution JPEG files, 300 dpi. Stress the anonymity rule: nobody recognizable in a photo. Grapevine also runs a yearly wall-calendar photo contest; the current deadline is at aagrapevine.org/photocontest.
      TRANSITION: 'How long should a story be?'

  - id: "length-format"
    layout: "table"
    title: "Length, format and tone"
    header: ["", "Grapevine", "La Viña"]
    rows:
      - ["Length", "300–1,800 words (3–5 double-spaced typed pages); short anecdotes welcome too", "5–6 double-spaced typed pages"]
      - ["Handwritten", "Clear, on one side of the paper", "Legible, one side of the page, space between lines"]
      - ["Language", "English", "Spanish"]
      - ["Tone", "Like a share at your home group: first person, honest, hopeful", "The same: told as in a meeting"]
    widths: [1.5, 3.2, 2.6]
    first_col_bold: true
    source: "Sources: aagrapevine.org/guidelines-contributing-grapevine; aalavina.org/guia-para-contribuciones."
    minutes: 1.5
    version_minutes: { short: 1 }
    notes: |
      SAY: Grapevine suggests 300 to 1,800 words, which is about three to five double-spaced typed pages, and it also prints one-liners and one-paragraph anecdotes. La Viña asks for five or six double-spaced typed pages. Please notice that the 300-to-1,800-words figure is Grapevine's guideline, not La Viña's. Handwritten is fine for both: write clearly, on one side of the page, and for La Viña leave space between the lines. As for tone, write the way you'd share at your home group: in the first person, honestly, with hope. In our experience, a focused short story is easier to finish and send, so don't worry if yours comes in on the short side.
      DO: If you have a printed story handy, show how long 300 words is: about one typed page, double-spaced.
      FACILITATOR TIP: Today's drafts will be short, and that's fine: Grapevine's own range starts at 300 words. Don't speak for the editors about what they choose; say what members have found.
      TRANSITION: 'And a few things neither magazine publishes.'

  - id: "not-published"
    layout: "bullets"
    title: "What the magazines don't publish"
    items:
      - "Poems, prayers or song lyrics"
      - "Plays, and tributes to individuals"
      - "Anything already published elsewhere"
      - "Material unrelated to AA, or against AA's principles"
    takeaway: "Have a poem in you? Tell the experience behind it as a story instead."
    source: "Paraphrased from Grapevine's Guidelines for Contributing (rev. April 2019) and La Viña's {lang:es}Pautas para Colaborar{/lang} (2020)."
    minutes: 1
    version_minutes: { short: 0.5 }
    notes: |
      SAY: This surprises people every time: neither magazine publishes poems. Grapevine's guidelines also rule out prayers, song lyrics, plays and tributes to individuals; La Viña's rule out poems, songs and tributes. Neither prints something already published elsewhere, and neither prints material that has nothing to do with AA or goes against its principles. So send only original work you wrote yourself. If you're someone who writes poetry, don't give it up: take the experience behind the poem and tell it as a story. That's usually where the gold is anyway.
      ASK: Any questions so far about what to send? (Keep answers short; the full Q&A is at the end.)
      FACILITATOR TIP: 'Tributes to individuals' means a piece praising a person, for example a memorial to a sponsor. A story about what your sponsor shared with you (or showed you), told as your own experience, is different and welcome.
      TRANSITION: 'Now, what are the editors asking for right now?'

