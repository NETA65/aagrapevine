      FACILITATOR TIP: Walk the room quietly (or watch the Zoom chat) for anyone who looks stuck, and offer a prompt: 'Where were you sitting?' 'What did the room smell like?' Writers who need to talk instead of write can record their story later (Audio Project, coming up).
      {not:short} EN ESPAÑOL (read it aloud or paste it in the chat): {lang:es}Elige un tema: uno del calendario de La Viña (diapositiva {slide:lv-themes}), un tema sugerido de La Viña (por ejemplo, «Mi Primer Paso») o cualquier Paso o Tradición. Elige un solo momento: una hora, una noche, una llamada. Escribe 10 minutos: dónde estás, qué ves y oyes, algo que alguien dijo, qué cambió en ti. Empieza en medio de la acción, por ejemplo: «Sonó el teléfono a las tres de la mañana…». En parejas (2 minutos cada uno): lee tu escena; tu compañero o compañera menciona un detalle que se le quedó grabado. Para compartir: ¿Qué dejaste fuera, y le hace falta a tu historia?{/lang}
      {only:short} EN ESPAÑOL (read it aloud or paste it in the chat): {lang:es}Elige un tema: uno del calendario de La Viña (diapositiva {slide:lv-themes}), un tema sugerido de La Viña (por ejemplo, «Mi Primer Paso») o cualquier Paso o Tradición. Elige un solo momento: una hora, una noche, una llamada. Escribe 10 minutos: dónde estás, qué ves y oyes, algo que alguien dijo, qué cambió en ti. Empieza en medio de la acción, por ejemplo: «Sonó el teléfono a las tres de la mañana…». En parejas: lee tu escena; tu compañero o compañera menciona un detalle que se le quedó grabado. Para compartir: ¿Qué dejaste fuera, y le hace falta a tu historia?{/lang}
