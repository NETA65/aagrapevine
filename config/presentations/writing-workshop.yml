  # The deck's "Keeping this deck current" page, rewritten for the web: what stays current by itself and what the
  # presenter fills in or checks. Its generator steps (WORKSHOP_DATE, GV_THEMES, LV_THEMES, the audio phones, TIMING,
  # LAST_UPDATED, AS_OF, re-run) and its PowerPoint export tip ("Include hidden slides") were only about rebuilding
  # the .pptx file, so they are gone.
  - id: "keeping-current"
    layout: "bullets"
    facilitator: true
    eyebrow: "For facilitators"
    title: "Keeping this presentation current"
    items:
      - "Themes and deadlines: the theme slides ({slide:gv-themes}, {slide:lv-themes}) come from the committee's website and drop passed deadlines by themselves (check them against aagrapevine.org/contribute and aalavina.org/recursos); the exercise slides ({slide:exercise-1}, {slide:exercise-2}, {slide:exercise-3}) point to them"
      - "Phone lines and addresses: slides {slide:how-to-submit} and {slide:record}, and the Spanish handouts; the two story lines' numbers come from the committee's website and stay current by themselves"
      - "Title slide: your service title, the date, the host, in person or on Zoom ({ui:customize} → {ui:your_details}; your first name only in the notes)"
      - "Agenda times follow the version and the slides you present; the break's return time and the Seventh Tradition line are in {ui:your_details}"
      - "The \"Current as of\" date, and the committee meeting on the Thank-you slide ({slide:thank-you}), fill in by themselves"
      - "Find every item to change: {ui:customize} → {ui:your_details} (an empty blank shows in orange)"
    notes: |
      SAY: Most of this presentation stays true for years. A few things change, and they are all marked. Slides with a 'Current information' eyebrow carry dates, deadlines, phone numbers or addresses; the themes, the deadlines and the two story lines on them come from the committee's website and stay current by themselves. Bracketed text in orange is a blank to fill in each time ({ui:customize} → {ui:your_details}). The themes come from Grapevine's editorial calendar and La Viña's annual themes list; both publish next year's themes early in the year, and the theme slides show them once the committee's website has them. The exercise slides point to the theme slides, so they stay in step with them. Never add prices to a slide: link to the committee's shop page, which updates itself every day.
      DO: To change a slide for your workshop, use {ui:customize} → {ui:edit}: your changes stay on this device, and resetting the slide brings back the committee's version.
      FACILITATOR TIP: Keep the presentation anonymous when you edit it: service titles only, first name and last initial at most, no personal phones or emails, no photos of people, and no Grapevine or La Viña logos, covers or artwork. The notes are public too. The facilitator pages (this section) are never projected.
