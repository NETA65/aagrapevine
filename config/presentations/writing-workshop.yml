    source: "Sources: aagrapevine.org/contact-us; aalavina.org/guia-para-contribuciones."
    minutes: 1.5
    notes: |
      SAY: Writing in English? It goes to Grapevine. The fastest way is the online form at aagrapevine.org/submit-your-story. You can also email it to gveditorial@aagrapevine.org, or mail it to the Editorial Department at 475 Riverside Drive in New York. Writing in Spanish? It goes to La Viña: the online form at aalavina.org/comparte, or email manuscritoslv@aagrapevine.org, or mail it to La Viña at the same address, Suite 1100. Two things: send each story once, by the form or by email but not both, and keep a copy, because manuscripts aren't returned.
      DO: Leave this slide up a little longer; people copy addresses. Tell them it's also on their handout and on the committee's contribute page. Spell the La Viña address aloud, 'manuscritos L V', all one word, with a lowercase L: on screen it can look like a capital I.
      FACILITATOR TIP: For a story in Spanish, the committee gives manuscritoslv@aagrapevine.org; La Viña's web form, aalavina.org/comparte, works too. A recorded story sent as a file goes to the same address (slide {slide:record}). Do not use 'manuscritos@aagrapevine.org' from an older committee deck: it is wrong. If someone handwrote their story today and wants to mail it, the addresses are on the handout.
      UPDATE: check the addresses on aagrapevine.org/contact-us and aalavina.org/guia-para-contribuciones once a year; if one changes, edit this slide, the 'Record your story' slide ({slide:record}) and the Spanish handout ({ui:customize} → {ui:edit}).
      TRANSITION: 'What should you include?'
    version_notes:
      short: "90-MINUTE PLAN: How to submit through Where to find it all take about 6 minutes (8 in the full plan)."

  - id: "what-to-include"
    layout: "bullets"
    title: "What to include"
    items:
      - "Your story with a title: typed, or clearly handwritten on one side of the page"
      - "Your full name, address, phone and email (for the editors only)"
      - "How your name should appear: first name and last initial, initials only, or _Anonymous_"
      - "Writing for a theme? Mention which one"
      - "Photos or art: high-resolution JPEG, 300 dpi"
      - "Your own, unpublished work, not sent anywhere else"
    source: "Sources: aagrapevine.org (guidelines; submit-your-story); aalavina.org/guia-para-contribuciones."
    minutes: 1.5
    version_minutes: { short: 1 }
    notes: |
      SAY: Here's what goes with your story. A title. Your full name, address, phone and email, which, again, the editors keep to themselves. How you'd like your name to appear. If you wrote for a theme, mention it. Photos and art go in as high-resolution JPEGs, 300 dpi. On Grapevine's online form you confirm that the work is your own and accept a copyright transfer: if your story is accepted, its copyright passes to AA Grapevine, Inc. La Viña sends a letter to sign the copyright release if your story is accepted.
      ASK: Anyone planning to mail a handwritten story? (Make sure they have the address from the handout.)
      FACILITATOR TIP: Each writer sends their own story, with their own contact details. Never send a story for someone else without their consent, and the committee does not collect stories to send in bulk. Grapevine's form also asks you to confirm the story hasn't been published and isn't being considered anywhere else. La Viña's web form also takes photos and illustrations.
      TRANSITION: 'What happens after you send it?'

  # Grapevine blue in the deck: the colour of its first column (eyebrow and takeaway).
  - id: "after-you-send"
    layout: "columns"
    style: "panels"
    accent: "gv"
    title: "After you send it"
    columns:
      - heading: "Grapevine"
        accent: "gv"
        items:
          - "You hear back **only if** your story is selected"
          - "No rejection letters; stories stay on file"
          - "At least three staff read each story"
      - heading: "La Viña"
        accent: "lv"
        items:
          - "An acknowledgment for every submission"
          - "If chosen: a copyright release to sign, and the publication date"
          - "A free copy of the issue with your story"
    takeaway: "We can't promise publication: the editors decide."
    minutes: 1.5
    version_minutes: { short: 1 }
    notes: |
      SAY: Here's what to expect. Grapevine's editors contact you only if your story is selected. There are no rejection letters; stories are kept on file, and some are used in later issues. At least three staff members read every story. La Viña sends every writer an acknowledgment that the story arrived, and if yours is chosen, a letter with the copyright release and the date it will appear. Both magazines receive several hundred submissions a month, so the waiting is normal. I can't promise anyone publication; nobody here can. The editors decide, and the Conference Charter protects their right to accept or reject material. Our part is to write it and send it. After that, we let it go.
      ASK: How might it feel to wait months without hearing anything? (Invite one answer; suggest writing the next story while you wait.)
      FACILITATOR TIP: If someone is published, the committee loves to hear about it: published members can tell us at grapevine@neta65.org. We mention them only as the magazine printed them, and only with their permission. Stories are chosen after discussion and the consensus of the editorial staff (P-52).
      TRANSITION: 'A word on editing and rights.'

  - id: "editing-rights"
    layout: "bullets"
    title: "Editing, rights and thanks"
    items:
      - "Stories are lightly edited for clarity, style and length"
      - "Once a story is published, it isn't changed"
      - "If a story is accepted, its copyright passes to AA Grapevine, Inc."
      - "No payment: published writers receive a free copy of the issue"
      - "The editors choose; the Conference Charter protects their right to accept or reject"
    source: "Sources: Grapevine Editorial Policy (aagrapevine.org); aagrapevine.org/submit-your-story; The A.A. Service Manual, 2024–2026, p. 81; aalavina.org/guia-para-contribuciones."
    minutes: 1
    version_minutes: { short: 0.5 }
    notes: |
      SAY: Some writers worry their story will be rewritten. Grapevine's editorial policy says stories are edited lightly, for clarity, style and length, and they aren't changed once they're published. When a story is accepted, its copyright goes to AA Grapevine, Inc. Grapevine's and La Viña's books are collections of stories first published in their pages, so a story can keep carrying the message long after its issue. There's no payment. Published writers receive a copy of the issue. That fits who we are: the story is a gift, the same way a share is.
      ASK: Any questions about editing or rights? (If a question goes beyond these points, say you don't know and suggest asking the magazine directly; don't guess.)
      FACILITATOR TIP: For questions you can't answer, the Grapevine office's customer service is customerservice@aagrapevine.org (in Spanish, preguntas@aagrapevine.org).
      TRANSITION: 'And if writing isn't your thing, you can talk instead.'

