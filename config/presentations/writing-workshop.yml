      - ["Mail", "Grapevine, Editorial Dept.\n475 Riverside Drive\nNew York, NY 10115", "La Viña\n475 Riverside Drive, Suite 1100\nNew York, NY 10115"]
    widths: [1.1, 3.4, 3.3]
