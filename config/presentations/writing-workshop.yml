# =====================================================================
#  "Grapevine and La Viña Writing Workshop" — the committee's writing
#  workshop as a web presentation (/orientation/#presentations, "Workshop
#  presentations"). Read by src/_data/presentations.js, checked by
#  tests/test_presentations.py (run it on this file after every change).
#
#  Source: the PowerPoint deck built 2026-10-01 by
#  aagrapevine-ops/decks/deck3_writing-workshop.py (59 slides, the last 11
#  hidden: the facilitator section and the printable handouts). Every slide
#  and every speaker note is here, in the same order and the same words.
#  Only what the web player does differently was adapted:
#  - Facts that change come from the site's data at every build: the two
#    theme tables are `live` deadline lists (passed deadlines drop off by
#    themselves), the committee meeting and the two story lines (Grapevine's
#    Audio Project, La Viña's Graba tu historia) are {live:…}, "as of October
#    2026" markers are gone (the player shows "Current as of <date>").
#  - The deck's orange [fill-ins] are presenter blanks ({fill:…}, Customize
#    → Your details). A first name appears only in the notes (anonymity).
#    The notes name the player's buttons with {ui:…} ("{ui:customize} →
#    {ui:your_details}"), so the Spanish page shows its own names for them.
#  - Spanish words inside the English slides and notes (La Viña's sections
#    and topics, the "EN ESPAÑOL" prompts) are {lang:es}…{/lang}, so a
#    screen reader reads them in Spanish.
#  - Each note's "TIME:" line is `minutes` (the player writes the TIME line
#    for the version being presented); an exercise's split of its minutes
#    stays as "TIME SPLIT:" (the full plan's: see the 90-minute plan below).
#  - The hidden facilitator section is `facilitator: true` (Customize →
#    Prepare); the six printable pages are also `handout: true` (Prepare →
#    Print; they print landscape, as in the deck), and so are the two shown
#    slides the deck had printed for everyone (the revision checklist, "How
#    to submit"). The Spanish handouts stay in Spanish, as in the deck,
#    marked `lang: "es"`.
#  - The deck's 90-minute plan (its timing page) is the "short" version:
#    Exercise 4 is done at home (left out), the slides that take less time
#    have `version_minutes.short`, so the agenda and the TIME lines follow
#    that plan, and each part's 90-minute target is a `version_notes.short`
#    line on the slide that starts it. What the room sees follows it too
#    (`version_fields.short`: the exercises' time cards, the break, the
#    agenda's "Revise" row), and a notes line only one plan needs starts with
#    {not:short} / {only:short}. The TIME line is the one count of a slide's
#    minutes: the 90-minute notes give no other (the deck decided only each
#    exercise's total there, so its split is the full plan's alone).
#  - Colours: a part's colour is its section slide's `accent`, as in the
#    deck; a slide the deck drew in another colour has its own `accent` (the
#    exercises' green, the quotations' and the Q&A's grape, La Viña's
#    orange …).
#  - Facts that change are never written into a sentence as a date: the
#    notes give the next deadline as {live:…}, or say what to do if a theme
#    is still on the slide, and read well when a fact has nothing to say.
#  - Wording rules: a few of the deck's words were changed (automatically,
#    job, lesson, taught, homework, PDF) — see the comments where it
#    happened.
# =====================================================================

id: "writing-workshop"
order: 3
lang: "en"
title: "Grapevine and La Viña Writing Workshop"
short: "Writing Workshop"
eyebrow: "Writing Workshop"
footer: "NETA 65 Grapevine & La Viña Committee · {live:panel}"
minutes: 115            # the deck's full plan: 115 minutes in a two-hour slot (its timing page)
icon: "pen-line"
tone: "lv"
drive_title: "Grapevine and La Viña Writing Workshop"

card:
  title:
    en: "Grapevine and La Viña Writing Workshop"
    es: "Taller de escritura de Grapevine y La Viña"
  summary:
    en: "A hands-on workshop for putting our experience, strength and hope on paper: four short writing exercises with sharing in pairs, what Grapevine and La Viña publish, their current themes and deadlines, anonymity in your writing, and how to send or record your story."
    es: "Un taller práctico para poner por escrito nuestra experiencia, fortaleza y esperanza: cuatro ejercicios breves de escritura con momentos para compartir en parejas, lo que publican La Viña y Grapevine, sus temas y fechas límite actuales, cómo cuidar el anonimato al escribir y cómo enviar o grabar tu historia."
  audience:
    en: "AA members who want to write their story or a short piece, in English for Grapevine or in Spanish for La Viña. A group or district hosts it, in person or on Zoom."
    es: "Miembros de AA que quieren escribir su historia o un texto breve, en español para La Viña o en inglés para Grapevine. Lo organiza un grupo o un distrito, en persona o por Zoom."

presets:
  - id: "full"
    label: { en: "Full workshop (about 2 hours)", es: "Taller completo (unas 2 horas)" }
    minutes: 115
  # The deck's "Short: 84 (+6 spare)" plan for a 90-minute slot (its timing page): Exercise 4 leaves the show (the
  # deck's "homework": done at home), the break takes 5 minutes, and the rest comes from trimming the talking, never
  # the writing.
  # The slides that take less time in it have `version_minutes.short`, so each segment adds up to the plan's
  # (welcome: 7, Parts 1–3: 12, Exercise 1: 8, Part 4: 8, Exercise 2: 12, break: 5, Part 5: 5, Exercise 3: 12,
  # checklist: 3, submit and record: 6, closing: 6) and the agenda shows the plan's times. `minutes` is the plan's
  # 84, as the full version's is its 115 in a two-hour slot.
  - id: "short"
    label: { en: "90-minute workshop (Exercise 4 at home)", es: "Taller de 90 minutos (el ejercicio 4, en casa)" }
    minutes: 84
    hide: ["exercise-4"]
    note:
      en: "The deck's 90-minute plan: Exercise 4 is done at home and the break is about five minutes; the rest of the time comes from trimming the talking, never the writing. The agenda, the exercises' time cards, the break and the times in the notes follow this plan, and each part's target time is in the notes."
      es: "El plan de 90 minutos de la presentación: el ejercicio 4 se hace en casa y el descanso dura unos cinco minutos; el resto del tiempo sale de hablar menos, nunca de escribir menos. La agenda, el tiempo de cada ejercicio, el descanso y los tiempos de las notas siguen este plan, y el tiempo de cada parte está en las notas."

