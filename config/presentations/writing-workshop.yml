  # ---------------------------------------------------------------- Part 6 · Revise and send (pptx 35–43)
  - id: "part-6"
    layout: "section"
    number: 6
    accent: "vine"
    title: "Revise and send"
    subtitle: "A checklist, a submission, a recording, and then letting it go"
    minutes: 0.5
    notes: |
      {not:short} SAY: You now have three pieces of writing, and at least one of them has a story in it. In this last part we'll go over a checklist for revising, do one last short exercise, and then cover exactly how to send your story to Grapevine or La Viña, how to record it instead if you'd rather talk than write, and what happens after you hit send.
      {only:short} SAY: You now have three pieces of writing, and at least one of them has a story in it. In this last part we'll go over a checklist for revising, which you can use at home for one last short exercise, and then cover exactly how to send your story to Grapevine or La Viña, how to record it instead if you'd rather talk than write, and what happens after you hit send.
      TRANSITION: 'Here's the checklist; it's also on your handout.'
    version_notes:
      short: "90-MINUTE PLAN: this section and the checklist take about 3 minutes, and Exercise 4 is done at home (it is left out of this version): show the revision checklist and invite people to use it before they send their story."

  # The deck's tick boxes (☐) are `checklist: true`, here and on the Spanish 'lista-de-revision'. Shown AND printed:
  # the deck's notes have it printed for everyone as the revision handout. In the 90-minute plan it takes Exercise
  # 4's place (the section slide and this one: 3 minutes), so it takes longer there.
  - id: "checklist"
    layout: "columns"
    style: "panels"
    checklist: true
    handout: true
    title: "Revision checklist"
    columns:
      - heading: "The story"
        accent: "vine"
        items:
          - "One moment or turning point"
          - "A first line that starts in the action"
          - "Clear that I'm an alcoholic in AA"
          - "More showing than telling"
          - "Experience, not advice"
          - "Hope: what it's like now"
      - heading: "The details"
        accent: "gv"
        items:
          - "Others: first names, or none"
          - "No outside issues or promotion"
          - "Original and unpublished"
          - "A length that fits the magazine"
          - "A title and my contact details"
          - "Read it aloud, or have a sponsor read it"
    minutes: 1.5
    version_minutes: { short: 2.5 }
    notes: |
      SAY: Here's a checklist for revising. On the left, the story itself: is it one story? Does the first line start in the action? Is it clear early that I'm an alcoholic and an AA member? Am I showing more than telling? Is it my experience, not advice? Is there hope in it? On the right, the details: other people protected, no outside issues or promotion, original work, about the right length, a title, and my contact details for the office. And the last item is the one members swear by: read it aloud, or ask your sponsor or a friend in the program to read it. They'll tell you if it rings true. Then send it.
      DO: Point to the printed checklist. On Zoom, paste the link to this presentation or the committee's contribute page in the chat.
      FACILITATOR TIP: This slide is also the revision handout: print one per person; the Spanish version is with the handouts in the facilitator section ({ui:customize} → {ui:prepare}). Don't let the checklist become a reason not to send: 'good enough and sent' carries the message; 'perfect and in a drawer' doesn't.
      {not:short} TRANSITION: 'Let's use it right now.'
      {only:short} TRANSITION: 'When you're ready, here's where to send it.'
    version_notes:
      short: "90-MINUTE PLAN: Exercise 4 is done at home (it is left out of this version): invite people to use this checklist before they send their story, then go on to how to submit."

  - id: "exercise-4"
    layout: "activity"
    eyebrow: "Exercise 4 of 4"
    title: "Revise and give it a title"
    steps:
      - "Choose your favorite draft from today"
      - "Run the checklist and circle one thing to fix"
      - "Rewrite your first line so it starts in the moment"
      - "Give it a title; write the theme and deadline at the top"
      - "In pairs: read your new first line and title (1 minute each)"
    duration: 8
    materials: ["Your drafts", "Revision checklist handout"]
    takeaway: "**Share back:** What is one next step for your story this week?"
    minutes: 8
    notes: |
      SAY: Last exercise, and it's short. Choose your favorite draft from today. Run down the checklist and circle one thing to fix; just one. Then rewrite your first line so it starts in the moment. Then give your story a title and write the theme and deadline at the top of the page, so future-you knows where it's going. Five minutes. Begin.
      DO: 5-minute timer, then pairs for 1 minute each (Zoom: breakout rooms of two, 3 minutes). Debrief: invite two or three people to say their next step out loud. Let people choose freely; nobody is asked to promise anything.
      FACILITATOR TIP: In the 90-minute plan, skip this exercise (the 90-minute version leaves it out): show the checklist, and invite people to do this at home before they send their story.
      EN ESPAÑOL (read it aloud or paste it in the chat): {lang:es}Elige tu borrador favorito de hoy. Repasa la lista de revisión y encierra en un círculo una sola cosa para mejorar. Vuelve a escribir tu primera línea para que empiece en el momento. Ponle un título y escribe arriba el tema y la fecha límite. En parejas: lee tu nueva primera línea y tu título (1 minuto cada uno). Para compartir: ¿Cuál es un próximo paso para tu historia esta semana? (La lista de revisión en español está en la sección para facilitadores.){/lang}
      TIME SPLIT: 5 writing, 2 in pairs, 1 debrief (10 with the checklist slide).
      TRANSITION: 'When you're ready, here's where to send it.'

  # Shown AND printed: the deck's notes have it printed for everyone, with the story planner and the checklist. Its
