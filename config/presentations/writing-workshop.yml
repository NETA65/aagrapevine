  # The deck's TIMING plan. Each segment's slides add up to its row: `minutes` for the full plan, `version_minutes`
  # (else `minutes`) of the "short" version for the 90-minute one. Change a slide's time and its row together.
  - id: "timing"
    layout: "table"
    facilitator: true
    eyebrow: "For facilitators"
    title: "Timing: about 2 hours, or 90 minutes"
    header: ["Segment (minutes)", "Full: 115", "Short: 84 (+6 spare)"]
    rows:
      - ["Welcome, Preamble, safe room, agenda", "9", "7"]
      - ["Parts 1–3: why we write, what they publish, themes", "18", "12"]
      - ["Exercise 1 · Part 4 (a strong story) · Exercise 2", "35", "28"]
      - ["Break", "7", "5"]
      - ["Part 5 (anonymity) · Exercise 3", "21", "17"]
      - ["Part 6: checklist, Exercise 4, submit, record", "18", "9 (Exercise 4 at home)"]
      - ["Self-support, Q&A, closing", "7", "6"]
    widths: [5.4, 1.2, 3.0]
    first_col_bold: true
    notes: |
      SAY: Two plans. The full plan runs about 115 minutes and leaves a few minutes of slack in a two-hour slot. The 90-minute plan trims the talking, shortens the break to 5 minutes, and leaves Exercise 4 for home: show the revision checklist and invite people to use it before they send their story. Never cut the pair sharing entirely; it's where people discover their story is worth telling. If you are running short, trim the slides in Parts 1 and 2 rather than the writing time. In detail, full (and 90-minute) minutes: Welcome, Preamble, safe room, agenda – 9 (7); Parts 1–3: why we write, what they publish, themes – 18 (12); Exercise 1 (warm-up) – 10 (8); Part 4: what makes a strong story – 11 (8); Exercise 2 – 14 (12); Break – 7 (5); Part 5: anonymity in your writing – 6 (5); Exercise 3 – 15 (12); Revision checklist and Exercise 4 – 10 (3); Submit, record, after you send – 8 (6); Self-support, Q&A and closing – 7 (6).
      DO: Assign one trusted servant to keep time, separate from the presenter.
      FACILITATOR TIP: These minutes match the agenda slide (minutes from the start), the exercises' time cards and the TIME line in each slide's notes, in both plans: choose the version you present ({ui:customize} → {ui:version}), the full plan or the 90-minute one with Exercise 4 left out, and this presentation works the times out for it and for the slides you switch off ({ui:customize} → {ui:slides}). The split of each exercise in its notes (TIME SPLIT) is the full plan's; in 90 minutes, keep the writing time and shorten the pairs and the debrief.
      TRANSITION: The story planner handout.

