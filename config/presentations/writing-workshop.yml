  # The deck draws every exercise in green (kit.py's activity(), accent="vine"), whatever the part.
  - id: "exercise-1"
    layout: "activity"
    accent: "vine"
    eyebrow: "Exercise 1 of 4 · warm-up"
    title: "Warm-up: one fun sober moment"
    steps:
      - "Think of one time you had fun sober: a trip, a game night, a dance, a service event, a belly laugh"
      - "Write for **5 minutes** without stopping. Don't fix anything"
      - "Stuck? Begin with: _The first time I noticed I was having fun sober…_"
      - "In pairs, read one sentence you like (1 minute each), or pass"
    duration: 10
    materials: ["Paper and pen, or your phone", "A timer (the facilitator keeps time)"]
    takeaway: "**Share back:** What surprised you in your own memory?"
    minutes: 10
    version_minutes: { short: 8 }
    # The 90-minute plan's time card. Its TIME SPLIT is the full plan's only: the deck gave the 90-minute plan this
    # exercise's total alone, so that version's notes keep the writing and leave the rest to the presenter (its DO
    # gives the breakout rooms no minutes: change the DO in both lines).
    version_fields:
      short: { duration: 8 }
    # DO: the deck's "opened automatically" → "set to open by themselves" (wording rules).
    notes: |
      SAY: Our first exercise is a warm-up, and it's meant to be fun. As our Big Book puts it, we are not a glum lot. Think of one time you had fun sober: a trip, a game night, a dance, a service event, a moment you laughed so hard you cried. Now write for five minutes without stopping. Don't fix spelling, don't cross anything out, don't worry about where it's going. If you get stuck, write the opening line on the screen and keep going. Ready? Begin.
      {not:short} DO: Start a visible 5-minute timer. Say 'one minute left' at 4 minutes, then 'finish your sentence'. Pair people up (neighbors in the room; on Zoom, breakout rooms of two for 3 minutes, set to open by themselves). Each person reads one sentence they like, or passes. Bring everyone back and take two or three answers to the debrief question, about their own writing only.
      {only:short} DO: Start a visible 5-minute timer. Say 'one minute left' at 4 minutes, then 'finish your sentence'. Pair people up in the time that is left (neighbors in the room; on Zoom, breakout rooms of two, set to open by themselves). Each person reads one sentence they like, or passes. Bring everyone back and take two or three answers to the debrief question, about their own writing only.
      FACILITATOR TIP: The warm-up isn't tied to a deadline. A fun sober story can fit many issues; if someone asks where to send it, point to the next open theme on slides {slide:gv-themes} and {slide:lv-themes}, or to La Viña's suggested topic '{lang:es}Tiempos de fiesta en sobriedad{/lang}', which has no deadline. Write along with the room for the first minute; it makes it easier for others to start.
      EN ESPAÑOL (read it aloud or paste it in the chat): {lang:es}Piensa en una vez que te divertiste en sobriedad: un viaje, una noche de juegos, un baile, un evento de servicio, una carcajada. Escribe 5 minutos sin parar; no corrijas nada. ¿No sabes cómo empezar? Comienza así: «La primera vez que me di cuenta de que me estaba divirtiendo en sobriedad…». En parejas, lee una frase que te guste (1 minuto cada uno), o pasa. Para compartir: ¿Qué te sorprendió de tu propio recuerdo?{/lang}
      {not:short} TIME SPLIT: 5 writing, 3 in pairs, 2 debrief.
      TRANSITION: 'Hold on to what you wrote. Now let's talk about what makes a story strong.'
    version_notes:
      short: "90-MINUTE PLAN: keep the five minutes of writing; the pairs and the debrief share the rest of the time. Never cut the pair sharing entirely; it's where people discover their story is worth telling."

  # ---------------------------------------------------------------- Part 4 · What makes a strong story (pptx 21–28)
  - id: "part-4"
    layout: "section"
    number: 4
    accent: "gv"
    title: "What makes a strong story"
    subtitle: "One moment, told honestly, in your own voice"
    minutes: 0.5
    notes: |
      SAY: You've just written for five minutes. Now let's look at a few things that turn a piece of writing into a story another alcoholic can't put down. None of these are rules; they're experience, from members who have been published and from what the editors themselves have shared.
      TRANSITION: 'Three things first.'
    version_notes:
      short: "90-MINUTE PLAN: Part 4 takes about 8 minutes (11 in the full plan)."

  - id: "strong-story"
    layout: "columns"
    style: "cards"
    title: "A strong story is…"
    columns:
      - heading: "1 · One moment"
        text: "One experience or turning point, not your whole life. Get right to the point."
      - heading: "2 · Honest"
        text: "Tell it the way it happened. Make it clear you're an alcoholic and a member of AA."
      - heading: "3 · Specific"
        text: "One real detail (a coffee pot, a late-night call, your first chip) puts the reader in the room."
    takeaway: "Ask yourself: will a reader recognize themselves in this?"
    minutes: 2.5
    version_minutes: { short: 2 }
    notes: |
      SAY: First, one moment. The most common mistake is trying to tell your whole life in five pages. Pick one experience, one turning point, and tell it well. Tips from a Grapevine editor, shared at one of our earlier workshops, put it simply: get right to the point. Second, honest. Tell it the way it happened, including the parts that don't make you look good. And make it clear early on that you're an alcoholic and an AA member; the reader needs to know they're hearing from one of their own. Third, specific. 'I was lonely' is a sentence. 'I ate dinner standing at the kitchen counter every night for a year' is a picture. The editor's other question is the one in the takeaway: will a reader recognize themselves in this?
      ASK: Look at what you wrote in the warm-up. Is there one specific detail in it? Underline it.
      FACILITATOR TIP: The editor tips are reported from an earlier committee workshop; credit them to 'a Grapevine editor', never by name.
      TRANSITION: 'Four more marks of a strong story.'

  - id: "sounds-like-you"
    layout: "bullets"
    title: "…and it sounds like you"
    items:
      - "**Show, don't tell:** let the reader see what you did and heard, instead of naming the feeling"
      - "**AA language:** write as you'd share at your home group: _I_, not _you should_; our words, not clinical ones"
      - "**Humility:** share, don't preach; experience, not advice"
      - "**Humor:** laughter belongs in recovery; a funny moment can carry a serious message"
    takeaway: "Your own voice is the one a reader trusts."
    minutes: 2
    version_minutes: { short: 1 }
    # SAY: the deck's "let the reader draw the lesson" → "draw the conclusion" (the site never says "lesson").
    notes: |
      SAY: Show, don't tell: we'll look at an example on the next slide. AA language: write the way you'd share at your home group. Say 'I', not 'you should'. Use the words we use in meetings, like the Steps, a sponsor, a Higher Power as you understand it, rather than clinical or textbook terms. Humility: share, don't preach. A story full of advice is a lecture; a story full of experience is a meeting. Let what happened to you carry the message, and let the reader draw the conclusion. And humor: laughter belongs in recovery. Some of the stories members remember longest are the funny ones, and a light moment can carry a serious message further than a heavy one.
      ASK: Which of these is hardest for you? (Most rooms say 'show, don't tell'; that's the next slide.)
      FACILITATOR TIP: If someone asks about God or spirituality in their story: write about your own experience in your own words. The magazines print members of every belief and none; there's no required vocabulary.
      TRANSITION: 'Here's what show, don't tell looks like.'

  # Navy in the deck, as the next slide: the colour of its first column (eyebrow and takeaway).
  - id: "show-dont-tell"
    layout: "columns"
    style: "panels"
    accent: "navy"
    title: "Show, don't tell: an example"
    columns:
      - heading: "Telling"
        accent: "navy"
        text: "I was in bad shape when I got to AA, and the people there really helped me."
      - heading: "Showing"
        accent: "vine"
        text: "The night of my first meeting I sat in my truck for twenty minutes with the engine running. A man tapped on the window, held up two cups of coffee and said, \"Coffee's on.\" I turned the key off."
    takeaway: "Same facts. The second one lets the reader sit in the truck with you."
    minutes: 2
    version_minutes: { short: 1.5 }
    notes: |
      SAY: Both of these say the same thing. The first one tells us: I was in bad shape, and AA helped. We nod, and we forget it. The second one shows us: we're sitting in that truck, we hear the engine, we see the coffee cups, and when the writer turns the key off, we know exactly what happened without being told. Nobody had to write 'I was afraid' or 'I felt welcomed'. That's what we're after. You don't have to do this in every sentence. A story needs some telling to move along. But the moments that matter most deserve a scene.
      ASK: Take one 'telling' sentence from your warm-up, something like 'I had a great time', and say out loud what someone would have seen or heard. (Take one or two volunteers.)
      FACILITATOR TIP: Both examples were written for this workshop; neither comes from a published story. Never put a published story on a slide: stories belong to AA Grapevine, Inc. Hold up the magazine or read a short passage aloud from the printed issue instead.
      TRANSITION: 'Now, how do you put a whole story together?'

  - id: "three-parts"
    layout: "columns"
    style: "cards"
    accent: "navy"
    title: "One familiar shape: three parts"
    columns:
      - heading: "1 · What it was like"
        accent: "navy"
        text: "Short and true. Enough to identify with; no need for every drink."
      - heading: "2 · What happened"
        accent: "gv"
        text: "The turning point: a meeting, a Step, a sponsor, a moment of willingness."
      - heading: "3 · What it is like now"
        accent: "vine"
        text: "Where the hope is: what's different today, and what you do to keep it that way."
    takeaway: "It's how we share in meetings, and how La Viña asks for testimonies."
    minutes: 2
    version_minutes: { short: 1.5 }
    notes: |
      SAY: You know this shape already: it's how we share in meetings. What it was like, what happened, and what it's like now. La Viña asks for testimonies in exactly this form. A few suggestions from members who've been published: keep the first part short. The reader needs enough to identify with you, not every drink you ever had. Give real space to what happened, the turning point. And give the most care to what it's like now, because that's where the hope is, and hope is what the reader came for. The same shape works for a small story too: what I used to do when I got angry, what happened, what I do now.
      ASK: In your own sobriety, what's one 'what happened' moment you could write about?
      TRANSITION: 'There's another way to build a story, and it's often stronger.'

  - id: "single-scene"
    layout: "bullets"
    title: "Or tell a single scene"
    items:
      - "Pick one hour, one evening, one phone call"
      - "**Where** were you? **When** was it? **Who** was there (first names only)?"
      - "**What** did you see, hear, smell? What was said?"
      - "**Why** does it matter to you today?"
      - "Start in the middle of the action; end on what it means now"
    takeaway: "A single scene can be the whole story, or the heart of a longer one."
    minutes: 2
    version_minutes: { short: 1.5 }
    notes: |
      SAY: Instead of covering years, some of the best stories cover one evening. One phone call to a sponsor. One meeting in a church basement. The questions on this slide are the ones on your story planner handout: who, what, where, when and why. Answer them and you have the bones of a scene. Here's a tip that works almost every time: start in the middle of the action. Not 'I was born in 1962'; start with 'The phone rang at 3 a.m.' Then end on what the scene means to you now. A single scene can be the whole story, or it can be the heart of a longer one.
      DO: Hold up the story planner handout so everyone knows which sheet you mean. On Zoom, paste the link to the handout in the chat.
      FACILITATOR TIP: Remind the room of the first-names-only rule here, before Exercise 3, so it shapes the drafts from the start.
      TRANSITION: 'Let's try the three-part shape now.'

