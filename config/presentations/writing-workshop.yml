          - "In pairs: read your scene; your partner names one detail that stayed with them"
    notes: |
      SAY: This is the longest writing time today: ten minutes. Pick a theme from the calendars we saw, on slides {slide:gv-themes} and {slide:lv-themes}, which show the next open themes, or pick any Step or Tradition, and choose one moment that belongs to it. (If the July 2027 Annual Prison Issue is still on slide {slide:gv-themes}, add: for that issue the editors especially want stories from women in long-term custody.) Use your story planner if it helps: where were you, who was there, first names only, what did you see and hear, what changed. Start in the middle of the action. Ten minutes. Begin.
      {not:short} DO: Start a 10-minute timer; give a 2-minute and a 1-minute warning. Then pairs for 2 minutes each (Zoom: breakout rooms of two, 5 minutes, with a 1-minute broadcast warning). The listener names one detail that stayed with them: nothing else, no advice. Debrief with two or three volunteers.
