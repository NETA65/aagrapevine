    notes: |
      {not:no-speaker,topic} SAY: Here's the plan for the rest of our hour. After our guest speaker, the committee's business has half an hour: reports and news, then the districts, events and business, and we close with the Responsibility Statement before eight. Our timekeeper tonight is (first name), who'll give a gentle signal when an item runs over. Is there anything anyone would like to add under new business? (Note any additions.) If there are no objections, we'll follow the agenda as presented.
      {only:no-speaker,topic} SAY: Here's tonight's agenda. We'll hear reports and news in the first half hour, then turn it over to the districts, look at events and business, and close with sharing and the Responsibility Statement before eight. Our timekeeper tonight is (first name), who'll give a gentle signal when an item runs over. Is there anything anyone would like to add under new business? (Note any additions.) If there are no objections, we'll follow the agenda as presented.
      DO: Write down any added items for new business. If the agenda is very full, ask the committee which items can wait until next month instead of deciding alone.
      {not:no-speaker,topic} TIP (timekeeping): The guest speaker's half ends at 7:30 sharp, and the committee's half hour has no minute to spare: through January 2027 the price heads-up takes a minute of its own, so the closing ends just before 8:00; from February, about a minute is left for an item that runs over. The times are a guide, not a rule. If the district reports run long because members are sharing real experience, shorten the news instead: the reports belong to the members. Start on time even if only a few people are there; it respects the people who came on time.
      {only:no-speaker,topic} TIP (timekeeping): The plan on this slide adds up to 58 minutes, so the closing ends by 7:58 and about two minutes are left spare for an item that runs over; through January 2027, the price heads-up takes one of them. The timing lines in these notes also count a few seconds for the title slide and for each part's divider, so they can run a minute behind this plan. The times are a guide, not a rule. If the district reports run long because members are sharing real experience, shorten the news instead: the reports belong to the members. Start on time even if only a few people are there; it respects the people who came on time.
      UPDATE: Change the times only if the committee changes its format ({ui:customize} → {ui:edit}). The versions without a guest speaker show their own plan by themselves; in a month with a topic of the month, the version 'No guest speaker, with a topic of the month' shows the news row as 'News and topic of the month'. If you switch the topic slide on in {ui:customize} → {ui:slides} instead, change that row here. If there's no treasurer's report, delete that row.
    version_notes:
      topic: "A MONTH WITH A TOPIC: in this version the news row reads 'News and topic of the month' by itself."

  - id: "last-minutes"
    layout: "bullets"
    title: "Last month's minutes"
    items:
      - "Minutes of the {fill:minutes_month} meeting, sent {fill:minutes_sent}"
      - "Any corrections or additions?"
      - "Approved {fill:minutes_approved}"
      - "Taking the minutes tonight: {fill:minutes_taker}"
    takeaway: "Minutes may be posted publicly: first names or service positions only, and no contact details."
    minutes: 1
    version_minutes: { no-speaker: 2, topic: 2 }
    notes: |
      SAY: Last month's minutes went out by email. Has everyone had a chance to look at them? Are there any corrections or additions? (Pause.) Hearing none, may we accept them as presented? (Wait for a raised hand or a thumbs-up reaction on Google Meet.) Thank you; the minutes are approved.
      IF THERE ARE CORRECTIONS: note each one, read it back, and ask whether the committee accepts the minutes as corrected.
      DO: Send the draft minutes a week before the meeting, with every address in BCC. Confirm who is taking tonight's minutes, or take them yourself and say so.
      TIP: Files in the committee's Drive folders for notes and minutes are published on the website, just like the slides. So the minutes should use first names, or better, service positions, and never phone numbers, email addresses, or a person's name linked to a home group. Keep the decisions and the action items: that's what next month's chair needs.
      UPDATE ({ui:customize} → {ui:your_details}): the month of the minutes, how they were sent, and who takes the minutes tonight.

  - id: "chairs-report"
    layout: "bullets"
    title: "Chair's report"
    items:
      - "Since we last met: {fill:chair_since}"
      - "From the Area: {fill:chair_area}"
      - "From the Grapevine office: {fill:chair_office}"
      - "Working on next: {fill:chair_next}"
