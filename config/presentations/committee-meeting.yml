    eyebrow: "Appendix · For the chair"
    title: "Credits & sources"
    sources:
      - "The AA Preamble (switched off since November 2026): Copyright © by AA Grapevine, Inc.; reprinted with permission"
      - "Responsibility Statement: written for the 1965 International Convention, Toronto"
      - "Serenity Prayer: said at many AA meetings; A.A. World Services does not hold its copyright (aa.org, Terms of Use)"
      - "Guest speakers: the committee's list of speakers (the Meetings page of the committee website), by first name and last initial, with their service position and topic"
      - "Facts about the magazines: [www.aagrapevine.org](https://www.aagrapevine.org) and [www.aalavina.org](https://www.aalavina.org), as of November 2026"
      - "Meeting dates, issues, themes, deadlines, the stores' offers, Books of the Month, open meetings and events on the slides: the committee website, {live:site}, as of the date on the title slide"
      - "Prices from January 1, 2027: AA Grapevine's letter to intergroups and central offices, October 1, 2026"
      - "Carry the Message: [www.aagrapevine.org/carry-the-message](https://www.aagrapevine.org/carry-the-message) and La Viña's [www.aalavina.org/lleva-el-mensaje](https://www.aalavina.org/lleva-el-mensaje)"
      - "The A.A. Service Manual, 2024–2026 Edition, Chapter 11; AA Grapevine and La Viña: Our Meetings in Print (P-52); Self-Support (F-3, June 2026); Anonymity (P-47, Sept. 2026)"
      - "Committee meeting details: neta65.org and the committee website"
    note: |-
      Grapevine and La Viña are trademarks of AA Grapevine, Inc. The names are used only to identify the magazines; no logos, covers or artwork are reproduced.
      This presentation was prepared by the NETA 65 Grapevine & La Viña Committee for local service use. It is not AA Conference-approved literature and does not speak for AA as a whole or for AA Grapevine, Inc.
    notes: |
      NOT PRESENTED: this page keeps the record of where the words and facts come from.
      SAY (if someone asks): This presentation is a local service piece from our Area committee. It isn't Conference-approved literature, and it doesn't speak for AA as a whole or for AA Grapevine, Inc.
      DO: When you add a fact or a quotation, add its source here. Quote A.A.W.S. literature only briefly and word for word, with 'Reprinted from (publication, page), with permission of Alcoholics Anonymous World Services, Inc.' Grapevine and La Viña stories and other AA Grapevine material need AA Grapevine's permission (licensing@aagrapevine.org), so paraphrase and link instead.
      NO LOGO: since October 2026 the committee's decks carry no NETA 65 Area logo on any slide, by decision. The Area's logo is the Area's own, so please don't add it back, and never add Grapevine or La Viña logos, covers or artwork either.
      AS OF: the facts in these notes were checked in November 2026; the dates and the other facts on the slides come from the committee website, which reads the official sites every day, so they are current as of the date on the title slide.
      UPDATE: the Service Manual's chapter reference when the 2026–2028 edition comes out, and the 'as of' month above when someone checks the facts again (ask whoever looks after the website).

  # A checklist: Prepare gives each line a tick box the chair's device remembers. Not numbered as well: a
  # number and a tick box would share the same spot in front of each line.
  - id: "week-before"
    layout: "bullets"
    facilitator: true
    eyebrow: "Appendix · For the chair"
    title: "The week before each meeting"
    checklist: true
    items:
      - "Save last month's version first ({ui:customize} → {ui:save_share}); name it “YYYY-MM GV-LV Committee Meeting”"
      - "{ui:customize} → {ui:your_details}: fill in each orange blank; what is still orange is still to fill in"
      - "Guest speaker: confirmed, with the Meet link, a reminder and the 6:50 sound check; their short introduction ready"
      - "No guest speaker? The version 'No guest speaker', and tonight's topic with its question"
      - "Volunteers: the events on 'Coming up' that need helpers; one story per magazine to mention"
      - "Check the offers, issues, deadlines, meetings and events: most fill in by themselves"
      - "Google Meet: signed in to the account that owns the link (only it admits people), nobody recording; a timekeeper lined up"
      - "E-mail the agenda and a reminder, with every address in BCC ({ui:customize} → {ui:paperwork})"
    notes: |
      WHEN: about 30 minutes of preparation, the week before the meeting.
      WHY: Most of this presentation stays the same every month, and the meeting dates, the guest speakers, the stores' offers, deadlines, issues and events fill in by themselves. Only the orange blanks change, so a careful pass through {ui:customize} → {ui:your_details} is usually all it takes.
      STEP 1: What you typed last month stays on this device until you change it. Before you change it, save last month's version ({ui:customize} → {ui:save_share}) with the year and month first in its name (for example, '2027-01 GV-LV Committee Meeting'), so your saved versions sort in order. 'Reset to the original', also in {ui:customize} → {ui:save_share}, starts again from the committee's version, with this presentation's blanks empty.
      STEP 2: Fill in this month's blanks in {ui:customize} → {ui:your_details}. A blank you haven't filled in shows on its slide in orange, in square brackets, and before you present, a short notice lists the blanks still empty. If you used 'Start next month' after the last meeting ({ui:customize} → {ui:paperwork}), last month's blanks are already cleared and this checklist is unticked.
      STEP 3 (THE GUEST SPEAKER): write to the speaker a week ahead from grapevine@neta65.org: the Meet link and code, the 6:50 sound check, about 20 minutes of sharing, then questions, done by 7:30 ("2 minutes" in the chat at the 18-minute mark), and whether they'll share slides. Ask for two or three sentences of introduction, and a sentence on the topic. Tonight's speaker is on the first slides already, from the committee's list (the website's Meetings page); if the list is wrong or a speaker cancels, tell whoever looks after the website, and choose the version 'No guest speaker' if nobody can come.
      STEP 4 (NO GUEST SPEAKER): choose the version 'No guest speaker' ({ui:customize} → {ui:version}) and fill in tonight's topic, why now, what we'll look at and a question to start the sharing. The page 'Suggested topics: the year at a glance' has one for each month.
      STEP 5: {ui:customize} → {ui:paperwork} has the agenda e-mail and a short reminder (in English and Spanish), ready to copy or to open in your e-mail app, with the guest speaker (or tonight's topic) and the Meet link. Put every address in BCC.
      60 MINUTES: on a free Google account, Google Meet ends a call of three or more people after 60 minutes: admit the members at 7:00 (the sound check with the speaker alone is fine), and before the Responsibility Statement tell the room to click the same link again for the parking lot if the call drops at eight. With a plan without that limit, nothing happens at 8:00.
      TIP: Ask your alternate chair to look over the presentation before the meeting (send your saved version: {ui:customize} → {ui:save_share}). A second pair of eyes catches stale details, and it prepares the alternate to chair whenever you can't. To chair, the alternate signs in to the Google account that owns the Meet link too: no other account can admit the members.
      TIP: The committee's /monthly/ page gathers this month's issues, deadlines, Books of the Month and events in one place, so you can fill in most of your blanks from it.

