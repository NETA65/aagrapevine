      - {fill:action_2_what} · {fill:action_2_who} · by {fill:action_2_when}
      - {fill:action_3_what} · {fill:action_3_who} · by {fill:action_3_when}
      - {fill:action_4_what} · {fill:action_4_who} · by {fill:action_4_when}

      Next meeting: {paper:after}, {live:meeting_time}, on {live:meeting_platform}.
      Closed with the Responsibility Statement.
  # "Start next month", after the meeting: the action items the chair ticks (and old business still open) become
  # next month's old business (old_1 … old_4: "what (who, by when)", the status cleared), the blanks below are
  # cleared (a name ending in * clears every blank whose name starts so), the minutes' month becomes the month
  # of the meeting just held, and the week-before checklist is unticked. Everything else stays (the presenter,
  # the order of districts, the treasurer's budget and process). It can be undone.
  next_month:
    actions: ["action_1", "action_2", "action_3", "action_4"]
    old_business: ["old_1", "old_2", "old_3", "old_4"]
    minutes_month: "minutes_month"
    clear: ["minutes_sent", "minutes_approved", "minutes_taker", "chair_*", "gv_story", "gv_section", "lv_story",
            "news_*", "topic", "topic_*", "treasurer_spent", "since_*", "old_*", "new_*", "volunteer_*", "action_*"]
    untick: ["week-before"]

slides:
  # ------------------------------------------------------------------ OPENING
  # The title slide is up while people arrive (about 10 minutes before 7:00): the hour starts when the chair
  # moves on, at 7:00 (0:00 of the TIME lines), so it has the least time a slide can have (15 seconds).
  # Its "Last updated" line is gone: the player shows "Current as of <the day's date>" by itself.
  # The month is the meeting's own ({live:meeting_month}, never the calendar's {live:month}): it switches with
  # the date under it ({live:meeting_day}, never {live:meeting_next}, which moves on as soon as the meeting ends),
  # at midnight Central after the meeting, so the two always name the same meeting.
  # Its notes name tonight's guest speaker ({live:speaker_name}) before a ";", never before a ".": a name ends
  # with its own period ("Rick W."), and "Rick W.." is a mistake.
  - id: "title"
    layout: "title"
    eyebrow: "NETA 65 · Grapevine & La Viña Committee"
    title: "Grapevine and La Viña Monthly Committee Meeting"
    subtitle: "{live:meeting_month} meeting · {live:panel}"
    lines:
      - "{fill:presenter}"
      - "{live:meeting_day} · {live:meeting_time} · {live:meeting_platform}"
    minutes: 0.25
    notes: |
      WHEN: Have this slide up about 10 minutes early, while people arrive. The hour starts when you move on, at 7:00 sharp: that is 0:00 in the timing lines of these notes.
      DO: Start the Google Meet ({live:meeting_link}) by 6:50 p.m. Central, signed in to the Google account that owns this Meet link (the organizer of its calendar event): on Google Meet that account is the host, and only it can admit the people who ask to join, so it stays in the call until the end. Check that you can share your screen, that nobody is recording, and that someone watches the chat. Line up a timekeeper and someone to take the minutes before you start.
      {not:no-speaker,topic} DO (the guest speaker): admit tonight's speaker at 6:50 for a sound check, just the two of you: their microphone, their camera, and how you'll signal the time ("2 minutes" in the chat). {live:speaker_slides}
      60 MINUTES: on a free Google account, Google Meet ends a call of three or more people after 60 minutes. Then admit the members at 7:00, not earlier (the sound check with the speaker alone is fine): the hour ends at 8:00 sharp, and the welcome below is said as they come in. If the account that owns the link has a plan without that limit, the call can open from 6:50 as people arrive.
      SAY (as people arrive): Welcome, come on in. We'll start right at seven. While we wait, please type your first name, your district and your service position in the chat, so we all know who's here.
      {not:no-speaker,topic} TONIGHT'S GUEST SPEAKER (from the Meetings page): {live:speaker_name}; if there is none (every meeting before January 20, 2027, when the guest speakers start) or the speaker can't come, choose the version 'No guest speaker' ({ui:customize} → {ui:version}): the committee's business for the whole hour, with its own agenda.
      {only:no-speaker,topic} NEXT MONTH: when the next meeting has a guest speaker, choose 'With a guest speaker' again ({ui:customize} → {ui:version}) before you send its agenda. 'Start next month' does it for you, and the paperwork says so if a listed speaker is left out.
      UPDATE EACH MONTH: nothing on this slide: the meeting's month and date (always the third Wednesday), the time and the panel fill in by themselves, and so does tonight's guest speaker on the next slides. Every orange item in square brackets, on any slide, is something to fill in: {ui:customize} → {ui:your_details} lists them all, and orange always means 'still to fill in'. What you typed last month stays on this device until you change it, so save your version first if you want to keep it ({ui:customize} → {ui:save_share}). The pages 'For the chair', in {ui:customize} → {ui:prepare}, list what to update on each slide and where to find it.
      TIP: This presentation, the slides AND these notes, is public on the committee's website. What you type in {ui:customize} stays on this device and is never sent anywhere, but it is shown on screen at the meeting and goes with any copy you save and share. Use service positions, not names, and keep internal figures out of it. Anything that must stay private goes in your own Drive, never in the shared A65_GV folders: PRIVATE in a name only hides a file from the website, not from Drive.

  # The welcome names tonight's plan: the guest speaker until 7:30, then the business (the versions without a
  # speaker keep the welcome of before: their own `items`, and the housekeeping said in full, which their minute
  # has room for; with a speaker it is one sentence, the rest being on the slide). On Google Meet a member's name
  # is their Google account's (a signed-in member can't rename themselves in the call), so the introductions go
  # in the chat.
  - id: "welcome"
    layout: "bullets"
    title: "Welcome to the committee meeting"
    items:
      - "Tonight: our **guest speaker**, the talk and questions, done by 7:30; then committee business until 8:00"
      - "In the chat, please: **first name · district · service position**"
      - "Cameras are optional; please stay muted unless you're speaking"
      - "Use the chat or the raise-hand button to ask for a turn"
      - "Please don't take photos, screenshots or recordings of members"
      - "All AA members are welcome; no registration is needed"
    version_fields:
      no-speaker:
        items:
          - "In the chat, please: **first name · district · service position**"
          - "Cameras are optional; please stay muted unless you're speaking"
          - "Use the chat or the raise-hand button to ask for a turn"
          - "Please don't take photos, screenshots or recordings of members"
          - "All AA members are welcome; no registration is needed"
      topic:
        items:
          - "In the chat, please: **first name · district · service position**"
          - "Cameras are optional; please stay muted unless you're speaking"
          - "Use the chat or the raise-hand button to ask for a turn"
          - "Please don't take photos, screenshots or recordings of members"
          - "All AA members are welcome; no registration is needed"
    takeaway: "Presented by the NETA 65 Grapevine & La Viña Committee for local service. This is not an official AA Grapevine, Inc. presentation."
    minutes: 0.5
    version_minutes: { no-speaker: 1, topic: 1 }
    notes: |
      {not:no-speaker,topic} TIP (timekeeping): about 30 seconds for the welcome, 30 for the prayer and a minute for the introduction: the guest speaker starts at about 7:02. So tonight the housekeeping is one sentence: the rest is on the screen.
      SAY: Good evening, and welcome to the monthly meeting of the NETA 65 Grapevine and La Viña Committee. My name is {fill:first_name}, and I'm grateful to serve as {fill:presenter}. Whether you're a GVR, an RLV, a district chair, a DCM, a GSR, or simply curious about the magazines, you're welcome here.
      {not:no-speaker,topic} SAY: Tonight we open with our guest speaker: the talk and your questions, done by 7:30. Then the committee's business until eight.
      {not:no-speaker,topic} SAY: The housekeeping is on the screen: your first name, district and service position in the chat, please, and no photos, screenshots or recordings. We aren't recording tonight either.
      {only:no-speaker,topic} A few housekeeping notes so the hour runs smoothly. If you haven't yet, please type your first name, district and service position in the chat: on Google Meet your name is the one your Google account shows. Cameras are up to you. Please stay muted unless you're speaking, and use the chat or the raise-hand button when you'd like a turn. Out of respect for everyone's anonymity, please don't take photos or screenshots while people are on camera, and please don't record. We aren't recording tonight either.
      {only:no-speaker,topic} One more thing: this is our Area committee's meeting. We share what we learn from AA Grapevine and La Viña, but we don't speak for them, and this isn't an official AA Grapevine, Inc. presentation.
      DO: Before you say 'we aren't recording', make sure nobody is recording. If Spanish-speaking members are present, ask a bilingual volunteer ahead of time to give a short summary in the chat, and post the key links in both languages.
      TRANSITION: Let's begin the way we always do.

  # The opening's prayer and the Preamble keep the deck's grape (its quote slides' big quote mark, its reading's
  # accent bar) inside the Opening and Part 1, whose colour is Grapevine blue: `accent` colours these two slides
  # only.
  - id: "serenity-prayer"
    layout: "quote"
    accent: "grape"
    title: "A moment of silence, then the Serenity Prayer"
    quote: "God, grant me the serenity to accept the things I cannot change, courage to change the things I can, and wisdom to know the difference."
    credit: "— The Serenity Prayer"
    source: "Said at many AA meetings. A.A. World Services does not hold its copyright (aa.org, Terms of Use)."
    minutes: 0.5
    version_minutes: { no-speaker: 2, topic: 2 }
    notes: |
      SAY: Please join me in a moment of silence for the alcoholic who still suffers, inside and outside our rooms. (Pause for about ten seconds.) Thank you. Those who wish, please join me in the Serenity Prayer. (Read it slowly, following the words on the screen.)
      DO: Online, unmuting everyone at once creates an echo. It usually works best if the chair says the prayer aloud and everyone else says it along with their microphones muted.
      TIP: 'Those who wish' keeps the invitation open: some members prefer not to pray, and silence is always welcome. How the committee opens its meeting is the committee's own decision. If its group conscience chooses a different opening, change this slide ({ui:customize} → {ui:edit}).
      {not:no-speaker,topic} TRANSITION: Now it's my pleasure to introduce our guest speaker.
      {only:no-speaker,topic} TRANSITION: Now let's turn to the committee's business, with our reading for tonight.

  # ------------------------------------------------------------------ GUEST SPEAKER (7:02 – 7:30)
  # From January 2027 each meeting opens with a guest speaker (config/site.yml `meeting: speakers:`: a first name
  # and last initial, the service position and the topic, as /meetings/ lists them): introduced right after the
  # prayer (a minute), the talk from about 7:02 (about 20 minutes), questions from about 7:22 (6½ minutes),
  # thanked and done by 7:30. These four slides have an eyebrow of their own, so the parts after them keep their
  # numbers in every version; the versions without a speaker leave them out. Their facts are tonight's speaker's
  # until midnight Central after the meeting (as the meeting's day on the title slide), and next month's speaker is
  # that of the meeting after it. A night the Meetings page lists no speaker for (the meetings before January 20,
  # 2027) says "none tonight" (choose "No guest speaker"); one the committee's list doesn't name yet, "to be
  # announced".
  - id: "speaker-intro"
    layout: "bullets"
    eyebrow: "Guest speaker"
    accent: "lv"
    title: "Tonight's guest speaker"
    items:
      - "**{live:speaker_name}**"
      - "{live:speaker_position}"
      - "Topic: {live:speaker_topic}"
    takeaway: "About 20 minutes of sharing, then your questions: we finish with our guest by 7:30."
    minutes: 1
    notes: |
      TIP (timekeeping): about a minute, with the two or three sentences the speaker sent you: the talk starts at about 7:02.
      SAY: It's my pleasure to introduce tonight's guest speaker, {live:speaker_name}: {live:speaker_position}. The topic tonight: {live:speaker_topic}. (Add the two or three sentences of introduction the speaker sent you.) Welcome, and thank you for being with us.
      SAY: Our guest will share for about 20 minutes, and then we'll have time for your questions. Please hold them until then; you can type them in the chat as they come to you.
      IF THE SPEAKER CAN'T COME: choose the version 'No guest speaker' ({ui:customize} → {ui:version}): its agenda, and the texts in {ui:customize} → {ui:paperwork}, then name no speaker. The run summary reminds you, about six weeks ahead, of a speaker who hasn't confirmed yet.
      IF THE SLIDE SAYS 'none tonight': the Meetings page lists no guest speaker for tonight (every meeting before January 20, 2027): choose the version 'No guest speaker'.
      IF IT SAYS 'to be announced' (the committee's list doesn't name tonight's speaker yet): type tonight's speaker on these slides ({ui:customize} → {ui:edit}), and tell whoever looks after the website; or choose the version 'No guest speaker'. What you type stays on this device, in every later month too, until you reset it: after the meeting, reset each slide you changed ({ui:customize} → {ui:edit} → 'Reset this slide to the original'), and next month's speaker fills in by itself again.
      ANONYMITY: on the slide, in the chat and in the minutes, a first name and last initial at most, with the speaker's service position; never their last name, e-mail address or phone number.

  # The talk: a pause card with the speaker and the topic, up while they share (or under their own slides).
  - id: "speaker-talk"
    layout: "text"
    style: "break"
    eyebrow: "Guest speaker"
    accent: "lv"
    title: "Our guest speaker: {live:speaker_name}"
    body: "{live:speaker_topic}"
    minutes: 20
    notes: |
      TIP (timekeeping): about 20 minutes, from about 7:02. At the 18-minute mark, about 7:20, type "2 minutes" in the chat, as the speaker was told: they then wrap up.
      DO: Leave this slide up while the speaker talks. If they share slides, stop sharing your screen first so they can share theirs, and share this presentation again when they're done. Keep everyone else muted, and note the questions that come in the chat for later.
      SLIDES: {live:speaker_slides}
      WATCH FOR: the time. Our guest is done by 7:30 at the latest, questions included: some speakers have to leave then.

  - id: "speaker-questions"
    layout: "qa"
    eyebrow: "Guest speaker"
    accent: "lv"
    title: "Questions for our guest speaker"
    prompts:
      - "Raise your hand, or type your question in the chat"
      - "One short question each, so more of us can ask"
      - "About tonight's topic and the speaker's experience in service"
    note: "We finish with our guest by 7:30."
    minutes: 6.5
    notes: |
      TIP (timekeeping): about 6½ minutes, from about 7:22. At about 7:28, say 'time for one last question': our guest is thanked and done by 7:30, whatever is left.
      SAY: Thank you. We have a few minutes for your questions. Please raise your hand, or type your question in the chat and I'll read it out. One short question each, please, so more people can ask.
      DO: Read the questions from the chat aloud, without the name the chat shows. Take hands first from people who haven't spoken yet. If a question needs a long answer, ask the speaker whether they'd answer it later through the committee's address, grapevine@neta65.org.
      TIP: Keep it to the speaker's experience and the topic. If a question drifts into outside issues, gently bring it back to how we carry the message.

  # Its notes name next month's guest speaker ({live:speaker_after}) before a ";", never before a ".": a name with no
  # topic ends with its own period ("Greg G."), and "Greg G.." is a mistake. (The "Next meeting" slide's notes too.)
  - id: "speaker-thanks"
    layout: "bullets"
    eyebrow: "Guest speaker"
    accent: "lv"
    title: "Thank you to our guest speaker"
    items:
      - "Thank you, **{live:speaker_name}**, for your time and your service"
      - "Next month's guest speaker: {live:speaker_after}"
      - "Our guest is welcome to stay for the committee's business, or to leave now"
    takeaway: "Next: the committee's business, until 8:00."
    minutes: 1
    notes: |
      TIP (timekeeping): about a minute: our guest is thanked and done by 7:30.
      SAY: Please join me in thanking {live:speaker_name} for tonight's talk. (Members can send a reaction, or unmute for a round of applause.) Thank you so much for being with us. You're welcome to stay for our business meeting, or to leave now: we know your time is precious. Next month's guest speaker: {live:speaker_after}; we hope to see you all then.
      DO: Let the speaker leave without a fuss. After the meeting, send them a short thank-you from the committee's address, grapevine@neta65.org.
      TRANSITION: Now let's turn to the committee's business.

  # ------------------------------------------------------------------ 1. COMMITTEE BUSINESS
  # 7:30 to 8:00, opened by the Preamble (in the versions without a speaker: right after the opening prayer, as
  # the meeting's business for the whole hour).
  - id: "part-1"
    layout: "section"
    number: 1
    title: "Committee business"
    subtitle: "The Preamble · introductions · reports and news"
    accent: "gv"
    minutes: 0.25
    notes: |
      {not:no-speaker,topic} SAY: Let's turn to the committee's business. We'll open with the Preamble and meet each other; then I'll give a short chair's report, share what's new from AA Grapevine and La Viña, hear the treasurer if we have a report, and then the floor is yours for the district reports.
      {only:no-speaker,topic} SAY: Let's begin with our reading and meet each other. Then I'll give a short chair's report, share what's new from AA Grapevine and La Viña, hear the treasurer if we have a report, and then the floor is yours for the district reports.
      {not:no-speaker,topic} TIP: The business has half an hour tonight. Keep your own part short and lively: the most valuable time is what the districts and groups share, so protect those eight minutes.
      {only:no-speaker,topic} TIP: Keep your own part short and lively. The most valuable time tonight is what the districts and groups share, so protect those twelve minutes.

  # The Preamble, word for word, with AA Grapevine's credit line exactly as on the slide. It opens the committee's
  # business.
  - id: "preamble"
    layout: "quote"
    accent: "grape"
    title: "Reading: the AA Preamble"
    quote: "Alcoholics Anonymous® is a fellowship of people who share their experience, strength and hope with each other that they may solve their common problem and help others to recover from alcoholism. The only requirement for membership is a desire to stop drinking. There are no dues or fees for A.A. membership; we are self-supporting through our own contributions. A.A. is not allied with any sect, denomination, politics, organization or institution; does not wish to engage in any controversy; neither endorses nor opposes any causes. Our primary purpose is to stay sober and help other alcoholics to achieve sobriety."
    credit: "Copyright © by AA Grapevine, Inc.; reprinted with permission. Revised per 2021 General Service Conference."
    minutes: 1
    version_minutes: { no-speaker: 2, topic: 2 }
    notes: |
      SAY: Could I have a volunteer to read the AA Preamble for us tonight? (Wait a moment; if nobody offers, read it yourself.) Thank you.
      DO: If you can, ask a reader ahead of time by private chat, so nobody is put on the spot. Rotate readers from month to month: it's an easy first piece of service for a new GVR or RLV.
      WHY THIS TEXT: The Preamble first appeared in the Grapevine in June 1947. AA Grapevine, Inc. holds its copyright and lets AA entities reprint it word for word with this credit line (SMF-101, Q4; Service Manual, p. 23). Read it exactly as written. This is the 2021 wording ('a fellowship of people').
      OTHER READINGS THE COMMITTEE MAY CHOOSE: the Tradition that matches the month (January, Tradition One, and so on), copied word for word from the short form in P-52, page 17, with the line 'Reprinted from AA Grapevine and La Viña: Our Meetings in Print (P-52), p. 17, with permission of Alcoholics Anonymous World Services, Inc.' Don't put Grapevine or La Viña stories, Daily Quotes or Workbook pages on a slide: they need AA Grapevine's permission. A member may hold up the printed issue and read a line or two aloud instead.
      TRANSITION: Next, let's meet each other.

  # About 7:31, 2½ minutes for introductions and the next slide (2 + ½): everyone typed theirs in the chat on
  # arriving, and first-timers say hello. In the versions without a speaker, 7:05 and 5 minutes (4 + 1), going
  # around the room as before (their own `items`).
  - id: "introductions"
    layout: "bullets"
    title: "Introductions"
    items:
      - "In the chat: your **first name**, your **district** and your **service position**"
      - "Is this your first committee meeting? Please unmute and say hello: welcome!"
      - "New to the GVR or RLV service position? Tell us: the next slide is for you"
    version_fields:
      no-speaker:
        items:
          - "Your **first name**, your **district** and your **service position**"
          - "Is this your first committee meeting? Welcome!"
          - "Optional: one thing you hope to take home tonight"
          - "More than 15 of us? Please type your introduction in the chat"
      topic:
        items:
          - "Your **first name**, your **district** and your **service position**"
          - "Is this your first committee meeting? Welcome!"
          - "Optional: one thing you hope to take home tonight"
          - "More than 15 of us? Please type your introduction in the chat"
    takeaway: "New GVR or RLV? Email [grapevine@neta65.org](grapevine@neta65.org) so we can add you to our reminders (always sent by BCC)."
    minutes: 2
    version_minutes: { no-speaker: 4, topic: 4 }
    notes: |
      {not:no-speaker,topic} TIP (timekeeping): two minutes and a half, including the next slide. Everyone typed their introduction in the chat on arriving; only first-timers unmute and say hello.
      {not:no-speaker,topic} SAY: Welcome to everyone who typed their introduction in the chat: we have reps from (read the districts in summary). Is this anyone's first committee meeting? Please unmute and say hello, so we can welcome you.
      {only:no-speaker,topic} TIP (timekeeping): introductions take 5 minutes, including the next slide. With up to 15 people, that's about 15 seconds each. With more than 15, ask everyone to type their introduction in the chat, and invite only first-timers to unmute and say hello.
      {only:no-speaker,topic} SAY: Let's go around the room. Please unmute and tell us your first name, your district and your service position. If it's your first time with us, let us know so we can welcome you, and if you like, share one thing you hope to take home tonight. I'll call on people in the order I see them on my screen.
      {only:no-speaker,topic} SAY (more than 15 people): There are a lot of us tonight, which is wonderful. To save time, please type your first name, district and service position in the chat. If this is your first committee meeting, please unmute and say hello so we can welcome you.
      DO: Call on people from the participant list rather than waiting for volunteers: it's faster, and nobody is skipped. Welcome each first-timer warmly, and ask the alternate chair or another trusted servant to send them a welcome email after the meeting. Read the chat introductions aloud only in summary ('we have reps from Districts 3, 22 and 91').
      ASK (first-timers): How did you hear about the committee?
      TIP: First names and last initials are fine inside the meeting. Don't copy the attendance list into the slides or into minutes that may be posted publicly; the minutes can simply record how many attended, by district.
      TRANSITION: If you're new to the GVR or RLV service position, this next slide is for you.

  - id: "new-reps"
    layout: "bullets"
    title: "New to the service position? Start here"
    items:
      - "**Grapevine:** register at [www.aagrapevine.org/get-involved/become-grapevine-rep](https://www.aagrapevine.org/get-involved/become-grapevine-rep) (you'll receive the Digital Grapevine Kit)"
      - "**La Viña:** register ({lang:es}regístrate{/lang}) at [www.aalavina.org/servicio/conviertete-en-rlv](https://www.aalavina.org/servicio/conviertete-en-rlv)"
      - "Free tools: [www.aagrapevine.org/gvr-resources](https://www.aagrapevine.org/gvr-resources) (GVR Workbook) and [www.aalavina.org/recursos](https://www.aalavina.org/recursos) ({lang:es}Manual del RLV{/lang})"
      - "Questions for the office: [gvrc@aagrapevine.org](gvrc@aagrapevine.org) · order problems: [customerservice@aagrapevine.org](customerservice@aagrapevine.org) ({lang:es}en español{/lang}: [preguntas@aagrapevine.org](preguntas@aagrapevine.org))"
      - "Our committee's corner for reps: [{live:site}/gvr/](/gvr/)"
    takeaway: "Each group decides how its rep is chosen and for how long; two years is common."
    minutes: 0.5
    version_minutes: { no-speaker: 1, topic: 1 }
    notes: |
      {not:no-speaker,topic} TIP (timekeeping): these 30 seconds are inside the two and a half minutes for introductions. If nobody is new to the service position tonight, skip it with one sentence: 'New reps, the first steps are on this slide and on our website.'
      {only:no-speaker,topic} TIP (timekeeping): this minute is inside the 5 minutes for introductions. If nobody is new to the service position tonight, skip it with one sentence: 'New reps, the first steps are on this slide and on our website.'
      SAY: Welcome to everyone who's new in this service position. Here are the first steps most reps find helpful. Register with the Grapevine office, or with La Viña if you serve as an RLV, so you receive the reps' newsletter (Grapevine News monthly, La Viña's {lang:es}Noticias{/lang} every two months); the Grapevine form also sends you a digital welcome kit. Both offices have free resources: the GVR Workbook in English and the RLV Manual in Spanish. Our committee's website has a corner for reps and a short orientation in six sessions. If you have a question for the office, the address for reps is on the screen, and customer service can help with any problem with an order; for help in Spanish, write to preguntas@aagrapevine.org.
      ASK: Is anyone still waiting to hear from the office, or not sure whether you're registered?
      DO: Offer to help new reps after the meeting. The orientation sessions on the committee site (/orientation/) work one-on-one or at a district meeting. Remind reps who are rotating out to tell the office, so the lists stay current.
      TIP: Many reps like to read the current issue in whatever form suits them (print, digital or the app), but nobody needs to buy anything to serve.
      TRANSITION: Here's our plan for the hour.

