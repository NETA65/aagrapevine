  - id: "lv-deadlines"
    layout: "live"
    facilitator: true
    accent: "lv"
    eyebrow: "Appendix · For the chair"
    title: "La Viña deadlines"
    kind: "deadlines"
    options: { pub: "lv", limit: 6 }
    takeaway: "Send to [www.aalavina.org/comparte](https://www.aalavina.org/comparte) or [manuscritoslv@aagrapevine.org](manuscritoslv@aagrapevine.org)"
    notes: |
      NOT PRESENTED: a reference for the chair.
      SOURCE: La Viña's themes ({lang:es}Temas de LV{/lang}, on aalavina.org/recursos); this list fills in from the committee website. La Viña comes out every two months, so there are six issues a year.
