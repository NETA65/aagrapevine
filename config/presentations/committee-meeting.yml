      SPECIAL OFFERS: the stores' current offers (config/site.yml on the website, as its /shop/ page lists them) and both Books of the Month fill in by themselves, each until its offer ends. Carry the Message is described there, never sold: a member or a group buys a gift certificate or a subscription from the official stores, and AA Grapevine or La Viña turns it into a subscription for an alcoholic in need.
      PRICE HEADS-UP: the slide after 'Special offers' announces AA Grapevine's prices from January 1, 2027. It is for the November and December 2026 meetings and January 2027 at the latest, and it leaves the show by itself after January 31, 2027. To remind the room after that, add a slide of your own in the past tense ({ui:customize} → {ui:add}).
      TONIGHT'S TOPIC: the next page suggests one for each month, for a night without a guest speaker (the version 'No guest speaker', {ui:customize} → {ui:version}), or to suggest to a guest speaker.
      EVENTS: the 'Coming up' slide fills in by itself from the committee's /events/ page, with the next NETA 65 assembly above the list, and the Area's website (neta65.org) lists what's coming too. The volunteer lines on the workshop slide come from the events that need help.
      NOTES OF THE MEETING: there are no minutes to approve. {ui:customize} → {ui:paperwork} drafts short notes (service positions and counts only) from your details, and 'Start next month' clears the blanks that were for one night only.

