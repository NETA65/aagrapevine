# =====================================================================
#  Grapevine and La Viña Monthly Committee Meeting — the chair's template for every monthly meeting on Google
#  Meet (3rd Wednesday, 7:00–8:00 p.m. Central), as a web presentation on /orientation/ ("Workshop presentations").
#  From January 2027 each meeting opens with a guest speaker: the talk and questions, done by 7:30 p.m.; then the
#  committee's business until 8:00.
#
#  Made from the committee's PowerPoint deck of 2026-10-01 (the copy in the Panel 77 slides folder, rebuilt with
#  the Google Meet details and the guest speakers on 2026-11-11; the card links it as "PowerPoint copy",
#  `drive_title` below): every slide, with the same words on the slide and in the notes. Only what the
#  web player does differently was changed, and in November 2026 the move to Google Meet and the guest speakers:
#   · the orange [fill-ins] are {fill:…} blanks (Customize → Your details; kept on the chair's own device);
#   · the facts that change come from the site's data: {live:…} (the meeting dates: tonight's on the title
#     slide, with its month, the one after it on "Next meeting" and "Thank you" — a meeting stays tonight's until
#     midnight Central, so both read right during AND after it; the time and the Google Meet link and code;
#     tonight's guest speaker and next month's, from config/site.yml `meeting: speakers:`, which switch with the
#     meeting's day; the weekly open meetings and La Viña's workshop; this month's issues; both Books of the
#     Month; the next assembly) and `live` slides (story deadlines, coming events, the next twelve meeting
#     dates). A fact the site has nothing for says where to look ("see the Meetings page", "to be announced"),
#     so every sentence around one is written to read well with that phrase too. A meeting with NO guest
#     speaker (November 18 and December 16, 2026: the guest speakers start on January 20, 2027) says so: "none
#     tonight" for tonight's speaker, "none this time" for next month's; "to be announced"
#     is only for a speaker the committee's list doesn't name yet;
#   · the versions (Customize → Version): "With a guest speaker" (the first one: the hour from January 2027),
#     "No guest speaker" (the committee's business for the whole hour, as before: the meetings before January 20,
#     2027, or a month whose speaker can't come) and "No guest speaker, with a topic of the month";
#   · each note's TIME line is `minutes:` (the player writes the TIME line for the current version), or
#     `version_minutes` where the versions without a speaker give a slide its time of before. The TIME line is
#     the one that counts: a timekeeping tip names only minutes that agree with it, in every version
#     ({not:no-speaker,topic} / {only:no-speaker,topic} lines where the versions differ). The title slide (up
#     before 7:00), the part dividers ("a few seconds") and "Thank you" (up after the hour) have the least time
#     a slide can have;
#   · the notes name the player's buttons with {ui:…} ("Customize → Your details" on the English page,
#     "Personalizar → Tus datos" on the Spanish one), and Spanish words are marked {lang:es}…{/lang};
#   · the price heads-up shows only while AA Grapevine's price notice is current (when: "price_notice");
#   · "Topic of the month" and "Sharing" start switched off; the versions without a speaker show the sharing, and
#     "… with a topic of the month" the topic too, with the agenda's news row as "News and topic of the month"
#     (version_fields);
#   · the hidden appendix "For the chair" is facilitator pages (Customize → Prepare), rewritten for the web:
#     what stays current by itself, and what the chair fills in or checks.
#  The content stays English (the owner's decision); the card, the versions and the blanks' labels are
#  bilingual. Checked by tests/test_presentations.py (and by the build, with I18N_STRICT=1).
# =====================================================================
id: "committee-meeting"
order: 4
lang: "en"
title: "Grapevine and La Viña Monthly Committee Meeting"
short: "Monthly Committee Meeting"
eyebrow: "Opening"
footer: "NETA 65 Grapevine & La Viña Committee · {live:panel}"
minutes: 60
icon: "users"
tone: "grape"
drive_title: "Grapevine and La Viña Monthly Committee Meeting"
card:
  title:
    en: "Grapevine and La Viña Monthly Committee Meeting"
    es: "Reunión mensual del Comité de Grapevine y La Viña"
  summary:
    en: "A ready-to-use outline for the committee's monthly meeting on Google Meet: a guest speaker (from January 2027), then the committee's business, from the opening to the Responsibility Statement; the chair fills in the details."
    es: "Un esquema listo para usar de la reunión mensual del comité por Google Meet: primero habla un(a) orador(a) invitado(a) (desde enero de 2027) y después el comité trata sus asuntos, desde la apertura hasta la Declaración de Responsabilidad; quien coordina completa los detalles."
  audience:
    en: "For the Area Grapevine / La Viña chair, or the alternate, who leads the meeting. GVRs, RLVs, district chairs and any AA member are welcome to attend."
    es: "Para ti, si coordinas La Viña y Grapevine en el Área (o eres suplente) y diriges la reunión. Pueden asistir los RLV, los GVR, los coordinadores de distrito y cualquier miembro de AA."

# The versions (Customize → Version). The first one is the hour from January 2027: the guest speaker until 7:30
# (the four "Guest speaker" slides: introduction, talk, questions, thanks), then the committee's business, each
# part shorter. The other two are the committee's business for the whole hour, as before the guest speakers: "No
# guest speaker" (the meetings before January 20, 2027 — November 18 and December 16, 2026 —, or a month whose
# speaker can't come) and "No guest speaker, with a topic of the month" (the "Topic of the month" slide's notes,
# WHERE THE TIME COMES FROM: its 5 minutes come from the news block — 'Open meetings' and 'More news' are left out,
# and 'Grapevine and La Viña this month' and the deadlines take about 30 seconds each). Both give the slides their time of before (`version_minutes`), the agenda its rows
# of before (`version_fields`), and show the sharing that the speaker's questions replace in the first version:
# `only` lists their slides, so they can show the slides that start switched off. The ids stay as they were ("full",
# "topic"): a chair's device keeps the version chosen by its id.
presets:
  - id: "full"
    label:
      en: "With a guest speaker (about 60 minutes)"
      es: "Con orador(a) invitado(a) (unos 60 minutos)"
    minutes: 60
    note:
      en: "The guest speaker until 7:30 (the talk and questions), then the committee's business until 8:00. A night with no guest speaker (every meeting before January 20, 2027, or a speaker who can't come): choose 'No guest speaker'."
      es: "El orador o la oradora invitada hasta las 7:30 (su charla y las preguntas) y después los asuntos del comité hasta las 8:00. Una noche sin orador(a) invitado(a) (todas las reuniones antes del 20 de enero de 2027, o si el orador o la oradora no puede venir): elige «Sin orador(a) invitado(a)»."
  - id: "no-speaker"
    label:
      en: "No guest speaker (about 60 minutes)"
      es: "Sin orador(a) invitado(a) (unos 60 minutos)"
    minutes: 60
    only: ["title", "welcome", "serenity-prayer", "part-1", "preamble", "introductions", "new-reps", "agenda",
           "last-minutes", "chairs-report", "this-month", "deadlines", "open-meetings", "more-news",
           "price-heads-up", "treasurer", "district-reports", "part-2", "since-last-meeting", "coming-up",
           "old-business", "new-business", "workshops-volunteers", "part-3", "sharing", "action-items",
           "next-meeting", "responsibility", "thank-you"]
    note:
      en: "The committee's business for the whole hour, with the sharing before the closing: for every meeting before January 20, 2027 (the guest speakers start then), or a month whose guest speaker can't come. The agenda shows this version's own times."
      es: "Los asuntos del comité durante toda la hora, con un rato para compartir antes del cierre: para todas las reuniones antes del 20 de enero de 2027 (entonces empiezan los oradores invitados) o un mes en que el orador o la oradora invitada no pueda venir. La agenda muestra los horarios de esta versión."
  - id: "topic"
    label:
      en: "No guest speaker, with a topic of the month (about 60 minutes)"
      es: "Sin orador(a) invitado(a), con tema del mes (unos 60 minutos)"
    minutes: 60
    only: ["title", "welcome", "serenity-prayer", "part-1", "preamble", "introductions", "new-reps", "agenda",
           "last-minutes", "chairs-report", "this-month", "deadlines", "price-heads-up", "topic-of-the-month",
           "treasurer", "district-reports", "part-2", "since-last-meeting", "coming-up", "old-business",
           "new-business", "workshops-volunteers", "part-3", "sharing", "action-items", "next-meeting",
           "responsibility", "thank-you"]
    note:
      en: "Like 'No guest speaker', with the 'Topic of the month' slide; it leaves out 'Open meetings and La Viña's workshop' and 'More news' (post their links in the chat instead), as the topic slide's notes suggest. The agenda's news row reads 'News and topic of the month'."
      es: "Como «Sin orador(a) invitado(a)», con la diapositiva «Topic of the month»; deja fuera «Open meetings and La Viña's workshop» y «More news» (publica sus enlaces en el chat), como sugieren las notas de la diapositiva del tema. En la agenda, la fila de noticias dice «News and topic of the month»."

