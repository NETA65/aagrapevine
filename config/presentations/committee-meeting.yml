  # The deck's 2 × 2 tinted cards, one accent each (gv, vine, lv, grape).
  - id: "chairing-tips"
    layout: "columns"
    facilitator: true
    eyebrow: "Appendix · For the chair"
    title: "Chairing tips"
    style: "cards"
    columns:
      - heading: "Timekeeping"
        accent: "gv"
        items: ["Start at 7:00, end by 8:00", "A timekeeper signals at 2 minutes", "Long topics can wait a month"]
      - heading: "Group conscience"
        accent: "vine"
        items: ["Present, discuss, then decide", "Ask for the minority view", "Or carry it to next month"]
      - heading: "Rotation"
        accent: "lv"
        items: ["Rotate readers and note-takers", "Invite new reps to help", "Share tasks with the alternate"]
      - heading: "Principles before personalities"
        accent: "grape"
        items: ["Ideas, not people", "No 'star system' for writers", "Thank volunteers as a group"]
    notes: |
      NOT PRESENTED: a reference for the chair.
      TIMEKEEPING: Starting on time respects the people who came on time. A timekeeper who signals in the chat at two minutes lets the chair stay friendly. When a topic needs more than its slot, offer to carry it to next month or to a small working group.
      GROUP CONSCIENCE: Tradition Two: our leaders are but trusted servants; they do not govern. Present the question, let people ask and discuss, ask directly for the minority view, then decide, or wait a month if the districts need to talk it over.
      ROTATION: Give the readings, timekeeping and minutes to different members each month, and invite new reps into small tasks. Involve the alternate chair in planning, so the committee keeps going whoever chairs.
      PRINCIPLES BEFORE PERSONALITIES: Tradition Twelve. Keep discussions on ideas. Celebrate members who are published without building a 'star system' around them, and thank volunteers as a group.

  - id: "aa-safe"
    layout: "bullets"
    facilitator: true
    eyebrow: "Appendix · For the chair"
    title: "Keeping this presentation and the minutes AA-safe"
    items:
      - "This presentation and its notes are public, and so is any copy saved in the Panel 77 folders"
      - "No full names, faces, personal phones or emails: use service positions and [grapevine@neta65.org](grapevine@neta65.org)"
      - "No Grapevine or La Viña logos, covers, artwork, stories or Daily Quotes: link, or hold up the issue"
      - "Internal figures (Grapevine's calls with Area chairs, GSO's Quarterly Report): say them aloud with the source; never type them here"
      - "No screenshots of the Zoom gallery, and no recordings of members"
      - "Need a private copy? Keep it OUTSIDE the shared A65_GV folder (your own Drive, sharing set to Restricted). PRIVATE in a file name only keeps it off the website."
    notes: |
      NOT PRESENTED: a reference for the chair.
      WHY: This presentation, slides and notes, is published on the committee's website; what you type in {ui:customize} stays on this device unless you share a saved copy. The website also publishes the files in the Panel 77 Drive folder, and anyone with the link can open them: the whole A65_GV folder is shared as 'Anyone with the link: Viewer'. Anything that must stay private goes in your own Drive, never in the shared A65_GV folders: PRIVATE in a name only hides a file from the website, not from Drive. AA's pamphlet on anonymity (P-47) says a public web page needs the same care as press, radio and film: no full names and no full-face photos of members.
      COPYRIGHT: AA Grapevine, Inc. owns all Grapevine and La Viña content. Writing the magazines' names is fine, but their logos, covers, artwork and cartoons may not be reproduced, and stories need permission. The AA Preamble, with its credit line, is the exception we use.
      INSIDE THE MEETING: last names are fine inside AA for service business, but not in this presentation. Email lists go in BCC, and nobody's email or phone number is shared without their permission.
      UPDATE: only if the Area's or the website's practice changes.

