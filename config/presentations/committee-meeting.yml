  # The deck's 2 × 2 tinted cards, one accent each (gv, vine, lv, grape).
  - id: "chairing-tips"
    layout: "columns"
    facilitator: true
    eyebrow: "Appendix · For the chair"
    title: "Chairing tips"
    style: "cards"
    columns:
      - heading: "Timekeeping"
        accent: "gv"
        items: ["Start at 7:00; our guest is done by 7:30", "“2 minutes” in the chat at the speaker's 18th minute", "Close by 8:00; the parking lot after"]
      - heading: "Sharing, not reporting"
        accent: "vine"
        items: ["Experience, not reports or scores", "About 2 minutes each", "First-timers and new reps first"]
      - heading: "Rotation"
        accent: "lv"
        items: ["Rotate timekeepers and note-takers", "Invite new reps to help", "Share tasks with the alternate"]
      - heading: "Principles before personalities"
        accent: "grape"
        items: ["Ideas, not people", "No 'star system' for writers", "Thank volunteers as a group"]
    notes: |
      NOT PRESENTED: a reference for the chair.
      TIMEKEEPING: Starting on time respects the people who came on time. The guest speaker's talk is about 20 minutes: type '2 minutes' in the chat at the 18-minute mark, about 7:20, and keep the questions short, so our guest is thanked and done by 7:30. In the second half, a timekeeper who signals in the chat lets the chair stay friendly. Close by 8:00 with the Responsibility Statement; anything that needs more time can go to the parking lot, or to next month.
      SHARING, NOT REPORTING: this is not a business meeting. GVRs and RLVs share what's working, a challenge and the help they need, about two minutes each: experience, not reports, scores or totals by group. Call first on first-timers and new reps.
      ROTATION: Give the timekeeping and the notes to different members each month, and invite new reps into small tasks. Involve the alternate chair in planning, so the committee keeps going whoever chairs.
      PRINCIPLES BEFORE PERSONALITIES: Tradition Twelve. Keep discussions on ideas. Celebrate members who are published without building a 'star system' around them, and thank volunteers as a group.

  - id: "aa-safe"
    layout: "bullets"
    facilitator: true
    eyebrow: "Appendix · For the chair"
    title: "Keeping this presentation and the notes AA-safe"
    items:
      - "This presentation and its notes are public, and so is any copy saved in the Panel 77 folders"
      - "No full names, faces, personal phones or emails: use service positions and [grapevine@neta65.org](grapevine@neta65.org)"
      - "No Grapevine or La Viña logos, covers, artwork, stories or Daily Quotes: link, or hold up the issue"
      - "Internal figures (Grapevine's calls with Area chairs, GSO's Quarterly Report): say them aloud with the source; never type them here"
      - "No screenshots of the Meet tiles, and no recordings of members, in the meeting or in the parking lot"
      - "Guest speakers: first name and last initial at most, with their service position; never their e-mail or phone"
      - "Need a private copy? Keep it OUTSIDE the shared A65_GV folder (your own Drive, sharing set to Restricted). PRIVATE in a file name only keeps it off the website."
    notes: |
      NOT PRESENTED: a reference for the chair.
      WHY: This presentation, slides and notes, is published on the committee's website; what you type in {ui:customize} stays on this device unless you share a saved copy. The website also publishes the files in the Panel 77 Drive folder, and anyone with the link can open them: the whole A65_GV folder is shared as 'Anyone with the link: Viewer'. Anything that must stay private goes in your own Drive, never in the shared A65_GV folders: PRIVATE in a name only hides a file from the website, not from Drive. AA's pamphlet on anonymity (P-47) says a public web page needs the same care as press, radio and film: no full names and no full-face photos of members.
      COPYRIGHT: AA Grapevine, Inc. owns all Grapevine and La Viña content. Writing the magazines' names is fine, but their logos, covers, artwork and cartoons may not be reproduced, and stories need permission. The AA Preamble, with its credit line, is the exception we use (its slide is switched off since November 2026).
      INSIDE THE MEETING: last names are fine inside AA for service, but not in this presentation or in the notes of the meeting. E-mail lists go in BCC, and nobody's e-mail or phone number is shared without their permission.
      UPDATE: only if the Area's or the website's practice changes.

