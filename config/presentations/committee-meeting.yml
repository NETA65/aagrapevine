      STAYS CURRENT: the meeting dates and their guest speakers, the stores' offers, both Books of the Month, the story deadlines, this month's issues and the next ones, the weekly open meetings, La Viña's workshop, the coming events and the next assembly fill in by themselves, and the price heads-up shows only while it is current: they come from the committee website, which updates itself every day from the official Grapevine and La Viña sites. Its /monthly/, /contribute/, /meetings/, /events/ and /shop/ pages are the quickest place to check a theme, a deadline, a meeting, an offer or an event. When the website has nothing yet for one of them, the slide says where to look instead ('to be announced' for a guest speaker the committee's list doesn't name yet; a meeting with no guest speaker, like every one before January 20, 2027, says 'none tonight' or 'none this time').
      OFFICIAL PAGES: Books of the Month, aagrapevine.org/BOTM and aalavina.org/libro-del-mes. Open meetings, aagrapevine.org/grapevine-weekly-open and aalavina.org/calendario-de-eventos. Themes and deadlines, aagrapevine.org/contribute and aalavina.org/recursos ({lang:es}Temas de LV{/lang}).

  - id: "what-to-update-2"
