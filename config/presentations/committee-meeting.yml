# =====================================================================
#  Grapevine and La Viña Monthly Committee Meeting — the chair's template for every monthly Zoom meeting
#  (3rd Wednesday, 7:00–8:00 p.m. Central), as a web presentation on /orientation/ ("Workshop presentations").
#
#  Made from the committee's PowerPoint deck of 2026-10-01 (the copy in the Panel 77 slides folder, linked from
#  the card as "PowerPoint copy"): every slide, in the same order, with the same words on the slide and in the
#  notes. Only what the web player does differently was changed:
#   · the orange [fill-ins] are {fill:…} blanks (Customize → Your details; kept on the chair's own device);
#   · the facts that change come from the site's data: {live:…} (the meeting dates: tonight's on the title
#     slide, with its month, the one after it on "Next meeting" and "Thank you" — a meeting stays tonight's until
#     midnight Central, so both read right during AND after it; the time, the Zoom details and Zoom's number for
#     callers; the weekly open meetings and La Viña's workshop; this month's issues; both Books of the Month; the
#     next assembly) and `live` slides (story deadlines, coming events, the next twelve meeting dates). A fact
#     the site has nothing for says where to look ("see the Meetings page"), so every sentence around one is
#     written to read well with that phrase too;
#   · each note's TIME line is `minutes:` (the player writes the TIME line for the current version), or
#     `version_minutes` where a version gives a slide less time (a month with a topic of the month). The TIME
#     line is the one that counts: a timekeeping tip names only minutes that agree with it, in every version
#     ({not:topic} / {only:topic} lines where the versions differ). The title slide (up before 7:00), the part
#     dividers ("a few seconds") and "Thank you" (up after the hour) have the least time a slide can have;
#   · the notes name the player's buttons with {ui:…} ("Customize → Your details" on the English page,
#     "Personalizar → Tus datos" on the Spanish one), and Spanish words are marked {lang:es}…{/lang};
#   · the price heads-up shows only while AA Grapevine's price notice is current (when: "price_notice");
#   · "Topic of the month" starts switched off; the version "A month with a topic of the month" shows it, with
#     the agenda's news row as "News and topic of the month" (version_fields);
#   · the hidden appendix "For the chair" is facilitator pages (Customize → Prepare), rewritten for the web:
#     what stays current by itself, and what the chair fills in or checks.
#  The content stays English (the owner's decision); the card, the versions and the blanks' labels are
#  bilingual. Checked by tests/test_presentations.py (and by the build, with I18N_STRICT=1).
# =====================================================================
id: "committee-meeting"
order: 4
lang: "en"
title: "Grapevine and La Viña Monthly Committee Meeting"
short: "Monthly Committee Meeting"
eyebrow: "Opening"
footer: "NETA 65 Grapevine & La Viña Committee · {live:panel}"
minutes: 60
icon: "users"
tone: "grape"
drive_title: "Grapevine and La Viña Monthly Committee Meeting"
card:
  title:
    en: "Grapevine and La Viña Monthly Committee Meeting"
    es: "Reunión mensual del Comité de Grapevine y La Viña"
  summary:
    en: "A ready-to-use outline for the committee's monthly meeting on Zoom, from the opening to the Responsibility Statement; the chair fills in the details."
    es: "Un esquema listo para usar de la reunión mensual del comité por Zoom, desde la apertura hasta la Declaración de Responsabilidad; quien coordina completa los detalles."
  audience:
    en: "For the Area Grapevine / La Viña chair, or the alternate, who leads the meeting. GVRs, RLVs, district chairs and any AA member are welcome to attend."
    es: "Para ti, si coordinas La Viña y Grapevine en el Área (o eres suplente) y diriges la reunión. Pueden asistir los RLV, los GVR, los coordinadores de distrito y cualquier miembro de AA."

# The versions (Customize → Version). The notes describe one other selection: a month with a topic of the
# month (the "Topic of the month" slide's notes, WHERE THE TIME COMES FROM). Its 5 minutes come from the news
# block: 'Open meetings' and 'More news' are left out, and 'Grapevine and La Viña this month' and the deadlines
# take about 30 seconds each (their `version_minutes`), so the hour stays about 60 minutes; the agenda's news
# row says so by itself (its `version_fields`). `only` lists its slides, so it can show the slide that starts
# switched off.
presets:
  - id: "full"
    label:
      en: "The full meeting (about 60 minutes)"
      es: "La reunión completa (unos 60 minutos)"
    minutes: 60
  - id: "topic"
    label:
      en: "A month with a topic of the month (about 60 minutes)"
      es: "Un mes con tema del mes (unos 60 minutos)"
    minutes: 60
    only: ["title", "welcome", "serenity-prayer", "preamble", "introductions", "new-reps", "agenda",
           "last-minutes", "part-1", "chairs-report", "this-month", "deadlines", "price-heads-up",
           "topic-of-the-month", "treasurer", "district-reports", "part-2", "since-last-meeting", "coming-up",
           "old-business", "new-business", "workshops-volunteers", "part-3", "sharing", "action-items",
           "next-meeting", "responsibility", "thank-you"]
    note:
      en: "Shows the 'Topic of the month' slide and leaves out 'Open meetings and La Viña's workshop' and 'More news' (post their links in the chat instead), as the topic slide's notes suggest. The agenda's news row reads 'News and topic of the month'."
      es: "Muestra la diapositiva «Topic of the month» y deja fuera «Open meetings and La Viña's workshop» y «More news» (publica sus enlaces en el chat), como sugieren las notas de la diapositiva del tema. En la agenda, la fila de noticias dice «News and topic of the month»."

