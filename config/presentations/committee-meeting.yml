    title: "Grapevine deadlines"
    kind: "deadlines"
    options: { pub: "gv", limit: 6 }
    notes: |
      NOT PRESENTED: a reference for the chair.
      SOURCE: AA Grapevine's editorial calendar (aagrapevine.org/contribute). This list stays current by itself, and the 'Story deadlines coming up' slide shows the next ones.
      AS OF OCTOBER 2026, the 2027 calendar: August 2027, 'Sober Seniors', due January 1, 2027; September 2027, 'Young & Sober', due February 1, 2027; October 2027, 'AA in the Military', due March 1, 2027; November 2027, 'Classic Grapevine' (stories from the archive), no deadline; December 2027, 'Remote Communities / Sober Holidays!', due May 1, 2027. The 2028 calendar was not yet published; it was expected in early 2027.
      EARLIER DEADLINES, for a meeting before January 2027: the June 2027 issue, 'Emotional Sobriety', is due November 1, 2026, and the July 2027 Annual Prison Issue is due December 1, 2026; for that issue the editors especially want stories from women in long-term custody. The November issue is 'Classic Grapevine', made of stories from the archive, so it has no deadline.
