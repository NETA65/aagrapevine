# =====================================================================
#  Grapevine and La Viña Monthly Committee Meeting — the chair's template for every monthly meeting on Google
#  Meet (3rd Wednesday, 7:00–8:00 p.m. Central), as a web presentation on /orientation/ ("Workshop presentations").
#  It is not a business meeting (the committee's decision, November 2026): no minutes to approve, no reports.
#  From January 2027 each meeting opens with a guest speaker: the talk and questions, done by 7:30 p.m.; then
#  coming events, workshop requests, special offers, magazine topics and GVR and RLV sharing until 8:00, the
#  Responsibility Statement, and after the close an open "parking lot" (whatever is on anyone's mind).
#
#  Made from the committee's PowerPoint deck of 2026-10-01 (the copy in the Panel 77 slides folder; the card links
#  it as "PowerPoint copy", `drive_title` below). Only what the web player does differently was changed, then in
#  November 2026 the move to Google Meet, the guest speakers, and the new evening:
#   · the business slides (minutes, chair's report, treasurer, district reports, since we last met, old and new
#     business, action items, more news) and their blanks are gone; the AA Preamble is switched off (its slide
#     stays, in no version, for a chair who wants it back); a night without a guest speaker shares on a topic;
#   · the orange [fill-ins] are {fill:…} blanks (Customize → Your details; kept on the chair's own device);
#   · the facts that change come from the site's data: {live:…} (the meeting dates: tonight's on the title
#     slide, with its month, the one after it on "Next meeting" and "Thank you" — a meeting stays tonight's until
#     midnight Central, so both read right during AND after it; the time and the Google Meet link and code;
#     tonight's guest speaker and next month's, from config/site.yml `meeting: speakers:`, which switch with the
#     meeting's day; the stores' offers and both Books of the Month; the weekly open meetings and La Viña's
#     workshop; this month's issues and the next ones; the next assembly) and `live` slides (story deadlines,
#     coming events, the next twelve meeting dates). A fact the site has nothing for says where to look ("see the
#     Meetings page", "see the Shop page", "to be announced"), so every sentence around one is written to read
#     well with that phrase too. A meeting with NO guest speaker (November 18 and December 16, 2026: the guest
#     speakers start on January 20, 2027) says so: "none tonight" for tonight's speaker, "none this time" for
#     next month's; "to be announced" is only for a speaker the committee's list doesn't name yet;
#   · the versions (Customize → Version): "With a guest speaker" (the first one: the hour from January 2027) and
#     "No guest speaker" (a topic to share on until 7:30, then the same second half: the meetings before January
#     20, 2027, or a month whose speaker can't come);
#   · each note's TIME line is `minutes:` (the player writes the TIME line for the current version), or
#     `version_minutes` where "No guest speaker" gives a slide more time. The TIME line is the one that counts: a
#     timekeeping tip names only minutes that agree with it, in both versions ({not:no-speaker} /
#     {only:no-speaker} lines where they differ). The title slide (up before 7:00), the part dividers ("a few
#     seconds"), the parking lot and "Thank you" (after the hour) have the least time a slide can have;
#   · the notes name the player's buttons with {ui:…} ("Customize → Your details" on the English page,
#     "Personalizar → Tus datos" on the Spanish one), and Spanish words are marked {lang:es}…{/lang};
#   · the price heads-up shows only while AA Grapevine's price notice is current (when: "price_notice");
#   · the Preamble and the two "Tonight's topic" slides start switched off; "No guest speaker" shows the topic;
#   · the hidden appendix "For the chair" is facilitator pages (Customize → Prepare), rewritten for the web:
#     what stays current by itself, what the chair fills in or checks, and the message for the Google Meet chat.
#  The content stays English (the owner's decision); the card, the versions and the blanks' labels are
#  bilingual. Checked by tests/test_presentations.py (and by the build, with I18N_STRICT=1).
# =====================================================================
id: "committee-meeting"
order: 4
lang: "en"
title: "Grapevine and La Viña Monthly Committee Meeting"
short: "Monthly Committee Meeting"
eyebrow: "Opening"
footer: "NETA 65 Grapevine & La Viña Committee · {live:panel}"
minutes: 60
icon: "users"
tone: "grape"
drive_title: "Grapevine and La Viña Monthly Committee Meeting"
card:
  title:
    en: "Grapevine and La Viña Monthly Committee Meeting"
    es: "Reunión mensual del Comité de Grapevine y La Viña"
  summary:
    en: "A ready-to-use outline for the committee's monthly meeting on Google Meet: from January 2027 each meeting opens with a guest speaker, then coming events, workshop requests, special offers, magazine topics and sharing by GVRs and RLVs, to the Responsibility Statement and an open parking lot after it; the chair fills in the details."
    es: "Un esquema listo para usar de la reunión mensual del comité por Google Meet: desde enero de 2027 cada reunión empieza con un(a) orador(a) invitado(a); luego, eventos próximos, solicitudes de talleres, ofertas especiales, temas de las revistas y lo que comparten los RLV y GVR, hasta la Declaración de Responsabilidad y la reunión después de la reunión; quien coordina completa los detalles."
  audience:
    en: "For the Area Grapevine / La Viña chair, or the alternate, who leads the meeting. GVRs, RLVs, district chairs and any AA member are welcome to attend."
    es: "Para ti, si coordinas La Viña y Grapevine en el Área (o eres suplente) y diriges la reunión. Pueden asistir los RLV, los GVR, los coordinadores de distrito y cualquier miembro de AA."

# The versions (Customize → Version). The first one is the hour from January 2027: the guest speaker until 7:30
# (the four "Guest speaker" slides: welcome and introduction, talk, questions, thanks), then the second half until
# 8:00. "No guest speaker" is a night without one (the meetings before January 20, 2027 — November 18 and December
# 16, 2026 —, or a month whose speaker can't come): the chair introduces a topic and the members share on it until
# 7:30 (the two "Tonight's topic" slides, which start switched off: `only` lists its slides, so it can show them),
# then the same second half; its welcome and prayer get a minute each (`version_minutes`), its welcome and agenda
# their own words (`version_fields`). The ids stay as they were ("full", "no-speaker"): a chair's device keeps the
# version chosen by its id (one that had chosen the old "No guest speaker, with a topic of the month" is back on
# the first version).
presets:
  - id: "full"
    label:
      en: "With a guest speaker (about 60 minutes)"
      es: "Con orador(a) invitado(a) (unos 60 minutos)"
    minutes: 60
    note:
      en: "The guest speaker until 7:30 (the talk and questions), then coming events, workshop requests, special offers, magazine topics and GVR and RLV sharing until 8:00, and the parking lot after the close. A night with no guest speaker (every meeting before January 20, 2027, or a speaker who can't come): choose 'No guest speaker'."
      es: "El orador o la oradora invitada hasta las 7:30 (su charla y las preguntas); luego, hasta las 8:00, eventos próximos, solicitudes de talleres, ofertas especiales, temas de las revistas y lo que comparten los RLV y GVR, y después del cierre, la reunión después de la reunión. Una noche sin orador(a) invitado(a) (todas las reuniones antes del 20 de enero de 2027, o si el orador o la oradora no puede venir): elige «Sin orador(a) invitado(a)»."
  - id: "no-speaker"
    label:
      en: "No guest speaker (about 60 minutes)"
      es: "Sin orador(a) invitado(a) (unos 60 minutos)"
    minutes: 60
    only: ["title", "welcome", "serenity-prayer", "topic-of-the-month", "topic-sharing", "part-1", "agenda", "coming-up",
           "open-meetings", "workshops-volunteers", "special-offers", "price-heads-up", "this-month", "deadlines",
           "new-reps", "sharing", "part-3", "next-meeting", "responsibility", "parking-lot", "thank-you"]
    note:
      en: "No guest speaker at this meeting: we share on a topic until 7:30, then the same second half. For every meeting before January 20, 2027 (the guest speakers start then), or a month whose guest speaker can't come. The agenda shows this version's own times."
      es: "En esta reunión no hay orador(a) invitado(a): compartimos sobre un tema hasta las 7:30 y luego seguimos como siempre. Para todas las reuniones antes del 20 de enero de 2027 (entonces empiezan los oradores invitados) o un mes en que el orador o la oradora invitada no pueda venir. La agenda muestra los horarios de esta versión."

# The chair's blanks (Customize → Your details), in slide order: each one is an orange [fill-in], and `hint` is
# its text in the brackets (what an empty blank shows, in orange). They stay on the chair's device from month to
# month until changed — the week-before checklist (Customize → Prepare) says what to fill in, and "Start next
# month" (Customize → Agenda & notes) clears the ones that were for one night only.
fillins:
  - key: "presenter"
    label: { en: "Presenter's service position", es: "Puesto de servicio de quien presenta" }
    hint: "Service position"
    default: "Area 65 Grapevine / La Viña Chair"
    shared: true
  - key: "first_name"
    label: { en: "Your first name (only in your notes)", es: "Tu nombre de pila (solo en tus notas)" }
    hint: "first name"
    shared: true
    notes_only: true
  # Tonight's topic (a night without a guest speaker: the slides that start switched off)
  - key: "topic"
    label: { en: "Tonight's topic (a night without a guest speaker)", es: "El tema de esta noche (una noche sin orador(a) invitado(a))" }
    hint: "topic"
  - key: "topic_why"
    label: { en: "Topic · why now", es: "Tema · por qué ahora" }
    hint: "one line, e.g. this month's Grapevine theme"
  - key: "topic_points"
    label: { en: "Topic · what we'll look at", es: "Tema · qué vamos a ver" }
    hint: "one or two points, or a link"
  - key: "topic_question"
    label: { en: "Topic · a question to start the sharing", es: "Tema · una pregunta para empezar a compartir" }
    hint: "one question"
  # Workshop requests and volunteers: two events that need helpers
  - key: "volunteer_1_event"
    label: { en: "Volunteers · 1 · event and date", es: "Voluntarios · 1 · evento y fecha" }
    hint: "Event, date"
  - key: "volunteer_1_helpers"
    label: { en: "Volunteers · 1 · helpers needed", es: "Voluntarios · 1 · cuánta ayuda se necesita" }
    hint: "helpers needed"
  - key: "volunteer_2_event"
    label: { en: "Volunteers · 2 · event and date", es: "Voluntarios · 2 · evento y fecha" }
    hint: "Event, date"
  - key: "volunteer_2_helpers"
    label: { en: "Volunteers · 2 · helpers needed", es: "Voluntarios · 2 · cuánta ayuda se necesita" }
    hint: "helpers needed"
  # Magazine topics: a story to mention (the issues, the next ones and their themes fill in by themselves)
  - key: "gv_story"
    label: { en: "Grapevine · a story to mention", es: "Grapevine · una historia para mencionar" }
    hint: "title"
  - key: "gv_section"
    label: { en: "Grapevine · the story's section", es: "Grapevine · la sección de la historia" }
    hint: "section"
  - key: "lv_story"
    label: { en: "La Viña · a story to mention", es: "La Viña · una historia para mencionar" }
    hint: "título (title)"
  # (No blank for joining by phone: the meeting's Google Meet room has no number to call. The blanks of the old
  # business slides a chair's device may still keep — minutes, reports, old and new business, action items — are
  # simply never shown.)

# The chair's paperwork (Customize → Agenda & notes): the agenda e-mail, the reminder and short draft notes of
# the meeting, made from the blanks above and the site's facts, to copy, open in an e-mail app (every address in
# BCC: none is ever filled in) or print — and "Start next month". Everything stays on the chair's device, like the
# blanks. The texts are plain text, in English like the slides (the reminder adds a paragraph in Spanish). Inside
# them:
#   {fill:…} a blank · {live:…} a fact of the day · {paper:meeting} the date of the meeting the text is for (the
#   agenda and the reminder: the next meeting; the notes: the last one held) · {paper:month} its month ·
#   {paper:after} the meeting after it · {paper:agenda} the rows of the agenda slide, in the version the chair
#   chose (a line of its own) · {paper:meeting_es} / {paper:time_es} that date and the time in Spanish ·
#   {paper:committee_es} the committee's name as the Spanish pages give it (config/site.yml site.committee_es) ·
#   {paper:speaker} that meeting's guest speaker (name and service position), {paper:speaker_position},
#   {paper:speaker_topic}, and for the Spanish paragraph {paper:speaker_es} / {paper:speaker_topic_es} (the
#   position and topic in Spanish, as /es/meetings/ gives them) (config/site.yml `meeting: speakers:`; in the
#   paperwork, the agenda's speaker row names that meeting's speaker too, even on the evening the agenda is
#   already next month's).
# A line whose blanks are all empty is left out, and so is a heading left with nothing under it ("Volunteers"
# with no events): the text never shows an empty [hint]. A line with no blank always stays — except a speaker line
# for a meeting with no guest speaker (the meetings before January 20, 2027), which is left out too, and so is every
# speaker line in a version that leaves out the guest speaker's slide (`speaker_slide`: "No guest speaker", for a
# speaker who can't come), whatever the site's list still says. A version that keeps the speaker's slide for a
# meeting the site lists no speaker for gets a warning in the panel (its agenda row says "none at this meeting"),
# and "Start next month" switches to "No guest speaker" by itself when the next meeting has none listed.
# The link and the meeting code are public (our flyers, the Meetings page): they go in every text. There is no
# number to call: the meeting's Google Meet room has no phone dial-in.
# The notes follow the deck's rule: service positions and counts only, never names or an attendance list (the
# guest speaker by their service position too). There are no minutes to approve: this is not a business meeting.
paperwork:
  agenda_slide: "agenda"
  speaker_slide: "speaker-intro"
  agenda:
    subject: "Agenda: Grapevine and La Viña Committee meeting, {paper:meeting}"
    body: |
      Hello, everyone,

      Here is the plan for the {paper:month} meeting of the NETA 65 Grapevine and La Viña Committee. All AA members are welcome: GVRs, RLVs, GSRs, DCMs and anyone interested in the magazines. There's nothing to sign up for.

      When: {paper:meeting}, {live:meeting_time}
      Guest speaker: {paper:speaker}
      Topic: {paper:speaker_topic}
      Topic for sharing: {fill:topic}
      Join on {live:meeting_platform}: {live:meeting_url} (meeting code {live:meeting_code})

      Agenda (Central time)
      {paper:agenda}

      From 7:30 to 8:00: coming events, workshop requests, special offers, magazine topics and GVR and RLV sharing. Bring an event or a workshop request, and your sharing: what's working with Grapevine and La Viña in your group or district, a challenge in your service position, or help you need.

      Help wanted
      - {fill:volunteer_1_event}: {fill:volunteer_1_helpers}
      - {fill:volunteer_2_event}: {fill:volunteer_2_helpers}

      After we close at 8:00, the parking lot: stay on for whatever is on your mind.

      When you join, please type your first name, district and service position in the chat (Google Meet shows the name of the Google account you join with), and please don't take photos, screenshots or recordings of members.

      In service,
      {fill:presenter}
      {live:email}
      Meeting details: {live:site_url}meetings/#committee-meeting
  reminder:
    subject: "Reminder: Grapevine and La Viña Committee meeting, {paper:meeting}"
    body: |
      Reminder: the NETA 65 Grapevine and La Viña Committee meets {paper:meeting}, {live:meeting_time}, on {live:meeting_platform}: {live:meeting_url} (meeting code {live:meeting_code}).
      Guest speaker: {paper:speaker}
      Topic: {paper:speaker_topic}
      From 7:30 to 8:00: coming events, workshop requests, special offers, magazine topics and GVR and RLV sharing. After we close at 8:00, the parking lot: stay on for whatever is on your mind.
      All AA members are welcome, and there's nothing to sign up for.

      {lang:es}Recordatorio: la reunión mensual del {paper:committee_es} es el {paper:meeting_es}, {paper:time_es}, por {live:meeting_platform}: {live:meeting_url} (código de la reunión: {live:meeting_code}).{/lang}
      {lang:es}Orador(a) invitado(a): {paper:speaker_es}{/lang}
      {lang:es}Tema: {paper:speaker_topic_es}{/lang}
      {lang:es}Entre las 7:30 y las 8:00 p. m.: eventos próximos, solicitudes de talleres, ofertas especiales, temas de las revistas y lo que comparten los RLV y GVR. Después del cierre a las 8:00 p. m., la reunión después de la reunión: quédate para hablar de lo que tengas en mente.{/lang}
      {lang:es}La reunión es en inglés. Todos los miembros de AA son bienvenidos, y no hace falta registrarse.{/lang}

      Details: {live:site_url}meetings/#committee-meeting
      {fill:presenter} · {live:email}
  minutes:
    subject: "Draft notes: Grapevine and La Viña Committee meeting, {paper:meeting}"
    body: |
      DRAFT NOTES of the meeting, for the committee's records (this is not a business meeting: nothing to approve). Service positions and counts only: no names, phone numbers or email addresses, and no attendance list.

      NETA 65 Grapevine and La Viña Committee, monthly meeting on {live:meeting_platform}: {paper:meeting}, {live:meeting_time}
      Chair: {fill:presenter}
      Attended: about ___ members (by district: ___)
      Opened with a moment of silence and the Serenity Prayer.
      Guest speaker: {paper:speaker_position}
      Topic: {paper:speaker_topic}, then the members' questions
      Topic shared on: {fill:topic}

      Coming up and workshop requests
      - Events announced: ___
      - Workshop requests: ___

      Volunteers
      - {fill:volunteer_1_event}: {fill:volunteer_1_helpers}
      - {fill:volunteer_2_event}: {fill:volunteer_2_helpers}

      Magazine topics
      - A Grapevine story mentioned: {fill:gv_story}, in {fill:gv_section}
      - A La Viña story mentioned: {fill:lv_story}

      GVR and RLV sharing
      - Highlights (what's working, challenges, help needed): ___

      Follow-ups (what · who, by service position · by when)
      - ___

      Next meeting: {paper:after}, {live:meeting_time}, on {live:meeting_platform}.
      Closed with the Responsibility Statement; the parking lot followed.
  # "Start next month", after the meeting: the blanks below are cleared (a name ending in * clears every blank whose
  # name starts so: tonight's topic, the volunteers, the stories mentioned), the week-before checklist is unticked,
  # and the agenda and the reminder move on to the next meeting. Nothing is carried over (there is no old business);
  # the presenter is kept. It can be undone.
  next_month:
    clear: ["topic", "topic_*", "volunteer_*", "gv_story", "gv_section", "lv_story"]
    untick: ["week-before"]

slides:
  # ------------------------------------------------------------------ OPENING
  # The title slide is up while people arrive (about 10 minutes before 7:00): the hour starts when the chair
  # moves on, at 7:00 (0:00 of the TIME lines), so it has the least time a slide can have (15 seconds).
  # Its "Last updated" line is gone: the player shows "Current as of <the day's date>" by itself.
  # The month is the meeting's own ({live:meeting_month}, never the calendar's {live:month}): it switches with
  # the date under it ({live:meeting_day}, never {live:meeting_next}, which moves on as soon as the meeting ends),
  # at midnight Central after the meeting, so the two always name the same meeting.
  # Its notes name tonight's guest speaker ({live:speaker_name}) before a ";", never before a ".": a name ends
  # with its own period ("Rick W."), and "Rick W.." is a mistake.
  - id: "title"
    layout: "title"
    eyebrow: "NETA 65 · Grapevine & La Viña Committee"
    title: "Grapevine and La Viña Monthly Committee Meeting"
    subtitle: "{live:meeting_month} meeting · {live:panel}"
    lines:
      - "{fill:presenter}"
      - "{live:meeting_day} · {live:meeting_time} · {live:meeting_platform}"
    minutes: 0.25
    notes: |
      WHEN: Have this slide up about 10 minutes early, while people arrive. The hour starts when you move on, at 7:00 sharp: that is 0:00 in the timing lines of these notes.
      {not:no-speaker} THE HOUR: 7:00 the opening (a moment of silence and the Serenity Prayer), then our guest speaker: the talk and your questions, done by 7:30. From 7:30 to 8:00: coming events and workshop requests, special offers, magazine topics, and GVR and RLV sharing. At 8:00 we close with the Responsibility Statement, and the parking lot follows: an open, informal time for whatever is on anyone's mind. This is not a business meeting: no minutes to approve, no reports.
      {only:no-speaker} THE HOUR: 7:00 the opening (a moment of silence and the Serenity Prayer), then tonight's topic: you introduce it, and the members share on it until 7:30. From 7:30 to 8:00: coming events and workshop requests, special offers, magazine topics, and GVR and RLV sharing. At 8:00 we close with the Responsibility Statement, and the parking lot follows: an open, informal time for whatever is on anyone's mind. This is not a business meeting: no minutes to approve, no reports.
      DO: Start the Google Meet ({live:meeting_link}) by 6:50 p.m. Central, signed in to the Google account that owns this Meet link (the organizer of its calendar event): on Google Meet that account is the host, and only it can admit the people who ask to join, so it stays in the call until the end. Check that you can share your screen, that nobody is recording, and that someone watches the chat. Line up a timekeeper, and someone to jot down a few lines for the draft notes ({ui:customize} → {ui:paperwork}).
      {not:no-speaker} DO (the guest speaker): admit tonight's speaker at 6:50 for a sound check, just the two of you: their microphone, their camera, and how you'll signal the time ("2 minutes" in the chat). {live:speaker_slides}
      60 MINUTES AND THE PARKING LOT: on a free Google account, Google Meet ends a call of three or more people after 60 minutes. So admit the members at 7:00, not earlier (the sound check with the speaker alone is fine): the hour then ends at 8:00 sharp, right after the Responsibility Statement. Before that closing, tell the room: "if the call drops at eight, click the same link again for the parking lot". Third-party guides say a new call opens on the same link right away (Google doesn't document it). If the link doesn't reopen, the parking lot waits for next month, or you e-mail a new link from grapevine@neta65.org. If the account that owns the link has a plan without that limit, nothing happens at 8:00, and the call can open from 6:50 as people arrive.
      SAY (as people arrive): Welcome, come on in. We'll start right at seven. While we wait, please type your first name, your district and your service position in the chat, so we all know who's here.
      {not:no-speaker} TONIGHT'S GUEST SPEAKER (from the Meetings page): {live:speaker_name}; if there is none (every meeting before January 20, 2027, when the guest speakers start) or the speaker can't come, choose the version 'No guest speaker' ({ui:customize} → {ui:version}): a topic to share on until 7:30, with its own agenda.
      {only:no-speaker} NEXT MONTH: when the next meeting has a guest speaker, choose 'With a guest speaker' again ({ui:customize} → {ui:version}) before you send its agenda. 'Start next month' does it for you, and the paperwork says so if a listed speaker is left out.
      UPDATE EACH MONTH: nothing on this slide: the meeting's month and date (always the third Wednesday), the time and the panel fill in by themselves, and so does tonight's guest speaker on the next slides. Every orange item in square brackets, on any slide, is something to fill in: {ui:customize} → {ui:your_details} lists them all, and orange always means 'still to fill in'. What you typed last month stays on this device until you change it, so save your version first if you want to keep it ({ui:customize} → {ui:save_share}). The pages 'For the chair', in {ui:customize} → {ui:prepare}, list what to update on each slide and where to find it.
      TIP: This presentation, the slides AND these notes, is public on the committee's website. What you type in {ui:customize} stays on this device and is never sent anywhere, but it is shown on screen at the meeting and goes with any copy you save and share. Use service positions, not names, and keep internal figures out of it. Anything that must stay private goes in your own Drive, never in the shared A65_GV folders: PRIVATE in a name only hides a file from the website, not from Drive.

  # The welcome names tonight's plan: the guest speaker until 7:30, then the second half and the parking lot
  # ("No guest speaker" has its own first line, and the housekeeping said in full, which its minute has room for;
  # with a speaker it is one sentence, the rest being on the slide). On Google Meet a member's name is their
  # Google account's (a signed-in member can't rename themselves in the call), so the introductions go in the chat.
  - id: "welcome"
    layout: "bullets"
    title: "Welcome to the committee meeting"
    items:
      - "Tonight: our **guest speaker** until 7:30; then events, workshop requests, special offers, magazine topics and your sharing until 8:00"
      - "After 8:00: the parking lot, for whatever is on your mind"
      - "In the chat, please: **first name · district · service position**"
      - "Please stay muted unless you're speaking; raise your hand or use the chat for a turn"
      - "Please don't take photos, screenshots or recordings of members"
      - "All AA members are welcome; no registration is needed"
    version_fields:
      no-speaker:
        items:
          - "Tonight: a **topic** to share on until 7:30; then events, workshop requests, special offers, magazine topics and your sharing until 8:00"
          - "After 8:00: the parking lot, for whatever is on your mind"
          - "In the chat, please: **first name · district · service position**"
          - "Please stay muted unless you're speaking; raise your hand or use the chat for a turn"
          - "Please don't take photos, screenshots or recordings of members"
          - "All AA members are welcome; no registration is needed"
    takeaway: "Presented by the NETA 65 Grapevine & La Viña Committee for local service. This is not an official AA Grapevine, Inc. presentation."
    minutes: 0.5
    version_minutes: { no-speaker: 1 }
    notes: |
      {not:no-speaker} TIP (timekeeping): about 30 seconds for the welcome, 30 for the prayer and a minute to welcome our guest speaker and introduce the topic: the talk starts at about 7:02. So tonight the housekeeping is one sentence: the rest is on the screen.
      {only:no-speaker} TIP (timekeeping): about a minute for the welcome and a minute for the prayer: tonight's topic starts at about 7:02, and the sharing on it runs until 7:30.
      SAY: Good evening, and welcome to the monthly meeting of the NETA 65 Grapevine and La Viña Committee. My name is {fill:first_name}, and I'm grateful to serve as {fill:presenter}. Whether you're a GVR, an RLV, a district chair, a DCM, a GSR, or simply curious about the magazines, you're welcome here.
      {not:no-speaker} SAY: Tonight we open with our guest speaker: the talk and your questions, done by 7:30. Then coming events and workshop requests, special offers, the magazines' topics, and your sharing until eight. After we close, the parking lot: stay on for whatever is on your mind.
      {only:no-speaker} SAY: We have no guest speaker tonight, so we'll share on a topic until 7:30. Then coming events and workshop requests, special offers, the magazines' topics, and your sharing until eight. After we close, the parking lot: stay on for whatever is on your mind.
      {not:no-speaker} SAY: The housekeeping is on the screen: your first name, district and service position in the chat, please, and no photos, screenshots or recordings. We aren't recording tonight either.
      {only:no-speaker} SAY: A few housekeeping notes so the hour runs smoothly. If you haven't yet, please type your first name, district and service position in the chat: on Google Meet your name is the one your Google account shows. Cameras are up to you. Please stay muted unless you're speaking, and use the chat or the raise-hand button when you'd like a turn. Out of respect for everyone's anonymity, please don't take photos or screenshots while people are on camera, and please don't record. We aren't recording tonight either.
      {only:no-speaker} SAY: One more thing: this is our Area committee's meeting. We share what we learn from AA Grapevine and La Viña, but we don't speak for them, and this isn't an official AA Grapevine, Inc. presentation.
      DO: Before you say 'we aren't recording', make sure nobody is recording. If Spanish-speaking members are present, ask a bilingual volunteer ahead of time to give a short summary in the chat, and post the key links in both languages (the chat message is in {ui:customize} → {ui:prepare}).
      TRANSITION: Let's begin the way we always do.

  # The opening's prayer keeps the deck's grape (its quote slides' big quote mark) inside the Opening, whose colour
  # is Grapevine blue: `accent` colours this slide only (and the Preamble's, when it is switched on).
  - id: "serenity-prayer"
    layout: "quote"
    accent: "grape"
    title: "A moment of silence, then the Serenity Prayer"
    quote: "God, grant me the serenity to accept the things I cannot change, courage to change the things I can, and wisdom to know the difference."
    credit: "— The Serenity Prayer"
    source: "Said at many AA meetings. A.A. World Services does not hold its copyright (aa.org, Terms of Use)."
    minutes: 0.5
    version_minutes: { no-speaker: 1 }
    notes: |
      SAY: Please join me in a moment of silence for the alcoholic who still suffers, inside and outside our rooms. (Pause for about ten seconds.) Thank you. Those who wish, please join me in the Serenity Prayer. (Read it slowly, following the words on the screen.)
      DO: Online, unmuting everyone at once creates an echo. It usually works best if the chair says the prayer aloud and everyone else says it along with their microphones muted.
      TIP: 'Those who wish' keeps the invitation open: some members prefer not to pray, and silence is always welcome. How the committee opens its meeting is the committee's own decision. If its group conscience chooses a different opening, change this slide ({ui:customize} → {ui:edit}).
      {not:no-speaker} TRANSITION: Now let's welcome our guest speaker.
      {only:no-speaker} TRANSITION: Now let's turn to tonight's topic.

  # The Preamble, word for word, with AA Grapevine's credit line exactly as on the slide. Since November 2026 the
  # committee meeting doesn't read it (the committee's decision: it is not a business meeting any more): the slide
  # stays, switched off and in no version, for a night the committee asks for it (Customize → Slides).
  - id: "preamble"
    layout: "quote"
    accent: "grape"
    title: "Reading: the AA Preamble"
    starts_off: true
    optional: true
    quote: "Alcoholics Anonymous® is a fellowship of people who share their experience, strength and hope with each other that they may solve their common problem and help others to recover from alcoholism. The only requirement for membership is a desire to stop drinking. There are no dues or fees for A.A. membership; we are self-supporting through our own contributions. A.A. is not allied with any sect, denomination, politics, organization or institution; does not wish to engage in any controversy; neither endorses nor opposes any causes. Our primary purpose is to stay sober and help other alcoholics to achieve sobriety."
    credit: "Copyright © by AA Grapevine, Inc.; reprinted with permission. Revised per 2021 General Service Conference."
    minutes: 1
    notes: |
      WHEN: switched off, and in no version: in November 2026 the committee stopped reading the Preamble at this meeting, which is no longer a business meeting. To read it on a night the committee asks for it, switch this slide on in {ui:customize} → {ui:slides}: it comes right after the Serenity Prayer.
      TIP (timekeeping): a minute, when it is switched on: keep the welcome short that night, so the guest speaker (or tonight's topic) still starts by about 7:03.
      SAY: Could I have a volunteer to read the AA Preamble for us tonight? (Wait a moment; if nobody offers, read it yourself.) Thank you.
      DO: If you can, ask a reader ahead of time by private chat, so nobody is put on the spot.
      WHY THIS TEXT: The Preamble first appeared in the Grapevine in June 1947. AA Grapevine, Inc. holds its copyright and lets AA entities reprint it word for word with this credit line (SMF-101, Q4; Service Manual, p. 23). Read it exactly as written. This is the 2021 wording ('a fellowship of people').
      {not:no-speaker} TRANSITION: Now let's welcome our guest speaker.
      {only:no-speaker} TRANSITION: Now let's turn to tonight's topic.

  # ------------------------------------------------------------------ GUEST SPEAKER (7:01 – 7:30)
  # From January 2027 each meeting opens with a guest speaker (config/site.yml `meeting: speakers:`: a first name
  # and last initial, the service position and the topic, as /meetings/ lists them): welcomed and the topic
  # introduced right after the prayer (a minute), the talk from about 7:02 (about 20 minutes), questions from about
  # 7:22 (6½ minutes), thanked and done by 7:30. These four slides have an eyebrow of their own; "No guest speaker"
  # leaves them out. Their facts are tonight's speaker's until midnight Central after the meeting (as the meeting's
  # day on the title slide), and next month's speaker is that of the meeting after it. A night the Meetings page
  # lists no speaker for (the meetings before January 20, 2027) says "none tonight" (choose "No guest speaker");
  # one the committee's list doesn't name yet, "to be announced".
  - id: "speaker-intro"
    layout: "bullets"
    eyebrow: "Guest speaker"
    accent: "lv"
    title: "Welcome to our guest speaker"
    items:
      - "**{live:speaker_name}**"
      - "{live:speaker_position}"
      - "Topic: {live:speaker_topic}"
    takeaway: "About 20 minutes of sharing, then your questions: we finish with our guest by 7:30."
    minutes: 1
    notes: |
      TIP (timekeeping): about a minute, with the two or three sentences the speaker sent you: the talk starts at about 7:02.
      SAY: It's my pleasure to welcome tonight's guest speaker, {live:speaker_name}: {live:speaker_position}. Tonight's topic: {live:speaker_topic}. (Introduce the topic in a sentence or two, why it matters for our service with Grapevine and La Viña, then read the two or three sentences of introduction the speaker sent you.) Welcome, and thank you for being with us.
      SAY: Our guest will share for about 20 minutes, and then we'll have time for your questions. Please hold them until then; you can type them in the chat as they come to you.
      IF THE SPEAKER CAN'T COME: choose the version 'No guest speaker' ({ui:customize} → {ui:version}): a topic to share on until 7:30, and the texts in {ui:customize} → {ui:paperwork} then name no speaker. The run summary reminds you, about six weeks ahead, of a speaker who hasn't confirmed yet.
      IF THE SLIDE SAYS 'none tonight': the Meetings page lists no guest speaker for tonight (every meeting before January 20, 2027): choose the version 'No guest speaker'.
      IF IT SAYS 'to be announced' (the committee's list doesn't name tonight's speaker yet): type tonight's speaker on these slides ({ui:customize} → {ui:edit}), and tell whoever looks after the website; or choose the version 'No guest speaker'. What you type stays on this device, in every later month too, until you reset it: after the meeting, reset each slide you changed ({ui:customize} → {ui:edit} → 'Reset this slide to the original'), and next month's speaker fills in by itself again.
      ANONYMITY: on the slide, in the chat and in the notes, a first name and last initial at most, with the speaker's service position; never their last name, e-mail address or phone number.

  # The talk: a pause card with the speaker and the topic, up while they share (or under their own slides).
  - id: "speaker-talk"
    layout: "text"
    style: "break"
    eyebrow: "Guest speaker"
    accent: "lv"
    title: "Our guest speaker: {live:speaker_name}"
    body: "{live:speaker_topic}"
    minutes: 20
    notes: |
      TIP (timekeeping): about 20 minutes, from about 7:02. At the 18-minute mark, about 7:20, type "2 minutes" in the chat, as the speaker was told: they then wrap up.
      DO: Leave this slide up while the speaker talks. If they share slides, stop sharing your screen first so they can share theirs, and share this presentation again when they're done. Keep everyone else muted, and note the questions that come in the chat for later.
      SLIDES: {live:speaker_slides}
      WATCH FOR: the time. Our guest is done by 7:30 at the latest, questions included: some speakers have to leave then.

  - id: "speaker-questions"
    layout: "qa"
    eyebrow: "Guest speaker"
    accent: "lv"
    title: "Questions for our guest speaker"
    prompts:
      - "Raise your hand, or type your question in the chat"
      - "One short question each, so more of us can ask"
      - "About tonight's topic and the speaker's experience in service"
    note: "We finish with our guest by 7:30."
    minutes: 6.5
    notes: |
      TIP (timekeeping): about 6½ minutes, from about 7:22. At about 7:28, say 'time for one last question': our guest is thanked and done by 7:30, whatever is left.
      SAY: Thank you. We have a few minutes for your questions. Please raise your hand, or type your question in the chat and I'll read it out. One short question each, please, so more people can ask.
      DO: Read the questions from the chat aloud, without the name the chat shows. Take hands first from people who haven't spoken yet. If a question needs a long answer, ask the speaker whether they'd answer it later through the committee's address, grapevine@neta65.org.
      TIP: Keep it to the speaker's experience and the topic. If a question drifts into outside issues, gently bring it back to how we carry the message.

  # Its notes name next month's guest speaker ({live:speaker_after}) before a ";", never before a ".": a name with no
  # topic ends with its own period ("Greg G."), and "Greg G.." is a mistake. (The "Next meeting" slide's notes too.)
  - id: "speaker-thanks"
    layout: "bullets"
    eyebrow: "Guest speaker"
    accent: "lv"
    title: "Thank you to our guest speaker"
    items:
      - "Thank you, **{live:speaker_name}**, for your time and your service"
      - "Next month's guest speaker: {live:speaker_after}"
      - "Our guest is welcome to stay for the rest of the hour and the parking lot, or to leave now"
    takeaway: "Next: events, offers, magazine topics and your sharing, until 8:00."
    minutes: 0.75
    notes: |
      TIP (timekeeping): about 45 seconds: our guest is thanked and done by 7:30.
      SAY: Please join me in thanking {live:speaker_name} for tonight's talk. (Members can send a reaction, or unmute for a round of applause.) Thank you so much for being with us. You're welcome to stay for the rest of our hour, or to leave now: we know your time is precious. Next month's guest speaker: {live:speaker_after}; we hope to see you all then.
      DO: Let the speaker leave without a fuss. After the meeting, send them a short thank-you from the committee's address, grapevine@neta65.org.
      TRANSITION: Now let's turn to what's coming up, the stores' offers, the magazines' topics and your sharing.

  # ------------------------------------------------------------------ TONIGHT'S TOPIC (no guest speaker, 7:02 – 7:30)
  # A night with no guest speaker (the version "No guest speaker"): the chair introduces a topic (from about 7:02,
  # two minutes), and the members share on it until 7:30. Both slides start switched off: that version shows them.
  - id: "topic-of-the-month"
    layout: "bullets"
    eyebrow: "Tonight's topic"
    accent: "lv"
    title: "Tonight's topic: {fill:topic}"
    starts_off: true
    items:
      - "Why now: {fill:topic_why}"
      - "What we'll look at: {fill:topic_points}"
      - "A question to start us off: {fill:topic_question}"
    takeaway: "We share experience and ideas here; each group decides for itself."
    minutes: 2
    notes: |
      WHEN: a night with no guest speaker (every meeting before January 20, 2027, or a month whose speaker can't come): the version 'No guest speaker' ({ui:customize} → {ui:version}) shows this slide and the sharing after it. With a guest speaker it stays switched off: the speaker's talk takes its place.
      TIP (timekeeping): about 2 minutes, from about 7:02: a sentence or two on why the topic matters now, what we'll look at, and the question that starts the sharing.
      SAY: Tonight's topic: {fill:topic}. (Two or three sentences on why it matters now, and what we'll look at.) Here's a question to start us off: {fill:topic_question} Who would like to share first?
      WHICH TOPIC: the page 'Suggested topics: the year at a glance' ({ui:customize} → {ui:prepare}) suggests one for each month, or take this month's Grapevine or La Viña theme. In February and March, the Conference agenda items for the Conference Committee on Grapevine and La Viña make a good topic, to help prepare our delegate (in 2027, they include the final report of the Fellowship survey on Grapevine's products); in May, the delegate reports back.
      DO: In February, March and May, invite the delegate or the alternate delegate ahead of time. Send any background material by e-mail beforehand (BCC). Keep internal figures off the slide.
      UPDATE: the topic and its three lines ({ui:customize} → {ui:your_details}).

  - id: "topic-sharing"
    layout: "qa"
    eyebrow: "Tonight's topic"
    accent: "lv"
    title: "Sharing on tonight's topic"
    starts_off: true
    prompts:
      - "Your experience with tonight's topic, in your group or in your service"
      - "Raise your hand, or type in the chat that you'd like a turn"
      - "About 2 to 3 minutes each, so more of us can share"
    note: "We share on the topic until 7:30."
    minutes: 25
    notes: |
      WHEN: in the version 'No guest speaker' only (this slide starts switched off).
      TIP (timekeeping): about 25 minutes, from about 7:04 to 7:30. At about 7:28, say 'time for one last share': the second half starts at 7:30, whatever is left.
      SAY: The floor is open. Share your experience, strength and hope on tonight's topic: what you've seen in your group, in your district or in your own service. Please keep it to two or three minutes, so more of us can share.
      DO: Wait through the silence; someone usually speaks within ten seconds. Call first on people who haven't spoken yet tonight, and make sure new reps get a turn. Read questions from the chat aloud, without the names the chat shows.
      TIP: Keep it to experience, not reports: what worked, what didn't, what we'd try. If a share drifts into outside issues, such as politics, treatment methods, other fellowships or commercial apps, gently bring it back to how we carry the message with Grapevine and La Viña.
      TRANSITION: Thank you all. Let's turn to what's coming up, the stores' offers, the magazines' topics and your sharing.

  # ------------------------------------------------------------------ 1. EVENTS, OFFERS, TOPICS AND SHARING (7:30 – 8:00)
  # The second half, the same in both versions, in the committee's order: coming up (events), workshop requests
  # and volunteers, special offers, magazine topics, then GVR and RLV sharing (experience, not reports).
  - id: "part-1"
    layout: "section"
    number: 1
    title: "Events, offers, topics and sharing"
    subtitle: "Coming up · workshop requests · special offers · magazine topics · GVR and RLV sharing"
    accent: "gv"
    minutes: 0.25
    notes: |
      SAY: It's 7:30: the second half of our hour. First what's coming up and your workshop requests, then the stores' special offers and the magazines' topics and deadlines, and then the floor is yours: GVR and RLV sharing until just before eight.
      TIP: Keep your own part short and lively. The most valuable time tonight is what the GVRs and RLVs share, so protect that quarter of an hour.

  # The agenda's clock times are the committee's plan for the hour (Central time), not times the player works
  # out, so the rows have no `from:`. It is shown at 7:30: the rest of the hour. The guest speaker's row names
  # tonight's speaker (in the paperwork, the speaker of the meeting the agenda is for); "No guest speaker" shows its
  # own rows (`version_fields`: the whole list, with tonight's topic in place of the speaker's two rows).
  - id: "agenda"
    layout: "agenda"
    title: "Tonight's agenda (Central time)"
    items:
      - { time: "7:00", title: "Opening: a moment of silence and the Serenity Prayer" }
      - { time: "7:01", title: "Guest speaker: {live:speaker_name}" }
      - { time: "7:22", title: "Questions for our guest speaker" }
      - { time: "7:30", title: "Coming up and workshop requests" }
      - { time: "7:35", title: "Special offers" }
      - { time: "7:37", title: "Magazine topics" }
      - { time: "7:40", title: "GVR and RLV sharing" }
      - { time: "7:57", title: "Next meeting; the Responsibility Statement" }
      - { time: "8:00", title: "The parking lot (after the meeting)" }
    version_fields:
      no-speaker:
        items:
          - { time: "7:00", title: "Opening: a moment of silence and the Serenity Prayer" }
          - { time: "7:02", title: "Tonight's topic and sharing" }
          - { time: "7:30", title: "Coming up and workshop requests" }
          - { time: "7:35", title: "Special offers" }
          - { time: "7:37", title: "Magazine topics" }
          - { time: "7:40", title: "GVR and RLV sharing" }
          - { time: "7:57", title: "Next meeting; the Responsibility Statement" }
          - { time: "8:00", title: "The parking lot (after the meeting)" }
    minutes: 0.5
    notes: |
      WHEN: shown at 7:30, after the guest speaker (or tonight's topic): here's the rest of our hour.
      {not:no-speaker} SAY: Here's the plan for the rest of our hour. After our guest speaker: what's coming up and your workshop requests, the stores' special offers, the magazines' topics, and then your sharing. We close with the Responsibility Statement at eight, and the parking lot follows. Our timekeeper tonight is (first name), who'll give a gentle signal in the chat when an item runs over.
      {only:no-speaker} SAY: Thank you for tonight's sharing. Here's the plan for the rest of our hour: what's coming up and your workshop requests, the stores' special offers, the magazines' topics, and then your sharing. We close with the Responsibility Statement at eight, and the parking lot follows. Our timekeeper tonight is (first name), who'll give a gentle signal in the chat when an item runs over.
      TIP (timekeeping): about 30 seconds. The times on the slide are the committee's plan, not a rule: the second half keeps a few minutes spare before eight (through January 2027 the price heads-up takes one of them). If the sharing runs long because members are sharing real experience, shorten the announcements instead: the sharing belongs to the members. Start on time even if only a few people are there; it respects the people who came on time.
      UPDATE: Change the times only if the committee changes its format ({ui:customize} → {ui:edit}). The version 'No guest speaker' shows its own plan by itself.

  # The table of fill-in rows → the next events on /events/ (the CityWide table, our Grapevine Meeting, workshops,
  # assemblies and other Area events: filter "neta"). The deck's row for the NETA 65 assembly is the line above the
  # list ({live:assembly_next}): the next assembly is often months away, after the five rows. La Viña's monthly
  # workshop has its own slide ("Open meetings"). A monthly series (the table, the Grapevine Meeting) takes one row:
  # its next date.
  - id: "coming-up"
    layout: "live"
    title: "Coming up"
    kind: "events"
    intro: "Next assembly: {live:assembly_next}"
    options: { filter: "neta", limit: 5 }
    takeaway: "Full calendar: [{live:site}/events/](/events/)"
    minutes: 2
    notes: |
      TIP (timekeeping): about 2 minutes: read the rows in a sentence each, and leave the details to the Events page.
      SAY: Here's what's coming up. Our table at CityWide Dallas is on the second Saturday of every month, from 5:30 to 7:30 p.m., at Lovers Lane United Methodist Church; the potluck is at 5:30 and the speaker at 7. Our Grapevine Meeting, an online AA meeting in English, is on the first Wednesday, at seven, on the same Google Meet link as this meeting: next on {live:grapevine_meeting_next}. (Read the other rows: the workshops, and the next assembly above them.) If you'd like to help at any of these, please say so in the chat or e-mail the committee.
      DO: Ask who can help at each event that needs volunteers, and note first names only for the follow-up e-mail. Those events and the helpers they need are the volunteer lines of 'Workshop requests and volunteers' ({slide:workshops-volunteers}).
      TIP: At a table we show the magazines and share information. Members buy directly from the official stores, or a group buys after its group conscience approves the expense. Our committee doesn't collect money. Take photos only of the table, never of people.
      REFERENCE: The next assembly: {live:assembly_next}. The page 'CityWide booth, Grapevine Meeting and Area events, coming up' ({ui:customize} → {ui:prepare}) lists the Area's events with the table's and the Grapevine Meeting's dates. Check the Area's website (neta65.org) before you announce an assembly, especially while its details are still to be confirmed.
      STAYS CURRENT: every row, and the next assembly above them, fill in by themselves from the committee's /events/ page, and its calendar feed lists the next dates too.

  # The weekly open meetings come from the site's data, as the Meetings page lists them: their day and time
  # ({live:gv_open_meeting}, {live:lv_open_meeting} — "starting Nov. 5, 2026" until La Viña's first meeting, then
  # "since", so the slide never calls it running before it starts) and their shared Zoom room
  # ({live:open_meeting_zoom}); La Viña's monthly workshop takes its time and Zoom room from config/site.yml
  # (recurring_events). The small "as of [Month YYYY]" line is gone: these facts stay current, and the player
  # shows the date they are current as of. "\u00a0" is a space that never breaks a line, so "Zoom" stays with
  # its ID, as the site's facts keep the ID's own digits together.
  - id: "open-meetings"
    layout: "bullets"
    title: "Open meetings and La Viña's workshop"
    optional: true
    items:
      - text: "**Grapevine Weekly Open AA Meeting**, in English"
        items: ["{live:gv_open_meeting} · {live:open_meeting_zoom}"]
      - text: "{lang:es}**Reunión Abierta de La Viña**{/lang}, La Viña's open meeting in Spanish"
        items: ["{live:lv_open_meeting} · same Zoom room"]
      - text: "{lang:es}**Taller Mensual y Virtual de La Viña**{/lang}, La Viña's monthly workshop in Spanish"
        items: ["Usually the 4th Thursday, {live:lv_workshop_time} · Zoom\u00a0{live:lv_workshop_zoom_id}"]
    takeaway: "Workshop dates: [www.aalavina.org/calendario-de-eventos](https://www.aalavina.org/calendario-de-eventos)"
    minutes: 0.5
    notes: |
      IF NOTHING CHANGED since last month: say one sentence ('the open meetings are on the screen, and I'll post the links in the chat') and move on, or switch this slide off ({ui:customize} → {ui:slides}) and post the links in the chat.
      SAY: AA Grapevine and La Viña hold their own open AA meetings on Zoom, and anyone may join. The Grapevine Weekly Open, in English: {live:gv_open_meeting}. It has a host and two speakers, and it's recorded for the Grapevine's podcast. La Viña's open meeting in Spanish, the {lang:es}Reunión Abierta de La Viña{/lang}, in the same Zoom room: {live:lv_open_meeting}. La Viña also holds a monthly virtual workshop in Spanish on Zoom, the {lang:es}Taller Mensual y Virtual de La Viña{/lang}, usually on the fourth Thursday, {live:lv_workshop_time}, to keep members up to date on La Viña's news and products. In November and December La Viña has held it on the Thursday before Thanksgiving and before Christmas, so please check La Viña's events calendar each month.
      DO: Before the meeting, check aagrapevine.org/grapevine-weekly-open and La Viña's events calendar (aalavina.org/calendario-de-eventos) for any change, and post the next workshop date in the chat. Next date listed on the committee's /events/ page: {live:lv_workshop_next}.
      SOURCE: The {lang:es}Reunión Abierta de La Viña{/lang} is known from La Viña's flyer (2026), which gives its start as Thursday, November 5, 2026, at noon Eastern, in the Grapevine Weekly Open's Zoom room. Until that day the slide says 'starting Nov. 5, 2026', and from then on 'since Nov. 5, 2026'. Its page on La Viña's site (checked November 11, 2026): aalavina.org/podcast (the meeting and its recordings).
      TIP: Say 'usually the fourth Thursday': La Viña's own calendar has kept the fourth Thursday even in months with five Thursdays. It starts at 3 p.m. Eastern, La Viña's own time; La Viña publishes no end time, so the committee lists it as one hour. Always give the calendar link along with the rule.
      ANONYMITY: AA Grapevine records both weekly meetings to publish them as podcasts, and says its podcast respects anonymity. Anyone who speaks at these meetings should know they are recorded.
      STAYS CURRENT: the weekly open meetings' days, times, Zoom room and passcode (as the committee's /meetings/ page lists them), and La Viña's workshop time and Zoom room, fill in by themselves. If either magazine's website shows a change that the committee website doesn't have yet, tell whoever looks after the website.

  - id: "workshops-volunteers"
    layout: "columns"
    title: "Workshop requests and volunteers"
    style: "panels"
    columns:
      - heading: "Request a workshop"
        items:
          - "Writing: Grapevine, La Viña or bilingual"
          - "Recording your story by phone"
          - "New-rep orientation, or a short talk"
          - "Ask: [grapevine@neta65.org](grapevine@neta65.org)"
          - "Free printed materials for your event: [gvrc@aagrapevine.org](gvrc@aagrapevine.org), 4–6 weeks ahead"
      - heading: "Volunteer"
        items:
          - "{fill:volunteer_1_event}: {fill:volunteer_1_helpers}"
          - "{fill:volunteer_2_event}: {fill:volunteer_2_helpers}"
          - "To help: say so in the chat, or write to [grapevine@neta65.org](grapevine@neta65.org)"
    takeaway: "Presented by our Area committee, not by AA Grapevine, Inc."
    minutes: 2
    notes: |
      TIP (timekeeping): about 2 minutes: the requests in a sentence, the room's own requests, then the volunteer lines.
      SAY: Any group or district can ask the committee for a workshop: a writing workshop for Grapevine or La Viña, a session on recording your story by phone, an orientation for new reps, or a short talk at a group or district meeting. Just e-mail the committee with the date, the place and the language. Does anyone have a workshop request tonight? And here's where we could use some help. (Read the volunteer lines.)
      DO: Write down each request with a contact by service position, and follow up by e-mail (BCC when you write to several people): it goes in the follow-ups of your notes. For events, the Grapevine office can send free printed materials: write to gvrc@aagrapevine.org four to six weeks ahead with your name, Area, service position and contact details, and the event's name, date and expected attendance. The office may reserve printed materials for larger events (about 100+, as reported on the May 2026 Area Chair call), so ask early.
      TIP: Say plainly at every workshop that our Area committee presents it, not AA Grapevine, Inc. If you invite Grapevine office staff to speak, the committee that invites them pays their expenses. And never promise anyone that their story will be published.
      UPDATE ({ui:customize} → {ui:your_details}): the volunteer lines, every month, from the events on the 'Coming up' slide that need help.

  # The stores' offers of the day ({live:store_offers}: config/site.yml store_offers, as /shop/#offers lists
  # them, each with its days; the line switches when an offer starts or ends, so a copy opened later stays right)
  # and both Books of the Month ({live:botm}, {live:botm_lv}: until each offer ends, then where to look). Carry the
  # Message is described, never sold. Information only: our committee doesn't collect money, and each member and
  # group decides what, if anything, to buy (never "subscribe now", a percentage off or a price as a bargain).
  - id: "special-offers"
    layout: "bullets"
    title: "Special offers"
    items:
      - "At the stores: {live:store_offers}"
      - "Grapevine's Book of the Month: {live:botm}"
      - "{lang:es}Libro del mes{/lang} of La Viña: {live:botm_lv}"
      - "Carry the Message: [{live:site}/shop/#carry](/shop/#carry)"
    takeaway: "We share information; each member and group decides what, if anything, to buy. Details: [{live:site}/shop/#offers](/shop/#offers)"
    minutes: 2
    notes: |
      TIP (timekeeping): about 2 minutes: a sentence for each line.
      SAY: Here's what the Grapevine and La Viña stores have on offer right now: {live:store_offers}. Each magazine also has a Book of the Month, an older book offered at a lower price for a set time: from Grapevine, {live:botm}; from La Viña, the {lang:es}Libro del mes{/lang}: {live:botm_lv}. Our committee's Shop page has the details and the conditions, with links to the official stores.
      SAY (Carry the Message): Carry the Message is a way to reach an alcoholic who can't get the magazines. A member or a group buys a gift certificate or a subscription, and AA Grapevine or La Viña turns it into a subscription for an alcoholic in need: in a treatment center, a correctional facility, a hospital or a detox. It's a purchase from the official stores, not a donation, and our committee doesn't collect money for it.
      TIP: Describe, never sell. Keep an informative attitude, not a 'hard sell': the General Service Conference asked for exactly that in Grapevine presentations in 1960. Give the facts and the link, never a reason to rush, and never call a purchase a contribution to Grapevine: AA Grapevine, Inc. accepts no contributions.
      DO: Post the Shop page's link in the chat ({live:site}/shop/#offers), so reps can read the conditions themselves; the chat message in {ui:customize} → {ui:prepare} has it.
      STAYS CURRENT: the stores' offers (with their days, as the committee's /shop/ page lists them) and both Books of the Month fill in by themselves, each until its offer ends; when there is none, the line points to the Shop page or to the magazine's own page instead.

  # AA Grapevine's letter of October 1, 2026. The slide is in the show only while the site's price notice is
  # current (config/site.yml price_changes: from October 1, 2026 through January 31, 2027 — the deck's "the
  # October to December 2026 meetings and January 2027 at the latest"), and never after January 31, 2027
  # (show_until, the generator's PRICE_HEADS_UP_UNTIL): a notice of a later price change must not bring these
  # figures back. They are the letter's own (new price, up from the old one), so they stay as written rather
  # than {live:price_…}, which would show the price of the day. Information only: never "before prices go up".
  - id: "price-heads-up"
    layout: "table"
    title: "Heads-up: new prices from January 1, 2027"
    when: "price_notice"
    show_until: "2027-01-31"
    header: ["", "Grapevine", "La Viña"]
    rows:
      - ["Print, 1 year", "**$39.00** (up from $36.00)", "**$19.50** (up from $18.00)"]
      - ["Digital, 1 year", "**$34.00** (up from $29.99)", "**$17.00** (up from $14.99)"]
      - ["Every book", "**$2.00** more", "**$2.00** more"]
    widths: [3.0, 4.4, 4.4]
    first_col_bold: true
    source: "Source: AA Grapevine's letter to intergroups and central offices, October 1, 2026. Other plans and current prices: the official stores or [{live:site}/shop/](/shop/)"
    takeaway: "Pass it on to your groups, and to treasurers planning the 2027 budget."
    minutes: 1
    notes: |
      WHEN: for the November and December 2026 meetings, and January 2027 at the latest: this slide is in the show by itself only until January 31, 2027. If the committee still wants a reminder after that, add a slide of your own in the past tense ('Prices since January 1, 2027'), without the 'up from' figures ({ui:customize} → {ui:add}).
      TIP (timekeeping): a minute, while this slide is in the show: it comes out of the few minutes the second half keeps spare, so keep the offers just before it short.
      SAY: Here's a heads-up from AA Grapevine to pass on. On October 1, AA Grapevine wrote to intergroups and central offices that its prices change on January 1, 2027. A year of Grapevine in print goes from $36 to $39, and a year of La Viña in print from $18 to $19.50. Digital goes from $29.99 to $34 for Grapevine, and from $14.99 to $17 for La Viña. And every Grapevine and La Viña book costs $2 more. AA Grapevine gives the reason as rising costs: printing, paper and materials, fulfillment, postage and shipping. Please tell your groups, and especially the group treasurers who are planning the 2027 budget. As always, each group decides what, if anything, to buy.
      DO: Post the prices in the chat so reps can copy them. The committee website announces the change on its Shop and Bulletin pages, and its Shop page switches to the new prices by itself on January 1, 2027.
      TIP: Share it as information, not as a reason to rush: never suggest subscribing or buying ahead of the new prices. The Conference asked for an informative attitude rather than a hard sell in Grapevine presentations (1960 Advisory Action). The letter covers only the yearly print and digital subscriptions and the books; it says nothing about 2- or 3-year, Complete or monthly plans or other regions, so don't guess at those: point people to the official stores or the committee's Shop page.
      SOURCE: AA Grapevine, Inc., letter to intergroups and central offices, October 1, 2026: 'Grapevine & La Viña Pricing Update, Effective January 1, 2027'. The 2026 prices: the official stores, October 2026.
      UPDATE: nothing: the slide leaves the show by itself after January 31, 2027 (see WHEN).

  # This month's issues and the next ones, with their themes, come from the site's data ({live:…}); the stories to
  # mention are the chair's blanks. (Both Books of the Month are on "Special offers".)
  - id: "this-month"
    layout: "columns"
    title: "Magazine topics: this month"
    style: "panels"
    columns:
      - heading: "Grapevine (monthly)"
        accent: "gv"
        items:
          - "**Issue:** {live:gv_issue}"
          - "**Next:** {live:gv_next_issue}"
          - "A story to mention: {fill:gv_story}, in {fill:gv_section}"
      - heading: "La Viña (every two months)"
        accent: "lv"
        items:
          - "**Issue:** {live:lv_issue}"
          - "**Next:** {live:lv_next_issue}"
          - "A story to mention: {fill:lv_story}"
    takeaway: "This month's issues, dates and ideas: [{live:site}/monthly/](/monthly/)"
    minutes: 1.5
    notes: |
      TIP (timekeeping): about 1½ minutes: this month's themes, the next issues, and one story per magazine.
      SAY: Here's what's in the magazines. This month's theme in Grapevine: {live:gv_theme}; the next issue: {live:gv_next_issue}. In La Viña, for these two months: {live:lv_theme}; the next issue: {live:lv_next_issue}. One story that stayed with me is {fill:gv_story}; you'll find it in the {fill:gv_section} section.
      DO: Hold the printed issue up to your camera, or open it in the app. Don't put covers, artwork or story text on the slide: AA Grapevine's copyright policy doesn't allow it without permission. Mention a story by its title and invite people to read it.
      ASK: Has anyone used this month's theme as a meeting topic at their group? How did it go?
      STAYS CURRENT: both issues, the next ones and their themes fill in by themselves from the committee website.
      UPDATE ({ui:customize} → {ui:your_details}): one story per magazine. The committee's /monthly/ page has all of it.
      TIP: Grapevine comes out every month; La Viña every two months, so one La Viña issue covers two months (for example, November/December).

  # The four-row table of fill-ins → the next deadlines from the site's data (/contribute/#deadlines): the next
  # two of EACH magazine (`limit_each`; an issue with two themes is never cut in half, so a row may be added).
  - id: "deadlines"
    layout: "live"
    title: "Story topics and deadlines coming up"
    kind: "deadlines"
    options: { pub: "both", limit: 4, limit_each: 2 }
    takeaway: "Send stories: [www.aagrapevine.org/submit-your-story](https://www.aagrapevine.org/submit-your-story) · [www.aalavina.org/comparte](https://www.aalavina.org/comparte)"
    minutes: 1
    notes: |
      TIP (timekeeping): about a minute: the themes and their dates, and where to send a story.
      SAY: If you or someone in your group has a story on one of these themes, here's when the magazines need it. Grapevine starts choosing stories about five months before an issue's cover date, so the deadlines come early. Anyone in AA can write; you don't need to be a writer, and the editors take care of spelling. Grapevine stories go through the form on its website or to gveditorial@aagrapevine.org. La Viña stories go through its '{lang:es}Comparte{/lang}' page or to manuscritoslv@aagrapevine.org. Writers give their full name and contact details to the office, and the magazine protects their anonymity in print.
      ASK: Is any group thinking about a writing workshop around one of these themes? Tell us after the meeting, or write to the committee.
      STAYS CURRENT: the next two deadlines of each magazine fill in by themselves from the committee's /contribute/#deadlines page, which keeps the current list with countdowns. When the website has no date yet for a magazine, its themes are on its own site: aagrapevine.org/contribute, or aalavina.org/recursos ('{lang:es}Temas de LV{/lang}'). The pages 'Grapevine deadlines' and 'La Viña deadlines', in {ui:customize} → {ui:prepare}, have more.
      TIP: Never promise anyone that a story will be published; the editors decide. A story that misses its deadline may still be used in a later issue.

  # Just before the sharing, so new reps get their first steps and then share first.
  - id: "new-reps"
    layout: "bullets"
    title: "New to the service position? Start here"
    optional: true
    items:
      - "**Grapevine:** register at [www.aagrapevine.org/get-involved/become-grapevine-rep](https://www.aagrapevine.org/get-involved/become-grapevine-rep) (you'll receive the Digital Grapevine Kit)"
      - "**La Viña:** register ({lang:es}regístrate{/lang}) at [www.aalavina.org/servicio/conviertete-en-rlv](https://www.aalavina.org/servicio/conviertete-en-rlv)"
      - "Free tools: [www.aagrapevine.org/gvr-resources](https://www.aagrapevine.org/gvr-resources) (GVR Workbook) and [www.aalavina.org/recursos](https://www.aalavina.org/recursos) ({lang:es}Manual del RLV{/lang})"
      - "Questions for the office: [gvrc@aagrapevine.org](gvrc@aagrapevine.org) · order problems: [customerservice@aagrapevine.org](customerservice@aagrapevine.org) ({lang:es}en español{/lang}: [preguntas@aagrapevine.org](preguntas@aagrapevine.org))"
      - "Our committee's corner for reps: [{live:site}/gvr/](/gvr/)"
    takeaway: "New GVR or RLV? Email [grapevine@neta65.org](grapevine@neta65.org) so we can add you to our reminders (always sent by BCC). Each group decides how its rep is chosen and for how long."
    minutes: 0.5
    notes: |
      TIP (timekeeping): about 30 seconds, just before the sharing. If nobody is new to the service position tonight, skip it with one sentence: 'New reps, the first steps are on this slide and on our website.'
      SAY: Welcome to everyone who's new in this service position. Here are the first steps most reps find helpful. Register with the Grapevine office, or with La Viña if you serve as an RLV, so you receive the reps' newsletter (Grapevine News monthly, La Viña's {lang:es}Noticias{/lang} every two months); the Grapevine form also sends you a digital welcome kit. Both offices have free resources: the GVR Workbook in English and the RLV Manual in Spanish. Our committee's website has a corner for reps and a short orientation in six sessions. If you have a question for the office, the address for reps is on the screen, and customer service can help with any problem with an order; for help in Spanish, write to preguntas@aagrapevine.org.
      DO: Offer to help new reps after the meeting, or in the parking lot. The orientation sessions on the committee site (/orientation/) work one-on-one or at a district meeting. Remind reps who are rotating out to tell the office, so the lists stay current.
      TIP: Many reps like to read the current issue in whatever form suits them (print, digital or the app), but nobody needs to buy anything to serve.
      TRANSITION: Now the floor is yours: GVR and RLV sharing, first-timers and new reps first.

  # The heart of the second half: GVRs and RLVs share experience (never reports), about two minutes each.
  - id: "sharing"
    layout: "qa"
    title: "GVR and RLV sharing"
    prompts:
      - "What's working with Grapevine and La Viña in your group or district?"
      - "A challenge in your service position right now"
      - "An event or a workshop coming up, or help you need"
      - "How can the committee help you?"
    note: "About 2 minutes each: experience, not reports. First-timers and new reps first."
    minutes: 15
    notes: |
      TIP (timekeeping): about 15 minutes, from about 7:40. At about 2 minutes each, six or seven people can share; at about 7:54, say 'time for one or two last shares'.
      SAY: Now the floor is yours. This is sharing, not reporting: what's working with Grapevine and La Viña in your group or district, a challenge in your service position, an event or a workshop coming up, or help you need. About two minutes each, please. Let's hear first from anyone here for the first time, and from new reps.
      DO: Wait through the silence; someone usually speaks within ten seconds. Call first on people who haven't spoken yet tonight. If questions come in the chat, read them aloud, without the names the chat shows. Note every need someone names (a workshop, materials, help for a new rep): those are the follow-ups of your notes, by service position.
      TIP (sharing, not reporting): Share experience, not scores. Don't compare groups or districts, and don't post totals by group. Each group decides for itself whether to subscribe, and a group that is less interested is within its rights under the Fourth Tradition.
      TIP: Keep it to experience, strength and hope. If a share drifts into outside issues, such as politics, treatment methods, other fellowships or commercial apps, gently bring it back to how we carry the message with Grapevine and La Viña. If a question needs research, say you'll find out, and add it to the follow-ups.
      UPDATE: nothing, unless the committee wants a theme for the sharing (for example, the month's issue theme).

  # ------------------------------------------------------------------ 2. CLOSING
  - id: "part-3"
    layout: "section"
    number: 2
    title: "Closing"
    subtitle: "Next meeting · Responsibility Statement · the parking lot"
    accent: "grape"
    minutes: 0.25
    notes: |
      SAY: Thank you all for your sharing. We're coming to the end of our hour: a look at our next meeting, then we close together with the Responsibility Statement, and the parking lot follows for anyone who wants to stay.
      TIP: Check the clock here: the Responsibility Statement starts by about 7:58, so the meeting closes at eight.

  # Shown DURING tonight's meeting, so its date is the meeting after tonight's ({live:meeting_after}), and its
  # guest speaker that meeting's ({live:speaker_after}: "none this time" for a meeting the Meetings page lists no
  # speaker for — December 16, 2026, on November 18's slide —, never "to be announced"): until midnight Central
  # after tonight's meeting, {live:meeting_day} is still tonight's, the title slide's date, so the slide reads right
  # during the meeting, after it, and while the chair prepares it the week before. The time, the Google Meet link and its meeting code
  # come from config/site.yml `meeting` (the same room every month; there is no number to call). The date and the
  # time are two facts side by side (" · "), and the script names the date after a colon, so both still read well
  # when the date says where to look ("see the Meetings page"). "\u00a0" keeps "meeting code" on the same line as
  # its value.
  - id: "next-meeting"
    layout: "bullets"
    title: "Next meeting"
    items:
      - "**{live:meeting_after}** · {live:meeting_time}"
      - "Guest speaker: {live:speaker_after}"
      - "{live:meeting_platform}: {live:meeting_link} · meeting code\u00a0{live:meeting_code} (the same every month)"
      - "Every 3rd Wednesday · all AA members welcome · no registration"
      - "Details: [{live:site}/meetings/](/meetings/#committee-meeting)"
    takeaway: "Questions between meetings: [grapevine@neta65.org](grapevine@neta65.org)"
    minutes: 0.5
    notes: |
      SAY: Our next meeting: {live:meeting_after}. As always, it's on the third Wednesday, at seven, on this same Google Meet link. Please invite anyone in your district who might be interested: GVRs, RLVs, GSRs or any member. Our guest speaker next month: {live:speaker_after}; everyone is welcome, and there's nothing to sign up for.
      DO: Post the date and the Meet link in the chat (in Spanish too, if Spanish-speaking members attend): the chat message in {ui:customize} → {ui:prepare} has them. Send a reminder about a week ahead, by e-mail with every address in BCC: {ui:customize} → {ui:paperwork} has one, with next month's guest speaker.
      STAYS CURRENT: the date (the meeting after tonight's, until midnight after the meeting), its guest speaker ('none this time' when the Meetings page lists none for it, 'to be announced' while the committee's list doesn't name one yet), the time, the Meet link and its code fill in by themselves ({ui:customize} → {ui:prepare} lists the next twelve dates). If the committee skips or moves a meeting, or a speaker changes, tell whoever looks after the website, so the date and the speaker here and the countdown on its meetings page stay right.
      TIP: The Meet link and its code are public on our flyers, the Area's website and our meetings page, so they can stay on this slide. There is no number to call: our Google Meet room has no phone dial-in. Someone without internet can still join the weekly open meetings by phone ({live:site}/accessibility/#phone).

  - id: "responsibility"
    layout: "quote"
    title: "Closing: the Responsibility Statement"
    quote: "I am responsible. When anyone, anywhere, reaches out for help, I want the hand of A.A. always to be there. And for that: I am responsible."
    credit: "— Responsibility Statement, written for the 1965 International Convention, Toronto"
    minutes: 1
    notes: |
      TIP (timekeeping): about a minute: even when an item ran over, keep this closing, and the meeting still ends at eight.
      SAY (before the statement): After we close, the parking lot: stay on for whatever is on your mind. If the call drops at eight, click the same link again for the parking lot.
      SAY: Thank you all for your service tonight. Let's close with the Responsibility Statement. Those who wish, please say it along with me. (Read it slowly.)
      DO: As with the prayer, say it aloud yourself while everyone else says it muted, to avoid an echo. If the committee also closes with the Serenity Prayer, go back to the opening slide, or simply say it together.
      TIP: Read the words exactly as they appear on the slide. Some older committee slides had a misquoted version. The wording shouldn't be changed or shortened.
      60 MINUTES: on a free Google account the call ends at 8:00, an hour after the members were admitted, so say the sentence above BEFORE the statement. Then everyone who wants the parking lot rejoins the same link right away: a new call (third-party guides say this works; Google doesn't document it). If the link doesn't reopen, the parking lot waits for next month, or you e-mail a new link from grapevine@neta65.org. On a plan without that limit, nothing happens at 8:00.

  # After 8:00: AA's "meeting after the meeting", informal, optional and open-ended. The meeting closed with the
  # Responsibility Statement, so this slide has the least time a slide can have (15 seconds): the hour's length
  # (Customize → Version) is the meeting itself.
  - id: "parking-lot"
    layout: "qa"
    eyebrow: "After the meeting"
    title: "The parking lot: what's on your mind?"
    prompts:
      - "A burning desire, a question, an idea we didn't get to"
      - "Stay as long as you like; leave whenever you need to"
    note: "Informal and open: the meeting closed with the Responsibility Statement."
    minutes: 0.25
    notes: |
      WHEN: after 8:00, once the meeting has closed with the Responsibility Statement: AA's 'meeting after the meeting'. It is informal, optional and open-ended, so its timing line is the least a slide can have, on purpose: it is after the hour.
      60 MINUTES: on a free Google account the call ends at 8:00. Rejoin the same link right away with the account that owns it (only it can admit the people who ask to join): a new call opens, and the members who want the parking lot click the same link too. Third-party guides say this works; Google doesn't document it. If the link doesn't reopen, the parking lot waits for next month, or you e-mail a new link from grapevine@neta65.org. On a plan without that limit, the call simply goes on.
      SAY: Our meeting is closed, and this is the parking lot: an open time for whatever is on your mind. A burning desire, a question, an idea we didn't get to tonight. Stay as long as you like, and leave whenever you need to.
      ANONYMITY: the same care as in the meeting: no photos, screenshots or recordings, and what's shared here stays here.
      TIP: Nothing is decided here: the parking lot is conversation, not business. An idea for the committee can go in your notes as a follow-up, or into next month's sharing.

  # The navy closing slide keeps its addresses as plain text, as in the deck. Its date is the meeting after
  # tonight's, as on "Next meeting" ({live:meeting_after}). It stays up after the hour, while people say
  # goodbye (the deck's "leave up"), so it has the least time a slide can have (15 seconds).
  - id: "thank-you"
    layout: "closing"
    title: "Thank you for your service"
    message: |-
      Next meeting: {live:meeting_after}
      {live:meeting_time}, on {live:meeting_platform}
    lines:
      - "Area 65 Grapevine / La Viña Chair: grapevine@neta65.org"
      - "Committee website: {live:site}"
      - "Northeast Texas Area 65: neta65.org"
    minutes: 0.25
    notes: |
      WHEN: after the hour: leave this slide up while people say goodbye, or through the parking lot.
      SAY: Thank you for being here, and for everything you do to carry the message. If you have questions, the committee's e-mail is on the screen, and our website has this month's news, deadlines and events. Good night, and see you next month.
      DO: Stop sharing your screen only after the last person has left. Then finish the short draft notes ({ui:customize} → {ui:paperwork} drafts them from your details), make sure the website shows the right date for the next meeting, and save this month's version if you want to keep it ({ui:customize} → {ui:save_share}): anything that shouldn't be public stays in your own Drive, outside the shared folders.
      TIP: The contact on this slide is the committee's service address. Never put a personal phone number or e-mail address here.
      STAYS CURRENT: the date of the next meeting (the one after tonight's, until midnight after the meeting) fills in by itself.

  # ------------------------------------------------------------------ APPENDIX · FOR THE CHAIR
  # Hidden slides in the PowerPoint template → facilitator pages: never in the show, read and printed in
  # Customize → Prepare (which lists every one, this divider too, and prints any of them). Rewritten for the web
  # where they explained the .pptx (fresh copies, Ctrl+F, orange text, hidden slides, "as of" lines); the 2027
  # dates and deadline tables are now lists that stay current.
  - id: "for-the-chair"
    layout: "section"
    facilitator: true
    number: "A"
    title: "For the chair"
    subtitle: "Preparing the meeting, chairing tips and reference. Hidden during the meeting."
    eyebrow: "Appendix · For the chair"
    accent: "navy"
    notes: |
      NOT PRESENTED: the meeting ends with the 'Thank you' slide just before this one.
      WHAT'S HERE: credits and sources; a checklist for the week before each meeting; what to update on each slide and where to find it; suggested topics for each month of the year; chairing tips; how to keep this presentation and the notes AA-safe; the next meeting dates, the CityWide booth, our Grapevine Meeting and Area events, and the story deadlines, which stay current by themselves; and the message for the Google Meet chat.
      FOR THE CHAIR ONLY: this divider and every page after it are never part of the show, even if you click past the 'Thank you' slide. They are in {ui:customize} → {ui:prepare}, where you can read each one before the meeting, or print it.

