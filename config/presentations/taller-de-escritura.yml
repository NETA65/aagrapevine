      - "¿Para qué tema o sección de La Viña van a escribir ahora?"
      - "¿Qué les ayudaría a terminar: alguien con quien escribir, que su padrino o madrina la lea, otro taller?"
    note: "Por favor, compartan brevemente para que todos tengan su turno."
    minutes: 4.5
