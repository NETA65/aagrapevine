  # The English deck's Spanish checklist (its handout 'lista-de-revision'), shown AND printed here: the revision
  # handout for everyone. In the 90-minute plan it takes Exercise 4's place.
  - id: "checklist"
    layout: "columns"
    style: "panels"
    checklist: true
    handout: true
    title: "Lista de revisión"
    columns:
      - heading: "La historia"
        accent: "vine"
        items:
          - "Un momento o un punto decisivo"
          - "Una primera línea que empieza en la acción"
          - "Queda claro que soy alcohólico y miembro de AA"
          - "Muestro más de lo que cuento"
          - "Experiencia, no consejos"
          - "Esperanza: cómo es ahora"
      - heading: "Los detalles"
        accent: "lv"
        items:
          - "Otras personas: solo nombre de pila, o ninguno"
          - "Sin asuntos ajenos ni promoción"
          - "Original y sin publicar"
          - "De 5 a 6 páginas a doble espacio"
          - "Un título y mis datos de contacto"
          - "Leerla en voz alta, o que mi padrino o madrina la lea"
    minutes: 1.5
    version_minutes: { short: 2.5 }
    notes: |
      DI: Esta es una lista para revisar. A la izquierda, la historia: ¿es una sola historia? ¿La primera línea empieza en la acción? ¿Queda claro desde temprano que soy alcohólico y miembro de AA? ¿Muestro más de lo que cuento? ¿Es mi experiencia, y no consejos? ¿Tiene esperanza? A la derecha, los detalles: las otras personas protegidas, sin asuntos ajenos ni promoción, un texto original, de cinco a seis páginas a doble espacio, un título y mis datos de contacto para la oficina. Y el último punto es el que los miembros más recomiendan: léanla en voz alta, o pídanle a su padrino o madrina, o a alguien del programa, que la lea. Les va a decir si suena verdadera. Y luego, mándenla.
      HAZ: Señala la lista impresa. En línea, pega en el chat el enlace a esta presentación o a la página Comparte tu historia del comité.
      CONSEJO: Esta diapositiva es también la hoja de revisión: imprime una por persona ({ui:customize} → {ui:prepare} → {ui:print}). Que la lista no se vuelva un pretexto para no mandar: «buena y enviada» lleva el mensaje; «perfecta y en un cajón», no.
      {not:short} TRANSICIÓN: «Usémosla ahora mismo».
      {only:short} TRANSICIÓN: «Cuando estén listos, aquí es adonde la mandan».
    version_notes:
      short: "PLAN DE 90 MINUTOS: el ejercicio 4 se hace en casa (no está en esta versión): invita a usar esta lista antes de mandar la historia, y sigue con cómo enviarla."

