  - id: "before-the-day"
    layout: "bullets"
    facilitator: true
    checklist: true
    eyebrow: "Para quien facilita"
    title: "Antes del día"
    items:
      - "Acuerda con el grupo o el distrito anfitrión la fecha, el lugar o el enlace, el idioma y el formato: ellos deciden"
      - "Invita en las reuniones y con un volante; piensa en invitar a un miembro a quien le hayan publicado una historia"
      - "Llena los espacios en naranja ({ui:customize} → {ui:your_details}); los temas, las fechas límite, la línea de Graba tu historia y los tiempos de la agenda se mantienen al día solos"
      - "Llama a la línea de Graba tu historia para probarla"
      - "Imprime para cada persona el planificador (dos páginas), la lista de revisión y «Cómo enviar tu historia a La Viña»"
      - "Materiales impresos gratis: escribe a gvrc@aagrapevine.org con 4 a 6 semanas de anticipación (pueden ser solo para eventos más grandes; pregunta)"
    notes: |
      DI: Los talleres se hacen porque un grupo o un distrito lo pide, y el anfitrión decide la fecha, el lugar, el idioma y el formato; el comité sugiere y apoya. Invita en las reuniones y con un volante; el comité puede ayudar con uno. Algunos talleres invitan a un miembro a quien le publicaron una historia para que comparta cómo fue escribirla. Si lo haces, preséntalo solo por su nombre de pila, y que comparta su experiencia en lugar de leer la historia publicada en una pantalla. Llena los espacios, prueba la línea de teléfono e imprime las hojas para cada persona, y unas cuantas en letra grande ({ui:customize} → {ui:prepare} → {ui:print}): el planificador (dos páginas), la lista de revisión ({slide:checklist}) y «Cómo enviar tu historia a La Viña» ({slide:how-to-submit}).
      HAZ: Para pedir materiales impresos gratis, escribe a gvrc@aagrapevine.org con 4 a 6 semanas de anticipación, con tu nombre, Área, puesto de servicio y datos de contacto, y el nombre, la fecha y la asistencia esperada del evento. Pregunta si tu evento califica: los materiales pueden ser solo para eventos más grandes, así que no cuentes con ellos para un taller pequeño.
      CONSEJO: No le prometas al anfitrión una historia publicada ni un número de historias enviadas. Lo nuestro es la invitación y la sala. Si en la sala habrá quien escriba en inglés, las hojas en inglés están en la presentación «Grapevine and La Viña Writing Workshop», en su {ui:prepare}.
      PREPARACIÓN: más o menos una hora, una semana antes.
      TRANSICIÓN: Los materiales y los talleres en línea.

  - id: "supplies"
