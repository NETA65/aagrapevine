      ACTUALIZA: la diapositiva que sigue viene del calendario de La Viña, a través de la página del comité {live:site}/es/contribute/#deadlines, que se mantiene al día y muestra una cuenta regresiva para cada fecha: las fechas que ya pasaron se quitan solas, y la presentación muestra la fecha de los datos. Aun así, antes de cada taller conviene revisar la lista de Temas de La Viña en aalavina.org/recursos.
      TRANSICIÓN: «Esto es lo que está pidiendo La Viña».

