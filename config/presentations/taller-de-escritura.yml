# =====================================================================
#  "Taller de escritura de La Viña" — the committee's writing workshop in
#  Spanish, for La Viña: the deck an RLV presents at a Spanish-language
#  writing workshop (the Spanish La Viña workshops' event pages link it:
#  eleventy/event-pages.js `deckEs`). Read by src/_data/presentations.js,
#  checked by tests/test_presentations.py (run it on this file after every
#  change), like the English decks.
#
#  Adapted by hand from writing-workshop.yml (not translated line by line):
#  the same parts, timing versions (115 minutes and the 90-minute plan) and
#  four exercises, written for a room that writes for La Viña:
#  - La Viña comes first everywhere: every two months, in Spanish, its own
#    sections, its themes and deadlines (a `live` list), its suggested
#    topics with no deadline, its own way to send a story (aalavina.org/
#    comparte, manuscritoslv@aagrapevine.org, its postal address) and to
#    record one (Graba tu historia: {live:lv_audio_phone}). Grapevine stays
#    for the members who write in English: one column, one line, and its
#    themes on a slide that starts switched off (turn it on in a bilingual
#    room: Customize → Slides).
#  - Every fact is one the repository already has (writing-workshop.yml,
#    orientation-workshop.yml, config/site.yml links); what it does not have
#    (how La Viña prints a byline, how it edits) the notes say to check on
#    aalavina.org, never guess.
#  - Quotations: only the Spanish texts the repository has word for word
#    (the Preamble from the Libro de trabajo de La Viña, the Responsibility
#    Statement from the Manual del RLV, with their credit lines). The English
#    deck's A.A.W.S. quotations have no Spanish text here, so their slides say
#    the same thing in our own words, with the source named.
#  - The register is the Spanish site's: "tú" to one person (the slides'
#    instructions, the presenter in the notes), "ustedes" to the room.
#  - The notes' labels are Spanish (DI:, HAZ:, PREGUNTA:, CONSEJO:,
#    PARA QUIEN FACILITA:, ACTUALIZA:, TRANSICIÓN:); the player writes the
#    TIEMPO line itself, in Spanish, from `minutes`. In a bilingual room the
#    exercises' notes also carry the English deck's prompts word for word
#    ({lang:en}IN ENGLISH …{/lang}).
#  - Same slide ids as writing-workshop.yml where a slide matches one there
#    (to compare the two decks), new ids for La Viña's own slides.
# =====================================================================

id: "taller-de-escritura"
order: 10              # after the English decks (their cards first): its own number, as every deck
lang: "es"
title: "Taller de escritura de La Viña"
short: "Taller de escritura"
eyebrow: "Taller de escritura"
footer: "Comité de Grapevine y La Viña de NETA 65 · {live:panel}"
minutes: 115            # the full plan, as the English deck's: 115 minutes in a two-hour slot
icon: "pen-line"
tone: "lv"

card:
  title:
    en: "La Viña Writing Workshop"
    es: "Taller de escritura de La Viña"
  summary:
    en: "The writing workshop in Spanish, for La Viña: four short writing exercises with sharing in pairs, what La Viña publishes, its themes and deadlines, anonymity in your writing, and how to send or record your story for La Viña."
    es: "El taller de escritura en español, para La Viña: cuatro ejercicios breves de escritura con momentos para compartir en parejas, lo que publica La Viña, sus temas y fechas límite, cómo cuidar el anonimato al escribir y cómo enviar o grabar tu historia para La Viña."
  audience:
    en: "AA members who want to write their story for La Viña, in Spanish, and the RLVs, groups and districts who host a writing workshop in Spanish, in person or online."
    es: "Miembros de AA que quieren escribir su historia para La Viña, y los RLV, grupos y distritos que organizan un taller de escritura en español, en persona o en línea."

presets:
  - id: "full"
    label: { en: "Full workshop (about 2 hours)", es: "Taller completo (unas 2 horas)" }
    minutes: 115
  # The English deck's 90-minute plan, the same way: Exercise 4 is done at home, the break takes 5 minutes, and the
  # rest comes from trimming the talking, never the writing (welcome: 7, Parts 1–3: 12, Exercise 1: 8, Part 4: 8,
  # Exercise 2: 12, break: 5, Part 5: 5, Exercise 3: 12, checklist: 3, submit and record: 6, closing: 6).
  - id: "short"
    label: { en: "90-minute workshop (Exercise 4 at home)", es: "Taller de 90 minutos (el ejercicio 4, en casa)" }
    minutes: 84
    hide: ["exercise-4"]
    note:
      en: "The 90-minute plan: Exercise 4 is done at home and the break is about five minutes; the rest of the time comes from trimming the talking, never the writing. The agenda, the exercises' time cards, the break and the times in the notes follow this plan, and each part's target time is in the notes."
      es: "El plan de 90 minutos: el ejercicio 4 se hace en casa y el descanso dura unos cinco minutos; el resto del tiempo sale de hablar menos, nunca de escribir menos. La agenda, el tiempo de cada ejercicio, el descanso y los tiempos de las notas siguen este plan, y el tiempo de cada parte está en las notas."

# The presenter's blanks (Customize → Your details). `puesto` is the presenter's service position in Spanish, shared
# by the Spanish presentations (the English ones have their own `presenter`); the first name is shared by all.
fillins:
  - key: "puesto"
    label: { en: "Presenter's service position (in Spanish)", es: "Puesto de servicio de quien presenta" }
    hint: "puesto de servicio"
    default: "Coordinador(a) de Grapevine / La Viña del Área 65"
    shared: true
  - key: "first_name"
    label: { en: "Your first name (only in your notes)", es: "Tu nombre de pila (solo en tus notas)" }
    hint: "nombre de pila"
    shared: true
    notes_only: true
  - key: "date"
    label: { en: "Date", es: "Fecha" }
    hint: "DD de mes de AAAA"
  - key: "host_group"
    label: { en: "Host group or district", es: "Grupo o distrito anfitrión" }
    hint: "grupo o distrito anfitrión"
  - key: "place"
    label: { en: "Place, or online", es: "Lugar, o en línea" }
    hint: "en persona / en línea"
  - key: "break_end"
    label: { en: "Back from the break at (clock time)", es: "Hora de regreso del descanso" }
    hint: "hora"
  - key: "supported_by"
    label: { en: "Who supports this workshop (host group, district or Area)", es: "Quién sostiene este taller (grupo, distrito o Área)" }
    hint: "el grupo, el distrito o el Área anfitrión"
  - key: "basket_for"
    label: { en: "Who today's basket supports (host group or district)", es: "A quién sostiene la canasta de hoy (grupo o distrito)" }
    hint: "el grupo o el distrito anfitrión"

slides:
  # ---------------------------------------------------------------- Apertura
  - id: "title"
    layout: "title"
    eyebrow: "NETA 65 · Comité de Grapevine y La Viña"
    title: "Taller de escritura de La Viña"
    subtitle: "Poner por escrito nuestra experiencia, fortaleza y esperanza"
    lines:
      - "{fill:puesto}"
      - "{fill:date} · {fill:host_group} · {fill:place}"
    minutes: 1
    notes: |
      {not:short} DI: Buenas [tardes / noches] a todos y bienvenidos al Taller de escritura de La Viña. Me llamo {fill:first_name}, soy alcohólico(a) y sirvo como {fill:puesto} en el Comité de Grapevine y La Viña de NETA 65. Gracias a {fill:host_group} por invitarnos y por abrirnos sus puertas. En las próximas dos horas vamos a escribir más de lo que vamos a escuchar. Cuando terminemos, la mayoría de ustedes tendrá el comienzo de una historia, tal vez una historia completa, que podrá mandar a La Viña si así lo decide.
      {only:short} DI: Buenas [tardes / noches] a todos y bienvenidos al Taller de escritura de La Viña. Me llamo {fill:first_name}, soy alcohólico(a) y sirvo como {fill:puesto} en el Comité de Grapevine y La Viña de NETA 65. Gracias a {fill:host_group} por invitarnos y por abrirnos sus puertas. En los próximos noventa minutos vamos a escribir más de lo que vamos a escuchar. Cuando terminemos, la mayoría de ustedes tendrá el comienzo de una historia, tal vez una historia completa, que podrá mandar a La Viña si así lo decide.
      HAZ: Antes de que llegue la gente, deja en cada silla un planificador de tu historia, una lista de revisión, papel y pluma; abre la presentación en esta diapositiva y ten listo un cronómetro. En línea: abre la reunión 15 minutos antes, pide a un servidor de confianza que te ayude con las salas para grupos pequeños si tu plataforma las tiene, y pega en el chat el enlace a la página Comparte tu historia del comité. Preséntate solo con tu nombre de pila. Esta presentación está publicada en internet, así que la diapositiva lleva tu puesto de servicio, nunca un nombre: tu nombre de pila solo aparece en estas notas.
      PARA QUIEN FACILITA: Todo lo que necesitas (una lista para antes del día, los materiales, cómo hacerlo en línea, el plan de 90 y de 120 minutos y las hojas para imprimir) está en la sección para quien facilita, {ui:customize} → {ui:prepare}. Esas páginas nunca se proyectan, así que la presentación termina en los créditos. Para imprimir las hojas: {ui:customize} → {ui:prepare} → {ui:print}. Cualquier miembro en quien confíe el grupo anfitrión puede dar este taller: las notas están escritas para leerlas casi palabra por palabra.
      ACTUALIZA: tu puesto, la fecha, el grupo anfitrión y el lugar: {ui:customize} → {ui:your_details}. La fecha de «Datos al» se pone sola.
      TRANSICIÓN: «Empecemos como empezamos nuestras reuniones: con unas palabras sobre quiénes somos y qué vamos a hacer hoy».
    version_notes:
      short: "PLAN DE 90 MINUTOS: la bienvenida, el Preámbulo, la sala segura y la agenda toman unos 7 minutos (9 en el plan completo)."

  - id: "welcome"
    layout: "bullets"
    eyebrow: "Bienvenida"
    title: "Bienvenidos: este es tu lugar"
    items:
      - "No hace falta experiencia escribiendo: basta la buena voluntad y una historia"
      - "Un taller práctico: cuatro ejercicios breves de escritura, y compartir en parejas (siempre opcional)"
      - "Escribimos en español, para La Viña; si escribes en inglés, tu historia es para Grapevine"
      - "Lo presenta el Comité de Grapevine y La Viña de NETA 65: **no** es una presentación oficial de AA Grapevine, Inc."
      - "Compartimos experiencia y sugerencias; lo que hagas con ellas es decisión tuya"
    takeaway: "Cada persona aquí tiene una historia que alguien más necesita leer."
    minutes: 2
    version_minutes: { short: 1 }
    notes: |
      DI: Tanto si han escrito una docena de historias como si no han tomado una pluma desde la escuela, están en el lugar correcto. Quiero dejar claras dos cosas. Primero, este taller lo organiza nuestro comité de Área. Somos servidores de confianza, no expertos, y no hablamos en nombre de AA Grapevine, Inc., que publica La Viña, ni de su redacción. Lo que van a oír sobre cómo funciona la revista viene de sus propias pautas publicadas, y les voy a mostrar dónde consultarlas. Segundo, hoy nadie tiene que leer nada en voz alta. Cuando compartamos en parejas, siempre pueden pasar. La Viña recibe historias en español; si alguien prefiere escribir en inglés, su historia va a Grapevine.
      PREGUNTA: Levanten la mano: ¿quién ha leído una historia en La Viña que se le quedó en el corazón? ¿Y quién ha pensado alguna vez «eso lo pude haber escrito yo»? Guarden ese pensamiento: por eso están aquí.
      CONSEJO: Si en la sala hay quien escribe en inglés, siéntalos juntos para que compartan en parejas en inglés, e invita a un miembro bilingüe a ayudar con las instrucciones. Nunca señales a un recién llegado; deja que la gente se ofrezca.
      TRANSICIÓN: «Abramos con un momento de silencio y el Preámbulo de AA».

  # The Spanish Preamble word for word, as orientation-workshop.yml gives it (Libro de trabajo de La Viña, 2023, p. 2),
  # with its credit line.
  - id: "preamble"
    layout: "quote"
    eyebrow: "Bienvenida · Apertura"
    title: "Abrimos con el Preámbulo de AA"
    quote: |-
      Alcohólicos Anónimos es una comunidad de personas que comparten su mutua experiencia, fortaleza y esperanza para resolver su problema común y ayudar a otros a recuperarse del alcoholismo.
      El único requisito para ser miembro de AA es el deseo de dejar la bebida. Para ser miembro de AA no se pagan derechos de admisión ni cuotas; nos mantenemos con nuestras propias contribuciones.
      AA no está afiliada a ninguna secta, religión, partido político, organización o institución alguna, no desea intervenir en controversias, no respalda ni se opone a ninguna causa.
      Nuestro objetivo primordial es mantenernos sobrios y ayudar a otros alcohólicos a alcanzar el estado de sobriedad.
    credit: "Copyright © The AA Grapevine, Inc., reimpreso con permiso."
    source: "Libro de trabajo de La Viña (2023), p. 2."
    minutes: 2
    notes: |
      DI: Los invito a un momento de silencio. (Pausa.) ¿Alguien quiere leernos el Preámbulo de AA? (Invita a un voluntario, o léelo tú.) Gracias. Un poco de historia que viene al caso: el Preámbulo apareció por primera vez en el Grapevine en junio de 1947, y lo escribió un editor del Grapevine. Las palabras con que abrimos casi todas nuestras reuniones salieron de la misma casa editorial que publica La Viña, la revista para la que vamos a escribir hoy.
      HAZ: Deja la diapositiva en pantalla mientras se lee. Lee el texto tal como aparece, sin acortarlo. La línea de copyright se queda en la diapositiva.
      CONSEJO: Sigue la costumbre del grupo anfitrión. Si el grupo abre con la Oración de la Serenidad, o lee el Preámbulo de su propia tarjeta, hazlo así y pasa esta diapositiva. Este es el texto en español del Libro de trabajo de La Viña (2023).
      TRANSICIÓN: «Antes de escribir una sola palabra, pongámonos de acuerdo en cómo vamos a cuidar esta sala».

  # The English slide's P-47 quotation has no Spanish text here: its point, in our own words, with its source.
  - id: "safe-room"
    layout: "bullets"
    eyebrow: "Bienvenida"
    title: "Una sala segura para escribir y compartir"
    items:
      - "**Lo que se comparte aquí, aquí se queda:** en la sala, en parejas, en las salas para grupos pequeños"
      - "Nada de fotos, capturas de pantalla ni grabaciones de nadie, en la sala o en línea"
      - "En línea: nombre de pila e inicial del apellido; la cámara es opcional"
      - "Compartir es opcional: siempre puedes pasar"
      - "En parejas: escucha sin corregir; después, habla solo de lo que tú escribiste"
      - "Tu borrador es tuyo: solo tú decides si lo mandas"
    source: "Fuente: Anonymity — Our Spiritual Foundation (P-47), p. 12, de A.A. World Services, Inc.: tomar fotos o capturas de pantalla no va con los principios del anonimato (en nuestras palabras)."
    minutes: 3
    version_minutes: { short: 2 }
    notes: |
      DI: Hoy vamos a escribir sobre vidas reales: las nuestras, y a veces las de la gente que forma parte de ellas. Por eso necesitamos la misma seguridad que tenemos en una reunión. Lo que oigan hoy se queda aquí, y eso incluye lo que su compañero o compañera les lea en los ejercicios en parejas. Por favor, no tomen fotos, capturas de pantalla ni grabaciones de nadie, en la sala ni en la pantalla; el folleto de AA sobre el anonimato dice lo mismo de las reuniones en línea. Si quieren las diapositivas, no hace falta fotografiar la pantalla: están publicadas en el sitio de nuestro comité, y las hojas son suyas. Cuando compartan en parejas, son oyentes, no editores: sin consejos y sin corregir. Y cuando hablemos con toda la sala, hablen solo de lo que ustedes escribieron, nunca de lo que escribió su pareja.
      PREGUNTA: ¿Están todos de acuerdo? ¿El grupo quiere agregar algo? (Es la conciencia de la sala: acepta cualquier sugerencia que ayude a que la gente se sienta segura.)
      CONSEJO: En línea, di en voz alta lo de las capturas de pantalla y pégalo también en el chat. Repíteselo por chat, en privado, a quien llegue tarde. Confirma que la reunión no se está grabando. La fuente al pie es material de A.A.W.S. dicho en nuestras palabras; si editas la diapositiva, deja la fuente.
      TRANSICIÓN: «Así vamos a usar nuestro tiempo juntos».

  # The rows' times are worked out by the player from `from` for the version shown; the 90-minute plan's own rows
  # (version_fields.short) are the English deck's. Change a row in both lists.
  - id: "agenda"
    layout: "agenda"
    eyebrow: "Bienvenida"
    title: "Nuestro tiempo juntos"
    items:
      - { time: "0:00", title: "Bienvenida, apertura y una sala segura", from: "title" }
      - { time: "0:09", title: "Por qué escribimos · lo que publica La Viña · sus temas", from: "part-1" }
      - { time: "0:27", title: "Ejercicio 1: para entrar en calor", from: "exercise-1" }
      - { time: "0:37", title: "Qué hace fuerte una historia · Ejercicio 2", from: "part-4" }
      - { time: "1:02", title: "Descanso", from: "break" }
      - { time: "1:09", title: "El anonimato al escribir · Ejercicio 3", from: "part-5" }
      - { time: "1:30", title: "Revisar (Ejercicio 4) · cómo enviar o grabar tu historia", from: "part-6" }
      - { time: "1:48", title: "Preguntas y cierre", from: "self-support" }
      - { time: "1:55", title: "Terminamos", from: "credits" }
    minutes: 1
    version_fields:
      short:
        items:
          - { time: "0:00", title: "Bienvenida, apertura y una sala segura", from: "title" }
          - { time: "0:07", title: "Por qué escribimos · lo que publica La Viña · sus temas", from: "part-1" }
          - { time: "0:19", title: "Ejercicio 1: para entrar en calor", from: "exercise-1" }
          - { time: "0:27", title: "Qué hace fuerte una historia · Ejercicio 2", from: "part-4" }
          - { time: "0:47", title: "Descanso", from: "break" }
          - { time: "0:52", title: "El anonimato al escribir · Ejercicio 3", from: "part-5" }
          - { time: "1:09", title: "Revisar · cómo enviar o grabar tu historia", from: "part-6" }
          - { time: "1:18", title: "Preguntas y cierre", from: "self-support" }
          - { time: "1:24", title: "Terminamos", from: "credits" }
    notes: |
      {not:short} DI: Este es el plan. Empezamos con por qué escribimos y qué publica La Viña, incluidos los temas que la redacción está pidiendo ahora mismo. Después escribimos: cuatro ejercicios breves, cada uno apoyado en el anterior, con un descanso a la mitad. Entre ejercicio y ejercicio les comparto algunas ideas sobre qué hace fuerte una historia, cómo cuidar el anonimato en el papel y cómo mandar su historia cuando esté lista. Dejamos tiempo para preguntas al final, y terminamos a tiempo.
      {only:short} DI: Este es el plan. Empezamos con por qué escribimos y qué publica La Viña, incluidos los temas que la redacción está pidiendo ahora mismo. Después escribimos: tres ejercicios breves, cada uno apoyado en el anterior, con un descanso a la mitad, y un cuarto para hacer en casa. Entre ejercicio y ejercicio les comparto algunas ideas sobre qué hace fuerte una historia, cómo cuidar el anonimato en el papel y cómo mandar su historia cuando esté lista. Dejamos tiempo para preguntas al final, y terminamos a tiempo.
      HAZ: Indica dónde están los baños y el café. En línea, si hay salas para grupos pequeños, explica que se abren solas y que se cierran con un aviso de un minuto.
      PARA QUIEN FACILITA: Los tiempos cuentan desde el inicio, así que sirven para cualquier hora de comienzo; si quieres, anota la hora del reloj al lado en una copia impresa. Si solo tienes 90 minutos, elige la versión de 90 minutos ({ui:customize} → {ui:version}): el ejercicio 4 se hace en casa y el descanso dura cinco minutos.
      ACTUALIZA: nada a mano: los tiempos siguen la versión que presentas y las diapositivas que apagas ({ui:customize} → {ui:slides}).
      TRANSICIÓN: «Entonces, ¿para qué escribir?».
    version_notes:
      short: "PLAN DE 90 MINUTOS: los tiempos de esta diapositiva son los del plan de 90 minutos. El ejercicio 4 se hace en casa (en «Revisar», muestra la lista de revisión), el descanso dura unos cinco minutos y el plan deja unos minutos libres en una hora y media."

  # ---------------------------------------------------------------- Parte 1 · Por qué escribimos
  - id: "part-1"
    layout: "section"
    number: 1
    accent: "gv"
    title: "Por qué escribimos"
    subtitle: "Nuestra reunión impresa, y el trabajo de Paso Doce en papel"
    minutes: 0.5
    notes: |
      DI: Antes de tomar la pluma, dediquemos unos minutos a por qué esto importa. Algunos de ustedes leen La Viña desde hace años; otros tal vez la tienen en las manos por primera vez. Sea como sea, espero que se vayan viéndola un poco distinto: no como algo que escriben otros, sino como algo de lo que ustedes pueden formar parte.
      HAZ: Si trajiste la edición actual de La Viña, levántala ahora y pásala. Muestra la revista impresa en lugar de una portada en pantalla: las portadas son obra de AA Grapevine.
      TRANSICIÓN: «Empecemos por de dónde viene la revista».
    version_notes:
      short: "PLAN DE 90 MINUTOS: las partes 1 a 3 (hasta el primer ejercicio) toman unos 12 minutos (18 en el plan completo). Recorta lo que se habla, no el tiempo para escribir: si vas corto de tiempo, acorta las diapositivas de las partes 1 y 2."

  - id: "meeting-in-print"
    layout: "bullets"
    title: "Nuestra reunión impresa"
    items:
      - "La Viña: cada dos meses, en español, desde **1996**"
      - "Grapevine, su revista hermana: cada mes, en inglés, desde **junio de 1944**"
      - "En los años cuarenta, los miembros que servían en las fuerzas armadas la llamaron su _reunión impresa_"
      - "Casi todas las historias las escriben miembros de AA: gente como nosotros"
      - "La Conferencia de Servicios Generales reconoció al Grapevine como _la revista internacional de Alcohólicos Anónimos_ (1986), y ese reconocimiento incluye a La Viña"
      - "Las historias son la experiencia de los miembros, no la política de AA"
    source: "Fuentes: aagrapevine.org/history-aa-grapevine y /history-aa-lavina; P-52 (2026); The A.A. Service Manual, 2024–2026, pp. 81–85."
    minutes: 2
    version_minutes: { short: 1 }
    notes: |
      DI: La Viña nació en 1996, para que los miembros de habla hispana tuvieran una reunión impresa en su propio idioma, y sale cada dos meses. Su revista hermana, el Grapevine, salió por primera vez en junio de 1944. La empezaron seis miembros de la zona de Nueva York, y se mandó a todos los grupos de AA, unos 300 en ese entonces, y a cada miembro que se sabía que servía en las fuerzas armadas fuera del país. Esos miembros escribieron de vuelta, y cada mes se imprimía una página entera con sus cartas. Empezaron a llamarla su «reunión impresa», y las dos revistas todavía llevan esa frase. Quiero que noten algo: casi todo lo que publica La Viña lo escriben miembros de AA. No profesionales: gente como nosotros. Y es la redacción la que decide qué va en cada edición; lo que leen allí es la experiencia de los miembros, no la política de AA. Esa libertad es justamente lo que le hace lugar a su historia.
      PREGUNTA: ¿Cómo conocieron La Viña? (Toma una o dos respuestas.)
      CONSEJO: Di «reconocida por la Conferencia como la revista internacional de AA», no «aprobada por la Conferencia»: una revista que sale cada mes o cada dos meses no puede pasar por el proceso anual de aprobación, y por eso la Conferencia la reconoció de esta manera en 1986.
      TRANSICIÓN: «¿Y por qué alguno de nosotros se sentaría a escribir para ella?».

  - id: "twelfth-step-work"
    layout: "columns"
    style: "cards"
    title: "Escribir es trabajo de Paso Doce"
    columns:
      - heading: "Lleva el mensaje"
        text: "Una historia escrita hoy puede llegar a alguien dentro de años: en una cárcel, un hospital, una biblioteca, en la mesa de una cocina a las 2 de la mañana."
      - heading: "Le ayuda a quien escribe"
        text: "Poner la experiencia en papel se parece mucho a un buen inventario: claridad, gratitud y una mirada nueva."
      - heading: "Se necesita cada voz"
        text: "La Viña no les paga a sus escritores. Depende de las historias de los miembros: recién llegados y veteranos, de todos los países y de todos los rincones."
    takeaway: "Tu experiencia, fortaleza y esperanza, para alguien a quien nunca vas a conocer."
    minutes: 2
    version_minutes: { short: 1 }
    notes: |
      DI: Cuando escribimos una historia, hacemos trabajo de Paso Doce. Una historia que escriban hoy puede leerla, dentro de años, alguien en una celda, en la cama de un hospital, en una biblioteca pública o en la mesa de su cocina a las dos de la mañana: alguien que nunca va a entrar a su grupo base. Las pautas de La Viña hasta llaman a su artículo un Paso Doce. Escribir también le hace algo a quien escribe. Muchos encontramos que poner nuestra experiencia en papel funciona como un inventario: las cosas se aclaran, y terminamos más agradecidos que cuando empezamos. Y la revista nos necesita. No puede pagar por las historias; depende de los miembros que quieren compartir, y es más rica cuando suena como todos nosotros: recién llegados y veteranos, de la ciudad y del rancho, de cada país de donde venimos.
      PREGUNTA: ¿Alguna vez una historia les llegó justo en el momento preciso? (Si tienes una, compártela en una o dos frases, sin nombres, y luego invita a una persona de la sala.)
      CONSEJO: Que tu propio compartimiento sea breve. Lo importante de esta diapositiva es la buena voluntad de la sala, no la historia de quien presenta.
      TRANSICIÓN: «Y si están pensando "pero yo no soy escritor", la que sigue es para ustedes».

  # The English slide quotes the Service Manual (p. 85); its Spanish text is not in the repository, so its point and La
  # Viña's own words (writing-workshop.yml: "the only requirement is that you're an alcoholic in recovery") are said in
  # our own words, with the source named.
  - id: "not-a-writer"
    layout: "bullets"
    accent: "grape"
    title: "No necesitas ser escritor"
    items:
      - "El Manual de Servicio de A.A. anima a los miembros a mandar sus artículos aunque piensen que su gramática y su ortografía no son perfectas"
      - "Las pautas de La Viña dicen lo mismo: no hace falta tener experiencia escribiendo; el único requisito es ser alcohólico en recuperación"
      - "La gramática y la ortografía son tarea de la redacción, no tuya"
    takeaway: "Lo que la redacción necesita de ti es honestidad, no perfección."
    source: "Fuentes: The A.A. Service Manual, 2024–2026, p. 85, y las pautas de La Viña (aalavina.org/guia-para-contribuciones), en nuestras palabras."
    minutes: 2
    version_minutes: { short: 1 }
    notes: |
      DI: Esto viene del Manual de Servicio de A.A., y me encanta que esté allí: anima a los miembros a mandar sus artículos aunque piensen que su gramática y su ortografía no son perfectas. La gramática y la ortografía son tarea de la redacción, no de ustedes. Si alguna vez escribieron un Cuarto Paso, una nota a su padrino o madrina, o un mensaje largo, pueden escribir una historia. La Viña dice lo mismo en sus pautas: no hace falta tener experiencia escribiendo; el único requisito es ser alcohólico en recuperación. Lo que la redacción necesita de ustedes es honestidad, no perfección.
      PREGUNTA: ¿Qué es lo que más les frena para escribir? (Toma dos o tres respuestas: el tiempo, el miedo, «mi historia no tiene nada de interesante». Responde a cada una con cariño: los ejercicios de hoy toman minutos, no horas; nadie ve su borrador si ustedes no quieren; y cada historia le sirve a alguien.)
      CONSEJO: Si alguien dice que su historia es «aburrida», recuérdale que quien lee en un hospital o en una cárcel busca a alguien como él o ella, no un drama.
      TRANSICIÓN: «Ahora veamos qué publica La Viña».

  # ---------------------------------------------------------------- Parte 2 · Lo que publica La Viña
  - id: "part-2"
    layout: "section"
    number: 2
    accent: "lv"
    title: "Lo que publica La Viña"
    subtitle: "Testimonios, secciones, piezas cortas, extensión y tono"
    minutes: 0.5
    notes: |
      DI: Saber lo que busca la redacción nos ahorra muchas suposiciones. En las próximas diapositivas vamos a ver qué tipo de historias publica La Viña, sus secciones, algunas piezas cortas que son una manera fácil de empezar, qué extensión debe tener una historia y lo que no se publica.
      HAZ: Ten a mano un ejemplar de La Viña abierto en el índice, para mostrar una sección si alguien pregunta.
      TRANSICIÓN: «Dos revistas, un mismo mensaje».

  # La Viña first, in its orange; Grapevine for the members who write in English.
