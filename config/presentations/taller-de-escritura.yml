          - "Un cronómetro visible o una campana"
          - "Las hojas, algunas en letra grande"
          - "Ejemplares actuales de La Viña para pasar"
          - "Sobres para las historias que se manden por correo"
          - "Buena luz y una sala tranquila"
      - heading: "En línea"
        accent: "gv"
        items:
          - "Salas de dos, si la plataforma las tiene"
          - "Nombre de pila e inicial: al renombrarse, o en el chat"
          - "Nada de capturas de pantalla; nada de grabar"
          - "Cada instrucción también en el chat"
          - "Si son impares: un grupo de tres"
          - "Las hojas por enlace, no como archivo adjunto"
    notes: |
      DI: En persona: papel con renglones, plumas, unas cuantas tablas para quien no tenga mesa, un cronómetro visible o una campana, las hojas impresas, unos ejemplares actuales de La Viña para pasar, y algunos sobres para quien quiera mandar por correo una historia escrita a mano. Escoge una sala tranquila y bien iluminada. En línea, en una plataforma con salas para grupos pequeños (Zoom las tiene): pide a un servidor de confianza que maneje salas de dos, asignadas al azar, con la cuenta regresiva y un aviso de un minuto; si son impares, haz una sala de tres, o que la persona que ayuda haga pareja. Al principio, pide que cada quien muestre su nombre de pila y la inicial de su apellido (renombrándose, o escribiéndolo en el chat) y recuérdales: nada de capturas de pantalla y nada de grabar. Tú tampoco grabes la sesión. Pega cada instrucción en el chat también, para quien no vea bien las diapositivas.
      CONSEJO: Accesibilidad: lee cada instrucción en voz alta, ofrece hojas en letra grande y deja que quien prefiera hablar use Graba tu historia en lugar de escribir.
      EN GOOGLE MEET (la plataforma que usa el comité para sus propias reuniones y talleres en línea): las salas para grupos pequeños dependen del plan de la cuenta (una cuenta personal de Google no las tiene), así que revisa el enlace del comité antes del taller; sin salas, las parejas se turnan en voz alta en la reunión principal, de dos en dos, o comparten en el chat; con más de unas cuantas parejas, acorta cada turno o usa el chat, para que el tiempo de parejas alcance. Un miembro que entró con su cuenta no puede renombrarse, así que los nombres de pila van en el chat.
      TRANSICIÓN: Los tiempos.

  # The timing plan. Each segment's slides add up to its row: `minutes` for the full plan, `version_minutes` (else
  # `minutes`) of the "short" version for the 90-minute one. Change a slide's time and its row together.
  - id: "timing"
    layout: "table"
    facilitator: true
    eyebrow: "Para quien facilita"
    title: "Los tiempos: unas 2 horas, o 90 minutos"
    header: ["Segmento (minutos)", "Completo: 115", "Corto: 84 (+6 libres)"]
    rows:
      - ["Bienvenida, Preámbulo, sala segura, agenda", "9", "7"]
      - ["Partes 1–3: por qué escribimos, lo que publica La Viña, sus temas", "18", "12"]
      - ["Ejercicio 1 · Parte 4 (una historia fuerte) · Ejercicio 2", "35", "28"]
      - ["Descanso", "7", "5"]
      - ["Parte 5 (el anonimato) · Ejercicio 3", "21", "17"]
      - ["Parte 6: lista, Ejercicio 4, enviar, grabar", "18", "9 (el ejercicio 4, en casa)"]
      - ["Automantenimiento, preguntas, cierre", "7", "6"]
    widths: [5.4, 1.2, 3.0]
    first_col_bold: true
    notes: |
      DI: Dos planes. El plan completo dura unos 115 minutos y deja unos minutos de holgura en dos horas. El plan de 90 minutos recorta lo que se habla, acorta el descanso a 5 minutos y deja el ejercicio 4 para la casa: muestra la lista de revisión e invita a usarla antes de mandar la historia. Nunca quites del todo el compartir en parejas; ahí la gente descubre que su historia vale la pena. Si vas corto de tiempo, recorta las diapositivas de las partes 1 y 2, no el tiempo para escribir. En detalle, minutos del plan completo (y del de 90): bienvenida, Preámbulo, sala segura y agenda – 9 (7); partes 1–3 – 18 (12); ejercicio 1 – 10 (8); parte 4: qué hace fuerte una historia – 11 (8); ejercicio 2 – 14 (12); descanso – 7 (5); parte 5: el anonimato – 6 (5); ejercicio 3 – 15 (12); lista de revisión y ejercicio 4 – 10 (3); enviar, grabar, después de mandarla – 8 (6); automantenimiento, preguntas y cierre – 7 (6).
      HAZ: Pídele a un servidor de confianza que lleve el tiempo, aparte de quien presenta.
      CONSEJO: Estos minutos coinciden con la agenda (minutos desde el inicio), con el tiempo de cada ejercicio y con la línea de TIEMPO de las notas de cada diapositiva, en los dos planes: elige la versión que vas a presentar ({ui:customize} → {ui:version}), el plan completo o el de 90 minutos sin el ejercicio 4, y esta presentación calcula los tiempos para ella y para las diapositivas que apagues ({ui:customize} → {ui:slides}). La diapositiva de los temas del Grapevine empieza apagada y no cuenta en estos minutos; si la enciendes, suma uno o dos. El reparto de cada ejercicio en sus notas (REPARTO DEL TIEMPO) es el del plan completo; en 90 minutos, deja el tiempo para escribir y acorta las parejas y el compartir.
      TRANSICIÓN: La hoja del planificador.

