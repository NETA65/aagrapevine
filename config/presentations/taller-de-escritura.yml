      DI: Casi todo en esta presentación sigue siendo cierto durante años. Unas cuantas cosas cambian, y todas están marcadas. Las diapositivas con «Información actual» llevan fechas, fechas límite, teléfonos o direcciones; los temas, las fechas límite y la línea de Graba tu historia vienen del sitio del comité y se mantienen al día solos. El texto entre corchetes en naranja es un espacio para llenar en cada taller ({ui:customize} → {ui:your_details}). Los temas vienen de la lista anual de temas de La Viña, que publica los del año siguiente a principios de año, y la diapositiva de los temas los muestra en cuanto el sitio del comité los tiene. Los ejercicios apuntan a la diapositiva de los temas, así que van al paso con ella. Nunca agregues precios a una diapositiva: enlaza la página de la Tienda del comité, que se actualiza cada día.
