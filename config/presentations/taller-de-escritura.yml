      CONSEJO: Estos enlaces se revisaron en octubre de 2026. Antes de cada taller, abre cada uno una vez.
      TRANSICIÓN: «Antes de las preguntas, unas palabras sobre el automantenimiento».

  # ---------------------------------------------------------------- Cierre
  - id: "self-support"
    layout: "bullets"
    accent: "navy"
    eyebrow: "Cierre"
    title: "El automantenimiento: la Séptima Tradición"
    items:
      - "Este taller se sostiene con las contribuciones de los propios miembros de AA, a través de {fill:supported_by}"
      - "Si hoy pasa una canasta, es para {fill:basket_for}, no para La Viña"
      - "AA Grapevine, Inc. no acepta contribuciones: las suscripciones, los libros y otros artículos sostienen las revistas, y la Junta de Servicios Generales cubre lo que le falta a La Viña"
      - "Para leer o regalar La Viña: [{live:site}/es/shop/](/shop/) (enlaces a las dos tiendas oficiales)"
    takeaway: "La Viña se sostiene con los miembros que la compran y la usan en su trabajo de Paso Doce."
    source: "Fuentes: The A.A. Service Manual, 2024–2026, p. 66; F-3, Self-Support (junio de 2026), pp. 12–13."
    minutes: 0.5
    notes: |
      DI: Unas palabras sobre el dinero, porque la Séptima Tradición importa aquí también. El taller de hoy se sostiene con las contribuciones de los propios miembros de AA, a través de {fill:supported_by}. Si se pasa una canasta, es para {fill:basket_for}, no para La Viña: AA Grapevine, Inc. no acepta contribuciones. Las revistas se sostienen con los miembros que las compran y las usan en su trabajo de Paso Doce. La Viña todavía no se mantiene sola, y la Junta de Servicios Generales cubre la diferencia como un servicio a la Comunidad.
      HAZ: Sigue la costumbre del grupo anfitrión con la canasta. Nunca pases una canasta «para La Viña», y no vendas nada en el taller más allá de lo que el grupo anfitrión haya acordado.
      CONSEJO: Nunca llames a una suscripción una «contribución a La Viña». Una suscripción del grupo es un gasto normal del grupo, que decide la conciencia de grupo (F-3). No pongas precios en esta diapositiva: cambian, y la página de la Tienda se actualiza cada día. Mantén una actitud informativa, no de venta (Acción Consultiva de 1960).
      ACTUALIZA: los dos espacios en naranja, en cada taller ({ui:customize} → {ui:your_details}).
      TRANSICIÓN: «Abramos el espacio para preguntas».
    version_notes:
      short: "PLAN DE 90 MINUTOS: el automantenimiento, las preguntas y el cierre toman unos 6 minutos (7 en el plan completo)."

