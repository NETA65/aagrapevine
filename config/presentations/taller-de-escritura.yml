    version_minutes: { short: 1 }
    notes: |
      DI: Las Tradiciones se aplican en el papel igual que en la sala de reunión. Escriban sobre su experiencia con el alcohol y con la recuperación en AA: esa es nuestra unidad de propósito. La Décima Tradición: ningún asunto ajeno. Nada de política, causas ni noticias, ningún consejo médico ni legal, y ninguna opinión sobre tratamientos, medicamentos u otras comunidades. Si algo de eso fue parte de su vida, digan lo que hicieron, sin decirle a quien lee qué hacer o qué pensar. La Sexta y la Undécima: atracción, no promoción. No recomienden un negocio, un sitio web, un producto o un centro de tratamiento como la respuesta; mencionar el Libro Grande u otra literatura de AA está bien. Y cada quien habla solo por sí: las historias son la experiencia de los miembros, nunca la política de AA.
      PREGUNTA: ¿A alguien se le ocurre cómo escribir sobre, digamos, una estancia en el hospital sin dar consejos médicos? (Respuesta: describe lo que te pasó y lo que hiciste; deja fuera las recomendaciones.)
      CONSEJO: Presenta esto como nuestro resumen de lo que dicen las Tradiciones, no como reglas del comité ni de la revista: la redacción decide lo que publica.
      TRANSICIÓN: «Ahora juntemos todo en una escena completa».

