      - "Diapositiva del título: tu puesto de servicio, la fecha, el anfitrión, en persona o en línea ({ui:customize} → {ui:your_details}; tu nombre de pila, solo en las notas)"
      - "Los tiempos de la agenda siguen la versión y las diapositivas que presentas; la hora de regreso del descanso y la línea de la Séptima Tradición están en {ui:your_details}"
      - "La fecha de «Datos al» y la reunión del comité en la diapositiva de agradecimiento ({slide:thank-you}) se ponen solas"
      - "Para encontrar todo lo que hay que cambiar: {ui:customize} → {ui:your_details} (un espacio vacío se ve en naranja)"
