      CONSEJO: Lee estas páginas una semana antes del taller, y otra vez el día anterior. Los talleres siguen las pautas para talleres de escritura de AA Grapevine (Writing Workshop Guidelines, en aagrapevine.org/gvr-resources): de hora y media a dos horas, una sala bien iluminada, plumas y papel, compartir para inspirarse, tiempo para escribir, y leer en voz alta para quien quiera.
