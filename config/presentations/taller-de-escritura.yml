  - id: "keeping-current"
    layout: "bullets"
    facilitator: true
    eyebrow: "Para quien facilita"
    title: "Cómo mantener esta presentación al día"
    items:
      - "Temas y fechas límite: la diapositiva de los temas ({slide:lv-themes}) viene del sitio del comité y quita sola las fechas que ya pasaron (compárala con aalavina.org/recursos); los ejercicios ({slide:exercise-1}, {slide:exercise-2}, {slide:exercise-3}) apuntan a ella"
