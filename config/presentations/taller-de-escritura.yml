    title: "Muestra, no cuentes: un ejemplo"
    columns:
      - heading: "Contar"
        accent: "navy"
        text: "Llegué a AA en muy mal estado, y la gente de ahí de veras me ayudó."
      - heading: "Mostrar"
        accent: "vine"
        text: "La noche de mi primera reunión me quedé veinte minutos en la camioneta con el motor prendido. Un señor tocó la ventanilla, levantó dos vasos de café y me dijo: «Ya está el café». Apagué el motor."
    takeaway: "Los mismos hechos. La segunda deja que quien lee se siente contigo en la camioneta."
    minutes: 2
    version_minutes: { short: 1.5 }
    notes: |
      DI: Las dos dicen lo mismo. La primera nos lo cuenta: estaba mal y AA me ayudó. Asentimos y se nos olvida. La segunda nos lo muestra: estamos sentados en esa camioneta, oímos el motor, vemos los vasos de café, y cuando quien escribe apaga el motor, sabemos exactamente lo que pasó sin que nadie nos lo diga. Nadie tuvo que escribir «tenía miedo» ni «me sentí bienvenido». Eso es lo que buscamos. No hace falta hacerlo en cada frase: una historia también necesita contar para avanzar. Pero los momentos que más importan merecen una escena.
      PREGUNTA: Tomen una frase de su calentamiento que «cuenta», algo como «me la pasé muy bien», y digan en voz alta qué habría visto u oído alguien. (Toma uno o dos voluntarios.)
