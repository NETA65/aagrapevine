    notes: |
      DI: En lugar de cubrir años, algunas de las mejores historias cubren una sola noche. Una llamada al padrino o a la madrina. Una reunión en el salón de una iglesia. Las preguntas de esta diapositiva son las de su planificador: quién, qué, dónde, cuándo y por qué. Contéstenlas y tienen el esqueleto de una escena. Un consejo que funciona casi siempre: empiecen en medio de la acción. No «nací en 1962»; empiecen con «sonó el teléfono a las tres de la mañana». Y terminen en lo que esa escena significa para ustedes hoy. Una sola escena puede ser toda la historia, o el corazón de una más larga.
