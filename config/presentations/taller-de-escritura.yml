  # Every exercise is green, as in the English deck. The steps are the English deck's "EN ESPAÑOL" prompt, which was
  # written in Spanish by hand; the English steps are in the notes for a bilingual room.
  - id: "exercise-1"
    layout: "activity"
    accent: "vine"
    eyebrow: "Ejercicio 1 de 4 · para entrar en calor"
    title: "Para entrar en calor: un momento divertido en sobriedad"
    steps:
      - "Piensa en una vez que te divertiste en sobriedad: un viaje, una noche de juegos, un baile, un evento de servicio, una carcajada"
      - "Escribe **5 minutos** sin parar. No corrijas nada"
      - "¿No sabes cómo empezar? Comienza así: _La primera vez que me di cuenta de que me estaba divirtiendo en sobriedad…_"
      - "En parejas, lee una frase que te guste (1 minuto cada uno), o pasa"
    duration: 10
    materials: ["Papel y pluma, o tu teléfono", "Un cronómetro (quien facilita lleva el tiempo)"]
    takeaway: "**Para compartir:** ¿Qué te sorprendió de tu propio recuerdo?"
    minutes: 10
    version_minutes: { short: 8 }
    version_fields:
      short: { duration: 8 }
    notes: |
      DI: Nuestro primer ejercicio es para entrar en calor, y la idea es que sea divertido. Nuestro Libro Grande nos recuerda que no somos gente triste. Piensen en una vez que se divirtieron en sobriedad: un viaje, una noche de juegos, un baile, un evento de servicio, un momento en que se rieron hasta llorar. Ahora escriban cinco minutos sin parar. No corrijan la ortografía, no tachen nada, no se preocupen por adónde va. Si se atoran, escriban la frase de la pantalla y sigan. ¿Listos? Empiecen.
      {not:short} HAZ: Pon a la vista un cronómetro de 5 minutos. A los 4 minutos di «queda un minuto», y luego «terminen su frase». Forma las parejas (con quien está al lado en la sala; en línea, salas de dos por 3 minutos, que se abran solas, o parejas que se turnan en voz alta si la plataforma no tiene salas). Cada persona lee una frase que le guste, o pasa. Reúne a todos y toma dos o tres respuestas a la pregunta para compartir, solo sobre lo que cada quien escribió.
      {only:short} HAZ: Pon a la vista un cronómetro de 5 minutos. A los 4 minutos di «queda un minuto», y luego «terminen su frase». Forma las parejas en el tiempo que queda (con quien está al lado en la sala; en línea, salas de dos que se abran solas, o parejas que se turnan en voz alta si la plataforma no tiene salas). Cada persona lee una frase que le guste, o pasa. Reúne a todos y toma dos o tres respuestas a la pregunta para compartir, solo sobre lo que cada quien escribió.
      CONSEJO: El calentamiento no está atado a una fecha límite. Una historia divertida en sobriedad le queda bien al tema sugerido de La Viña «Tiempos de fiesta en sobriedad», que no tiene fecha límite, o a uno de los temas de la diapositiva {slide:lv-themes}. Escribe con la sala durante el primer minuto: así a los demás les cuesta menos empezar.
      {lang:en}IN ENGLISH (for anyone writing in English, read it aloud or paste it in the chat): Think of one time you had fun sober: a trip, a game night, a dance, a service event, a belly laugh. Write for 5 minutes without stopping. Don't fix anything. Stuck? Begin with: The first time I noticed I was having fun sober… In pairs, read one sentence you like (1 minute each), or pass. Share back: What surprised you in your own memory?{/lang}
      {not:short} REPARTO DEL TIEMPO: 5 para escribir, 3 en parejas, 2 para compartir.
      TRANSICIÓN: «Guarden lo que escribieron. Ahora hablemos de qué hace fuerte una historia».
    version_notes:
