      - heading: "La Viña: en español"
        accent: "lv"
        items:
          - "Cada dos meses"
          - "Testimonios contados como en una reunión: cómo era tu vida, cómo llegaste a AA, cómo es ahora"
          - "Historias originales en español, y algunas traducidas del Grapevine"
          - "También fotos de salas de reunión y chistes favoritos"
      - heading: "Grapevine: en inglés"
        accent: "gv"
        items:
          - "Cada mes"
          - "Historias en primera persona sobre el alcoholismo y AA"
          - "Un artículo sobre un Paso y otro sobre una Tradición en cada edición"
          - "Cartas, opiniones, chistes y fotos de lugares de reunión"
    source: "Fuentes: las pautas para colaborar de las dos revistas; P-52 (2026); La Viña News (sept.–oct. 2026)."
    minutes: 1.5
    version_minutes: { short: 1 }
    notes: |
      DI: La Viña sale cada dos meses, en español. Nos pide nuestro testimonio contado como lo contaríamos en una reunión: cómo era nuestra vida, cómo llegamos a AA y cómo es ahora. La mayoría de sus historias las escriben en español miembros de habla hispana, y algunas se traducen del Grapevine. También publica fotos de salas de reunión y chistes. El Grapevine sale cada mes, en inglés; casi todo lo que imprime son historias en primera persona, y cada edición trae un artículo sobre un Paso y otro sobre una Tradición.
      PREGUNTA: ¿Alguien aquí piensa escribir en inglés? (Levanten la mano; te ayuda a formar las parejas para los ejercicios.)
      CONSEJO: Si un miembro bilingüe pregunta a cuál revista mandar su historia: que escriba en el idioma en que piensa y en que reza. Una historia va a una sola revista, en su propio idioma.
      TRANSICIÓN: «La Viña tiene secciones fijas, y cada una es una puerta para su historia».

  - id: "departments"
    layout: "columns"
    style: "panels"
    accent: "lv"
    title: "Las secciones: un lugar para tu historia"
    columns:
      - heading: "Algunas secciones de La Viña"
        accent: "lv"
        text: "**_Pasos y Tradiciones_** · _Veteranos_, para quienes llevan muchos años · _Jóvenes en AA_ · _Servicio_"
      - heading: "Si escribes en inglés: Grapevine"
        accent: "gv"
        text: "{lang:en}Emotional Sobriety · Sponsorship · Newcomers · Old-Timers · Young & Sober (YES) · Spiritual Awakenings · Home Group · Into Action · Our Personal Stories · **Steps and Traditions**{/lang}"
    takeaway: "Las historias sobre los Pasos y las Tradiciones siempre hacen falta."
    source: "Fuentes: las Pautas para Colaborar de La Viña (2020); aagrapevine.org/contribute."
    minutes: 1.5
    version_minutes: { short: 1 }
    notes: |
      DI: Cada edición está organizada en secciones, y son una gran manera de encontrar su ángulo. La Viña tiene, entre otras, Pasos y Tradiciones, Veteranos para los miembros con muchos años, Jóvenes en AA y Servicio. Si su padrino o madrina les cambió la vida, si su grupo base los sostuvo en un momento difícil, si el servicio les abrió una puerta: ahí hay una historia. Fíjense en la frase de abajo: la redacción del Grapevine dice que siempre necesita historias sobre los Pasos Cuatro al Doce y sobre cada Tradición, y la sección de Pasos y Tradiciones de La Viña es justamente para eso. Son más difíciles de escribir, y por eso hacen falta. Su experiencia con la Séptima Tradición en una junta de trabajo del grupo es una historia.
      PREGUNTA: Mirando estas secciones, ¿para cuál podrían escribir hoy? Solo piénsenlo; lo van a usar en unos minutos.
      CONSEJO: Estas son las secciones que mencionan las pautas de La Viña (2020) y aagrapevine.org a octubre de 2026. Las secciones cambian de vez en cuando; el índice de la edición actual es la mejor manera de confirmarlas.
      TRANSICIÓN: «Si una historia completa les parece mucho, empiecen con algo pequeño».

  - id: "short-pieces"
    layout: "bullets"
    title: "Piezas cortas: un primer paso fácil"
    items:
      - "**Una foto de tu sala de reunión,** sin ninguna persona: las sillas, la mesa, la cafetera"
      - "**Tus chistes favoritos** de AA, y los momentos graciosos de la vida en sobriedad"
      - "**Fotos e ilustraciones:** el formulario de La Viña también las recibe (JPEG de alta resolución, 300 dpi)"
      - "**Si escribes en inglés:** las secciones de cartas, opiniones y chistes del Grapevine ({lang:en}Dear Grapevine, What's On Your Mind?, At Wit's End{/lang})"
    takeaway: "Una foto o un chiste también es una contribución a nuestra reunión impresa."
    source: "Fuentes: aalavina.org/comparte; La Viña News (sept.–oct. 2026); aagrapevine.org/contribute."
    minutes: 1.5
    version_minutes: { short: 1 }
    notes: |
      DI: No todo el mundo tiene que empezar con una historia completa. La Viña pide también fotos de salas de reunión y chistes favoritos. La foto es de la sala, nunca de las personas: las sillas, la mesa, la cafetera que ha visto cuarenta años de reuniones. Su formulario en línea también recibe fotos e ilustraciones, en archivos JPEG de alta resolución, de 300 dpi. Y quienes escriben en inglés tienen en el Grapevine secciones de cartas, de opiniones y de chistes que salen casi enteras de sus lectores. Una foto o un chiste es una contribución de verdad a nuestra reunión impresa.
      PREGUNTA: ¿Su grupo base tiene una sala con historia? ¿Una cafetera que ha visto décadas de reuniones? Esa es una foto para La Viña.
      CONSEJO: Insiste en el anonimato: en una foto no debe reconocerse a nadie.
      TRANSICIÓN: «¿Qué tan larga debe ser una historia?».

  - id: "length-format"
    layout: "table"
    title: "Extensión, formato y tono"
    header: ["", "La Viña", "Grapevine (en inglés)"]
    rows:
      - ["Extensión", "De 5 a 6 páginas a máquina, a doble espacio", "De 300 a 1,800 palabras (de 3 a 5 páginas a doble espacio); también anécdotas cortas"]
      - ["A mano", "Con letra legible, de un solo lado de la hoja y con espacio entre líneas", "Con letra clara, de un solo lado de la hoja"]
      - ["Idioma", "Español", "Inglés"]
      - ["Tono", "Como en una reunión: en primera persona, con honestidad y esperanza", "El mismo: como cuando compartes en tu grupo base"]
    widths: [1.5, 3.2, 2.6]
    first_col_bold: true
    source: "Fuentes: aalavina.org/guia-para-contribuciones; aagrapevine.org/guidelines-contributing-grapevine."
    minutes: 1.5
    version_minutes: { short: 1 }
    notes: |
      DI: La Viña pide de cinco a seis páginas escritas a máquina, a doble espacio. Si escriben a mano, también está bien: con letra legible, de un solo lado de la hoja y dejando espacio entre las líneas. El tono es el de una reunión: en primera persona, con honestidad, con esperanza. Fíjense que la cifra de 300 a 1,800 palabras es la del Grapevine, no la de La Viña; no las confundan. Según nuestra experiencia, una historia corta y enfocada es más fácil de terminar y de mandar, así que no se preocupen si la suya les sale breve.
      HAZ: Si tienes a mano una historia impresa, muestra cuánto es una página a doble espacio.
      CONSEJO: Los borradores de hoy van a ser cortos, y está bien. No hables en nombre de la redacción sobre lo que escoge; di lo que han encontrado los miembros.
      TRANSICIÓN: «Y unas cuantas cosas que no se publican».

  - id: "not-published"
    layout: "bullets"
    title: "Lo que La Viña no publica"
    items:
      - "Poemas ni canciones"
      - "Homenajes a personas"
      - "Nada que ya se haya publicado en otro lugar"
      - "Material que no tiene que ver con AA, o que va en contra de sus principios"
    takeaway: "¿Llevas un poema dentro? Cuenta como historia la experiencia que hay detrás."
    source: "En nuestras palabras, de las Pautas para Colaborar de La Viña (2020) y las Guidelines for Contributing del Grapevine (rev. abril de 2019)."
    minutes: 1
    version_minutes: { short: 0.5 }
    notes: |
      DI: Esto sorprende siempre: La Viña no publica poemas. Sus pautas tampoco aceptan canciones ni homenajes a personas, y el Grapevine dice lo mismo, y además deja fuera las oraciones y las obras de teatro. Ninguna de las dos imprime algo que ya se haya publicado en otro lugar, ni material que no tenga que ver con AA o que vaya en contra de sus principios. Así que manden solo lo que ustedes mismos escribieron. Si escriben poesía, no la dejen: tomen la experiencia que hay detrás del poema y cuéntenla como historia. Casi siempre ahí está lo mejor.
      PREGUNTA: ¿Alguna pregunta, hasta ahora, sobre qué mandar? (Respuestas breves; las preguntas largas van al final.)
      CONSEJO: «Homenajes a personas» quiere decir un texto para alabar a alguien, por ejemplo en memoria de un padrino. Una historia sobre lo que tu padrino compartió contigo (o te mostró), contada como tu propia experiencia, es otra cosa, y es bienvenida.
      TRANSICIÓN: «Ahora, ¿qué temas está pidiendo La Viña?».

