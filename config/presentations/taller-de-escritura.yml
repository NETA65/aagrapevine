  # How La Viña edits is not in the repository on its own: the slide gives what holds for both magazines (AA
  # Grapevine, Inc. publishes them) and names Grapevine's editorial policy where it is the source.
  - id: "editing-rights"
    layout: "bullets"
    title: "La edición, los derechos y el agradecimiento"
    items:
      - "La política editorial del Grapevine: las historias se editan un poco, por claridad, estilo y extensión, y no se cambian una vez publicadas"
      - "Si aceptan tu historia, los derechos de autor pasan a AA Grapevine, Inc., que publica las dos revistas"
      - "No se paga: quien publica recibe un ejemplar gratis de la edición"
      - "Los libros de La Viña reúnen historias publicadas primero en sus páginas"
    source: "Fuentes: la política editorial del Grapevine (aagrapevine.org); aalavina.org/guia-para-contribuciones; The A.A. Service Manual, 2024–2026, p. 81."
    minutes: 1
    version_minutes: { short: 0.5 }
    notes: |
      DI: A algunos les preocupa que les reescriban su historia. La política editorial del Grapevine dice que las historias se editan un poco, por claridad, estilo y extensión, y que no se cambian una vez publicadas. Cuando aceptan una historia, los derechos de autor pasan a AA Grapevine, Inc., la casa editorial de las dos revistas. Los libros de La Viña y del Grapevine son colecciones de historias que se publicaron primero en sus páginas, así que una historia puede seguir llevando el mensaje mucho después de su edición. No se paga: quien publica recibe un ejemplar. Eso va con lo que somos: la historia es un regalo, igual que lo que compartimos en una reunión.
      PREGUNTA: ¿Alguna pregunta sobre la edición o los derechos? (Si la pregunta va más allá de esto, di que no sabes y sugiere preguntarle directamente a la revista; no adivines.)
      CONSEJO: Para lo que no sepas contestar, el servicio al cliente de la oficina de AA Grapevine en español es preguntas@aagrapevine.org, o el (800) 640-8781. Si alguien pregunta cómo edita La Viña en particular, remítelo a aalavina.org/guia-para-contribuciones.
      TRANSICIÓN: «Y si escribir no es lo suyo, pueden hablar».

